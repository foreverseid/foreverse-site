:root{
  --kertas:#F4ECE0; --ink:#2B2420; --muted:#7A6B60; --hair:rgba(43,36,32,.14);
  --tera:#C8643B; --tera-dk:#9E4A28; --sage:#8DA68A; --madu:#D9A55B;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--kertas);

button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%;-webkit-user-drag:none;pointer-events:none}
#ruang{position:fixed;left:0;top:0;width:100vw;touch-action:none}
#bilah{position:fixed;left:0;right:0;bottom:0;height:72px;padding:0 14px;display:flex;align-items:center;gap:10px;
  background:#FFF9F0;border-top:1px solid var(--hair);z-index:20}
#letak{font-family:var(--hand);font-size:1.25rem;color:var(--tera);white-space:nowrap}
#petunjuk{flex:1;font-size:.86rem;font-weight:700;line-height:1.3}
#petunjuk b{color:var(--tera)}
#bilah .kecil{font-size:.74rem;font-weight:800;color:var(--muted);padding:8px 10px;border-radius:999px;border:1px solid var(--hair)}
#suara{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair)}
.panah{position:fixed;top:40%;z-index:15;width:44px;height:44px;border-radius:50%;background:var(--tera);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:1.3rem;pointer-events:none;box-shadow:0 3px 0 var(--tera-dk);
  animation:dorong 1.1s ease-in-out infinite}

@keyframes dorong{50%{transform:translateX(var(--d,6px))}}

#kartu .catat{font-family:var(--hand);font-size:1.6rem;line-height:1.2;color:var(--ink);background:#FFF3C9;padding:14px 16px;
  border-radius:6px;transform:rotate(-1deg);box-shadow:2px 3px 0 rgba(43,36,32,.12);margin:4px 0 10px}

#transisi{position:fixed;inset:0 0 72px 0;background:#2B2420;opacity:0;pointer-events:none;z-index:30;transition:opacity .35s}

.memuat.pergi{opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-30px);opacity:0;z-index:60;background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-weight:800;font-size:.84rem;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

    for(var j=2;j<lampuJejak.length;j+=4){ var p=lampuJejak[j]; var x=X(p.u), y=Y(p.v)+6;
      if(lampuNyala){ var gg=cx.createRadialGradient(x,y,0,x,y,18); gg.addColorStop(0,'rgba(255,214,120,.9)'); gg.addColorStop(1,'rgba(255,214,120,0)'); cx.fillStyle=gg; cx.beginPath(); cx.arc(x,y,18,0,7); cx.fill(); }
      cx.fillStyle=lampuNyala?'#FFE7A8':'#F3EEE4'; cx.beginPath(); cx.arc(x,y,4.5,0,7); cx.fill(); } }
  /* bangku */
  kotak(.38,.72,.24,.05,'#A47A52',GARIS,4); kotak(.4,.77,.02,.07,'#7B5A3E',null,1); kotak(.58,.77,.02,.07,'#7B5A3E',null,1);
  pintu(.08,tugas>=2,'#F3E3C6');
  tanaman(.93,.86,.2);
}
function gambarKamar(){
  dinding('#E9D6D2','#B78E66',true);
  jendela(.08,.16,.18,.3,'#2F3A5C');   // malam di luar
  cx.fillStyle='#FFF4D6'; cx.beginPath(); cx.arc(X(.2),Y(.24),8,0,7); cx.fill();
  /* ranjang */
  kotak(.24,.36,.36,.16,'#A47A52',GARIS,8); kotak(.22,.52,.4,.24,'#FBF6EE',GARIS,8); kotak(.22,.62,.4,.14,'#D99C8E',GARIS,4);
  kotak(.29,.5,.13,.07,'#fff',GARIS,10);
  if(!suratDibaca){ cx.save(); cx.translate(X(.35),Y(.535)); cx.rotate(-.15); cx.fillStyle='#FFF3C9'; cx.fillRect(-20,-12,40,24); cx.strokeStyle=GARIS; cx.lineWidth=1.5; cx.strokeRect(-20,-12,40,24); cx.beginPath(); cx.moveTo(-20,-12); cx.lineTo(0,2); cx.lineTo(20,-12); cx.stroke(); cx.restore(); }
  /* nakas + lampu tidur + kotak cincin */
  kotak(.66,.62,.13,.16,'#A47A52',GARIS,4);
  var gl=cx.createRadialGradient(X(.76),Y(.45),0,X(.76),Y(.45),S()*.35); gl.addColorStop(0,'rgba(255,214,140,.55)'); gl.addColorStop(1,'rgba(255,214,140,0)'); cx.fillStyle=gl; cx.fillRect(X(.5),0,S()*.8,H);
  kotak(.745,.47,.03,.15,'#7B5A3E',null,1); cx.fillStyle='#F2D28E'; cx.beginPath(); cx.moveTo(X(.73),Y(.4)); cx.lineTo(X(.79),Y(.4)); cx.lineTo(X(.81),Y(.48)); cx.lineTo(X(.71),Y(.48)); cx.fill(); cx.strokeStyle=GARIS; cx.lineWidth=2; cx.stroke();
  var bx=X(.72), by=Y(.62), bw=S()*.09;
  cx.fillStyle='#8E2F3B'; rrect(bx-bw/2,by-bw*.55,bw,bw*.55,5); cx.fill(); cx.strokeStyle=GARIS; cx.stroke();
  if(tutupKotak>0){ cx.fillStyle='#F7EEDD'; cx.fillRect(bx-bw*.38,by-bw*.55,bw*.76,bw*.18);
    if(cincin){ cx.strokeStyle='#E8C26A'; cx.lineWidth=4; cx.beginPath(); cx.ellipse(bx,by-bw*.6,bw*.16,bw*.12,0,0,7); cx.stroke();
      cx.fillStyle='#EAF6FF'; cx.beginPath(); cx.moveTo(bx,by-bw*.82); cx.lineTo(bx+7,by-bw*.72); cx.lineTo(bx,by-bw*.66); cx.lineTo(bx-7,by-bw*.72); cx.fill(); cx.strokeStyle=GARIS; cx.lineWidth=1.5; cx.stroke(); } }
  /* tutup: berputar ke belakang sesuai tarikan */
  cx.save(); cx.translate(bx,by-bw*.55); cx.rotate(-tutupKotak*1.9); cx.fillStyle='#A33A48'; rrect(-bw/2,-bw*.32,bw,bw*.32,6); cx.fill(); cx.strokeStyle=GARIS; cx.lineWidth=2.5; cx.stroke(); cx.restore();
}
var GAMBAR_RUANG={teras:gambarTeras,tamu:gambarTamu,dapur:gambarDapur,halaman:gambarHalaman,kamar:gambarKamar};

/* ── cincin penanda sasaran + panah tepi ── */
function penanda(t){
  var s=sasaran(); if(!s||!$('#tirai').hidden) { $('#panahKiri').hidden=$('#panahKanan').hidden=true; return; }
  var semua=s.semua||[s], rr=s.r*S(), adaTampak=false, kiri=false, kanan=false;
  semua.forEach(function(p){ var x=X(p.u), y=Y(p.v);
    if(x<-rr*.3) kiri=true; else if(x>W+rr*.3) kanan=true; else adaTampak=true;
    cx.strokeStyle='rgba(200,100,59,'+(.55+.35*Math.sin(t/260))+')'; cx.lineWidth=3; cx.setLineDash([7,6]);
    cx.beginPath(); cx.arc(x,y,rr*(1+.05*Math.sin(t/260)),0,7); cx.stroke(); cx.setLineDash([]); });
  $('#panahKiri').hidden=adaTampak||!kiri; $('#panahKanan').hidden=adaTampak||!kanan;
}

/* ══════ input: geser = menoleh; di sasaran = berinteraksi ══════ */
var tekan=null;
function pos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function kena(q,p,r){ return Math.hypot(q.x-X(p.u),q.y-Y(p.v))<(r||sasaran().r)*S(); }
cv.addEventListener('pointerdown',function(e){
  if(!$('#tirai').hidden||pindah) return; ac(); var q=pos(e); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  var s=sasaran(), r=RUANG[ri];
  tekan={x0:q.x,y0:q.y,pan0:panTuju,jenis:'lihat',t:performance.now()};
  if(!s) return;
  if(r==='teras'&&tugas===0&&kena(q,{u:.55-keset*.17*kesetArah,v:.88})) tekan.jenis='keset', tekan.k0=keset;
  else if(r==='dapur'&&tugas===0&&kena(q,s)){ tekan.jenis='teko'; tuang=true; }
  else if(r==='halaman'&&tugas===0&&kena(q,s)){ tekan.jenis='lampu'; lampuJejak=[{u:LAMPU_KAIT[0].u,v:LAMPU_KAIT[0].v}]; tekan.kait=1; }
  else if(r==='kamar'&&tugas===1&&kena(q,s)) tekan.jenis='tutup';
});
cv.addEventListener('pointermove',function(e){
  if(!tekan) return; var q=pos(e), dx=q.x-tekan.x0, dy=q.y-tekan.y0;
  if(tekan.jenis==='lihat'){ if(Math.abs(dx)>8) tekan.geser=true; panTuju=klem(tekan.pan0-dx,0,PW-W); }
  else if(tekan.jenis==='keset'){ if(Math.abs(dx)>4) kesetArah=dx<0?1:-1; keset=klem(tekan.k0+Math.abs(dx)/Math.min(.17*PW,130),0,1); if(Math.random()<.2) SFX.geser(); if(keset>=.95) kesetSelesai(); }
  else if(tekan.jenis==='lampu'){ var uv=keUV(q.x,q.y); lampuJejak.push(uv);
    var k=LAMPU_KAIT[tekan.kait]; if(k&&Math.hypot(q.x-X(k.u),q.y-Y(k.v))<S()*.07){ tekan.kait++; tone(500+tekan.kait*110,.12,{type:'sine',vol:.1}); buzz(8);
      if(tekan.kait>=LAMPU_KAIT.length) lampuSelesai(); } }
  else if(tekan.jenis==='tutup'){ tutupKotak=klem(-dy/(S()*.16),0,1); if(tutupKotak>=.95) kotakTerbuka(); }
});
function lepasTekan(e){
  if(!tekan) return; var t=tekan; tekan=null; var q=e?pos(e):{x:t.x0,y:t.y0};
  if(t.jenis==='teko'){ tuang=false; nilaiTeh(); return; }
  if(t.jenis==='lampu'&&!lampuNyala){ lampuJejak=[]; SFX.salah(); toast('talinya lepas, ulangi dari kait pertama'); return; }
  if(t.jenis==='keset'&&keset<.95){ var k0=keset; (function balik(){ keset=Math.max(0,keset-.08); if(keset>0&&tugas===0) requestAnimationFrame(balik); })(); return; }
  if(t.jenis==='tutup'&&!cincin){ tutupKotak=0; return; }
  if(t.jenis==='lihat'&&!t.geser&&performance.now()-t.t<500) ketuk(q);
}
cv.addEventListener('pointerup',lepasTekan); cv.addEventListener('pointercancel',function(){ lepasTekan(null); });

function ketuk(q){
  var s=sasaran(); if(!s) return; var r=RUANG[ri];
  if(r==='tamu'&&s.semua){ for(var i=0;i<jumlahFoto();i++) if(!bingkai[i]&&kena(q,{u:FRAME[i].u,v:FRAME[i].v+.12},.1)) return lurusFoto(i); return; }
  if(!kena(q,s)) return;
  if(s.pintu) return melangkah();
  if(r==='teras'&&tugas===1){ kunciAmbil=true; SFX.kunci(); buzz(10); return janjiPanel(0,'Ada catatan diikat di kuncinya',function(){ tugas=2; SFX.pintu(); perbarui(); }); }
  if(r==='tamu'&&tugas===0) return janjiPanel(1,'Catatan di meja ruang tamu',function(){ tugas=1; perbarui(); });
  if(r==='dapur'&&tugas===1) return janjiPanel(2,'Di bawah cangkirnya ada tulisan',function(){ tugas=2; perbarui(); });
  if(r==='halaman'&&tugas===1) return janjiPanel(3,'Diukir kecil di sandaran bangku',function(){ tugas=2; perbarui(); });
  if(r==='kamar'&&tugas===0) return bacaSurat();
}

/* ── teras: keset ── */
function kesetSelesai(){ if(tugas!==0) return; tekan=null; keset=1; tugas=1; SFX.bagus(); buzz(12); toast('ada kunci di bawahnya'); perbarui(); }
/* ── ruang tamu: bingkai ── */
function lurusFoto(i){ bingkai[i]=true; SFX.ketuk(); var f=D.foto[i];
  panel(function(k){ var w=el('div','foto'+(f.bentuk==='R'?' rebah':'')), im=el('img'); im.src=f.src; im.style.objectPosition=(f.fx==null?50:f.fx)+'% '+(f.fy==null?50:f.fy)+'%'; im.alt=f.caption||'foto'; w.appendChild(im); k.appendChild(w);
    if(f.caption) k.appendChild(el('div','cap',f.caption)); k.appendChild(tombol('Taruh lagi di dinding',function(){ tutupPanel(); perbarui(); })); }); }
/* ── dapur: tuang teh (game 1) ── */
function nilaiTeh(){
  if(air>=.72&&air<=.9){ game++; SFX.bagus(); buzz([10,30,10]); tugas=1; toast('pas. tehnya siap'); $('#lewati').hidden=true; perbarui(); }
  else { SFX.salah(); if(air>.9){ tumpah=.8; toast('kepenuhan, tumpah. Ulangi, ya'); } else toast('masih kurang, tuang lagi');
    if(air>.9) setTimeout(function(){ air=0; tumpah=0; },700); }
}
/* ── halaman: lampu tali (game 2) ── */
function lampuSelesai(){ lampuNyala=true; tekan=null; game++; SFX.ting(); buzz([12,30,12]); tugas=1; $('#lewati').hidden=true; perbarui(); }
/* ── kamar ── */
function bacaSurat(){ suratDibaca=true; SFX.geser();
  panel(function(k){ k.appendChild(el('h3',null,'Untuk '+(D.penerima||'kamu')));
    (D.surat.length?D.surat:['…']).forEach(function(s){ k.appendChild(el('p','par',s)); });
    k.appendChild(el('div','ttd',(D.pengirim||''))); k.appendChild(tombol('Taruh suratnya',function(){ tutupPanel(); tugas=1; perbarui(); })); }); }
function kotakTerbuka(){ if(cincin) return; cincin=true; tutupKotak=1; tekan=null; SFX.ting(); buzz([20,40,20]); tugas=2; perbarui();
  setTimeout(lamaran,1400); }
function lamaran(){
  var wa=String(D.waPengirim||'').replace(/\D/g,''), nomor=wa.charAt(0)==='0'?'62'+wa.slice(1):wa;
  panel(function(k){
    var t=el('div','tanya'); t.innerHTML='<em></em>, mau tinggal di rumah ini sama aku?'; t.querySelector('em').textContent=D.penerima||''; k.appendChild(t);
    if(D.penutup) k.appendChild(el('p','ket',D.penutup));
    if(nomor.length>=10){
      [['Iya','Aku udah keliling rumahnya. Iya.'],['Aku mau jawab langsung','Aku udah keliling rumahnya. Aku mau jawab langsung, di depanmu.']].forEach(function(j,i){
        var a=el('a','tbl'+(i?' putih':''),j[0]); a.target='_blank'; a.rel='noopener'; a.href='https://wa.me/'+nomor+'?text='+encodeURIComponent(j[1]); k.appendChild(a); }); }
    k.appendChild(tombol('Lihat kamarnya lagi',function(){ tutupPanel(); },'putih'));
    var m=el('a','dibuat','dibuat di foreverse.id'); m.href=D.foreverseUrl||'https://foreverse.id'; m.target='_blank'; m.rel='noopener'; k.appendChild(m);
  }); tugas=3; perbarui(); }

function janjiPanel(i,judul,lanjut){
  panel(function(k){ k.appendChild(el('p','ket',judul)); k.appendChild(el('div','catat',JANJI[i]||'…'));
    k.appendChild(el('div','ttd',(D.pengirim||''))); k.appendChild(tombol('Simpan',function(){ tutupPanel(); lanjut(); })); }); }

/* ── melangkah ke ruangan berikutnya ── */
var pindah=false;
function melangkah(){
  if(pindah||ri>=RUANG.length-1) return; pindah=true; SFX.pintu(); $('#transisi').classList.add('on');
  setTimeout(function(){ ri++; tugas=0; panTuju=pan=0;
    if(RUANG[ri]==='dapur'||RUANG[ri]==='halaman') $('#lewati').hidden=false;
    perbarui(); $('#transisi').classList.remove('on'); setTimeout(function(){ pindah=false; },350); },420);
}
$('#lewati').addEventListener('click',function(){
  if(RUANG[ri]==='dapur'&&tugas===0){ air=.8; game++; tugas=1; }
  else if(RUANG[ri]==='halaman'&&tugas===0){ lampuJejak=[]; LAMPU_KAIT.forEach(function(k,i){ if(i){ var a=LAMPU_KAIT[i-1]; for(var s=0;s<=10;s++) lampuJejak.push({u:a.u+(k.u-a.u)*s/10,v:a.v+(k.v-a.v)*s/10+Math.sin(Math.PI*s/10)*.05}); } }); lampuNyala=true; game++; tugas=1; }
  $('#lewati').hidden=true; perbarui();
});
function perbarui(){ var s=sasaran(); $('#letak').textContent=NAMA[RUANG[ri]]; $('#petunjuk').innerHTML=s?s.kata:'Rumahnya sudah kamu kelilingi.'; }

/* ── panel ── */
function siap(){ return performance.now()-panelSejak>=400; }
function tombol(t,fn,kelas){ var b=el('button','tbl'+(kelas?' '+kelas:''),t); b.type='button'; b.addEventListener('click',function(){ if(siap()) fn(); }); return b; }
function panel(isi){ var k=$('#kartu'); k.innerHTML=''; isi(k); k.scrollTop=0; $('#tirai').hidden=false; panelSejak=performance.now(); }
function tutupPanel(){ $('#tirai').hidden=true; }

/* ── putaran ── */
var akhir=performance.now();
function putar(t){ requestAnimationFrame(putar); var dt=Math.min(.05,(t-akhir)/1000); akhir=t;
  pan+=(panTuju-pan)*Math.min(1,dt*14);
  if(tuang){ air=Math.min(1.05,air+dt*.42); if(Math.random()<.15) SFX.tuang(); if(air>=1.05){ tuang=false; tekan=null; nilaiTeh(); } }
  cx.clearRect(0,0,W,H); GAMBAR_RUANG[RUANG[ri]](t); penanda(t); }
addEventListener('resize',ukur); ukur(); perbarui(); requestAnimationFrame(putar);

$('#tblMulai').addEventListener('click',function(){ ac(); MU.play(); SFX.ketuk(); $('#pembuka').classList.add('pergi'); setTimeout(function(){ var p=$('#pembuka'); p&&p.remove(); },700); });

/* jembatan uji (baca saja). Tanpa foto, ruang tamu langsung ke catatan. */
window.__fv=function(){ var s=sasaran(); return { ruang:RUANG[ri], tugas:tugas, game:game, pan:pan, panTuju:panTuju, PW:PW, W:W, H:H, S:S(),
  sasaran:s?{x:s.u*PW-pan,y:s.v*H,r:s.r*S(),pintu:!!s.pintu,semua:(s.semua||[]).map(function(p){ return {x:p.u*PW-pan,y:p.v*H}; })}:null,
  keset:{x:(.55-keset*.17*kesetArah)*PW-pan,y:.88*H}, kait:LAMPU_KAIT.map(function(k){ return {x:k.u*PW-pan,y:k.v*H}; }), air:air,
  kotak:{x:.72*PW-pan,y:.6*H}, panel:!$('#tirai').hidden, pindah:pindah, cincin:cincin }; };
}
</script>
<script>
(function(){
  "use strict";
  var tirai=document.getElementById("memuat");
  var data=null; try{ data=JSON.parse(document.getElementById("foreverse-data").textContent||"{}"); }catch(e){ data={}; }
  if(!data||!data.penerima){ document.getElementById("memuatPesan").textContent="Suratnya tidak bisa dibuka sekarang. Minta tautan yang benar ke pengirimnya, ya."; return; }
  window.KADO=data;
  var tugas=(data.foto||[]).filter(function(f){ return f&&f.src; }).map(function(f){ return new Promise(function(b){ var im=new Image(); im.onload=im.onerror=b; im.src=f.src; }); });
  Promise.race([Promise.all(tugas),new Promise(function(r){ setTimeout(r,12000); })]).then(function(){ FV_MULAI(); tirai.classList.add("pergi"); setTimeout(function(){ tirai.remove(); },420); });
})();
</script>
