<style>
/* =====================================================================
   DUA JENDELA — layar terbelah dua kota.
   · panggungnya SATU layar tetap yang terbelah: potret atas-bawah,
     landscape kiri-kanan. Tidak ada kolom tunggal, tidak ada scroll.
   · tiap sisi diterangi sesuai JAM ASLI kotanya saat surat dibuka
   · benda di meja diposisikan dalam persen kotak MEJA-nya sendiri,
     berdiri di garis permukaan meja — tidak ada yang melayang
   · penutup: garis tengah hilang, dua kamar jadi satu ruangan
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#241C2E; --redup:#6E6480; --krem:#FFF8EE; --kertas:#FFFDF8;
  --coral:#E8734A; --amber:#FFC24A; --hijau:#3F8F7A;
  --serif:'Fraunces',Georgia,serif; --sans:'Figtree',system-ui,sans-serif;
  --atas:58px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#EFE6D8}
body{position:fixed;inset:0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}

#atas{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--atas) + env(safe-area-inset-top));
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:var(--krem);border-bottom:3px solid var(--ink);
  display:grid;grid-template-columns:auto 1fr auto auto;gap:2px 9px;align-items:center}
#langkahN{font-weight:700;font-size:.74rem;color:var(--coral);white-space:nowrap}
#langkahT{grid-column:1/-1;font-size:.86rem;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kecil{font-size:.74rem;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:#fff;white-space:nowrap}
#suara{width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:.8rem}

/* ---------- panggung terbelah ---------- */
#panggung{position:fixed;left:0;right:0;bottom:0;top:calc(var(--atas) + env(safe-area-inset-top));
  display:grid;grid-template-rows:1fr 5px 1fr}
#garis{background:var(--ink);transition:opacity 1.2s ease, transform 1.2s ease;position:relative;z-index:3}
@media (orientation:landscape){ #panggung{grid-template-rows:none;grid-template-columns:1fr 5px 1fr} }
#panggung.satu #garis{opacity:0;transform:scale(.2)}
.sisi{position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--dinding,#F6E7D2);
  transition:background 1.4s ease}
.papan{display:flex;align-items:baseline;gap:8px;padding:8px 12px 2px;flex-wrap:wrap;position:relative;z-index:2}
.papan b{font-family:var(--serif);font-size:1.02rem}
.papan .kota{font-size:.8rem;font-weight:600;opacity:.75}
.papan .jam{margin-left:auto;font-family:var(--serif);font-weight:700;font-size:1.35rem;letter-spacing:.02em}
.sisi.gelap{color:#FFF2DE}
/* jendela & foto rata atas — sisa ruang di bawahnya dicadangkan untuk
   gelembung pikiran di atas jam meja, supaya tidak pernah menimpa */
.dinding{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:space-evenly;gap:10px;padding:2% 14px 0}
.jendela{position:relative;height:66%;max-height:min(280px, 66%);aspect-ratio:4/3;border:4px solid var(--ink);border-radius:6px;overflow:hidden;
  background:var(--langit,#BFE3F5);transition:background 1.4s ease;flex:none}
.jendela::before,.jendela::after{content:"";position:absolute;background:var(--ink);z-index:2}
.jendela::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
.jendela::after{top:50%;left:0;right:0;height:3px;transform:translateY(-50%)}
.bulat{position:absolute;width:26%;aspect-ratio:1/1;border-radius:50%;right:14%;top:14%;background:var(--surya,#FFD36B);box-shadow:0 0 18px var(--surya,#FFD36B)}
.tempel{position:relative;height:60%;max-height:min(230px, 60%);aspect-ratio:4/5;background:#fff;padding:5px 5px 18px;border:2px solid var(--ink);
  box-shadow:2px 3px 0 rgba(0,0,0,.18);transform:rotate(-4deg);flex:none}
.tempel img{width:100%;height:100%;object-fit:cover;display:block}
.tempel::before{content:"";position:absolute;left:50%;top:-8px;width:34px;height:14px;background:rgba(255,226,140,.85);transform:translateX(-50%) rotate(3deg)}
.tempel span{position:absolute;left:4px;right:4px;bottom:2px;font-size:.6rem;font-weight:600;text-align:center;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* meja: benda berdiri di garis permukaan (38% dari atas kotak meja) */
.meja{position:relative;flex:0 0 44%;min-height:118px}
.meja .muka{position:absolute;left:0;right:0;top:38%;bottom:0;background:var(--kayu,#C99A63);border-top:4px solid var(--ink)}
.meja .muka::after{content:"";position:absolute;left:0;right:0;top:12px;bottom:0;background:var(--kayu2,#A97B4A)}
.benda{position:absolute;bottom:calc(62% - 2px);display:flex;flex-direction:column;align-items:center;
  /* membesar mengikuti tinggi kamar (--sk dari JS), berporos di bawah —
     tetap berpijak di permukaan meja; cincin penanda ikut membesar */
  transform:translateX(-50%) scale(var(--sk,1));transform-origin:50% 100%}
.label{position:absolute;top:calc(38% + 20px);transform:translateX(-50%);font-size:.7rem;font-weight:700;background:var(--krem);
  border:2px solid var(--ink);border-radius:999px;padding:0 8px;white-space:nowrap;z-index:2;color:var(--ink)}
.lampu{width:34px;height:58px;position:relative}
.lampu i{position:absolute;left:4px;top:0;width:26px;height:20px;background:#E8734A;border:3px solid var(--ink);border-radius:12px 12px 4px 4px}
.lampu b{position:absolute;left:15px;top:18px;width:4px;height:34px;background:var(--ink)}
.lampu u{position:absolute;left:6px;bottom:0;width:22px;height:6px;background:var(--ink);border-radius:3px}
.sisi.gelap .lampu i{background:#FFD36B;box-shadow:0 0 26px 10px rgba(255,211,107,.55)}
.jamMeja{min-width:66px;height:36px;padding:0 8px;background:#2B2533;border:3px solid var(--ink);border-radius:8px;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;color:#FFC24A;font-size:1.02rem}
.ponsel{width:46px;height:74px;border:3px solid var(--ink);border-radius:9px;background:#1F1A26;padding:5px 4px;position:relative;overflow:hidden}
.ponsel .layar{width:100%;height:100%;border-radius:4px;background:#5E5A6A;background-size:cover;background-position:center;position:relative}
.ponsel .notif{position:absolute;left:3px;right:3px;top:6px;background:#fff;border-radius:4px;font-size:.5rem;font-weight:700;padding:2px 3px;line-height:1.15;color:var(--ink)}
.awan{position:absolute;bottom:calc(100% + 34px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:14px;
  padding:5px 10px;font-size:.72rem;font-weight:700;white-space:nowrap;color:var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.awan::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}

/* benda yang sedang aktif: cincin putus-putus + panah, selalu disertai
   namanya di baris instruksi */
.aktif{cursor:pointer}
.aktif::before{content:"";position:absolute;inset:-9px;border:3px dashed var(--coral);border-radius:14px;animation:denyut 1.3s ease-in-out infinite;pointer-events:none}
.aktif::after{content:"▼";position:absolute;left:50%;top:-30px;transform:translateX(-50%);color:var(--coral);font-size:1.15rem;
  animation:lompat 1s ease-in-out infinite;text-shadow:0 1px 0 var(--ink)}
@keyframes denyut{50%{opacity:.35}}
@keyframes lompat{50%{transform:translate(-50%,-5px)}}
@keyframes bergetar{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.dering{animation:bergetar .3s linear infinite}

/* paket yang menyeberangi garis tengah */
/* pointer-events:none — kotaknya hanya gambar; ketukan harus tembus ke
   benda di bawahnya yang memang menerima ketukan (bercincin aktif) */
#paket{position:fixed;z-index:6;width:62px;height:50px;left:0;top:0;pointer-events:none;transform-origin:50% 100%;transition:transform 1.3s cubic-bezier(.55,0,.35,1)}
#paket .kotak{position:absolute;inset:0;background:#C98A52;border:3px solid var(--ink);border-radius:4px}
#paket .kotak::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;background:#E8734A;transform:translateX(-50%)}
#paket .kotak::after{content:"";position:absolute;top:50%;left:0;right:0;height:8px;background:#E8734A;transform:translateY(-50%)}

/* satu ruangan (penutup) */
#satuKata{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:7;transition:opacity 1s ease .9s, transform 1s ease .9s;
  background:var(--krem);border:3px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);padding:10px 18px;text-align:center;pointer-events:none}
#satuKata b{display:block;font-family:var(--serif);font-size:1.3rem}
#satuKata span{font-size:.86rem;color:var(--redup)}
#panggung.satu ~ #satuKata{opacity:1;transform:translate(-50%,-50%)}

/* ---------- panel ---------- */
#tirai{position:fixed;inset:0;z-index:40;background:rgba(36,28,46,.42);display:flex;align-items:center;justify-content:center;padding:14px}
.kartu{width:100%;max-width:440px;max-height:calc(100svh - 28px);overflow:auto;background:var(--krem);border:3px solid var(--ink);border-radius:12px;
  box-shadow:6px 6px 0 var(--ink);padding:18px 18px 16px;-webkit-overflow-scrolling:touch}
.kartu h3{font-family:var(--serif);font-weight:700;font-size:1.32rem;line-height:1.15;margin-bottom:8px}
.kartu p{font-size:.95rem;margin-bottom:10px}
.tbl{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:999px;background:var(--coral);color:#fff;
  font-weight:700;border:3px solid var(--ink);box-shadow:3px 4px 0 var(--ink);text-decoration:none;margin-top:6px}
.tbl:active{transform:translate(2px,3px);box-shadow:0 1px 0 var(--ink)}
.tbl.putih{background:#fff;color:var(--ink)}
.tbl.hijau{background:var(--hijau)}
.tbl[disabled]{opacity:.4;pointer-events:none}
.baris-tbl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* panggilan masuk (pembuka) */
.panggil{text-align:center}
.panggil .foto-bulat{width:86px;height:86px;border-radius:50%;border:3px solid var(--ink);margin:4px auto 10px;background:#E9DCC4 center/cover;display:grid;place-items:center;
  font-family:var(--serif);font-size:2rem;font-weight:700}
.panggil .siapa{font-family:var(--serif);font-size:1.5rem;font-weight:700}
.panggil .dari{font-size:.88rem;color:var(--redup);margin-bottom:12px}

/* kuis */
.jamBesar{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin:2px 0 12px}
.jamBesar b{font-family:var(--serif);font-size:1.7rem}
.pilih{display:grid;gap:8px;margin-bottom:10px}
.pilih button{text-align:left;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-weight:600}
.pilih button.benar{background:#DDF1E1;border-color:var(--hijau)}
.pilih button.salah{animation:geleng .35s ease}
@keyframes geleng{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* samakan jadwal */
.duaJam{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:4px 0 12px}
.duaJam .k{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px;text-align:center}
.duaJam .k small{display:block;font-size:.72rem;font-weight:700;color:var(--redup)}
.duaJam .k b{font-family:var(--serif);font-size:1.5rem}
.duaJam .k em{display:block;font-style:normal;font-size:.7rem;color:var(--coral);font-weight:700;min-height:1em}
.putar{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.putar button{min-width:88px;height:46px;white-space:nowrap;padding:0 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:700;font-size:1.05rem}

/* surat sebagai pesan di ponsel */
.hp{background:#F2EEF7;border:3px solid var(--ink);border-radius:18px;padding:12px 10px 14px;margin:2px 0 10px}
.hp .kepala{display:flex;align-items:center;gap:8px;border-bottom:1px solid #D7D0E2;padding-bottom:8px;margin-bottom:10px}
.hp .kepala i{width:30px;height:30px;border-radius:50%;background:#E9DCC4 center/cover;border:2px solid var(--ink);flex:none}
.hp .kepala b{font-size:.92rem}
.hp .kepala small{display:block;font-size:.7rem;color:var(--redup)}
.gelembung{background:#fff;border:1px solid #D7D0E2;border-radius:4px 14px 14px 14px;padding:9px 11px;margin:0 30px 8px 0;font-size:.95rem;line-height:1.5}
.gelembung small{display:block;text-align:right;font-size:.66rem;color:var(--redup);margin-top:3px}
.ketik{display:inline-flex;gap:4px;padding:10px 12px;background:#fff;border-radius:4px 14px 14px 14px;border:1px solid #D7D0E2}
.ketik i{width:7px;height:7px;border-radius:50%;background:#A79FB0;animation:titik 1s infinite}
.ketik i:nth-child(2){animation-delay:.15s}.ketik i:nth-child(3){animation-delay:.3s}
@keyframes titik{50%{transform:translateY(-4px)}}

/* isi paket */
.lapisan{display:grid;gap:8px;margin:2px 0 10px}
.lapis{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-weight:600}
.lapis img{width:100%;max-height:28svh;object-fit:cover;display:block;border:2px solid var(--ink);margin-top:8px}
.kertasKado{display:block;width:100%;text-align:center;background:repeating-linear-gradient(45deg,#F6C9B6 0 10px,#FBE0D4 10px 20px);border:2px dashed var(--ink);border-radius:10px;padding:14px;font-weight:700}

.hitung{font-family:var(--serif);font-size:1.05rem;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;margin:2px 0 10px}
.hitung b{display:block;font-size:1.8rem;color:var(--coral);line-height:1.1}
.balas{width:100%;margin-top:6px;border:2px solid var(--ink);border-radius:8px;padding:9px 11px;font:inherit;font-size:.92rem;background:#fff;min-height:70px;resize:vertical;user-select:text;-webkit-user-select:text}
.jejak{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;font-size:.76rem;color:var(--redup)}
.jejak a{color:var(--redup)}

#toast{position:fixed;left:50%;top:calc(var(--atas) + 14px + env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;z-index:30;background:var(--ink);color:#FFF4E2;
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:.86rem;max-width:88vw;text-align:center;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:520px){ .meja{flex-basis:48%;min-height:104px} .papan{padding-top:5px} .papan .jam{font-size:1.15rem} }
@media (prefers-reduced-motion:reduce){*{transition-duration:.05s!important;animation-duration:.05s!important}}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   FOREVERSE · mesin tema "Dua Jendela" (LDR)
   Menggantikan tema Zona Waktu lama seluruhnya (id tema tetap
   "zona-waktu" supaya tautan pesanan lama tetap hidup). Dipakai ulang
   dari tema lain HANYA: sintesis suara, kotak musik, toast.
   ═══════════════════════════════════════════════════════════════ */
(function(){
"use strict";

var D = {};
try { D = JSON.parse(document.getElementById('foreverse-data').textContent) || {}; }

/* ══════════════ jam kota yang hidup ══════════════ */
function waktuDi(tz){
  try{
    var p = new Intl.DateTimeFormat('en-GB', { timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date());
    var h = 0, m = 0;
    p.forEach(function(x){ if(x.type === 'hour') h = +x.value % 24; if(x.type === 'minute') m = +x.value; });
    return h*60 + m;
  }catch(e){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
}
function tulis(m){ m = ((m % 1440) + 1440) % 1440; return ('0' + Math.floor(m/60)).slice(-2) + '.' + ('0' + (m%60)).slice(-2); }
/* selisih B − A dalam menit, dinormalkan ke (−720, 720] */
function selisih(){ var d = waktuDi(KB.tz) - waktuDi(KA.tz); while(d <= -720) d += 1440; while(d > 720) d -= 1440; return d; }
function hariGeser(mAsal, d){ var t = mAsal + d; return t < 0 ? 'kemarin' : (t >= 1440 ? 'besok' : ''); }

/* suasana dari jam: [langit, matahari/bulan, dinding, kayu, kayu-gelap, gelap?] */
function suasana(m){
  var h = m / 60;
  if(h >= 5 && h < 7)   return ['linear-gradient(#F7B9A0,#FFE3B5)', '#FFB36B', '#FBE3CF', '#C99A63', '#A97B4A', false];
  if(h >= 7 && h < 16)  return ['linear-gradient(#8FD0F2,#D9F0FB)', '#FFD36B', '#F6EBDA', '#C99A63', '#A97B4A', false];
  if(h >= 16 && h < 18.5) return ['linear-gradient(#F59C7A,#FFD2A0)', '#FF9E5E', '#F7DCC6', '#C08B58', '#9E7244', false];
  return ['linear-gradient(#2E3A6E,#4C5A94)', '#F2EFD8', '#5B5277', '#7B5E46', '#5E4634', true];
}
function terangi(sisi, jendela, m){
  var s = suasana(m);
  jendela.style.setProperty('--langit', s[0]);
  jendela.style.setProperty('--surya', s[1]);
  sisi.style.setProperty('--dinding', s[2]);
  sisi.style.setProperty('--kayu', s[3]);
  sisi.style.setProperty('--kayu2', s[4]);

}

var AC = null, bisu = false;

function tone(f, dur, o){
  o = o || {}; var a = ac(); if(!a || bisu) return;
  var t = a.currentTime + (o.when||0), osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .1, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  osc.connect(g); g.connect(a.__out||a.destination); osc.start(t); osc.stop(t + dur + .05);
}

function musicBox(){
  var a = ac(); if(!a) return function(){};
  var stop = false, i = 0, pola = [0,7,12,7,4,7,11,7,2,9,14,9,5,9,12,9];
  function ping(midi, t){
    var f = 440 * Math.pow(2, (midi - 69) / 12), o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(bisu ? .0001 : .042, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .9);
    o.connect(g); g.connect(a.__out||a.destination); o.start(t); o.stop(t + 1);
  }
  var tNext = a.currentTime + .05;
  (function loop(){
    if(stop) return;
    if(tNext < a.currentTime) tNext = a.currentTime + .05;
    while(tNext < a.currentTime + 2){ ping(60 + pola[i % pola.length], tNext); tNext += .44; i++; }

/* ── 2 · game: "jam segini aku lagi apa?" — jawabannya bergantung
   pada JAM ASLI di kota pengirim saat surat dibuka ── */
/* kebiasaan yang jamnya PALING DEKAT dengan jam sekarang di kota
   pengirim (melingkar 24 jam). Bukan "yang terakhir sudah lewat": jam
   07.07 dengan kebiasaan 07.30 & 22.30 harus terbaca "berangkat kerja",
   bukan "siap-siap tidur". Seri → yang lebih awal di daftar isian. */
function rutinitasSekarang(){
  var kini = waktuDi(KA.tz), hasil = RUT[0], jt = 1e9;
  RUT.forEach(function(r){
    var d = Math.abs(menitDari(r.jam) - kini); d = Math.min(d, 1440 - d);
    if(d < jt){ jt = d; hasil = r; }
  });
  return hasil;
}
function bukaKuis(){
  var aw = $('#pikirA .awan'); if(aw) aw.remove();
  var benar = rutinitasSekarang(), kini = waktuDi(KA.tz);
  var jb = el('div', 'jamBesar'); jb.appendChild(el('b', '', tulis(kini))); jb.appendChild(el('span', '', 'sekarang di ' + KA.nama));
  var pilih = el('div', 'pilih'), lanjut = tombol('Lanjut', function(){ tutup(); keSurat(); });
  lanjut.hidden = true;
  [1,2,0].map(function(i){ return RUT[i]; }).forEach(function(r){
    var b = el('button', '', r.kegiatan); b.type = 'button';
    b.addEventListener('click', function(){
      if(!siap() || !lanjut.hidden) return;
      if(r !== benar){ b.classList.remove('salah'); void b.offsetWidth; b.classList.add('salah'); SFX.salah(); toast('Belum. Lihat lagi jam di ' + KA.nama + '.'); return; }

  });

  buka([ h3('Jam segini dia lagi apa?'), jb, pilih, ket, lanjut ]);

/* ── 4 · game: samakan jadwal — jam meja penerima diputar ke jam
   lokalnya yang setara dengan rutinitas si pengirim, dua ronde ── */
function keJadwal(){

  aktifkan($('#jamBendaB'), function(){ jadwalBuka = true; bukaJadwal(0); });

function bukaJadwal(ronde){
  var r = RUT[ronde === 0 ? 0 : 2], d = selisih();
  var asal = menitDari(r.jam), target = ((asal + d) % 1440 + 1440) % 1440;
  var nilai = asal;                                    // jarum mulai di angka yang sama — selisihnya yang harus dicari
  var kA = el('div', 'k'), kB = el('div', 'k');
  kA.appendChild(el('small', '', KA.nama)); kA.appendChild(el('b', '', tulis(asal))); kA.appendChild(el('em', '', ''));
  kB.appendChild(el('small', '', KB.nama + ' (punyamu)'));
  var bB = el('b', '', tulis(nilai)), eB = el('em', '', ''); kB.appendChild(bB); kB.appendChild(eB);
  var dua = el('div', 'duaJam'); dua.appendChild(kA); dua.appendChild(el('span', '', '→')); dua.appendChild(kB);
  var putar = el('div', 'putar');
  var ok = tombol('Cocokkan', function(){
    if(nilai !== target){ SFX.salah(); toast('Belum pas. Di ' + KB.nama + ' sekarang jam ' + tulis(waktuDi(KB.tz)) + ', di ' + KA.nama + ' jam ' + tulis(waktuDi(KA.tz)) + '.', 3200); return; }
    SFX.benar(); buzz(30);
    var hari = hariGeser(asal, d);
    toast('Pas. Saat dia ' + r.kegiatan + ', di tempatmu jam ' + tulis(target) + (hari ? ' (' + hari + ')' : '') + '.', 3200);
    tutup();
    if(ronde === 0) bukaJadwal(1); else { jadwalBuka = false; segarJam(); keGanti(); }
  }, 'hijau');
  function segar(){ bB.textContent = tulis(nilai); }
  [['−1 jam', -60], ['+1 jam', 60]].forEach(function(x){
    var b = el('button', '', x[0]); b.type = 'button';
    b.addEventListener('click', function(){ if(!siap()) return; nilai = ((nilai + x[1]) % 1440 + 1440) % 1440; segar(); SFX.klik(); $('#jamMejaB').textContent = tulis(nilai); });
    putar.appendChild(b);
  });
  var isi = [ h3('Samakan jadwal' + (ronde ? ' (2 dari 2)' : ' (1 dari 2)')),
    p('Jam ' + tulis(asal) + ' di ' + KA.nama + ', dia ' + r.kegiatan + '. Putar jam mejamu: di ' + KB.nama + ' itu jam berapa?'),
    dua ];
  if(d === 0){
    isi.push(p('Kalian ternyata di zona waktu yang sama — jamnya memang sama persis. Tinggal cocokkan.'));
  }
  isi.push(putar, ok);
  panelSejak = performance.now();
  buka(isi);
}

function taruhPaket(node, ms){
  paketDi = node;
  var pk = $('#paket'), r = node.getBoundingClientRect();
  pk.style.transition = ms ? '' : 'none';
  /* skala sama dengan benda di meja, berporos di bawah → tetap di meja */
  pk.style.transform = 'translate(' + (r.left + r.width/2 - 31).toFixed(1) + 'px,' + (r.bottom - 50).toFixed(1) + 'px) scale(var(--sk,1))';
  if(!ms){ void pk.offsetWidth; pk.style.transition = ''; }
}
function kirimPaket(){
  SFX.geser(); buzz(20);
  taruhPaket($('#jamBendaB'), 1300);
  setTimeout(function(){ bukaPaket(); }, 1450);
}
function bukaPaket(){
  $('#labelPaketA').textContent = 'ponselnya';
  $('#mejaPaketA').querySelector('.ponsel').style.visibility = '';
  var lap = el('div', 'lapisan'), sisa = 3;
  var kertas = el('button', 'kertasKado', 'Ketuk untuk membuka lapis pertama'); kertas.type = 'button';
  var selesai = tombol('Simpan semuanya', function(){ tutup(); $('#paket').hidden = true; mulaiSatu(); }, 'hijau');
  selesai.hidden = true;
  kertas.addEventListener('click', function(){
    if(!siap()) return;
    var i = 3 - sisa, kotak = el('div', 'lapis', OLEH[i]);
    if(i === 2 && FOTO[2]){ var img = el('img'); img.alt = ''; img.src = FOTO[2].src; kotak.appendChild(img); if(FOTO[2].caption) kotak.appendChild(el('div', '', FOTO[2].caption)); }
    lap.appendChild(kotak); sisa--; SFX.benar(); buzz(15);
    if(sisa <= 0){ kertas.remove(); selesai.hidden = false; }
    else kertas.textContent = 'Masih ada lapis lagi — ketuk';
  });
  buka([ h3('Paket dari ' + KA.nama), p('Dibungkus tiga lapis. Pelan-pelan aja.'), lap, kertas, selesai ]);
}

/* ── 6 · penutup: garis tengah hilang, dua kamar jadi satu ── */
function mulaiSatu(){
  setLangkah(5);
  satu = true; segarJam(); SFX.benar();
  $('#panggung').classList.add('satu');
  var hari = KETEMU ? Math.round((KETEMU - new Date(new Date().setHours(0,0,0,0))) / 86400000) : null;
  $('#satuSub').textContent = hari && hari > 0 ? hari + ' hari lagi, beneran.' : 'sebentar lagi, beneran.';
  setTimeout(bukaAkhir, 2600);
}
function bukaAkhir(){
  var isi = [ h3('Satu ruangan') ];
  var hari = KETEMU ? Math.round((KETEMU - new Date(new Date().setHours(0,0,0,0))) / 86400000) : null;
  if(hari !== null && hari > 0){
    var h = el('div', 'hitung'); h.appendChild(el('b', '', hari + ' hari lagi')); h.appendChild(document.createTextNode('sampai kalian di kota yang sama.'));
    isi.push(h);
  } else if(hari === 0){
    var h0 = el('div', 'hitung'); h0.appendChild(el('b', '', 'Hari ini')); h0.appendChild(document.createTextNode('kalian ketemu.')); isi.push(h0);
  }
  if(PENUTUP) isi.push(p(PENUTUP + ' — ' + PENGIRIM));
  var wa = String(D.waPengirim || '').replace(/\D/g, ''), nomor = wa.charAt(0) === '0' ? '62' + wa.slice(1) : wa;
  if(nomor.length >= 10 || window.fvBalas){
    var ta = el('textarea', 'balas'); ta.value = 'Udah aku buka. Di sini jam ' + tulis(waktuDi(KB.tz)) + ', kangen kamu yang di jam ' + tulis(waktuDi(KA.tz)) + '.';
    var tombolBalas = [];
    if(window.fvBalas) tombolBalas.push(fvBalas.tombol(ta, { tagName:'A', className:'tbl' }, 'Kirim balasan ke ' + PENGIRIM));
    if(nomor.length >= 10){
      var kirim = el('a', 'tbl' + (window.fvBalas ? ' putih' : ''), 'Balas lewat WhatsApp');
      kirim.target = '_blank'; kirim.rel = 'noopener'; kirim.href = 'https://wa.me/' + nomor;
      kirim.addEventListener('click', function(){ kirim.href = 'https://wa.me/' + nomor + '?text=' + encodeURIComponent(ta.value); });
      tombolBalas.push(kirim);
    }
    isi.push.apply(isi, [ta].concat(tombolBalas));
  }
  var bar = el('div', 'baris-tbl');
  bar.appendChild(tombol('Baca pesannya lagi', function(){ tutup(); bukaSurat(); }, 'putih'));
  bar.appendChild(tombol('Lihat kamarnya', function(){ tutup(); }, 'putih'));
  isi.push(bar);
  var jejak = el('div', 'jejak');
  jejak.innerHTML = '<svg width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path d="M1 11C1 5 4.5 1 8 1" fill="none" stroke="#241C2E" stroke-width="2" stroke-linecap="round"/><path d="M19 11C19 5 15.5 1 12 1" fill="none" stroke="#E8734A" stroke-width="2" stroke-linecap="round"/></svg>';
  var a = el('a', '', 'Dibuat dengan Foreverse'), fu = D.foreverseUrl || 'https://foreverse.id';
  a.href = fu + (fu.indexOf('?') > -1 ? '&' : '?') + 'ref=zona-waktu'; a.target = '_blank'; a.rel = 'noopener';
  jejak.appendChild(a); isi.push(jejak);
  buka(isi);
}

/* ── lewati: langsung ke pesan, lalu penutup ── */
$('#lewati').addEventListener('click', function(){
  if(panelBuka && langkah === 0){ tutup(); }
  if(satu || panelBuka) return;
  ac(); MU.main(); aktifkan(null); lewatiMode = true;
  $('#ponselB').classList.remove('dering'); $('#paket').hidden = true;
  setLangkah(2);
  bukaSurat();
});
$('#suara').addEventListener('click', function(){
  bisu = !bisu; MU.bisukan(bisu);
  try{ if(AC){ bisu ? AC.suspend() : AC.resume(); } }catch(e){}
  this.textContent = bisu ? '🔇' : '🔊';
});

/* ── mulai ── */
$('#namaA').textContent = PENGIRIM; $('#kotaA').textContent = KA.nama;
$('#namaB').textContent = PENERIMA; $('#kotaB').textContent = KB.nama;
if(FOTO[1]){ var tp = $('#tempelA'); tp.hidden = false; tp.querySelector('img').src = FOTO[1].src; tp.querySelector('span').textContent = FOTO[1].caption || ''; }
document.title = 'Panggilan dari ' + KA.nama + ' buat ' + PENERIMA;
function skala(){
  var h = $('#sisiA').getBoundingClientRect().height;
  var sk = Math.max(1, Math.min(1.7, h / 380));
  document.documentElement.style.setProperty('--sk', sk.toFixed(2));
}
skala(); window.addEventListener('resize', skala);
segarJam(); setInterval(segarJam, 20000);
window.addEventListener('resize', function(){ if(!$('#paket').hidden && paketDi) taruhPaket(paketDi, 0); });
$('#ponselB').classList.add('dering');
setLangkah(0);
SFX.dering();
bukaPanggil();

window.__fv = function(){
  return { langkah:langkah, satu:satu, panel:panelBuka, selisih:selisih(), kini:{ a:waktuDi(KA.tz), b:waktuDi(KB.tz) },
           benarKuis: rutinitasSekarang().kegiatan, rut: RUT.map(function(r){ return r.jam; }), aktif: aktifNode ? aktifNode.id : null };
};
})();
</script>
