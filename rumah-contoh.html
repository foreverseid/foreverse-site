function FV_MULAI(){

var cv=$('#ruang'), cx=cv.getContext('2d'), W=0, H=0, DPR=1, BILAH=72, PW=0, pan=0, panTuju=0;

function sasaran(){

function lepasTekan(e){

function ketuk(q){
  var s=sasaran(); if(!s) return; var r=RUANG[ri];
  if(r==='tamu'&&s.semua){ for(var i=0;i<jumlahFoto();i++) if(!bingkai[i]&&kena(q,{u:FRAME[i].u,v:FRAME[i].v+.12},.1)) return lurusFoto(i); return; }
  if(!kena(q,s)) return;
  if(s.pintu) return melangkah();
  if(r==='teras'&&tugas===1){ kunciAmbil=true; SFX.kunci(); buzz(10); return janjiPanel(0,'Ada catatan diikat di kuncinya',function(){ tugas=2; SFX.pintu(); perbarui(); }); }
  if(r==='tamu'&&tugas===0) return janjiPanel(1,'Catatan di meja ruang tamu',function(){ tugas=1; perbarui(); });
  if(r==='dapur'&&tugas===1) return janjiPanel(2,'Di bawah cangkirnya ada tulisan',function(){ tugas=2; perbarui(); });
  if(r==='halaman'&&tugas===1) return janjiPanel(3,'Diukir kecil di sandaran bangku',function(){ tugas=2; perbarui(); });
  if(r==='kamar'&&tugas===0) return bacaSurat();
}

function putar(t){ requestAnimationFrame(putar); var dt=Math.min(.05,(t-akhir)/1000); akhir=t;
  pan+=(panTuju-pan)*Math.min(1,dt*14);
  if(tuang){ air=Math.min(1.05,air+dt*.42); if(Math.random()<.15) SFX.tuang(); if(air>=1.05){ tuang=false; tekan=null; nilaiTeh(); } }
  cx.clearRect(0,0,W,H); GAMBAR_RUANG[RUANG[ri]](t); penanda(t); }
addEventListener('resize',ukur); ukur(); perbarui(); requestAnimationFrame(putar);

$('#tblMulai').addEventListener('click',function(){ ac(); MU.play(); SFX.ketuk(); $('#pembuka').classList.add('pergi'); setTimeout(function(){ var p=$('#pembuka'); p&&p.remove(); },700); });

/* jembatan uji (baca saja). Tanpa foto, ruang tamu langsung ke catatan. */
window.__fv=function(){ var s=sasaran(); return { ruang:RUANG[ri], tugas:tugas, game:game, pan:pan, panTuju:panTuju, PW:PW, W:W, H:H, S:S(),
  sasaran:s?{x:s.u*PW-pan,y:s.v*H,r:s.r*S(),pintu:!!s.pintu,semua:(s.semua||[]).map(function(p){ return {x:p.u*PW-pan,y:p.v*H}; })}:null,
  keset:{x:(.55-keset*.17)*PW-pan,y:.88*H}, kait:LAMPU_KAIT.map(function(k){ return {x:k.u*PW-pan,y:k.v*H}; }), air:air,
  kotak:{x:.72*PW-pan,y:.6*H}, panel:!$('#tirai').hidden, pindah:pindah, cincin:cincin }; };
}
</script>
<script>
(function(){
  "use strict";
  var tirai=document.getElementById("memuat");
  var data=null; try{ data=JSON.parse(document.getElementById("foreverse-data").textContent||"{}"); }catch(e){ data={}; }
  if(!data||!data.penerima){ document.getElementById("memuatPesan").textContent="Suratnya tidak bisa dibuka sekarang. Minta tautan yang benar ke pengirimnya, ya."; return; }
  window.KADO=data;
  var tugas=(data.foto||[]).filter(function(f){ return f&&f.src; }).map(function(f){ return new Promise(function(b){ var im=new Image(); im.onload=im.onerror=b; im.src=f.src; }); });
  Promise.race([Promise.all(tugas),new Promise(function(r){ setTimeout(r,12000); })]).then(function(){ FV_MULAI(); tirai.classList.add("pergi"); setTimeout(function(){ tirai.remove(); },420); });
})();
</script>
