<script>
/* ═══════════════════════════════════════════════════════════════
   Mesin tema Toples Kunang-Kunang × Confess.
   Urutan: 1 label segel (pembuka) · 2 tampung yang turun (game) ·
   3 foto di tali jemuran (interaktif) · 4 pasangan nyala (game) ·
   5 surat dari cahaya (interaktif) · 6 tahan & lepas (momen khas) ·
   7 jawaban (penutup). Satu kanvas, menyesuaikan potret & mendatar.
   ═══════════════════════════════════════════════════════════════ */
function FV_MULAI(){
'use strict';
var D = KADO || {};
var $=function(s){ return document.querySelector(s); };
var el=function(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; };
var rand=function(a,b){ return a+Math.random()*(b-a); };
var buzz=function(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
var klem=function(v,a,b){ return Math.max(a,Math.min(b,v)); };

D.foto=(D.foto||[]).filter(function(f){ return f && f.src; });
D.surat=(D.surat||[]).filter(function(s){ return s && String(s).trim(); });
/* pesanan versi lama belum punya isian kunang-kunang: pakai kalimat netral */
var KUNANG=[0,1,2].map(function(i){ var v=(D.kunang||[])[i]; return v && String(v).trim() ? v : ['yang pertama aku simpan','yang kedua aku simpan','yang ketiga aku simpan'][i]; });
var SEJAK=String(D.sejak||'').trim();
document.querySelectorAll('[data-f]').forEach(function(n){ n.textContent=D[n.dataset.f]||''; });

/* ── suara dibuat browser ── */
var AC=null, bisu=false;
function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,dur,o){ o=o||{}; var a=ac(); if(!a||bisu) return;
  var t=a.currentTime+(o.when||0), v=o.vol||.12, osc=a.createOscillator(), g=a.createGain();
  osc.type=o.type||'triangle'; osc.frequency.setValueAtTime(f,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g); g.connect(a.destination); osc.start(t); osc.stop(t+dur+.05); }
function noise(dur,freq,vol){ var a=ac(); if(!a||bisu) return;
  var n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);
  var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  var g=a.createGain(); g.gain.value=vol; n.buffer=b; n.connect(f); f.connect(g); g.connect(a.destination); n.start(); }
var SFX={
  sobek:function(){ noise(.16,3000,.12); },
  pop:function(){ tone(620,.08,{type:'sine',vol:.18}); tone(940,.1,{type:'sine',vol:.09,when:.05}); },
  tangkap:function(i){ tone([660,784,988][i%3],.3,{type:'sine',vol:.14}); },
  salah:function(){ tone(196,.18,{type:'sine',vol:.08}); },
  nyala:function(f){ tone(f,.22,{type:'sine',vol:.1}); },
  chime:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,.5,{when:i*.09,vol:.1}); }); }
};
function kotakMusik(){ var a=ac(); if(!a) return null;
  var gain=a.createGain(); gain.gain.value=.1; gain.connect(a.destination);
  var not=[64,67,71,74,71,67, 62,66,69,74,69,66, 60,64,67,72,67,64, 59,62,67,71,74,71];
  var step=.4, t0=a.currentTime+.1, n=0, henti=false, tm=null;
  function ping(m,t){ var o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=440*Math.pow(2,(m-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.5);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t+1.6); }
  (function loop(){ if(henti) return; while(t0<a.currentTime+1.2){ ping(not[n%not.length],t0); t0+=step; n++; } tm=setTimeout(loop,300); })();
  return { gain:gain }; }
var MU=(function(){
  var L=D.lagu||{}, ada=!!(L.src&&String(L.src).trim()), au=ada?new Audio():null, st=+L.mulai||0, en=+L.selesai||0, synth=null, main=false;
  if(au){ au.src=L.src; au.preload='auto'; au.loop=!en;
    au.addEventListener('timeupdate',function(){ if(en>st&&au.currentTime>=en) au.currentTime=st; }); }
  return { play:function(){ if(au){ if(!main){ try{ au.currentTime=st; }catch(e){} } au.volume=.7; au.play().then(function(){ main=true; }).catch(function(){}); return; }
      if(!synth) synth=kotakMusik(); },
    bisu:function(b){ if(au) au.muted=b; } };
})();
$('#suara').onclick=function(){ bisu=!bisu; this.textContent=bisu?'🔇':'🔊'; MU.bisu(bisu); try{ if(AC) bisu?AC.suspend():AC.resume(); }catch(e){} };
var tt; function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('show'); },2200); }

/* cegah menu tekan-lama, seleksi, dan seret gambar bawaan browser */
['contextmenu','selectstart','dragstart'].forEach(function(ev){
  document.addEventListener(ev,function(e){ if(!(e.target.closest&&e.target.closest('#kartu'))||ev!=='selectstart') e.preventDefault(); },true); });
document.addEventListener('touchmove',function(e){ if(!(e.target.closest&&e.target.closest('#kartu'))) e.preventDefault(); },{passive:false});

/* ══════ kanvas & tata letak ══════ */
var cv=$('#langit'), cx=cv.getContext('2d'), W=0, H=0, DPR=1, BILAH=70;
var L={};               // posisi semua benda, dihitung ulang tiap ukuran berubah
var TOPLES={x:0,tx:0};  // x toples (tx = tujuan geser halus)
function ukur(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight-BILAH;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0);
  var mendatar=W>H*1.15;
  var js=klem(Math.min(W*.3,H*(mendatar?.34:.22)),74,150);   // lebar toples
  L={ mendatar:mendatar, js:js, jh:js*1.25, dasar:H-Math.max(16,H*.04), tanah:H-Math.max(40,H*.12) };
  L.mulut=L.dasar-L.jh;                                     // garis bibir toples
  if(!TOPLES.x||!langkahPakaiGeser()) TOPLES.x=TOPLES.tx=W/2;
  TOPLES.x=TOPLES.tx=klem(TOPLES.tx,js/2+8,W-js/2-8);
  /* tali jemuran & tiga foto */
  var pw=klem(Math.min(W*.22,H*(mendatar?.3:.17)),58,130);
  L.pw=pw; L.tali={x0:W*.06,x1:W*.94,y:Math.max(30,H*.1)};
  L.fotoPos=[.24,.5,.76].map(function(t){ var x=W*t; return {x:x,y:taliY(x)+8}; });
  /* enam kunang-kunang pasangan */
  var kol=3, bar=2, gx=Math.min(W*.68,mendatar?W*.5:W*.8), gy=Math.min(H*.3,mendatar?H*.36:H*.26);
  L.orb=[]; for(var r=0;r<bar;r++) for(var c=0;c<kol;c++) L.orb.push({x:W/2+(c-1)*gx/2, y:H*.16+r*gy});
  L.orbR=klem(Math.min(gx,gy)*.17,22,40);
  susunBisik();
}
function taliY(x){ var t=(x-L.tali.x0)/(L.tali.x1-L.tali.x0); return L.tali.y+Math.sin(Math.PI*klem(t,0,1))*Math.min(H*.05,28); }
function susunBisik(){
  var b=$('#bisik'), bt=$('#bisikTetap');
  b.style.top=Math.max(40,L.mulut-150)+'px';
  bt.style.top=(L.orb.length?(L.orb[3].y+L.orbR+22):H*.5)+'px';
}

/* ── latar: bintang, bukit, rumput (digambar sekali per ukuran) ── */
var BINTANG=[]; for(var bi=0;bi<70;bi++) BINTANG.push({x:Math.random(),y:Math.random()*.7,r:rand(.5,1.5),f:rand(0,6)});
var RUMPUT=[]; for(var ri=0;ri<90;ri++) RUMPUT.push({x:Math.random(),h:rand(.5,1),c:Math.random()});
function latar(t){
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#141026'); g.addColorStop(.6,'#241D44'); g.addColorStop(1,'#33295A');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  BINTANG.forEach(function(s){ cx.globalAlpha=.35+.35*Math.sin(t/900+s.f); cx.fillStyle='#F3EEE4';
    cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,7); cx.fill(); });
  cx.globalAlpha=1;
  /* bulan sabit kecil */
  cx.fillStyle='#F6E7C1'; cx.beginPath(); cx.arc(W*.86,H*.09+10,13,0,7); cx.fill();
  cx.fillStyle='#181330'; cx.beginPath(); cx.arc(W*.86+6,H*.09+6,12,0,7); cx.fill();
  /* bukit */
  cx.fillStyle='#1A1532'; cx.beginPath(); cx.moveTo(0,L.tanah-20);
  cx.quadraticCurveTo(W*.3,L.tanah-70,W*.6,L.tanah-26); cx.quadraticCurveTo(W*.85,L.tanah-4,W,L.tanah-40); cx.lineTo(W,H); cx.lineTo(0,H); cx.fill();
  cx.fillStyle='#120E24'; cx.fillRect(0,L.tanah,W,H-L.tanah);
  cx.strokeStyle='#2A2350'; cx.lineWidth=2;
  RUMPUT.forEach(function(r){ var x=r.x*W, h=14+r.h*22, s=Math.sin(t/1200+r.c*6)*4;
    cx.beginPath(); cx.moveTo(x,L.tanah+4); cx.quadraticCurveTo(x+s*.5,L.tanah-h*.5,x+s,L.tanah-h); cx.stroke(); });
}

/* ── kunang-kunang: titik bercahaya ── */
function cahaya(x,y,r,warna,kuat){
  var g=cx.createRadialGradient(x,y,0,x,y,r*4); g.addColorStop(0,warna); g.addColorStop(.25,warna.replace('1)',(.45*kuat)+')')); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r*4,0,7); cx.fill();
  cx.fillStyle='#FFF7DA'; cx.beginPath(); cx.arc(x,y,r*.7,0,7); cx.fill();
}

/* ── toples ── */
var segel=1, tutup=1, terang=0, isiToples=[];  // segel: 1 utuh → 0 lepas; tutup 1 terpasang
function gambarToples(t){
  var x=TOPLES.x, js=L.js, jh=L.jh, y0=L.mulut, y1=L.dasar;
  /* pendar di tanah */
  var pend=.25+terang*.75;
  var g=cx.createRadialGradient(x,y1,0,x,y1,js*1.6); g.addColorStop(0,'rgba(240,180,41,'+(.28*pend)+')'); g.addColorStop(1,'rgba(240,180,41,0)');
  cx.fillStyle=g; cx.fillRect(x-js*1.6,y1-js*1.6,js*3.2,js*1.8);
  /* isi kunang-kunang di dalam */
  isiToples.forEach(function(k,i){ var kx=x+Math.sin(t/700+i*2)*js*.28, ky=y1-jh*.3+Math.cos(t/900+i*1.7)*jh*.22;
    cahaya(kx,ky,3,'rgba(240,180,41,1)',.8+.2*Math.sin(t/300+i)); });
  /* kaca */
  cx.save();
  cx.fillStyle='rgba(200,215,240,'+(.1+terang*.1)+')'; cx.strokeStyle='rgba(243,238,228,.75)'; cx.lineWidth=2.5;
  rrect(x-js/2,y0+8,js,jh-8,js*.18); cx.fill(); cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(x-js*.32,y0+jh*.25); cx.lineTo(x-js*.32,y1-jh*.2); cx.stroke();
  /* leher */
  cx.fillStyle='rgba(200,215,240,.14)'; cx.strokeStyle='rgba(243,238,228,.75)'; cx.lineWidth=2.5;

function jalurSegel(){

function jh4(){ return L.jh*.36; }
function panjangJalur(p){ var s=0; for(var i=1;i<p.length;i++) s+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); return s; }

<script>
/* Pemuat: ambil isi surat, lalu jalankan tampilannya. */
(function(){
  "use strict";
  var tirai = document.getElementById("memuat");
  function gagal(t){ if(!tirai) return; document.getElementById("memuatPesan").textContent = t; }
  function tutupTirai(){ if(tirai){ tirai.classList.add("pergi"); setTimeout(function(){ tirai.remove(); },420); } }
  var data = null;
  try{ data = JSON.parse(document.getElementById("foreverse-data").textContent || "{}"); }catch(e){ data = {}; }
  if(!data || !data.penerima){ gagal("Suratnya tidak bisa dibuka sekarang. Minta tautan yang benar ke pengirimnya, ya."); return; }
  window.KADO = data;
  var tugas = (data.foto || []).filter(function(f){ return f && f.src; }).map(function(f){
    return new Promise(function(beres){ var im = new Image(); im.onload = im.onerror = beres; im.src = f.src; }); });
  Promise.race([Promise.all(tugas), new Promise(function(r){ setTimeout(r, 12000); })]).then(function(){ FV_MULAI(); tutupTirai(); });
})();
</script>
