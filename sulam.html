<style>
/* Palet: meja lavender keabuan, kain linen, benang merah tua, pamidangan
   kayu birch. Beda dari Dua Jendela (krem, coral, amber, hijau), Celengan
   Rindu (terakota, mint, kayu tua), Koper (arang, kuning, biru), dan
   Radio Tengah Malam (malam biru tua, marun, hijau lampu). */
:root{
  --meja:#CFC8DD; --meja2:#B7AECB; --linen:#F3ECE0; --linen2:#E2D6C2; --benang:#B3263A; --benang2:#86192A; --kayu:#E8CF9F; --kayu2:#C8A56C; --tinta:#2B2530; --redup:#6E6680;
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --tangan:'Caveat',cursive;
  --u:min(1vw,.5vh);
}
@media (min-aspect-ratio:1/1){ :root{ --u:min(.62vw,.92vh); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--meja);font-family:var(--sans);color:var(--tinta)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(ellipse at 50% 30%,#DDD7E8 0,transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),var(--meja)}
img{-webkit-user-drag:none;pointer-events:none}
.linen{background:repeating-linear-gradient(0deg,rgba(120,96,60,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,96,60,.07) 0 1px,transparent 1px 3px),var(--linen)}

/* kepala: hitungan jahitan */
.kepala{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 54px 6px}
.label-k{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--linen);box-shadow:0 0 0 1.5px var(--benang) inset,0 0 0 4px var(--linen);outline:1.5px dashed var(--benang);outline-offset:-6px;font:700 12px var(--sans);letter-spacing:.04em;color:var(--benang2)}
#music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:41;border:0;width:34px;height:34px;border-radius:50%;background:var(--linen);color:var(--tinta);font-size:15px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}

.petunjuk{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:65;max-width:500px;margin:0 auto;background:var(--tinta);color:var(--linen);padding:11px 16px 11px 44px;border-radius:12px;font:14px/1.45 var(--sans);box-shadow:0 8px 22px rgba(43,37,48,.3);transition:opacity .25s,transform .25s}
.petunjuk::before{content:"";position:absolute;left:15px;top:50%;width:16px;height:2px;margin-top:-1px;background:var(--benang);box-shadow:0 0 0 1px #F3ECE044;transform:rotate(-35deg)}
.petunjuk b{color:#F2B5BE}
.petunjuk.ganti{opacity:0;transform:translateY(6px)}
.petunjuk.kedip{animation:kedip .45s}
@keyframes kedip{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#lanjut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:70;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:.4s;
  border:0;border-radius:99px;padding:13px 24px;font:700 15px var(--sans);color:#fff;background:var(--benang);box-shadow:0 0 0 4px #B3263A2E,0 8px 20px rgba(43,37,48,.3);cursor:pointer;white-space:nowrap}
#lanjut::after{content:"  ›"}
#lanjut.tampil{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* adegan: berganti seperti kain disibak */
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3.4);
  opacity:0;pointer-events:none;transform:translateY(14px) rotate(-1deg);transition:opacity .55s,transform .7s cubic-bezier(.3,1.2,.5,1);z-index:5}
.sc.aktif{opacity:1;pointer-events:auto;transform:none}
.judul{margin:0;text-align:center;font:600 calc(var(--u)*6.4)/1.12 var(--serif);color:var(--tinta);opacity:0;transform:translateY(8px);transition:.6s}
.judul small{display:block;margin-top:6px;font:700 calc(var(--u)*5.6) var(--tangan);color:var(--benang)}
.judul.tampil{opacity:1;transform:none}

/* ═ 1-2 · pamidangan: kencangkan, lalu jahit ═ */
.ram{--d:calc(var(--u)*80);position:relative;width:var(--d);height:var(--d);flex:none}
.ram .cincin{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 calc(var(--u)*2.4) var(--kayu),0 0 0 calc(var(--u)*2.8) var(--kayu2),0 0 0 calc(var(--u)*4.2) #EFD9AE,0 14px 26px calc(var(--u)*3) rgba(43,37,48,.25);pointer-events:none;z-index:3}
.ram .kain{position:absolute;inset:0;border-radius:50%;overflow:hidden;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.ram .kerut{position:absolute;inset:0;border-radius:50%;pointer-events:none;transition:opacity .5s;
  background:repeating-linear-gradient(115deg,transparent 0 12%,rgba(90,70,50,.10) 13%,transparent 16% 26%),repeating-linear-gradient(35deg,transparent 0 18%,rgba(90,70,50,.08) 19%,transparent 22%)}
.ram.k1 .kain{transform:scale(.95) rotate(-1.5deg)} .ram.k2 .kain{transform:scale(.97) rotate(-.8deg)} .ram.k3 .kain{transform:none}
.ram:not(.k1):not(.k2):not(.k3) .kain{transform:scale(.93) rotate(-2.5deg) skewX(-2deg)}
.ram.k1 .kerut{opacity:.7}.ram.k2 .kerut{opacity:.4}.ram.k3 .kerut{opacity:0}
.sekrup{position:absolute;left:50%;top:calc(var(--u)*-10);width:calc(var(--u)*12);height:calc(var(--u)*10);margin-left:calc(var(--u)*-6);border:0;padding:0;background:none;cursor:pointer;z-index:4}
.sekrup::before{content:"";position:absolute;left:30%;right:30%;top:42%;bottom:0;background:linear-gradient(90deg,#9C9CA6,#E7E7EC,#9C9CA6);border-radius:2px}
.sekrup i{position:absolute;left:8%;right:8%;top:0;height:46%;border-radius:calc(var(--u)*2);background:linear-gradient(180deg,#F1F1F4,#A9AAB3);box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .35s}
.sekrup i::after{content:"";position:absolute;left:20%;right:20%;top:45%;height:2px;background:#7C7C86}
.sekrup.ajak i{animation:ajakS 1.4s infinite}
@keyframes ajakS{0%,100%{box-shadow:0 2px 4px rgba(0,0,0,.25),0 0 0 0 #B3263A66}50%{box-shadow:0 2px 4px rgba(0,0,0,.25),0 0 0 calc(var(--u)*2.4) #B3263A00}}
#s0 .ram{margin-top:calc(var(--u)*12)}
.sekrup-ket{position:absolute;left:50%;top:calc(var(--u)*-17);transform:translateX(-50%);font:700 calc(var(--u)*4.6) var(--tangan);color:var(--benang);white-space:nowrap;transition:opacity .4s}
.ram.k3 #s0 .ram{margin-top:calc(var(--u)*12)}
.sekrup-ket{opacity:0}
svg.pola{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#pola{cursor:pointer}
.pola .lubang{fill:#B9AC97}
.pola .lubang.ajak{fill:var(--benang);animation:denyut 1.1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes denyut{50%{transform:scale(1.9);opacity:.55}}
.pola .jahit{stroke:var(--benang);stroke-width:1.5;stroke-linecap:round;fill:none}
.pola .jahit.baru{animation:tarik .35s ease-out}
@keyframes tarik{from{stroke-dashoffset:var(--p)}to{stroke-dashoffset:0}}
.pola .simpul{fill:var(--benang2);transform-box:fill-box;transform-origin:center;animation:simpul .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes simpul{from{transform:scale(0)}}
.pola .tanda-s{fill:none;stroke:var(--benang);stroke-width:.5;stroke-dasharray:1 1.2;opacity:.6}
.pola .kota{font:700 4.6px var(--tangan);fill:var(--benang2)}
.pola .titik-k{fill:var(--benang2)}
.pola .jarum{stroke:#8E8E98;stroke-width:.9;stroke-linecap:round;transition:transform .3s}
.catatan-j{list-style:none;margin:0;padding:0;width:min(90vw,calc(var(--u)*88));display:flex;flex-direction:column;gap:calc(var(--u)*2)}
.catatan-j li{position:relative;padding:calc(var(--u)*2.2) calc(var(--u)*3.6) calc(var(--u)*2.2) calc(var(--u)*10);border-radius:calc(var(--u)*1.6);box-shadow:0 4px 10px rgba(43,37,48,.12);animation:jatuh .6s cubic-bezier(.3,1.4,.5,1)}
.catatan-j li::before{content:"";position:absolute;left:calc(var(--u)*3.6);top:50%;width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);margin-top:calc(var(--u)*-1.7);border-radius:50%;background:var(--benang2);box-shadow:0 0 0 calc(var(--u)*.8) #F3ECE0,0 0 0 calc(var(--u)*1.2) var(--benang)}
.catatan-j li::after{content:"";position:absolute;inset:4px;border:1.5px dashed #B3263A66;border-radius:calc(var(--u)*1.2);pointer-events:none}
.catatan-j small{display:block;font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--benang)}
.catatan-j span{font:500 clamp(15px,calc(var(--u)*4.4),20px)/1.35 var(--serif);color:var(--tinta)}
@keyframes jatuh{from{opacity:0;transform:translateY(-12px) rotate(-2deg)}}

/* ═ 3 · tambalan foto berpeniti ═ */
.papan{display:grid;grid-template-columns:auto auto;gap:calc(var(--u)*4) calc(var(--u)*5);align-items:center;justify-items:center}
.tambal{position:relative;padding:calc(var(--u)*2);border-radius:calc(var(--u)*1.2);box-shadow:0 6px 14px rgba(43,37,48,.18);transform:rotate(var(--rot,0deg))}
.tambal::after{content:"";position:absolute;inset:calc(var(--u)*.9);border:1.5px dashed var(--benang);border-radius:calc(var(--u)*.8);pointer-events:none;opacity:.7}
.tambal img{display:block;border-radius:2px;background:#ddd}
.tambal.T img{width:calc(var(--u)*34);aspect-ratio:3/4}
.tambal.R img{width:calc(var(--u)*42);aspect-ratio:4/3}
.tambal p{margin:calc(var(--u)*1.4) 0 0;max-width:calc(var(--u)*42);font:700 calc(var(--u)*4.4)/1.05 var(--tangan);color:var(--benang2);text-align:center;opacity:0;transition:opacity .5s .3s}
.tambal.T p{max-width:calc(var(--u)*34)}
.tambal.buka p{opacity:1}
.tutup-t{position:absolute;inset:0;border-radius:calc(var(--u)*1.2);background:repeating-linear-gradient(45deg,#C9BFD9 0 6px,#BDB2CF 6px 12px);box-shadow:inset 0 0 0 calc(var(--u)*.8) #fff6;transform-origin:50% 0;transition:transform .8s cubic-bezier(.5,0,.7,.4),opacity .6s .35s;z-index:2}
.tutup-t::after{content:"";position:absolute;inset:calc(var(--u)*1.4);border:1.5px dashed #ffffffaa;border-radius:calc(var(--u)*.8)}
.tambal.buka .tutup-t{transform:translateY(140%) rotate(24deg);opacity:0;pointer-events:none}
.peniti{position:absolute;left:50%;top:calc(var(--u)*-3.6);width:calc(var(--u)*17);height:calc(var(--u)*7.4);margin-left:calc(var(--u)*-8.5);border:0;background:none;padding:0;cursor:pointer;z-index:3;transition:transform .5s,opacity .5s}
.peniti::before{content:"";position:absolute;left:8%;right:10%;top:30%;height:40%;border:calc(var(--u)*.7) solid #A7A9B4;border-radius:99px 30% 30% 99px}
.peniti::after{content:"";position:absolute;right:0;top:20%;width:24%;height:60%;border-radius:calc(var(--u)*1);background:linear-gradient(180deg,#E4E5EA,#9EA0AB)}
.peniti.ajak{animation:ajakP 1.5s infinite}
@keyframes ajakP{0%,100%{transform:none}50%{transform:translateY(-3px) rotate(-6deg)}}
.tambal.buka .peniti{transform:translate(30px,-40px) rotate(70deg);opacity:0;pointer-events:none}

/* ═ 4 · balik pamidangan, surat di belakang ═ */
.balik-w{position:relative;perspective:900px;flex:none}
.balik{--d:calc(var(--u)*58);position:relative;width:var(--d);height:var(--d);transform-style:preserve-3d;transform:rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.3,1.2,.5,1);touch-action:none;cursor:grab}
.balik.tarik{transition:none}
.balik .muka{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 0 calc(var(--u)*2) var(--kayu),0 0 0 calc(var(--u)*2.4) var(--kayu2),0 12px 22px rgba(43,37,48,.25);overflow:hidden}
.balik .belakang{transform:rotateY(180deg);background:repeating-linear-gradient(0deg,rgba(120,96,60,.1) 0 1px,transparent 1px 3px),#E6DCCB}
.balik .belakang svg{position:absolute;inset:0;width:100%;height:100%}
.balik .belakang p{position:absolute;left:14%;right:14%;bottom:16%;margin:0;text-align:center;font:700 calc(var(--u)*4.4)/1.05 var(--tangan);color:var(--benang2)}
.panah-b{position:absolute;left:50%;bottom:calc(var(--u)*-9);transform:translateX(-50%);font:700 calc(var(--u)*4.8) var(--tangan);color:var(--benang);white-space:nowrap;animation:geserP 1.6s infinite;transition:opacity .3s}
@keyframes geserP{50%{transform:translateX(-38%)}}
.surat-k{width:min(90vw,calc(var(--u)*90));max-height:62vh;overflow-y:auto;padding:calc(var(--u)*5) calc(var(--u)*5.4);border-radius:calc(var(--u)*1.6);box-shadow:0 10px 24px rgba(43,37,48,.18);display:none;flex-direction:column;gap:calc(var(--u)*2.6);position:relative}
.surat-k::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*2);background:repeating-linear-gradient(90deg,var(--benang) 0 10px,transparent 10px 16px);opacity:.75}
.surat-k.tampil{display:flex;animation:jatuh .7s cubic-bezier(.3,1.3,.5,1)}
.surat-k p{margin:0;font:500 clamp(15px,calc(var(--u)*4.4),20px)/1.55 var(--serif);color:var(--tinta);opacity:0;transform:translateY(6px);transition:.6s}
.surat-k p.tampil{opacity:1;transform:none}
.surat-k .ttd{align-self:flex-end;font:700 calc(var(--u)*6) var(--tangan);color:var(--benang)}

/* ═ 5 · gunting benang + balasan ═ */
.ram.kecil{--d:calc(var(--u)*50)}
.benang-g{position:absolute;left:79.5%;top:26%;width:calc(var(--u)*1);height:calc(var(--u)*40);background:var(--benang);border-radius:2px;transform-origin:50% 0;transform:rotate(-10deg);z-index:4;transition:transform 1s cubic-bezier(.5,0,.7,.4),opacity .8s .4s}
.benang-g.putus{transform:rotate(-10deg) translateY(70%) rotate(25deg);opacity:0}
.ujung-g{position:absolute;left:calc(80% + var(--u)*6.4);top:calc(26% + var(--u)*36);width:calc(var(--u)*11);height:calc(var(--u)*11);margin:calc(var(--u)*-5.5) 0 0 calc(var(--u)*-5.5);border-radius:50%;border:2px dashed var(--benang);z-index:5;animation:denyut 1.3s infinite}
.gunting{position:absolute;left:calc(var(--u)*-14);bottom:calc(var(--u)*-18);width:calc(var(--u)*24);height:calc(var(--u)*24);touch-action:none;cursor:grab;z-index:6}
.gunting svg{width:100%;height:100%;overflow:visible}
.gunting.ajak{animation:ajakP 1.5s infinite}
.akhir{width:min(92vw,calc(var(--u)*84));color:var(--tinta);border-radius:calc(var(--u)*2.4);padding:16px;display:none;flex-direction:column;gap:10px;box-shadow:0 12px 28px rgba(43,37,48,.2)}
.akhir.tampil{display:flex;animation:jatuh .7s ease}
.akhir h3{margin:0;font:600 20px/1.2 var(--serif);color:var(--benang2)}
.akhir textarea{width:100%;min-height:76px;border:1.5px solid var(--linen2);border-radius:10px;padding:10px 12px;font:15px var(--sans);resize:none;background:#fff;color:var(--tinta);user-select:text;-webkit-user-select:text}
.akhir .aksi{display:flex;flex-direction:column;gap:8px}
.akhir .aksi a,.akhir .aksi button,.akhir .ulang{border:0;border-radius:99px;padding:12px;font:700 14px var(--sans);text-align:center;text-decoration:none;cursor:pointer}
.t-utama{background:var(--benang);color:#fff}.t-wa{background:#25D366;color:#073b1c}.ulang{background:transparent;color:var(--benang);box-shadow:inset 0 0 0 1.5px var(--benang)}
.dibuat{font-size:12px;color:var(--redup);text-align:center;text-decoration:none}

@media (min-aspect-ratio:1/1){
  #s0,#s2,#s3{flex-direction:row;gap:calc(var(--u)*8)}
  .papan{grid-template-columns:repeat(4,auto);gap:calc(var(--u)*5)}
  .catatan-j{width:calc(var(--u)*92)}
  .surat-k{max-height:calc(100vh - 150px)}
  .ram{--d:calc(var(--u)*72)}
  .ram.kecil{--d:calc(var(--u)*54)}

}
.kol-a{display:contents}
@media (min-aspect-ratio:1/1){ .kol-a{display:flex} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important} }
.dibawa{position:fixed!important;z-index:80!important;margin:0!important;transition:none!important;animation:none!important}
.memuat{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#CFC8DD;transition:opacity .4s}
.memuat.pergi{opacity:0;pointer-events:none}
.memuat p{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#2B2530;font-size:15px;text-align:center;padding:24px;max-width:22rem;line-height:1.6}

<body>
<div id="memuat" class="memuat"><p id="memuatPesan">Menyiapkan benangnya…</p></div>
<header class="kepala"><div class="label-k" id="labelK">0 / 15 jahitan</div></header>
<button id="music" type="button" aria-label="Suara">🔊</button>
<div class="petunjuk" id="petunjuk"></div>
<button id="lanjut" type="button">Lanjut</button>

<!-- 1-2 · pamidangan: kencangkan, jahit -->
<section class="sc" id="s0">
  <div class="kol-a">
    <p class="judul" id="judulAwal"></p>
    <div class="ram" id="ram">
      <div class="kain linen"><div class="kerut"></div><svg class="pola" id="pola" viewBox="0 0 100 100"></svg></div>
      <div class="cincin"></div>
      <span class="sekrup-ket">kencangkan ↓</span>
      <button class="sekrup ajak" id="sekrup" type="button" aria-label="Kencangkan pamidangan"><i></i></button>
    </div>
  </div>
  <ol class="catatan-j" id="catatanJ"></ol>
</section>

<!-- 3 · tambalan foto -->
<section class="sc" id="s1">
  <p class="judul" id="judulFoto"></p>
  <div class="papan" id="papan"></div>
</section>

<!-- 4 · balik pamidangan -->
<section class="sc" id="s2">
  <div class="balik-w"><div class="balik" id="balik">
    <div class="muka depan linen"><svg class="pola" id="polaDepan" viewBox="0 0 100 100"></svg></div>
