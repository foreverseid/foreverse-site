<style>
/* Palet: langit malam ungu-plum + amber kunang-kunang. Satu-satunya
   tema berdasar gelap dengan teks terang. */
:root{
  --bg:#1C1730; --card:#241E3D; --ink:#F3EEE4; --muted:rgba(243,238,228,.68);
  --hair:rgba(243,238,228,.16); --p:#F0B429; --p-dk:#C4891A; --a1:#E79FB0;
  --disp:'Fraunces',Georgia,serif; --hand:'Caveat',cursive;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%;-webkit-user-drag:none;pointer-events:none}

#langit{position:fixed;left:0;top:0;width:100vw;touch-action:none}
/* bilah petunjuk di bawah - tidak pernah menutupi panggung */
#bilah{position:fixed;left:0;right:0;bottom:0;height:70px;padding:0 14px calc(env(safe-area-inset-bottom) * .5);
  display:flex;align-items:center;gap:10px;background:#16122A;border-top:1px solid var(--hair);z-index:20}
#petunjuk{flex:1;font-size:.86rem;font-weight:700;line-height:1.3}
#petunjuk b{color:var(--p)}
#bilah .kecil{font-size:.74rem;font-weight:800;color:var(--muted);padding:8px 10px;border-radius:999px;border:1px solid var(--hair)}
#suara{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);font-size:.95rem}

/* kalimat bisikan yang ditulis kunang-kunang di langit */
.bisik{position:fixed;left:50%;transform:translateX(-50%);max-width:min(88vw,520px);text-align:center;
  font-family:var(--hand);font-size:1.55rem;line-height:1.15;color:#FCE6A3;z-index:12;pointer-events:none;
  text-shadow:0 0 14px rgba(240,180,41,.55);opacity:0;transition:opacity .6s}
.bisik.tampil{opacity:1}
@media (orientation:landscape){ #bisikTetap{max-width:52vw} }
#kumpulan{position:fixed;left:12px;top:12px;z-index:11;display:flex;gap:6px;pointer-events:none}
#kumpulan i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(240,180,41,.6)}
#kumpulan i.isi{background:var(--p);box-shadow:0 0 10px var(--p)}

/* panel */
#tirai{position:fixed;inset:0;z-index:40;background:rgba(14,11,28,.62);display:grid;place-items:center;padding:16px 14px 86px}
#kartu{width:min(100%,440px);max-height:calc(100vh - 110px);overflow:auto;background:var(--card);border:1px solid var(--hair);
  border-radius:20px;padding:20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.45);-webkit-user-select:text;user-select:text}
#kartu h3{font-family:var(--disp);font-weight:600;font-size:1.3rem;line-height:1.2;margin-bottom:6px}
#kartu .ket{font-size:.86rem;color:var(--muted);margin-bottom:12px}
#kartu .foto{border-radius:12px;overflow:hidden;border:5px solid #F3EEE4;transform:rotate(-1.5deg);margin:4px auto 10px;max-width:300px}
#kartu .foto img{width:100%;aspect-ratio:3/4;object-fit:cover}
#kartu .foto{max-width:260px}
#kartu .foto.rebah{max-width:340px}
#kartu .foto.rebah img{aspect-ratio:4/3}
@media (max-height:560px){ #kartu .foto{max-width:36vh} #kartu .foto.rebah{max-width:62vh} }
#kartu .cap{font-family:var(--hand);font-size:1.4rem;text-align:center;color:#FCE6A3}
#kartu p.par{font-family:var(--disp);font-size:1.02rem;line-height:1.6;margin:0 0 12px;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
#kartu p.par.tampil{opacity:1;transform:none}
#kartu .ttd{font-family:var(--hand);font-size:1.5rem;color:var(--p);text-align:right}
.tbl{display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px;padding:13px 18px;border-radius:999px;
  background:var(--p);color:#1C1730;font-weight:900;font-size:.95rem;box-shadow:0 3px 0 var(--p-dk);text-decoration:none}
.tbl.putih{background:transparent;color:var(--ink);border:1.5px solid var(--hair);box-shadow:none}
.pengakuan{font-family:var(--disp);font-size:1.5rem;line-height:1.25;text-align:center;margin:6px 0 10px}
.pengakuan em{font-style:italic;color:var(--p)}
.rahasia{font-family:var(--hand);font-size:1.4rem;text-align:center;color:#FCE6A3;margin:4px 0 8px}
.dibuat{display:block;text-align:center;margin-top:14px;font-size:.72rem;color:var(--muted);text-decoration:none}

/* layar pembuka */
#pembuka{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 100%,#2E2650 0%,var(--bg) 70%);transition:opacity .6s}
#pembuka.pergi{opacity:0;pointer-events:none}
#pembuka small{display:block;font-family:var(--hand);font-size:1.4rem;color:var(--p)}
#pembuka b{display:block;font-family:var(--disp);font-size:2.1rem;font-weight:600;line-height:1.1;margin:2px 0 10px}
#pembuka p{color:var(--muted);font-size:.92rem;max-width:20rem;margin:0 auto 18px}
#pembuka .tbl{width:auto;display:inline-flex;padding:13px 30px}

.memuat{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.memuat.pergi{opacity:0;pointer-events:none}
.memuat-in{text-align:center;padding:24px;max-width:22rem;color:var(--muted)}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-30px);opacity:0;z-index:60;background:#0F0C1E;color:var(--ink);
  padding:9px 16px;border-radius:999px;font-weight:800;font-size:.84rem;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="memuat" class="memuat"><div class="memuat-in"><p id="memuatPesan">Menyalakan kunang-kunangnya…</p></div></div>

<canvas id="langit" aria-label="Padang rumput malam dengan toples kunang-kunang"></canvas>
<div id="kumpulan" hidden></div>
<div class="bisik" id="bisik"></div>
<div class="bisik" id="bisikTetap"></div>
<div id="toast"></div>

<div id="bilah">
  <div id="petunjuk"></div>
  <button class="kecil" id="lewati" hidden>lewati game</button>
  <button id="suara" aria-label="Suara">🔊</button>
</div>

<div id="tirai" hidden><div id="kartu" role="dialog" aria-modal="true"></div></div>

<div id="pembuka">
  <div>
    <small>untuk</small>
    <b data-f="penerima"></b>
    <p>Ada satu toples yang dari tadi disimpan buat kamu. Bukanya malam ini aja.</p>
    <button class="tbl" id="tblMulai" type="button">Ambil toplesnya</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Mesin tema Toples Kunang-Kunang × Confess.
   Urutan: 1 label segel (pembuka) · 2 tampung yang turun (game) ·
   4 foto di tali jemuran (interaktif) · 4 pasangan nyala (game) ·
   5 surat dari cahaya (interaktif) · 6 tahan & lepas (momen khas) ·
   7 jawaban (penutup). Satu kanvas, menyesuaikan potret & mendatar.
   ═══════════════════════════════════════════════════════════════ */
function FV_MULAI(){
'use strict';
var D = KADO || {};
var $=function(s){ return document.querySelector(s); };
var el=function(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; };
var rand=function(a,b){ return a+Math.random()*(b-a); };
var buzz=function(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
var klem=function(v,a,b){ return Math.max(a,Math.min(b,v)); };

D.foto=(D.foto||[]).filter(function(f){ return f && f.src; });
D.surat=(D.surat||[]).filter(function(s){ return s && String(s).trim(); });
/* pesanan versi lama belum punya isian kunang-kunang: pakai kalimat netral */
var KUNANG=[0,1,2].map(function(i){ var v=(D.kunang||[])[i]; return v && String(v).trim() ? v : ['yang pertama aku simpan','yang kedua aku simpan','yang ketiga aku simpan'][i]; });
var SEJAK=String(D.sejak||'').trim();
document.querySelectorAll('[data-f]').forEach(function(n){ n.textContent=D[n.dataset.f]||''; });

/* ── suara dibuat browser ── */
var AC=null, bisu=false;
function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(C){ try{ AC=new C({latencyHint:'playback'}); }catch(e){ AC=new C(); } (function(c){ try{ var k=c.createDynamicsCompressor(); k.threshold.value=-12; k.knee.value=8; k.ratio.value=12; k.attack.value=.003; k.release.value=.2; var m=c.createGain(); m.gain.value=.85; m.connect(k); k.connect(c.__out||c.destination); c.__out=m; }catch(e){} })(AC); } } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,dur,o){ o=o||{}; var a=ac(); if(!a||bisu) return;
  var t=a.currentTime+(o.when||0), v=o.vol||.12, osc=a.createOscillator(), g=a.createGain();
  osc.type=o.type||'triangle'; osc.frequency.setValueAtTime(f,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g); g.connect(a.__out||a.destination); osc.start(t); osc.stop(t+dur+.05); }
function noise(dur,freq,vol){ var a=ac(); if(!a||bisu) return;
  var n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5)*Math.min(1,i/(a.sampleRate*.006));
  var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  var g=a.createGain(); g.gain.value=vol; n.buffer=b; n.connect(f); f.connect(g); g.connect(a.__out||a.destination); n.start(); }
var SFX={
  sobek:function(){ noise(.16,3000,.12); },
  pop:function(){ tone(620,.08,{type:'sine',vol:.18}); tone(940,.1,{type:'sine',vol:.09,when:.05}); },
  tangkap:function(i){ tone([660,784,988][i%3],.3,{type:'sine',vol:.14}); },
  salah:function(){ tone(196,.18,{type:'sine',vol:.08}); },
  nyala:function(f){ tone(f,.22,{type:'sine',vol:.1}); },
  chime:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,.5,{when:i*.09,vol:.1}); }); }
};
function kotakMusik(){ var a=ac(); if(!a) return null;
  var gain=a.createGain(); gain.gain.value=.1; gain.connect(a.__out||a.destination);
  var not=[64,67,71,74,71,67, 62,66,69,74,69,66, 60,64,67,72,67,64, 59,62,67,71,74,71];
  var step=.4, t0=a.currentTime+.1, n=0, henti=false, tm=null;
  function ping(m,t){ var o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=440*Math.pow(2,(m-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.5);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t+1.6); }
  (function loop(){ if(henti) return; if(t0<a.currentTime) t0=a.currentTime+.05; while(t0 < a.currentTime + 2){ ping(not[n%not.length],t0); t0+=step; n++; } tm=setTimeout(loop,300); })();
  return { gain:gain }; }
var MU=(function(){
  var L=D.lagu||{}, ada=!!(L.src&&String(L.src).trim()), au=ada?new Audio():null, st=+L.mulai||0, en=+L.selesai||0, synth=null, main=false;
  if(au){ au.src=L.src; au.preload='auto'; au.loop=!en;
    au.addEventListener('timeupdate',function(){ if(en>st&&au.currentTime>=en) au.currentTime=st; }); }
  return { play:function(){ if(au){ if(!main){ try{ au.currentTime=st; }catch(e){} } au.volume=.7; au.play().then(function(){ main=true; }).catch(function(){}); return; }
      if(!synth) synth=kotakMusik(); },
    bisu:function(b){ if(au) au.muted=b; } };
})();
$('#suara').onclick=function(){ bisu=!bisu; this.textContent=bisu?'🔇':'🔊'; MU.bisu(bisu); try{ if(AC) bisu?AC.suspend():AC.resume(); }catch(e){} };
var tt; function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('show'); },2200); }

/* cegah menu tekan-lama, seleksi, dan seret gambar bawaan browser */
['contextmenu','selectstart','dragstart'].forEach(function(ev){
  document.addEventListener(ev,function(e){ if(!(e.target.closest&&e.target.closest('#kartu'))||ev!=='selectstart') e.preventDefault(); },true); });
document.addEventListener('touchmove',function(e){ if(!(e.target.closest&&e.target.closest('#kartu'))) e.preventDefault(); },{passive:false});

/* ══════ kanvas & tata letak ══════ */
var cv=$('#langit'), cx=cv.getContext('2d'), W=0, H=0, DPR=1, BILAH=70;
var L={};               // posisi semua benda, dihitung ulang tiap ukuran berubah
var TOPLES={x:0,tx:0};  // x toples (tx = tujuan geser halus)
function ukur(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight-BILAH;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0);
  var mendatar=W>H*1.15;
  var js=klem(Math.min(W*.3,H*(mendatar?.34:.22)),74,150);   // lebar toples
  L={ mendatar:mendatar, js:js, jh:js*1.25, dasar:H-Math.max(16,H*.04), tanah:H-Math.max(40,H*.12) };
  L.mulut=L.dasar-L.jh;                                     // garis bibir toples
  if(!TOPLES.x||!langkahPakaiGeser()) TOPLES.x=TOPLES.tx=W/2;
  TOPLES.x=TOPLES.tx=klem(TOPLES.tx,js/2+8,W-js/2-8);
  /* tali jemuran & foto */
  var pw=klem(Math.min(W*.17,H*(mendatar?.26:.15)),48,120);
  L.tali={x0:W*.06,x1:W*.94,y:Math.max(30,H*.1)};
  pw=Math.min(pw,Math.max(48,(L.mulut-L.tali.y-62)/1.5));   // foto tidak tertutup toples
  L.pw=pw;
  L.fotoPos=[.16,.39,.61,.84].map(function(t){ var x=W*t; return {x:x,y:taliY(x)+8}; });
  /* enam kunang-kunang pasangan */
  var kol=3, bar=2, gx=Math.min(W*.68,mendatar?W*.5:W*.8), gy=Math.min(H*.3,mendatar?H*.36:H*.26);
  L.orb=[]; for(var r=0;r<bar;r++) for(var c=0;c<kol;c++) L.orb.push({x:W/2+(c-1)*gx/2, y:H*.16+r*gy});
  L.orbR=klem(Math.min(gx,gy)*.17,22,40);
  susunBisik();
}
function taliY(x){ var t=(x-L.tali.x0)/(L.tali.x1-L.tali.x0); return L.tali.y+Math.sin(Math.PI*klem(t,0,1))*Math.min(H*.05,28); }
function susunBisik(){
  var b=$('#bisik'), bt=$('#bisikTetap');
  b.style.top=Math.max(40,L.mulut-150)+'px';
  bt.style.top=(L.orb.length?(L.orb[3].y+L.orbR+22):H*.5)+'px';
}

/* ── latar: bintang, bukit, rumput (digambar sekali per ukuran) ── */
var BINTANG=[]; for(var bi=0;bi<70;bi++) BINTANG.push({x:Math.random(),y:Math.random()*.7,r:rand(.5,1.5),f:rand(0,6)});
var RUMPUT=[]; for(var ri=0;ri<90;ri++) RUMPUT.push({x:Math.random(),h:rand(.5,1),c:Math.random()});
function latar(t){
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#141026'); g.addColorStop(.6,'#241D44'); g.addColorStop(1,'#33295A');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  BINTANG.forEach(function(s){ cx.globalAlpha=.35+.35*Math.sin(t/900+s.f); cx.fillStyle='#F3EEE4';
    cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,7); cx.fill(); });
  cx.globalAlpha=1;
  /* bulan sabit kecil */
  cx.fillStyle='#F6E7C1'; cx.beginPath(); cx.arc(W*.86,H*.09+10,13,0,7); cx.fill();
  cx.fillStyle='#181330'; cx.beginPath(); cx.arc(W*.86+6,H*.09+6,12,0,7); cx.fill();
  /* bukit */
  cx.fillStyle='#1A1532'; cx.beginPath(); cx.moveTo(0,L.tanah-20);
  cx.quadraticCurveTo(W*.3,L.tanah-70,W*.6,L.tanah-26); cx.quadraticCurveTo(W*.85,L.tanah-4,W,L.tanah-40); cx.lineTo(W,H); cx.lineTo(0,H); cx.fill();
  cx.fillStyle='#120E24'; cx.fillRect(0,L.tanah,W,H-L.tanah);
  cx.strokeStyle='#2A2350'; cx.lineWidth=2;
  RUMPUT.forEach(function(r){ var x=r.x*W, h=14+r.h*22, s=Math.sin(t/1200+r.c*6)*4;
    cx.beginPath(); cx.moveTo(x,L.tanah+4); cx.quadraticCurveTo(x+s*.5,L.tanah-h*.5,x+s,L.tanah-h); cx.stroke(); });
}

/* ── kunang-kunang: titik bercahaya ── */
function cahaya(x,y,r,warna,kuat){
  var g=cx.createRadialGradient(x,y,0,x,y,r*4); g.addColorStop(0,warna); g.addColorStop(.25,warna.replace('1)',(.45*kuat)+')')); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r*4,0,7); cx.fill();
  cx.fillStyle='#FFF7DA'; cx.beginPath(); cx.arc(x,y,r*.7,0,7); cx.fill();
}

/* ── toples ── */
var segel=1, tutup=1, terang=0, isiToples=[];  // segel: 1 utuh → 0 lepas; tutup 1 terpasang
function gambarToples(t){
  var x=TOPLES.x, js=L.js, jh=L.jh, y0=L.mulut, y1=L.dasar;
  /* pendar di tanah */
  var pend=.25+terang*.75;
  var g=cx.createRadialGradient(x,y1,0,x,y1,js*1.6); g.addColorStop(0,'rgba(240,180,41,'+(.28*pend)+')'); g.addColorStop(1,'rgba(240,180,41,0)');
  cx.fillStyle=g; cx.fillRect(x-js*1.6,y1-js*1.6,js*3.2,js*1.8);
  /* isi kunang-kunang di dalam */
  isiToples.forEach(function(k,i){ var kx=x+Math.sin(t/700+i*2)*js*.28, ky=y1-jh*.3+Math.cos(t/900+i*1.7)*jh*.22;
    cahaya(kx,ky,3,'rgba(240,180,41,1)',.8+.2*Math.sin(t/300+i)); });
  /* kaca */
  cx.save();
  cx.fillStyle='rgba(200,215,240,'+(.1+terang*.1)+')'; cx.strokeStyle='rgba(243,238,228,.75)'; cx.lineWidth=2.5;
  rrect(x-js/2,y0+8,js,jh-8,js*.18); cx.fill(); cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(x-js*.32,y0+jh*.25); cx.lineTo(x-js*.32,y1-jh*.2); cx.stroke();
  /* leher */
  cx.fillStyle='rgba(200,215,240,.14)'; cx.strokeStyle='rgba(243,238,228,.75)'; cx.lineWidth=2.5;
  rrect(x-js*.38,y0-2,js*.76,14,5); cx.fill(); cx.stroke();
  /* tutup */
  if(tutup>0){ var ty=y0-14-(1-tutup)*60, rot=(1-tutup)*-.5;
    cx.save(); cx.globalAlpha=tutup; cx.translate(x,ty); cx.rotate(rot);
    cx.fillStyle='#8C6A4A'; cx.strokeStyle='#F3EEE4'; cx.lineWidth=2; rrect(-js*.44,-10,js*.88,18,5); cx.fill(); cx.stroke();
    cx.restore(); }
  /* label segel: jalurnya dari sisi kiri tutup, melintang, turun sisi kanan */
  if(segel>0) gambarSegel();
  cx.restore();
}
function jalurSegel(){
  var x=TOPLES.x, js=L.js, y=L.mulut;
  return [{x:x-js*.5,y:y+jh4()},{x:x-js*.44,y:y-12},{x:x+js*.44,y:y-12},{x:x+js*.5,y:y+jh4()}];
}
function jh4(){ return L.jh*.36; }
function panjangJalur(p){ var s=0; for(var i=1;i<p.length;i++) s+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); return s; }
function titikDi(p,u){ var tot=panjangJalur(p), d=u*tot;
  for(var i=1;i<p.length;i++){ var l=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); if(d<=l||i===p.length-1){ var k=l?d/l:0; return {x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k}; } d-=l; }
  return p[p.length-1]; }
function proyeksi(p,q){ /* u terdekat (0..1) di jalur untuk titik q, plus jaraknya */
  var tot=panjangJalur(p), jalan=0, best={u:0,d:1e9};
  for(var i=1;i<p.length;i++){ var ax=p[i-1].x, ay=p[i-1].y, bx=p[i].x, by=p[i].y, l=Math.hypot(bx-ax,by-ay);
    var k=klem(((q.x-ax)*(bx-ax)+(q.y-ay)*(by-ay))/(l*l||1),0,1), px=ax+(bx-ax)*k, py=ay+(by-ay)*k, d=Math.hypot(q.x-px,q.y-py);
    if(d<best.d) best={u:(jalan+k*l)/tot,d:d}; jalan+=l; }
  return best; }
var sobek=0;   // bagian label yang sudah terkelupas (0..1)
function gambarSegel(){
  var p=jalurSegel(), N=40;
  cx.lineCap='round';
  /* bagian yang masih menempel */
  cx.strokeStyle='#F3E3C3'; cx.lineWidth=13; cx.beginPath();
  for(var i=0;i<=N;i++){ var u=sobek+(1-sobek)*i/N, q=titikDi(p,u); i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y); } cx.stroke();
  cx.strokeStyle='rgba(196,137,26,.7)'; cx.lineWidth=1.5; cx.setLineDash([3,4]); cx.stroke(); cx.setLineDash([]);
  /* ujung yang dipegang: tab oranye */
  var u0=titikDi(p,sobek);
  if(langkah===1){ cx.fillStyle='#E8734A'; cx.strokeStyle='#F3EEE4'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(u0.x,u0.y,11+Math.sin(performance.now()/260)*1.5,0,7); cx.fill(); cx.stroke(); }
}
function rrect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

/* ══════ status ══════ */
var langkah=0, game=0, panelSejak=0;
var JATUH=[], tertangkap=0, spawnBerikut=0;
var FOTO_LIHAT=[false,false,false], fotoNyala=-1;
var ORB=[], buka=[], pasangan=0, potong=[], kunciOrb=false;
var tahanMulai=0, tahanP=0, lepas=null;
function langkahPakaiGeser(){ return langkah===2; }

var TEKS={
  1:'Toplesnya masih bersegel. <b>Seret tab oranye</b> menyusuri labelnya sampai terkelupas.',
  2:'Kunang-kunangnya keluar. <b>Geser toplesnya ke kiri-kanan</b> untuk menampung yang turun.',
  3:'Ada foto-foto di tali jemuran. <b>Ketuk tiap foto</b>, toplesnya akan meneranginya.',
  4:'Enam kunang-kunang berkedip berpasangan. <b>Ketuk dua yang warnanya sama.</b>',
  5:'Kunang-kunangnya menulis sesuatu. <b>Ketuk toplesnya</b> untuk membaca.',
  6:'<b>Tekan dan tahan toplesnya</b> sebentar, lalu biarkan mereka terbang.',
  7:'Jawabanmu ditunggu.'
};
function maju(){
  langkah++;
  $('#petunjuk').innerHTML=TEKS[langkah]||'';
  $('#lewati').hidden=!(langkah===2||langkah===4);
  if(langkah===2){ $('#kumpulan').hidden=false; spawnBerikut=performance.now()+400; }
  if(langkah===3){ $('#kumpulan').hidden=true; if(!D.foto.length) return maju(); }   // tanpa foto, slot ini dilewati
  if(langkah===4){ siapkanOrb(); if(L.mendatar) TOPLES.tx=W-L.js/2-16; }   // mendatar: toples minggir dari kisi
  if(langkah===5) TOPLES.tx=W/2;
  if(langkah===7) bukaPenutup();
}

/* ══════ input ══════ */
var tekan=null;
function posisi(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function diToples(q){ return Math.abs(q.x-TOPLES.x)<L.js*.6 && q.y>L.mulut-30 && q.y<L.dasar+10; }
cv.addEventListener('pointerdown',function(e){
  if(!$('#tirai').hidden) return;
  var q=posisi(e); ac();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(langkah===1){ var t=titikDi(jalurSegel(),sobek); if(Math.hypot(q.x-t.x,q.y-t.y)<34) tekan={jenis:'segel'}; return; }
  if(langkah===2){ tekan={jenis:'geser',x0:q.x,t0:TOPLES.tx}; return; }
  if(langkah===3){ var i=fotoDi(q); if(i>=0) lihatFoto(i); return; }
  if(langkah===4){ var o=orbDi(q); if(o>=0) ketukOrb(o); return; }
  if(langkah===5){ if(diToples(q)) bukaSurat(); return; }
  if(langkah===6){ if(diToples(q)&&!lepas){ tekan={jenis:'tahan'}; tahanMulai=performance.now(); buzz(8); } return; }
});
cv.addEventListener('pointermove',function(e){
  if(!tekan) return; var q=posisi(e);
  if(tekan.jenis==='segel'){
    var pr=proyeksi(jalurSegel(),q);
    /* satu jalur penyelesaian: harus dekat label, dan tidak boleh melompat jauh ke depan */
    if(pr.d<56 && pr.u>sobek && pr.u-sobek<.22){ if(Math.random()<.3) SFX.sobek(); sobek=pr.u; }
    if(sobek>.93) segelLepas();
  } else if(tekan.jenis==='geser'){
    TOPLES.tx=klem(tekan.t0+(q.x-tekan.x0),L.js/2+8,W-L.js/2-8);
  }
});
function lepasTekan(){ if(tekan&&tekan.jenis==='tahan'&&!lepas){ tahanMulai=0; tahanP=0; } tekan=null; }
cv.addEventListener('pointerup',lepasTekan); cv.addEventListener('pointercancel',lepasTekan);

/* ══════ 1 · segel ══════ */
function segelLepas(){
  if(segel<=0) return; segel=0; tekan=null; SFX.pop(); buzz([10,30,10]);
  var t0=performance.now();
  (function buka(){ var k=klem((performance.now()-t0)/700,0,1); tutup=1-k; if(k<1) requestAnimationFrame(buka); })();
  terang=.4;
  toast('tutupnya terbuka');
  setTimeout(maju,900);
}

/* ══════ 2 · tampung yang turun (game) ══════ */
function spawn(now){
  if(tertangkap>=3||JATUH.length>=2||now<spawnBerikut) return;
  /* jatuh di sisi yang jauh dari toples, supaya harus digeser */
  var x=TOPLES.x<W/2?rand(W*.55,W-30):rand(30,W*.45);
  JATUH.push({x:x,y:-10,ax:x,v:Math.max(46,H/9),fase:rand(0,6)});
  spawnBerikut=now+rand(1300,1900);
}
function gerakJatuh(dt,now){
  JATUH.forEach(function(k){
    k.y+=k.v*dt; k.x=k.ax+Math.sin(now/600+k.fase)*22;
    if(!k.selesai && k.y>L.mulut-6 && k.y<L.mulut+22 && Math.abs(k.x-TOPLES.x)<L.js*.42) tangkap(k);
    if(k.y>L.tanah+10) k.selesai=true;
  });
  JATUH=JATUH.filter(function(k){ return !k.selesai; });
}
function tangkap(k){
  k.selesai=true; if(tertangkap>=3) return;   // dua bisa masuk di bingkai yang sama
  var i=tertangkap++; isiToples.push(1); terang=Math.min(1,terang+.2);
  SFX.tangkap(i); buzz(14);
  $('#kumpulan').children[i].classList.add('isi');
  bisik('“'+KUNANG[i]+'”',2800);
  if(tertangkap>=3){ game++; JATUH=[]; setTimeout(maju,2900); }
}
var bisikT; function bisik(t,ms){ var b=$('#bisik'); b.textContent=t; b.classList.add('tampil'); clearTimeout(bisikT); bisikT=setTimeout(function(){ b.classList.remove('tampil'); },ms||2400); }

/* ══════ 3 · foto di tali jemuran ══════ */
function fotoDi(q){ if(!D.foto.length) return -1;
  for(var i=0;i<Math.min(4,D.foto.length);i++){ var f=L.fotoPos[i]; if(Math.abs(q.x-f.x)<L.pw*.6 && q.y>f.y-8 && q.y<f.y+L.pw*1.25) return i; } return -1; }
var GAMBAR=D.foto.map(function(f){ var im=new Image(); im.src=f.src; return im; });
function gambarTali(){
  cx.strokeStyle='rgba(243,238,228,.55)'; cx.lineWidth=1.5; cx.beginPath();
  for(var x=L.tali.x0;x<=L.tali.x1;x+=8) x===L.tali.x0?cx.moveTo(x,taliY(x)):cx.lineTo(x,taliY(x)); cx.stroke();
  cx.fillStyle='#5A4A7A'; cx.fillRect(L.tali.x0-4,L.tali.y-6,8,L.tanah-L.tali.y+6); cx.fillRect(L.tali.x1-4,L.tali.y-6,8,L.tanah-L.tali.y+6);
  var n=Math.min(4,D.foto.length);
  for(var i=0;i<n;i++){ var fo=D.foto[i]||{}, rb=fo.bentuk==='R', f=L.fotoPos[i], w=rb?L.pw*1.2:L.pw*.9, dh=rb?(w-10)*.75:(w-10)*4/3, h=dh+w*.3, nyala=FOTO_LIHAT[i]||fotoNyala===i;
    cx.save(); cx.translate(f.x,f.y); cx.rotate((i-1.5)*.05);
    cx.fillStyle=nyala?'#F3EEE4':'#3A3160'; cx.fillRect(-w/2,0,w,h);
    var im=GAMBAR[i]; if(im&&im.complete&&im.naturalWidth){ cx.globalAlpha=nyala?1:.18;
      /* foto dipotong sesuai bentuk slot (tegak 3:4 / mendatar 4:3) dan titik fokus */
      var nw=im.naturalWidth, nh=im.naturalHeight, r=(w-10)/dh, sw=nw, sh=nw/r; if(sh>nh){ sh=nh; sw=nh*r; }
      cx.drawImage(im,(nw-sw)*((fo.fx==null?50:fo.fx)/100),(nh-sh)*((fo.fy==null?50:fo.fy)/100),sw,sh,-w/2+5,5,w-10,dh); cx.globalAlpha=1; }
    cx.fillStyle='#C9A36A'; cx.fillRect(-5,-8,10,14);   // jepitan
    if(langkah===3&&!FOTO_LIHAT[i]){ cx.strokeStyle='rgba(240,180,41,'+(.5+.4*Math.sin(performance.now()/300))+')'; cx.lineWidth=2.5; cx.strokeRect(-w/2-5,-5,w+10,h+10); }
    cx.restore(); }
}
function lihatFoto(i){
  fotoNyala=i; TOPLES.tx=klem(L.fotoPos[i].x,L.js/2+8,W-L.js/2-8); SFX.nyala(520+i*120);
  setTimeout(function(){
    FOTO_LIHAT[i]=true; var f=D.foto[i];
    panel(function(k){
      var w=el('div','foto'+(f.bentuk==='R'?' rebah':'')), im=el('img'); im.src=f.src; im.style.objectPosition=(f.fx==null?50:f.fx)+'% '+(f.fy==null?50:f.fy)+'%'; im.alt=f.caption||'foto'; w.appendChild(im); k.appendChild(w);
      if(f.caption) k.appendChild(el('div','cap',f.caption));
      k.appendChild(tombol(FOTO_LIHAT.slice(0,Math.min(4,D.foto.length)).every(Boolean)?'Lanjut':'Lihat foto lainnya',function(){
        tutupPanel(); fotoNyala=-1; if(FOTO_LIHAT.slice(0,Math.min(4,D.foto.length)).every(Boolean)) setTimeout(maju,400); }));
    });
  },550);
}

/* ══════ 4 · pasangan nyala (game) ══════ */
var WARNA=['rgba(240,180,41,1)','rgba(231,159,176,1)','rgba(140,210,200,1)'];
function siapkanOrb(){
  var w=[0,0,1,1,2,2]; for(var i=w.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=w[i]; w[i]=w[j]; w[j]=x; }
  ORB=w.map(function(c){ return {c:c,nyala:false,tetap:false}; });
  /* tiga potong kalimat "sejak …" */
  var kata=(SEJAK?('sejak '+SEJAK):'aku suka kamu').split(/\s+/), n=kata.length;
  var a=Math.ceil(n/3), b=Math.ceil((n-a)/2);
  potong=[kata.slice(0,a).join(' '),kata.slice(a,a+b).join(' '),kata.slice(a+b).join(' ')].filter(function(s){ return s; });
}
function orbDi(q){ for(var i=0;i<L.orb.length;i++) if(Math.hypot(q.x-L.orb[i].x,q.y-L.orb[i].y)<L.orbR*1.5) return i; return -1; }
function ketukOrb(i){
  var o=ORB[i]; if(kunciOrb||o.tetap||o.nyala) return;
  o.nyala=true; buka.push(i); SFX.nyala([523,659,784][o.c]);
  if(buka.length<2) return;
  var a=ORB[buka[0]], b=ORB[buka[1]];
  if(a.c===b.c){ a.tetap=b.tetap=true; buka=[]; pasangan++; buzz(14);
    var teks=potong.slice(0,Math.ceil(pasangan*potong.length/3)).join(' ');
    var bt=$('#bisikTetap'); bt.textContent=teks+(pasangan>=3?'.':' …'); bt.classList.add('tampil');
    if(pasangan>=3){ game++; SFX.chime(); setTimeout(function(){ bt.classList.remove('tampil'); maju(); },2600); }
  } else { kunciOrb=true; SFX.salah();
    setTimeout(function(){ a.nyala=b.nyala=false; buka=[]; kunciOrb=false; },700); }
}
function gambarOrb(t){
  L.orb.forEach(function(p,i){ var o=ORB[i]; if(!o) return;
    var y=p.y+Math.sin(t/800+i)*4;
    if(o.nyala||o.tetap) cahaya(p.x,y,L.orbR*.32,WARNA[o.c],1);
    else { cx.fillStyle='rgba(243,238,228,.12)'; cx.strokeStyle='rgba(243,238,228,.35)'; cx.lineWidth=1.5;
      cx.beginPath(); cx.arc(p.x,y,L.orbR*.55,0,7); cx.fill(); cx.stroke(); }
  });
}

/* ══════ 5 · surat dari cahaya ══════ */
function bukaSurat(){
  SFX.chime();
  var par=D.surat.length?D.surat:['…'], n=0;
  panel(function(k){
    k.appendChild(el('h3',null,'Untuk '+(D.penerima||'kamu')));
    var ps=par.map(function(s){ var p=el('p','par',s); k.appendChild(p); return p; });
    var ttd=el('div','ttd',(D.pengirim||'')); ttd.hidden=true; k.appendChild(ttd);
    var b=tombol('Baca lanjutannya',function(){
      if(n<ps.length){ ps[n++].classList.add('tampil'); SFX.nyala(600+n*80); }
      if(n>=ps.length){ ttd.hidden=false; b.textContent='Tutup suratnya'; b.onclick=function(){ if(!siap()) return; tutupPanel(); setTimeout(maju,300); }; }
    });
    k.appendChild(b);
    ps[n++].classList.add('tampil'); if(n>=ps.length){ ttd.hidden=false; b.textContent='Tutup suratnya'; b.onclick=function(){ if(!siap()) return; tutupPanel(); setTimeout(maju,300); }; }
  });
}

/* ══════ 6 · tahan & lepas (momen khas) ══════ */
var TAHAN=1500, TERBANG=[];
function hati(u){ var t=u*Math.PI*2, x=16*Math.pow(Math.sin(t),3), y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); return {x:x,y:y}; }
function lepaskan(){
  lepas=performance.now(); tekan=null; tahanP=1; isiToples=[]; terang=.15; SFX.chime(); buzz([20,40,20]);
  /* hati harus muat utuh di atas bibir toples: tinggi hati ≈ 30·s */
  var ruang=L.mulut-40, s=Math.min(W*.022,ruang/34), cy=20+s*13;
  for(var i=0;i<26;i++){ var h=hati(i/26); TERBANG.push({x:TOPLES.x+rand(-10,10),y:L.mulut,tx:W/2+h.x*s,ty:cy+h.y*s,d:rand(0,500)}); }
  setTimeout(function(){
    panel(function(k){
      var p=el('div','pengakuan'); p.innerHTML='Aku suka kamu, <em></em>.'; p.querySelector('em').textContent=D.penerima||'';
      k.appendChild(p);
      if(SEJAK) k.appendChild(el('p','ket','Sejak '+SEJAK+'.'));
      k.appendChild(el('div','ttd',(D.pengirim||'')));
      k.appendChild(tombol('Lanjut',function(){ tutupPanel(); setTimeout(maju,300); }));
    });
  },2600);
}
function gambarTerbang(now){
  TERBANG.forEach(function(f,i){ var k=klem((now-lepas-f.d)/1800,0,1), e=1-Math.pow(1-k,3);
    var x=f.x+(f.tx-f.x)*e+Math.sin(now/500+i)*2*(1-e), y=f.y+(f.ty-f.y)*e;
    cahaya(x,y,3,'rgba(240,180,41,1)',.7+.3*Math.sin(now/240+i)); });
}
function gambarTahan(){
  if(langkah!==6||lepas) return;
  if(tahanMulai){ tahanP=klem((performance.now()-tahanMulai)/TAHAN,0,1); if(tahanP>=1){ lepaskan(); return; } }
  var x=TOPLES.x, y=(L.mulut+L.dasar)/2, r=L.js*.7;
  cx.strokeStyle='rgba(243,238,228,.2)'; cx.lineWidth=4; cx.beginPath(); cx.arc(x,y,r,0,7); cx.stroke();
  if(tahanP>0){ cx.strokeStyle='#F0B429'; cx.lineCap='round'; cx.beginPath(); cx.arc(x,y,r,-Math.PI/2,-Math.PI/2+tahanP*Math.PI*2); cx.stroke(); }
}

/* ══════ 7 · penutup ══════ */
function bukaPenutup(){
  var wa=String(D.waPengirim||'').replace(/\D/g,''); var nomor=wa.charAt(0)==='0'?'62'+wa.slice(1):wa;
  panel(function(k){
    k.appendChild(el('h3',null,'Jadi, gimana?'));
    if(D.rahasia) k.appendChild(el('div','rahasia','“'+D.rahasia+'”'));
    if(nomor.length>=10){
      [['Aku juga',"Aku udah buka toplesnya. Aku juga."],['Boleh aku jawab langsung?',"Aku udah buka toplesnya. Boleh aku jawab langsung pas ketemu?"]].forEach(function(j,i){
        var a=el('a','tbl'+(i?' putih':''),j[0]); a.target='_blank'; a.rel='noopener';
        a.href='https://wa.me/'+nomor+'?text='+encodeURIComponent(j[1]); k.appendChild(a); });
    }
    k.appendChild(tombol('Lihat langitnya lagi',function(){ tutupPanel(); },'putih'));
    var m=el('a','dibuat','dibuat di foreverse.id'); m.href=D.foreverseUrl||'https://foreverse.id'; m.target='_blank'; m.rel='noopener'; k.appendChild(m);
  });
}

/* ══════ panel ══════ */
function siap(){ return performance.now()-panelSejak>=400; }
function tombol(t,fn,kelas){ var b=el('button','tbl'+(kelas?' '+kelas:''),t); b.type='button'; b.addEventListener('click',function(){ if(siap()) fn(); }); return b; }
function panel(isi){ var k=$('#kartu'); k.innerHTML=''; isi(k); k.scrollTop=0; $('#tirai').hidden=false; panelSejak=performance.now(); }
function tutupPanel(){ $('#tirai').hidden=true; }

/* ══════ lewati game ══════ */
$('#lewati').addEventListener('click',function(){
  if(langkah===2){ while(tertangkap<3){ isiToples.push(1); $('#kumpulan').children[tertangkap++].classList.add('isi'); } JATUH=[]; game++; maju(); }
  else if(langkah===4){ ORB.forEach(function(o){ o.tetap=true; }); pasangan=3; game++; maju(); }
});

/* ══════ putaran gambar ══════ */
var akhir=performance.now();
function putar(now){
  requestAnimationFrame(putar);   // dijadwalkan dulu: satu galat gambar tidak boleh membekukan langit
  var dt=Math.min(.05,(now-akhir)/1000); akhir=now;
  TOPLES.x+=(TOPLES.tx-TOPLES.x)*Math.min(1,dt*(langkah===2?18:5));
  if(langkah===2){ spawn(now); gerakJatuh(dt,now); }
  latar(now);
  if(langkah>=3&&langkah<=3) gambarTali();
  if(langkah===4) gambarOrb(now);
  JATUH.forEach(function(k){ cahaya(k.x,k.y,3.2,'rgba(240,180,41,1)',.9); });
  gambarToples(now);
  if(langkah===5){ cx.fillStyle='rgba(240,180,41,'+(.4+.3*Math.sin(now/300))+')'; cx.font='700 22px Caveat, cursive'; cx.textAlign='center'; cx.fillText('ketuk aku',TOPLES.x,L.mulut-40); }
  gambarTahan();
  if(lepas) gambarTerbang(now);
}
addEventListener('resize',ukur);
for(var ki=0;ki<3;ki++) $('#kumpulan').appendChild(el('i'));
ukur(); requestAnimationFrame(putar);

$('#tblMulai').addEventListener('click',function(){
  ac(); MU.play(); SFX.pop();
  $('#pembuka').classList.add('pergi'); setTimeout(function(){ var p=$('#pembuka'); p&&p.remove(); },700);
  setTimeout(maju,500);
});

/* jembatan uji (baca saja) */
window.__fv=function(){ return { langkah:langkah, game:game, sobek:sobek, segel:segel, tertangkap:tertangkap,
  toples:{x:TOPLES.x,mulut:L.mulut,dasar:L.dasar,js:L.js}, jatuh:JATUH.map(function(k){ return {x:k.x,y:k.y}; }),
  segelTitik:titikDi(jalurSegel(),sobek), segelJalur:jalurSegel(), fotoPos:L.fotoPos, pw:L.pw, orb:L.orb, orbWarna:ORB.map(function(o){ return o.c; }),
  tahan:[tahanMulai,tahanP,tekan&&tekan.jenis], pasangan:pasangan, panel:!$('#tirai').hidden, lepas:!!lepas, W:W, H:H }; };
}
</script>

<script>
/* Pemuat: ambil isi surat, lalu jalankan tampilannya. */
(function(){
  "use strict";
  var tirai = document.getElementById("memuat");
  function gagal(t){ if(!tirai) return; document.getElementById("memuatPesan").textContent = t; }
  function tutupTirai(){ if(tirai){ tirai.classList.add("pergi"); setTimeout(function(){ tirai.remove(); },420); } }
  var data = null;
  try{ data = JSON.parse(document.getElementById("foreverse-data").textContent || "{}"); }catch(e){ data = {}; }
  if(!data || !data.penerima){ gagal("Suratnya tidak bisa dibuka sekarang. Minta tautan yang benar ke pengirimnya, ya."); return; }
  window.KADO = data;
  var tugas = (data.foto || []).filter(function(f){ return f && f.src; }).map(function(f){
    return new Promise(function(beres){ var im = new Image(); im.onload = im.onerror = beres; im.src = f.src; }); });
  Promise.race([Promise.all(tugas), new Promise(function(r){ setTimeout(r, 12000); })]).then(function(){ FV_MULAI(); tutupTirai(); });
})();
</script>
