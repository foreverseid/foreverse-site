  kini=no; $('#s'+no).classList.add('aktif'); if(MASUK[no]) MASUK[no]();
}
function berikut(){ ke(URUT[URUT.indexOf(kini)+1]); }
function lcd(frek,ket,siar){ $('#lcdFrek').textContent=frek; $('#lcdKet').textContent=ket; $('#lcd').classList.toggle('siar',!!siar); }

/* ═ 1-2 · nyalakan radio, putar kenop tala ═ */
(function(){
  var rd=$('#radio'), sk=$('#skala'), jr=$('#jarumF'), kt=$('#kenopTala'), mt=$('#mata'), f=F_MIN+.4, r=0, lalu=0, nyala=false, kunci=false;
  for(var m=88;m<=108;m+=1){ var t=el('i',m%4===0?'besar':''); t.style.left=((m-F_MIN)/(F_MAX-F_MIN)*100)+'%'; sk.appendChild(t);
    if(m%4===0){ var s=el('span',null,String(m)); s.style.left=t.style.left; sk.appendChild(s); } }
  $('#tandaF').style.left=((FREK-F_MIN)/(F_MAX-F_MIN)*100)+'%';
  $('#catatanF').textContent='Frekuensi kita: '+FREK_T;
  function atur(){ jr.style.setProperty('--x',((f-F_MIN)/(F_MAX-F_MIN)*100)+'%'); kt.style.setProperty('--r',r+'deg');
    var dekatnya=Math.max(0,1-Math.abs(f-FREK)/2.5); mt.style.setProperty('--s',dekatnya.toFixed(3)); lcd('FM '+f.toFixed(1),dekatnya>.85?'hampir':'mencari'); aturDerau(.06*(1-dekatnya)+.004); }
  $('#kenopDaya').addEventListener('click',function(){ if(nyala) return; nyala=true; ac(); MU.play(); MU.duck(true); mulaiDerau(); SFX.klek(); buzz(15);
    this.classList.remove('ajak'); rd.classList.add('nyala'); kt.classList.add('ajak'); atur();
    petunjuk('Isinya masih kresek-kresek. <b>Putar kenop tala</b> sampai ketemu frekuensi di kertas kuning.'); });
  noMenu($('#kenopDaya'));
  function sudut(e){ var p=pusat(kt); return Math.atan2(e.clientX-p.x,-(e.clientY-p.y))*180/Math.PI; }
  seret(kt,{
    boleh:function(){ return nyala && !kunci; },
    down:function(e){ lalu=sudut(e); kt.classList.remove('ajak'); },
    move:function(e){ var a=sudut(e), d=((a-lalu)%360+540)%360-180; lalu=a; r+=d; f=klem(f+d*.03,F_MIN,F_MAX); atur();
      if(Math.abs(f-FREK)<.15) dapat(); },
    up:function(){ if(!kunci && Math.abs(f-FREK)>2.5) petunjuk('Lihat lampu hijau di tengah. Makin dekat, makin penuh. <b>Terus putar</b> ke arah '+(f<FREK?'kanan ⟳':'kiri ⟲')+'.'); }
  });
  function dapat(){ kunci=true; f=FREK; atur(); henti(); MU.duck(false); SFX.bip(); buzz([20,40,20]); rd.classList.add('terkunci'); mt.style.setProperty('--s','1');
    lcd('FM '+FREK_T,'siaran',true);
    var j=$('#judulAwal'); j.innerHTML=''; j.appendChild(document.createTextNode('Radio '+PENGIRIM+' '+FREK_T)); j.appendChild(el('small',null,KOTA_KU&&KOTA_DIA?'siaran dari '+KOTA_KU+' ke '+KOTA_DIA:'siaran khusus malam ini')); j.classList.add('tampil');
    petunjuk('Ketemu. Penyiarnya cuma satu, pendengarnya juga cuma satu.');
    setTimeout(function(){ lanjut(berikut,SALAM.length?'Dengar salam-salamnya':'Putar kasetnya'); },2400); }
  MASUK[0]=function(){ var j=$('#judulAwal'); j.innerHTML=''; j.appendChild(document.createTextNode('Ada siaran khusus malam ini')); j.appendChild(el('small',null,'untuk '+PENERIMA)); setTimeout(function(){ j.classList.add('tampil'); },300);
    petunjuk('Radionya masih mati. <b>Ketuk kenop daya</b> di kiri bawah.'); };
})();

/* ═ 3 · kirim-kirim salam: tiap fader yang didorong ke atas menyiarkan satu salam ═ */
(function(){
  if(!SALAM.length) return;
  var mx=$('#mixer'), tr=$('#transkrip'), siar=0;
  SALAM.forEach(function(t,i){
    var jl=el('div','jalur'+(i===0?' ajak':'')), rel=el('div','rel-f'), tuas=el('div','tuas-f'); rel.appendChild(el('i')); rel.appendChild(tuas);
    jl.appendChild(el('span','lampu')); jl.appendChild(rel); jl.appendChild(el('b',null,'LINE '+(i+1))); mx.appendChild(jl);
    var p=0, p0=0, beres=false;
    function atur(){ rel.style.setProperty('--p',p+'%'); }
    seret(tuas,{
      boleh:function(){ return !beres && i===siar; },
      down:function(){ p0=p; },
      move:function(e,dx,dy){ p=klem(p0-dy/rel.offsetHeight*100,0,100); atur(); if(p>=96 && !beres) naik(); },
      up:function(){ if(!beres){ if(p<8) kedip(); p=0; atur(); } }
    });
    function naik(){ beres=true; p=100; atur(); jl.classList.remove('ajak'); jl.classList.add('siar'); SFX.bip(); buzz(15); siar++;
      var li=el('li'); li.appendChild(el('small',null,'Line '+(i+1)+' · salam dari '+PENGIRIM+(KOTA_KU?' di '+KOTA_KU:''))); li.appendChild(el('span',null,t)); tr.appendChild(li);
      if(siar>=SALAM.length){ petunjuk('Semua salam sudah mengudara.'); setTimeout(function(){ lanjut(berikut,'Putar kasetnya'); },2400); return; }
      $$('.jalur',mx)[siar].classList.add('ajak'); petunjuk('Ada telepon masuk lagi. <b>Dorong fader LINE '+(siar+1)+' ke atas.</b>'); }
  });
  MASUK[1]=function(){ lcd('FM '+FREK_T,'salam',true); petunjuk('Ada telepon masuk di LINE 1. <b>Dorong fadernya ke atas</b> supaya salamnya mengudara.'); };
})();

/* ═ 4 · kaset: tiap kaset yang dimasukkan ke deck memutar satu foto di sampulnya ═ */
(function(){
  var rak=$('#rak'), dk=$('#deck'), sp=$('#sampul'), diputar=0, WARNA=['#E5484D','#8FE3A8','#F2E6C9','#7FA7E8','#E8B9C0','#F5C85B'];
  var BOLEH=FOTO.length?FOTO:[];
  BOLEH.forEach(function(ft,i){ var k=el('div','kaset'+(i===0?' ajak':'')); k.style.setProperty('--w',WARNA[i%WARNA.length]); k.appendChild(el('b',null,'SISI '+(i+1))); rak.appendChild(k);
    bawa(k,{
      boleh:function(){ return !k.classList.contains('dipakai') && !sp.classList.contains('tampil'); },
      down:function(){ k.classList.remove('ajak'); $('#celahK').classList.add('siap'); },
      up:function(){ $('#celahK').classList.remove('siap');
        if(!dekat(k,$('#celahK'),U()*24)){ kedip(); return false; }
        k.classList.remove('dibawa'); k.style.left=k.style.top=''; k.classList.add('dipakai'); rak.appendChild(k); putar(i); return true; }
    }); });
  function putar(i){ var ft=BOLEH[i]; SFX.klek(); buzz(15); dk.classList.add('putar'); diputar++;
    var inl=$('#inlay'); inl.className='inlay '+(ft.bentuk==='R'?'R':'T'); pasFoto($('#inlayFoto'),ft);
    $('#inlayKet').textContent=ft.caption||''; $('#inlayNo').textContent='SISI '+(i+1)+' / '+BOLEH.length;
    setTimeout(function(){ sp.classList.add('tampil'); },450); }
  $('#keluar').onclick=function(){ sp.classList.remove('tampil'); dk.classList.remove('putar'); SFX.klik();
    if(diputar>=BOLEH.length){ petunjuk('Semua kaset sudah diputar.'); setTimeout(function(){ lanjut(berikut,'Siaran utama'); },1200); return; }
    var sisa=$$('.kaset:not(.dipakai)',rak); if(sisa[0]) sisa[0].classList.add('ajak'); petunjuk('<b>'+(BOLEH.length-diputar)+' kaset lagi.</b> Seret ke deck.'); };
  MASUK[2]=function(){ lcd('FM '+FREK_T,'lagu',true);
    if(!BOLEH.length){ berikut(); return; }
    petunjuk('Lagu-lagu malam ini ada di kaset. <b>Seret satu kaset ke deck</b> untuk memutarnya.'); };
})();

(function(){
