<script>
function FV_MULAI(){
"use strict";
var D = KADO || {};
D.lagu = D.lagu || {}; D.lagu.src = D.lagu.src || D.lagu.file || "";
D.foto = (D.foto || []).map(function(f){ return { src: f && f.src, caption: (f && (f.caption || f.ket)) || "" }; });
var $=function(s,r){ return (r||document).querySelector(s); };
var $$=function(s,r){ return [].slice.call((r||document).querySelectorAll(s)); };
var rand=function(a,b){ return a+Math.random()*(b-a); };
var klem=function(v,a,b){ return Math.max(a,Math.min(b,v)); };

var AC=null, muted=false;
function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(C){ try{ AC=new C({latencyHint:'playback'}); }catch(e){ AC=new C(); } (function(c){ try{ var k=c.createDynamicsCompressor(); k.threshold.value=-12; k.knee.value=8; k.ratio.value=12; k.attack.value=.003; k.release.value=.2; var m=c.createGain(); m.gain.value=.85; m.connect(k); k.connect(c.__out||c.destination); c.__out=m; }catch(e){} })(AC); } } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,dur,o){ o=o||{}; var a=ac(); if(!a||muted) return;
  var t=a.currentTime+(o.when||0), v=o.vol||.14, osc=a.createOscillator(), g=a.createGain();
  osc.type=o.type||'triangle'; osc.frequency.setValueAtTime(f,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g); g.connect(a.__out||a.destination); osc.start(t); osc.stop(t+dur+.05);
}
function noise(dur,freq,vol){ var a=ac(); if(!a||muted) return;
  var n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5)*Math.min(1,i/(a.sampleRate*.006));
  var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  var g=a.createGain(); g.gain.value=vol; n.buffer=b; n.connect(f); f.connect(g); g.connect(a.__out||a.destination); n.start();
}
/* ---- lagu latar: lagu unggahan pembeli, atau kotak musik bawaan ----
   Kalau tidak ada berkas lagu, surat TIDAK pernah diam — ini aturan
   produk (Project Instructions, Bagian 5), bukan selera tampilan. */
function musicBox(){
  var a=ac(); if(!a) return null;
  var gain=a.createGain(); gain.gain.value=.11; gain.connect(a.__out||a.destination);
  var notes=[72,76,79,84,79,76, 74,77,81,86,81,77, 72,76,79,83,79,76, 71,74,79,83,86,83];
  var step=.34, t0=a.currentTime+.1, n=0, timer=null, berhenti=false;
  function ping(midi,t){
    var o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=440*Math.pow(2,(midi-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.4);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t+1.5);
  }
  (function loop(){
    if(berhenti) return;
    if(t0<a.currentTime) t0=a.currentTime+.05; while(t0 < a.currentTime + 2){ ping(notes[n%notes.length],t0); t0+=step; n++; }
    timer=setTimeout(loop,300);
  })();
  return { gain:gain, stop:function(){ berhenti=true; clearTimeout(timer); } };
}
var MU=(function(){
  var L=D.lagu||{}, has=!!(L.src&&String(L.src).trim()), audio=has?new Audio():null;
  var st=+L.mulai||0, en=+L.selesai||0, vol=.72, playing=false, synth=null;
  if(audio){ audio.src=L.src; audio.preload='auto'; audio.loop=!en;
    audio.addEventListener('timeupdate',function(){ if(en>st&&audio.currentTime>=en) audio.currentTime=st; });
    audio.addEventListener('ended',function(){ audio.currentTime=st; audio.play().catch(function(){}); }); }
  return { has:has, audio:audio,
    play:function(){
      if(audio){
        try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
        if(!playing){ try{ audio.currentTime=st; }catch(e){} }
        audio.volume=0; audio.muted=muted;
        audio.play().then(function(){ playing=true; var v=0, t=setInterval(function(){ v+=.05; if(v>=vol){v=vol;clearInterval(t);} audio.volume=v; },90); }).catch(function(){});
        return;
      }
      if(!synth) synth=musicBox();
    },
    duck:function(on){ if(audio) audio.volume=on?.12:vol; else if(synth) synth.gain.gain.setTargetAtTime(on?.03:.11,AC.currentTime,.08); } };
})();

function noMenu(n){ n.addEventListener('contextmenu',function(e){ e.preventDefault(); }); }

/* satu gestur seret: down / move(dx,dy) / up(dx,dy); boleh() mengunci */
function seret(node,o){
  var pid=null,sx=0,sy=0; noMenu(node);
  node.addEventListener('pointerdown',function(e){
    if(pid!==null || (o.boleh && !o.boleh())) return;
    pid=e.pointerId; sx=e.clientX; sy=e.clientY;
    try{ node.setPointerCapture(pid); }catch(_){}
    e.preventDefault(); ac(); if(o.down) o.down(e);
  });
  node.addEventListener('pointermove',function(e){ if(e.pointerId===pid && o.move) o.move(e,e.clientX-sx,e.clientY-sy); });
  function lepas(e){ if(e.pointerId!==pid) return; pid=null; if(o.up) o.up(e,e.clientX-sx,e.clientY-sy); }
  node.addEventListener('pointerup',lepas); node.addEventListener('pointercancel',lepas);
}
/* benda dibawa jari ke mana saja (pindah ke lapisan atas selama diseret) */
function bawa(node,o){
  var ox=0,oy=0,ruang=null,lw='',lh='';
  seret(node,{ boleh:o.boleh,
    down:function(e){ var r=node.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; lw=node.style.width; lh=node.style.height;
      ruang=el('div'); ruang.style.cssText='visibility:hidden;flex:none;width:'+r.width+'px;height:'+r.height+'px;margin:'+getComputedStyle(node).margin;
      node.parentNode.insertBefore(ruang,node); node.style.width=r.width+'px'; node.style.height=r.height+'px';
      node.classList.add('dibawa'); document.body.appendChild(node); try{ node.setPointerCapture(e.pointerId); }catch(_){} node.style.left=r.left+'px'; node.style.top=r.top+'px'; if(o.down) o.down(e); },
    move:function(e){ node.style.left=(e.clientX-ox)+'px'; node.style.top=(e.clientY-oy)+'px'; if(o.move) o.move(e); },
    up:function(e){ var hasil=o.up?o.up(e):false;
      if(!hasil){ node.classList.remove('dibawa'); node.style.left=node.style.top=''; node.style.width=lw; node.style.height=lh; ruang.parentNode.insertBefore(node,ruang); }
      ruang.remove(); }
  });
}
function dekat(a,b,jarak){ var p=pusat(a),q=pusat(b); return Math.hypot(p.x-q.x,p.y-q.y)<jarak; }

var konfeti=(function(){
  var cv=el('canvas'); cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:90'; document.body.appendChild(cv);
  var ctx=cv.getContext('2d'), P=[], jalan=false, W=0, H=0;
  function ukur(){ var d=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); }
  function langkah(){ ctx.clearRect(0,0,W,H);
    P=P.filter(function(p){ p.vy+=.12; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; return p.y<H+20; });
    P.forEach(function(p){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(P.length) requestAnimationFrame(langkah); else jalan=false; }
  return function(x,y,n,warna){ ukur(); var C=warna||['#E8734A','#E8A5B0','#F5C85B','#3B3168','#FBFAF7'];
    for(var i=0;i<(n||90);i++) P.push({x:x,y:y,vx:rand(-6,6),vy:rand(-11,-3),r:rand(0,6),vr:rand(-.3,.3),s:rand(6,11),c:C[i%C.length]});
    if(!jalan){ jalan=true; requestAnimationFrame(langkah); } };
})();

/* ═ 1 · mencari hilal lewat teropong ═ */
(function(){
  var ck=$('#cakrawala'), jr=$('#jernih'), ls=$('#lensa'), hl=$('#hilal'), x=0, y=0, x0=0, y0=0, R=0, beres=false, tahan=null;

  function gambar(){ if(beres) return; jr.style.clipPath='circle('+R+'px at '+x+'px '+y+'px)'; ls.style.transform='translate('+(x-R)+'px,'+(y-R)+'px)'; }
  function jarak(){ var r=ck.getBoundingClientRect(), h=pusat(hl); return Math.hypot(h.x-r.left-x,h.y-r.top-y); }
  function cek(){ var j=jarak(); ls.classList.toggle('dekat',j<R*1.1);
    if(j<R*.45){ if(!tahan) tahan=setTimeout(ketemu,450); } else { clearTimeout(tahan); tahan=null; } }
  MASUK[0]=function(){ ukur(); petunjuk('Malam terakhir Ramadan. <b>Geser teropongnya</b>, cari bulan sabit tipis di langit barat, dekat cakrawala.'); };
  addEventListener('resize',function(){ if(kini===0) ukur(); });
  seret(ck,{
    boleh:function(){ return !beres; },
    down:function(){ x0=x; y0=y; },
    move:function(e,dx,dy){ if(beres) return; var r=ck.getBoundingClientRect(); x=klem(x0+dx,R*.3,r.width-R*.3); y=klem(y0+dy,R*.3,r.height-R*.3); gambar(); cek(); },
    up:function(){ if(!beres && !tahan) kedip(); }
  });
  function ketemu(){
    if(beres) return; beres=true; MU.play(); SFX.dentang(); buzz(25);
    var r=ck.getBoundingClientRect(), h=pusat(hl), hx=h.x-r.left, hy=h.y-r.top;

/* ═ 2 · menganyam ketupat (game): selang-seling atas–bawah ═ */
(function(){
  var an=$('#anyaman'), dm=$('#daftarMaaf'), N=4, BARIS=3, r=0, c=0, tip=0, mode=null, pegang=false, beres=false, pakan=null, tambal=[], uj=el('div','ujung');
  for(var i=0;i<N;i++){ var l=el('div','lungsin'); l.style.left=((i+.5)/N*100-9.5)+'%'; an.appendChild(l); }
  an.appendChild(el('div','ekor')); an.appendChild(el('div','ekor e2')); uj.appendChild(el('b')); an.appendChild(uj);
  function S(){ return an.offsetWidth; }
  function yBaris(){ return (.2+r*.3); }
  function perlu(k){ return (r+k)%2===0?'atas':'bawah'; }
  function xLungsin(k){ return (k+.5)/N*S(); }
  function baruBaris(){ pakan=el('div','pakan'); pakan.style.top=(yBaris()*100-10)+'%'; pakan.style.width='0px'; an.appendChild(pakan); tip=0; c=0; mode=null; tambal=[]; gambar(); }
  function gambar(){ pakan.style.width=(tip+S()*.08)+'px'; uj.style.left=tip+'px'; uj.style.top=(yBaris()*100)+'%';
    uj.className='ujung'+(mode?' '+mode:''); $('b',uj).textContent=mode==='atas'?'lewat atas':mode==='bawah'?'lewat bawah':''; }
  function aturan(){ return 'Lembar janur pertama di baris ini lewat <b>'+perlu(0)+'</b>, lalu bergantian.'; }
  MASUK[1]=function(){ baruBaris();
    petunjuk('Tarik ujung janur ke kanan. <b>Naikkan jari</b> untuk lewat atas, <b>turunkan</b> untuk lewat bawah, selang-seling, mulai dari <b>atas</b>.'); };
  addEventListener('resize',function(){ if(kini===1 && pakan) gambar(); });
  seret(an,{
    boleh:function(){ return !beres; },
    down:function(e){ var b=an.getBoundingClientRect(); pegang=Math.abs(e.clientX-b.left-tip)<S()*.22; pakan.classList.add('seret'); if(!pegang) kedip(); },
    move:function(e){ if(!pegang || beres) return;
      var b=an.getBoundingClientRect(), fx=e.clientX-b.left, dy=e.clientY-b.top-yBaris()*S(), batas=S()*.06;
      if(dy<-batas) mode='atas'; else if(dy>batas) mode='bawah';
      var t=klem(fx,tip,Math.min(tip+S()*.3,S()));
      while(c<N && t>=xLungsin(c)){
        if(mode!==perlu(c)){ kusut(c); return; }
        if(perlu(c)==='bawah'){ var p=el('div','tambal'); p.style.left=((c+.5)/N*100-9.5)+'%'; p.style.width='19%'; p.style.top=(yBaris()*100-10)+'%'; an.appendChild(p); tambal.push(p); }
        SFX.janur(); buzz(8); c++;
      }
      tip=t; gambar();
      if(c>=N && tip>=S()*.97) barisBeres();
    },
    up:function(){ pegang=false; if(pakan) pakan.classList.remove('seret'); }
  });
  function kusut(k){
    pegang=false; SFX.salah(); buzz(40); pakan.classList.remove('seret'); pakan.classList.add('kusut');
    petunjuk('Kusut! Di lembar ke-'+(k+1)+' seharusnya lewat <b>'+perlu(k)+'</b>. '+aturan());
    tambal.forEach(function(p){ p.remove(); }); tambal=[];
    setTimeout(function(){ pakan.classList.remove('kusut'); tip=0; c=0; mode=null; gambar(); },380);
  }
  function barisBeres(){
    pegang=false; pakan.classList.remove('seret'); tip=S()*1.0; mode=null; gambar(); SFX.benar(); buzz(20);
    if(MAAF[r]){ var li=el('li'); li.appendChild(el('small',null,'maaf '+(r+1))); li.appendChild(document.createTextNode(MAAF[r])); dm.appendChild(li); }
    r++;
    if(r>=BARIS){ beres=true; an.classList.add('jadi'); SFX.menang(); var p=pusat(an); konfeti(p.x,p.y,80,['#C9D86A','#9DB23F','#E9B949','#FFF6E0']);
      petunjuk('Ketupatnya jadi. Rapi sekali.'); setTimeout(function(){ lanjut(berikut,FOTO.length?'Buka toples kuenya':'Lanjut'); },2600); return; }
    setTimeout(function(){ baruBaris(); petunjuk('Rapi! Baris berikutnya <b>kebalikannya</b>: mulai lewat <b>'+perlu(0)+'</b>.'); },900);
  }
})();

/* ═ 3 · toples kue: putar tutupnya ke kiri (foto) ═ */
(function(){

  var JENIS=[{n:'nastar',w:'#c9463d',w2:'#a83530',k:'#E9A33D'},{n:'kastengel',w:'#6F8A2A',w2:'#57701e',k:'#F0C46A'},{n:'putri salju',w:'#5a3f7d',w2:'#45305f',k:'#FFFDF5'}];

    var J=JENIS[i%3], t=el('div','toples'), tp=el('div','tutup'), kc=el('div','kaca');
    tp.style.setProperty('--w',J.w); tp.style.setProperty('--w2',J.w2);
    for(var k=0;k<9;k++){ var q=el('i','kue'), s=rand(18,26); q.style.cssText='width:'+s+'%;height:'+(s*.6)+'%;left:'+rand(4,72)+'%;top:'+rand(30,82)+'%;background:'+J.k+';box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)'; kc.appendChild(q); }
    var im=el('img','mini'); im.src=f.src; im.alt=''; kc.appendChild(im); kc.appendChild(el('span','label',J.n));
    t.appendChild(el('span','panah','↺')); t.appendChild(tp); t.appendChild(kc); rak.appendChild(t);
    var total=0, sudut=0, cx=0, cy=0, lepas=false;
    seret(tp,{
      boleh:function(){ return !lepas && !aktif; },
      down:function(e){ var p=pusat(tp); cx=p.x; cy=p.y; sudut=Math.atan2(e.clientY-cy,e.clientX-cx); tp.classList.add('seret'); },
      move:function(e){ if(lepas) return; var a=Math.atan2(e.clientY-cy,e.clientX-cx), d=a-sudut; sudut=a;
        if(d>Math.PI) d-=2*Math.PI; if(d<-Math.PI) d+=2*Math.PI;
        total=Math.max(0,total-d); tp.style.backgroundPosition=(-total*U()*4)+'px 0'; tp.style.transform='translateY('+(-total*U()*.5)+'px)';
        if(-d>.04 && Math.random()<.5) SFX.ulir();
        if(total>Math.PI*1.6) buka(); },
      up:function(){ tp.classList.remove('seret'); if(!lepas){ if(total<.3) kedip(); } }
    });
    function buka(){
      lepas=true; aktif=t; tp.classList.remove('seret'); tp.classList.add('lepas'); t.classList.add('buka'); SFX.pop(); buzz(15);

  fn.addEventListener('click',function(){ if(!aktif) return; fn.classList.remove('tampil'); aktif.classList.add('simpan'); aktif=null; ptj.style.visibility=''; sisa--; SFX.klik();
    if(sisa<=0) lanjut(berikut,'Dengar takbirnya'); else petunjuk('<b>'+sisa+' toples lagi.</b> Putar tutupnya ke kiri.'); });
  noMenu(fn);
  MASUK[2]=function(){ petunjuk('Kue Lebaran sudah siap di toples. <b>Putar tutupnya ke kiri</b>, gerakkan jari memutar di atas tutup.'); };
})();
