      judul('#judulKelas','Sampai juga','di mejamu'); petunjuk('Di luar lipatannya ada tulisan kecil. <b>Baca dulu.</b>');
      setTimeout(function(){ lanjut(berikut,FOTO.length?'Cek laci meja':'Buka kertasnya'); },Math.max(3500,OPER.join('').length*45)); },650); });
  noMenu(tb);
  MASUK[0]=function(){ judul('#judulKelas','Jam pelajaran ketiga','ada yang bisik-bisik dari belakang'); label('kelas'); pos=0; requestAnimationFrame(letak);
    petunjuk('Ada kertas terlipat di bangku paling belakang. <b>Ketuk kertasnya.</b>'); };

})();
