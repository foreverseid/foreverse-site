<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesanan · Foreverse</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16161A; --ink-soft:#4A4852; --ink-faint:#83808C;
  --cream:#FBFAF7; --cream-lift:#F5F3EE; --paper:#FFF; --stone:#E4E2DC;
  --violet:#3B3168; --violet-tint:#EEEBF7; --coral:#E8734A; --merah:#C0392B; --hijau:#2E8B57;
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:24px clamp(14px,3vw,28px) 70px}

h1{font-size:1.3rem;font-weight:600;margin:0 0 3px}
.sub{color:var(--ink-faint);font-size:.87rem;margin:0 0 22px}

/* masuk */
.masuk{max-width:22rem;margin:12vh auto 0;background:var(--paper);border:1px solid var(--stone);border-radius:16px;padding:26px}
.masuk h1{margin-bottom:14px}
input[type=password],input[type=text]{
  width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--stone);border-radius:10px;background:var(--cream);
}
input:focus{outline:none;border-color:var(--violet)}
.tbl{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--violet);color:#fff}
.tbl:hover{background:#2C2450}
.tbl.kecil{padding:6px 11px;font-size:.78rem;border-radius:8px;background:var(--cream-lift);color:var(--ink)}
.tbl.kecil:hover{background:var(--stone)}
.tbl.bahaya{color:var(--merah)}
.tbl[disabled]{opacity:.5;cursor:wait}
.tbl.lebar{width:100%;margin-top:14px}

.galat{color:var(--merah);font-size:.85rem;margin:10px 0 0;min-height:1.2em}

/* ringkas */
.angka{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kotak{background:var(--paper);border:1px solid var(--stone);border-radius:13px;padding:14px 16px}
.kotak b{display:block;font-size:1.5rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kotak span{font-size:.78rem;color:var(--ink-faint)}

.sehat{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.lencana{font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--cream-lift);color:var(--ink-soft)}
.lencana.ya{background:#E8F6EE;color:#1E6B42}
.lencana.tidak{background:#FDECEA;color:#8C2B20}

/* tabel */
.gulung{overflow-x:auto;background:var(--paper);border:1px solid var(--stone);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:860px}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);
   padding:11px 12px;border-bottom:1px solid var(--stone);white-space:nowrap;font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--cream-lift);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:#FCFBF8}
.kode{font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.st{font-size:.73rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.lunas{background:#E8F6EE;color:#1E6B42}
.st.draf{background:var(--cream-lift);color:var(--ink-faint)}
.st.menunggu{background:#FFF4DC;color:#8A6416}
.st.gagal{background:#FDECEA;color:#8C2B20}
.mati{opacity:.45}
.aksi{display:flex;flex-wrap:wrap;gap:5px}
a.tautan{color:var(--violet);font-size:.8rem;word-break:break-all}
.kosong{padding:40px;text-align:center;color:var(--ink-faint)}
.atas{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.atas .kanan{margin-left:auto;display:flex;gap:8px}
</style>
</head>
<body>

<div class="wrap">
  <!-- masuk -->
  <section id="pMasuk">
    <div class="masuk">
      <h1>Pesanan Foreverse</h1>
      <p class="sub">Masukkan password admin.</p>
      <form id="fMasuk">
        <input id="sandi" type="password" placeholder="Password" autocomplete="current-password" autofocus>
        <button class="tbl lebar" type="submit">Masuk</button>
      </form>
      <p class="galat" id="galatMasuk"></p>
    </div>
  </section>

  <!-- isi -->
  <section id="pIsi" hidden>
    <div class="atas">
      <div>
        <h1>Pesanan</h1>
        <p class="sub" style="margin:0">200 pesanan terakhir.</p>
      </div>
      <div class="kanan">
        <button class="tbl kecil" id="segar" type="button">Muat ulang</button>
        <button class="tbl kecil" id="keluar" type="button">Keluar</button>
      </div>
    </div>

    <div class="sehat" id="sehat"></div>
    <div class="angka" id="angka"></div>
    <div class="gulung"><div id="tabel"></div></div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var sandi = sessionStorage.getItem("fv-sandi") || "";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function rp(n){ return "Rp" + Number(n||0).toLocaleString("id-ID"); }

  function tgl(ms){
    if(!ms) return "—";
    var d = new Date(+ms);
    return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short"}) + " " +
           d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  }

  async function panggil(isi){
    var r = await fetch("/api/admin", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify(Object.assign({ sandi: sandi }, isi))
    });
    var j = await r.json().catch(function(){ return {}; });
    if(!r.ok || !j.ok) throw new Error(j.pesan || "Gagal.");
    return j;
  }

  $("fMasuk").addEventListener("submit", async function(e){
    e.preventDefault();
    sandi = $("sandi").value;
    $("galatMasuk").textContent = "";
    try{
      await panggil({ aksi:"daftar" });
      sessionStorage.setItem("fv-sandi", sandi);
      buka();
    }catch(err){ $("galatMasuk").textContent = err.message; }
  });

  $("keluar").addEventListener("click", function(){
    sessionStorage.removeItem("fv-sandi"); location.reload();
  });
  $("segar").addEventListener("click", muat);

  function buka(){ $("pMasuk").hidden = true; $("pIsi").hidden = false; muat(); }

  async function muat(){
    try{
      var d = await panggil({ aksi:"daftar" });
      var p = await panggil({ aksi:"periksa" });

      $("sehat").innerHTML =
        lencana("Database", p.d1) + lencana("Penyimpanan foto R2", p.r2, "Foto di D1") +
        lencana("Email (Resend)", p.resend) + lencana("Midtrans", p.midtrans) +
        '<span class="lencana">Mode: ' + esc(p.mode) + '</span>' +
        '<span class="lencana">Pengirim: ' + esc(p.pengirim) + '</span>';

      var draf = d.baris.filter(function(b){ return b.status !== "lunas"; }).length;
      $("angka").innerHTML =
        kotak(d.lunas, "surat terbayar") +
        kotak(rp(d.pendapatan), "total masuk") +
        kotak(draf, "draf / belum lunas");

      gambar(d.baris);
    }catch(err){
      if(/[Pp]assword/.test(err.message)){ sessionStorage.removeItem("fv-sandi"); location.reload(); return; }
      $("tabel").innerHTML = '<div class="kosong">' + esc(err.message) + '</div>';
    }
  }

  function lencana(nama, ya, kalauTidak){
    return '<span class="lencana ' + (ya ? "ya" : "tidak") + '">' + esc(nama) + ": " +
           (ya ? "tersambung" : esc(kalauTidak || "belum")) + '</span>';
  }
  function kotak(b, s){ return '<div class="kotak"><b>' + esc(b) + '</b><span>' + esc(s) + '</span></div>'; }

  function gambar(baris){
    if(!baris.length){ $("tabel").innerHTML = '<div class="kosong">Belum ada pesanan.</div>'; return; }
    var html = '<table><thead><tr>' +
      '<th>Kode</th><th>Untuk</th><th>Status</th><th>Masuk</th><th>Kontak</th><th>Tautan</th><th>Tindakan</th>' +
      '</tr></thead><tbody>';

    baris.forEach(function(b){
      var st = b.status || "draf";
      html += '<tr class="' + (b.aktif ? "" : "mati") + '">' +
        '<td class="kode">' + esc(b.kode) + '</td>' +
        '<td><strong>' + esc(b.penerima || "—") + '</strong><br><span style="color:var(--ink-faint);font-size:.8rem">dari ' + esc(b.pengirim || "—") + '</span></td>' +
        '<td><span class="st ' + esc(st) + '">' + esc(st) + '</span>' + (b.aktif ? "" : '<br><span style="font-size:.72rem;color:var(--merah)">nonaktif</span>') + '</td>' +
        '<td style="white-space:nowrap">' + esc(tgl(b.dibayar || b.dibuat)) + '</td>' +
        '<td style="font-size:.8rem">' + esc(b.email || "—") + (b.whatsapp ? '<br>' + esc(b.whatsapp) : "") +
          (b.status === "lunas" ? '<br><span style="font-size:.72rem;color:' + (b.email_terkirim ? "var(--hijau)" : "var(--merah)") + '">email ' + (b.email_terkirim ? "terkirim" : "belum") + '</span>' : "") + '</td>' +
        '<td>' + (st === "lunas"
            ? '<a class="tautan" href="/s/' + esc(b.kode) + '" target="_blank" rel="noopener">/s/' + esc(b.kode) + '</a>' +
              '<br><a class="tautan" href="/edit/' + esc(b.token) + '" target="_blank" rel="noopener" style="color:var(--ink-faint)">tautan edit</a>'
            : '<span style="color:var(--ink-faint)">—</span>') + '</td>' +
        '<td><div class="aksi">' +
          (st === "lunas"
            ? '<button class="tbl kecil" data-a="email" data-k="' + esc(b.kode) + '">Kirim ulang email</button>' +
              '<button class="tbl kecil" data-a="aktif" data-k="' + esc(b.kode) + '" data-n="' + (b.aktif ? 0 : 1) + '">' + (b.aktif ? "Nonaktifkan" : "Aktifkan") + '</button>' +
              '<button class="tbl kecil" data-a="perpanjang" data-k="' + esc(b.kode) + '">Perpanjang edit</button>'
            : '') +
          '<button class="tbl kecil bahaya" data-a="hapus" data-k="' + esc(b.kode) + '">Hapus</button>' +
        '</div></td></tr>';
    });

    $("tabel").innerHTML = html + '</tbody></table>';
  }

  $("tabel").addEventListener("click", async function(e){
    var t = e.target.closest("[data-a]");
    if(!t) return;
    var aksi = t.dataset.a, kode = t.dataset.k;

    if(aksi === "hapus" && !confirm("Hapus pesanan " + kode + " beserta fotonya? Tidak bisa dibatalkan.")) return;
    if(aksi === "aktif" && t.dataset.n === "0" && !confirm("Nonaktifkan surat " + kode + "? Tautannya jadi tidak bisa dibuka.")) return;

    var teksLama = t.textContent;
    t.disabled = true; t.textContent = "…";
    try{
      var hasil = await panggil({ aksi: aksi, kode: kode, nilai: t.dataset.n === "1" });
      if(aksi === "email" && !hasil.ok) throw new Error(hasil.pesan || "Email gagal dikirim.");
      await muat();
    }catch(err){
      alert(err.message);
      t.disabled = false; t.textContent = teksLama;
    }
  });

  if(sandi) buka();
})();
</script>
</body>
</html>
