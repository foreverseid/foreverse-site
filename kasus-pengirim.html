<style>
/* =====================================================================
   KASUS PENGIRIM TANPA NAMA — satu kafe yang dijalani, bukan halaman.
   · halaman TIDAK bisa discroll; kamera mengikuti ke dua arah
   · satu ruang dalam yang terang (bukan jalan memanjang seperti tema
     "Dia Lewat Sini Duluan", bukan malam seperti Toples Kunang-Kunang)
   · skema kontrol yang sama dengan tema dunia-dijalani lain: joystick
     diam di kiri bawah + satu tombol aksi di kanan bawah
   · kemajuan ditunjukkan lewat kantong bukti (0–3), bukan jam/langit
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#241C2E; --redup:#6E6480; --krem:#FFF4DC; --kertas:#FFFCF4;
  --coral:#E8734A; --amber:#FFC24A; --merah:#C8372D; --hijau:#3F7F6E;
  --piksel:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --ketik:'Special Elite','Courier New',monospace;
  --sans:'Figtree',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#8A6A52}
body{
  position:fixed;inset:0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
#dunia{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- baris atas ---------- */
#atas{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding:calc(7px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 7px calc(12px + env(safe-area-inset-left));
  background:var(--krem);border-bottom:3px solid var(--ink);
  display:grid;grid-template-columns:auto 1fr auto auto;gap:3px 9px;align-items:center
}
#berkas{font-family:var(--piksel);font-weight:700;font-size:.8rem;background:var(--ink);color:var(--amber);border-radius:6px;padding:2px 8px;white-space:nowrap}
#kantong{display:flex;gap:5px;align-items:center;font-family:var(--piksel);font-size:.78rem;color:var(--redup);white-space:nowrap}
#kantong i{width:14px;height:14px;border:2px solid var(--ink);border-radius:3px;background:#fff;display:inline-block}
#kantong i.isi{background:var(--coral)}
#langkahT{grid-column:1/-1;font-size:.88rem;font-weight:600;line-height:1.3}
.kecil{font-size:.76rem;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;background:#fff;white-space:nowrap}
#suara{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:.85rem}
@media (orientation:landscape) and (max-height:560px){
  #atas{grid-template-columns:auto auto 1fr auto auto}
  #langkahT{grid-column:auto;order:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lewati{order:4} #suara{order:5}
}

/* ---------- joystick: diam, kelihatan, sederhana ---------- */
#joy{
  position:fixed;z-index:15;
  left:calc(24px + env(safe-area-inset-left));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:112px;height:112px;border-radius:50%;
  background:rgba(255,244,220,.88);border:3px solid var(--ink);touch-action:none
}
#joy::before{content:"";position:absolute;inset:-23px;border-radius:50%}

#joy .s1{left:50%;top:7px;transform:translateX(-50%);border-bottom-color:rgba(36,28,46,.45);border-top:0}
#joy .s2{left:50%;bottom:7px;transform:translateX(-50%);border-top-color:rgba(36,28,46,.45);border-bottom:0}
#joy .s3{top:50%;left:7px;transform:translateY(-50%);border-right-color:rgba(36,28,46,.45);border-left:0}

  ungkap:  function(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f,.22,{when:i*.09,vol:.06}); }); },

function musicBox(){
  var a = ac(); if(!a) return function(){};
  var stop = false, i = 0, pola = [0,3,7,10,7,3,5,8,12,8,5,3,2,5,7,-2];
  function ping(midi, t){
    var f = 440 * Math.pow(2, (midi - 69) / 12), o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(bisu ? .0001 : .045, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + .8);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .9);
  }
  (function loop(){
    if(stop) return;
    var t = a.currentTime + .05;
    for(var k=0;k<4;k++) ping(62 + pola[(i+k) % pola.length], t + k*.42);
    i += 4; setTimeout(loop, 1680);
  })();
  return function(){ stop = true; };
}

/* ══════════════════════════════════════════════════════════════
   PETA — satu kafe, dilihat dari atas. Satuan: petak.
     W = dinding luar (atas berjendela), P = sekat rendah tempat papan
     pengumuman digantung. Sisanya lantai kayu.
   ══════════════════════════════════════════════════════════════ */
var COLS = 24, ROWS = 16;
var G = [];
for(var r=0;r<ROWS;r++){ G.push([]); for(var c=0;c<COLS;c++) G[r].push((r === 0 || r === ROWS-1 || c === 0 || c === COLS-1) ? 'W' : 'f'); }
for(var cp=1; cp<=7; cp++) G[8][cp] = 'P';
var DINDING = { W:1, P:1 };
var BLOK = {};
function blok(c, r){ BLOK[r*COLS + c] = 1; }
function padat(c, r){
  if(c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  return !!(DINDING[G[r][c]] || BLOK[r*COLS + c]);
}
blok(3,2); blok(4,2);                                   // meja langganan (TKP)
blok(7,3); blok(8,3); blok(8,4);                        // meja + pelanggan sebelah
for(var ck=15; ck<=22; ck++) blok(ck,3);                // konter barista
blok(15,1); blok(15,2);                                 // sisi konter, supaya belakang konter tertutup
blok(10,6); blok(11,6);                                 // meja pengunjung
blok(15,9); blok(16,9);
blok(9,11); blok(10,11);
blok(19,12); blok(20,12);                               // pojok detektif
blok(14,13); blok(15,13);                               // kurir + paketnya
blok(1,6); blok(22,14); blok(1,14);                     // pot tanaman

/* ══════════════ masukan: joystick (skema bersama), keyboard ══════════════ */
var JV = { x:0, y:0 }, KB = {}, jid = null;
var joy = $('#joy'), bola = $('#joyBola');
var MAKS = 46, MATI = 10;
function arahJoy(e){
  var r = joy.getBoundingClientRect();
  var dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  var len = Math.hypot(dx, dy), tampil = len > MAKS ? MAKS / len : 1;
  bola.style.transform = 'translate(calc(-50% + ' + (dx*tampil).toFixed(1) + 'px), calc(-50% + ' + (dy*tampil).toFixed(1) + 'px))';
  if(len < MATI){ JV.x = 0; JV.y = 0; return; }
  var kuat = klem((len - MATI) / (MAKS - MATI), 0, 1);
  JV.x = dx / len * kuat; JV.y = dy / len * kuat;
}
function lepasJoy(e){
  if(e && e.pointerId !== jid) return;
  jid = null; JV.x = 0; JV.y = 0;
  bola.style.transform = 'translate(-50%,-50%)';
}
joy.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive:false });
joy.addEventListener('pointerdown', function(e){
  e.preventDefault();
  if(jid !== null) return;
  jid = e.pointerId; ac();
  try{ joy.setPointerCapture(e.pointerId); }catch(err){}
  arahJoy(e);
});
joy.addEventListener('pointermove', function(e){ if(e.pointerId === jid){ e.preventDefault(); arahJoy(e); } });
joy.addEventListener('pointerup', lepasJoy);
joy.addEventListener('pointercancel', lepasJoy);
joy.addEventListener('lostpointercapture', lepasJoy);

window.addEventListener('blur', function(){ KB = {}; lepasJoy({ pointerId:jid }); });
function arahKB(){
  var x = (KB.arrowright||KB.d ? 1 : 0) - (KB.arrowleft||KB.a ? 1 : 0);
  var y = (KB.arrowdown||KB.s ? 1 : 0) - (KB.arrowup||KB.w ? 1 : 0);

/* ══════════════════════════════════════════════════════════════
   GAMBAR — kanvas tunggal, kamera mengikuti ke DUA arah. Di potret,
   bagian bawah layar disisihkan untuk kontrol supaya pemain tidak
   pernah berjalan di bawah joystick.
   ══════════════════════════════════════════════════════════════ */
var cv = $('#dunia'), g = cv.getContext('2d');
var VW = 0, VH = 0, S = 40, CAMX = 0, CAMY = 0, ATAS = 60, BAWAH = 0, OX = 0, OY = 0;
function ukur(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  ATAS = $('#atas').offsetHeight;
  BAWAH = VH > VW ? 168 : 0;            // potret: pita bawah milik kontrol
  S = Math.max(26, Math.min((VH - ATAS - BAWAH) / 9, VW / 7.2));
}
window.addEventListener('resize', ukur);
window.addEventListener('orientationchange', function(){ setTimeout(ukur, 120); });
function sx(x){ return x * S - CAMX + OX; }
function sy(y){ return y * S - CAMY + OY; }
function kamera(){
  var lebarW = COLS * S, tinggiW = ROWS * S, tinggiV = VH - ATAS - BAWAH;
  if(lebarW <= VW){ CAMX = 0; OX = (VW - lebarW) / 2; }
  else { CAMX = klem(P.x * S - VW / 2, 0, lebarW - VW); OX = 0; }
  if(tinggiW <= tinggiV){ CAMY = 0; OY = ATAS + (tinggiV - tinggiW) / 2; }
  else { CAMY = klem(P.y * S - tinggiV / 2, 0, tinggiW - tinggiV); OY = ATAS; }
}

function kotak(x, y, w, h, isi, garis){
  g.fillStyle = isi; g.fillRect(x, y, w, h);
  if(garis){ g.strokeStyle = garis; g.lineWidth = Math.max(1.5, S/22); g.strokeRect(x, y, w, h); }
}
function hurufPiksel(px, berat){ return (berat || 600) + ' ' + Math.round(px) + "px 'Pixelify Sans', ui-monospace, 'Courier New', monospace"; }

function petak(c, r){
  var t = G[r][c], x = sx(c), y = sy(r), s = S + .6;
  if(t === 'f'){
    g.fillStyle = (c + Math.floor(r / 1)) % 2 ? '#E4C499' : '#E9CBA2'; g.fillRect(x, y, s, s);
    g.fillStyle = 'rgba(150,105,60,.22)'; g.fillRect(x, y + S*.5, s, 1.5);
    if((c + r) % 3 === 0){ g.fillRect(x + S*.5, y, 1.5, S*.5); }
    return;
  }
  var atap = t === 'P' ? '#EBD9BC' : '#F3E6CF', depan = t === 'P' ? '#B98E66' : '#A9805E';
  var bawah = r + 1 < ROWS ? G[r+1][c] : 'W';
  var punyaDepan = !DINDING[bawah];
  g.fillStyle = atap; g.fillRect(x, y, s, s);
  if(punyaDepan){
    g.fillStyle = depan; g.fillRect(x, y + S*.45, s, S*.55);
    g.fillStyle = 'rgba(36,28,46,.5)'; g.fillRect(x, y + S*.45, s, Math.max(1.5, S/24));
    if(t === 'W' && r === 0 && c % 3 === 1) kotak(x + S*.14, y + S*.54, S*.72, S*.36, '#BFE1EE', 'rgba(36,28,46,.7)');
  }
  if(r === ROWS - 1 && (c === 11 || c === 12)){           // pintu masuk kaca
    kotak(x + S*.06, y + S*.1, S*.88, S*.8, '#CFE7EE', '#241C2E');
  }
}

/* orang: balok-balok sederhana. gaya: rambut panjang (perempuan) atau
   pendek; topi detektif hanya untuk pemain. */
function orang(x, y, o){
  var X = sx(x), Y = sy(y), u = S / 38;
  var ayun = o.jalan ? Math.sin(o.t * 14) * 2.4 * u : 0;
  g.fillStyle = 'rgba(0,0,0,.18)';
  g.beginPath(); g.ellipse(X, Y + u, 9*u, 3.5*u, 0, 0, 7); g.fill();
  if(!o.duduk){
    kotak(X - 6*u, Y - 9*u + ayun, 5*u, 9*u - ayun, o.celana || '#3B4A72', '#241C2E');
    kotak(X + 1*u, Y - 9*u - ayun, 5*u, 9*u + ayun, o.celana || '#3B4A72', '#241C2E');
  }
  var by = o.duduk ? Y - 15*u : Y - 21*u;
  if(o.mantel){
    kotak(X - 9*u, by, 18*u, 14*u, o.baju, '#241C2E');
    g.fillStyle = 'rgba(36,28,46,.35)'; g.fillRect(X - .8*u, by, 1.6*u, 14*u);
  } else kotak(X - 8*u, by, 16*u, 13*u, o.baju, '#241C2E');
  var hy = by - 13*u;
  if(o.panjang && o.hadap !== 'atas'){                       // rambut panjang terurai di belakang kepala
    kotak(X - 8.5*u, hy + 2*u, 17*u, 15*u, o.rambut, '#241C2E');
  }
  kotak(X - 7*u, hy, 14*u, 13*u, '#F2C9A0', '#241C2E');
  g.fillStyle = o.rambut;
  if(o.hadap === 'atas'){
    g.fillRect(X - 7*u, hy, 14*u, 11*u);
    if(o.panjang) kotak(X - 7*u, hy + 6*u, 14*u, 12*u, o.rambut, '#241C2E');
  } else {
    g.fillRect(X - 7*u, hy, 14*u, 4*u);
    /* rambut panjang terurai sampai bahu — penanda yang langsung kebaca
       walau tokohnya kecil */
    if(o.panjang){ kotak(X - 8.5*u, hy, 3.6*u, 19*u, o.rambut, '#241C2E'); kotak(X + 4.9*u, hy, 3.6*u, 19*u, o.rambut, '#241C2E'); g.fillStyle = o.rambut; g.fillRect(X - 7*u, hy, 14*u, 4*u); }
    g.fillStyle = '#241C2E';
    if(o.hadap === 'bawah'){ g.fillRect(X - 4*u, hy + 6*u, 2*u, 2.5*u); g.fillRect(X + 2*u, hy + 6*u, 2*u, 2.5*u); }
    else if(o.hadap === 'kiri') g.fillRect(X - 5*u, hy + 6*u, 2*u, 2.5*u);
    else g.fillRect(X + 3*u, hy + 6*u, 2*u, 2.5*u);
  }
  if(o.topi){
    kotak(X - 10*u, hy - 1*u, 20*u, 3*u, '#6B4A33', '#241C2E');
    kotak(X - 6.5*u, hy - 6*u, 13*u, 5.5*u, '#6B4A33', '#241C2E');
    g.fillStyle = '#C8372D'; g.fillRect(X - 6.5*u, hy - 2.6*u, 13*u, 1.6*u);
  }
}

/* label nama — selalu tampil; benda di luar layar tidak diberi label */
function pil(x, y, teks, gaya){
  if(x < -S*.5 || x > VW + S*.5 || y < ATAS - 4 || y > VH + S) return;
  var fs = Math.max(10.5, S * .21);
  g.font = hurufPiksel(fs, 700);
  var w = g.measureText(teks).width + fs*1.1, h = fs * 1.55;
  x = klem(x, w/2 + 4, VW - w/2 - 4);
  var bx = Math.round(x - w/2), by = Math.round(y - h);
  g.fillStyle = gaya === 'aktif' ? '#FFC24A' : gaya === 'kamu' ? '#241C2E' : gaya === 'selesai' ? 'rgba(255,244,220,.78)' : '#FFF4DC';
  g.fillRect(bx, by, w, h);
  g.strokeStyle = gaya === 'selesai' ? 'rgba(36,28,46,.45)' : '#241C2E'; g.lineWidth = 2; g.strokeRect(bx, by, w, h);
  g.fillStyle = gaya === 'kamu' ? '#FFC24A' : gaya === 'selesai' ? 'rgba(36,28,46,.55)' : '#241C2E';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(teks, x, by + h/2 + 1);
}

/* penunjuk arah: cincin + panah mantul; kalau tujuannya di luar layar,
   panah menempel di tepi layar dan menunjuk arahnya (ke segala arah). */
function gambarPenunjuk(now){
  var t = tujuan().o; if(!t || panelBuka) return;
  var X = sx(t.ox), Y = sy(t.oy);
  g.strokeStyle = '#E8734A'; g.lineWidth = Math.max(2, S/14); g.setLineDash([S*.16, S*.12]);
  g.beginPath(); g.ellipse(X, Y + S*.15, S*1.0, S*.6, 0, 0, 7); g.stroke(); g.setLineDash([]);
  var kiri = 22, kanan = VW - 22, atas = ATAS + 26, bawah = VH - (BAWAH || 150) - 10;
  if(X < kiri || X > kanan || Y < atas || Y > bawah){
    var cx = VW / 2, cy = (atas + bawah) / 2, dx = X - cx, dy = Y - cy;
    var k = Math.min(Math.abs((dx > 0 ? kanan - cx : kiri - cx) / (dx || 1e-6)), Math.abs((dy > 0 ? bawah - cy : atas - cy) / (dy || 1e-6)));
    var ex = cx + dx * k, ey = cy + dy * k, a = Math.atan2(dy, dx);
    g.save(); g.translate(ex, ey); g.rotate(a);
    g.fillStyle = '#E8734A'; g.strokeStyle = '#241C2E'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(12, 0); g.lineTo(-12, -14); g.lineTo(-12, 14); g.closePath(); g.fill(); g.stroke();
    g.restore();
    return;
  }
  var lyAtas = (t.ly != null ? sy(t.ly) : Y - S*.42) - S*.7;
  var ay = lyAtas - S*.3 + Math.sin(now / 220) * S * .08;
  g.fillStyle = '#E8734A'; g.strokeStyle = '#241C2E'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(X, ay + S*.3); g.lineTo(X - S*.22, ay); g.lineTo(X + S*.22, ay); g.closePath(); g.fill(); g.stroke();
}

function gambar(now){

  var r0 = Math.max(0, Math.floor((CAMY - OY) / S)), r1 = Math.min(ROWS - 1, Math.ceil((CAMY - OY + VH) / S));
  for(var r=r0;r<=r1;r++) for(var c=c0;c<=c1;c++) petak(c, r);
  /* tulisan nama kafe di dinding atas */
  var px = sx(11.5), py = sy(.12);
  kotak(px - S*1.8, py, S*3.6, S*.34, '#FFF4DC', '#241C2E');
  g.fillStyle = '#241C2E'; g.font = hurufPiksel(S*.22, 700); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('KAFE LANGGANAN', px, py + S*.17);

  benda();

  IA.forEach(function(o){
    var gaya = selesaiIA(o) ? 'selesai' : (o === dekat ? 'aktif' : '');
    var lx = o.lx != null ? o.lx : o.ox, ly = o.ly != null ? o.ly : o.oy - .42;

  gambarPenunjuk(now);
}

var lalu = performance.now(), sudahMulai = false;
function tik(now){
  var dt = Math.min(.05, (now - lalu) / 1000); lalu = now;
  var v = (!panelBuka && sudahMulai) ? (arahKB() || JV) : { x:0, y:0 };
  var kec = Math.hypot(v.x, v.y);
  if(kec > .01){
    var nx = P.x + v.x * KEC * dt, ny = P.y + v.y * KEC * dt;
    if(bisaDi(nx, P.y)) P.x = nx;
    if(bisaDi(P.x, ny)) P.y = ny;
    P.hadap = Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'kanan' : 'kiri') : (v.y > 0 ? 'bawah' : 'atas');
    P.jalan = kec; P.langkahT += dt;
    if(Math.floor(P.langkahT / .3) !== Math.floor((P.langkahT - dt) / .3)) SFX.langkah();
  } else P.jalan = 0;
  kamera();
  segarAksi();
  gambar(now);
  requestAnimationFrame(tik);
}

$('#pbNama').textContent = PENERIMA;
document.title = 'Berkas kasus buat ' + PENERIMA;
$('#mulai').addEventListener('click', function(){
  ac(); MU.main(); sudahMulai = true;
  $('#pembuka').hidden = true;
  ukur();
  toast('Mulai dari meja langgananmu. Kertasnya masih di situ.');
});
ukur(); segarBar();
requestAnimationFrame(tik);

           dekat:dekat ? dekat.id : null, panel:panelBuka, S:S, inisial:INISIAL, karakter:KARAKTER,
           layarY:sy(P.y), batasBawah:VH - BAWAH };
};
