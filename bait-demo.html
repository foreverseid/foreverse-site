:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ═════ 5 · diterawang ke lampu ═════ */
(function(){

/* ═════ 7 · timbangan pos ═════ */
(function(){
  var modeUmur=!A.hide && A.age>=6 && A.age<=99, T=modeUmur?A.age:25;
  var MAKS=Math.max(30,Math.ceil(T*1.6/10)*10);
  var a=Math.max(1,Math.round(T*.27)), b=Math.max(1,Math.round(T*.38)), c=T-a-b;
  if(c<1){ b=Math.max(1,b+c-1); c=T-a-b; }
  var umpan=[], coba=0;
  while(umpan.length<3 && coba<200){ coba++; var w=Math.round(rand(2,Math.max(3,T-2))); if(w!==T && umpan.indexOf(w)<0 && [a,b,c].indexOf(w)<0) umpan.push(w); }
  while(umpan.length<3) umpan.push(umpan.length+T+1);
  var NAMA=[['🎀','Pita'],['🍬','Permen'],['🕯️','Lilin'],['💌','Kartu'],['📎','Jepit'],['🔑','Gantungan']];
  var berat=[a,b,c].concat(umpan).sort(function(){ return Math.random()-.5; });
  var nampan=$('#nampan'), tumpuk=$('#tumpuk'), piring=$('#piring'), sel=[], brg=[], beres=false;
  berat.forEach(function(g,i){
    var s=el('div'); s.style.cssText='width:calc(var(--u)*24);height:calc(var(--u)*20)'; nampan.appendChild(s); sel.push(s);
    var x=el('div','brg'); x.innerHTML='<span class="ik">'+NAMA[i][0]+'</span>'+NAMA[i][1]+'<span class="g">'+g+' g</span>'; x._g=g; x._sel=s; x._di=false;
    s.appendChild(x); brg.push(x);
  });
  $('#syarat').innerHTML='Kirim balik paket kecil untuk '+PENGIRIM.replace(/</g,'&lt;')+'. Hari ini tarifnya khusus: beratnya harus pas <b>'+T+' g</b>'+(modeUmur?', sama dengan umurmu.':'.');
  /* dial */
  var svg=$('#dialSvg'), h='';
  function sud(v){ return -135+270*v/MAKS; }
  for(var v=0;v<=MAKS;v+=MAKS/10){ var r=sud(v)*Math.PI/180, x1=50+Math.sin(r)*40, y1=50-Math.cos(r)*40, x2=50+Math.sin(r)*34, y2=50-Math.cos(r)*34, xt=50+Math.sin(r)*27, yt=50-Math.cos(r)*27;
    h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#16161A" stroke-width="1.6"/><text x="'+xt+'" y="'+(yt+2.4)+'" font-size="6.4" text-anchor="middle" font-family="sans-serif" font-weight="700" fill="#16161A">'+v+'</text>'; }
  var rt=sud(T)*Math.PI/180;

    if(Math.abs(vel)>.02||Math.abs(tuju-cur)>.05) requestAnimationFrame(goyang); else { cur=tuju; jalan=false; } }
  var cekT=null;
  function hitung(){
    var tot=brg.filter(function(x){ return x._di; }).reduce(function(s,x){ return s+x._g; },0);
    tuju=sud(Math.min(tot,MAKS*1.04)); if(!jalan){ jalan=true; requestAnimationFrame(goyang); }
    $('#baca').textContent=tot+' g';
    piring.style.transform='translateY('+(Math.min(tot,MAKS)/MAKS*U()*1.6)+'px)'; tumpuk.style.transform=piring.style.transform;
    clearTimeout(cekT);
    if(tot===T) cekT=setTimeout(berhasil,700);
    else if(tot>T) petunjuk('Kelebihan <b>'+(tot-T)+' g</b>. Turunkan satu barang dari piring.');
    else if(tot>0) petunjuk('Masih kurang <b>'+(T-tot)+' g</b>.');
  }
  MASUK[6]=function(){ petunjuk('<b>Seret barang ke piring timbangan</b> sampai jarumnya pas di garis merah.'); };
  brg.forEach(function(x){
    var ox=0,oy=0,ruang=null;
    seret(x,{
      boleh:function(){ return !beres; },
      down:function(e){ var r=x.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;

      move:function(e){ x.style.left=(e.clientX-ox)+'px'; x.style.top=(e.clientY-oy)+'px'; },
      up:function(e){
        var p=pusat(piring), dalam=Math.abs(e.clientX-p.x)<p.r.width*.6 && e.clientY<p.r.bottom+U()*10 && e.clientY>p.r.top-U()*26;

    brg.forEach(function(x){ if(x._di){ x._di=false; x.classList.remove('di-piring'); x._sel.appendChild(x); } });
