/* ═══════════════════════════════════════════════════════════════
   FOREVERSE · Tema Bait × Birthday (dirombak total 3-11-2026)
   Satu hari menerima pos: kotak pos di depan rumah → amplop dibuka
   dengan pisau surat → album perangko umur → rak kartu pos berisi
   foto → kertas tipis diterawang ke lampu → kartu ucapan dibalik
   lembar demi lembar → paket balasan ditimbang pas → bendera kotak
   pos dinaikkan, balasan dikirim.
   Satu layar, tidak di-scroll. Ukuran memakai --u supaya sama rapi
   di HP tegak dan laptop/landscape.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#16161A; --cream:#FBFAF7; --stone:#E4E2DC; --violet:#3B3168; --coral:#E8734A; --blush:#E8A5B0;
  --kraft:#D8B78A; --kayu:#B98A5E; --kuning:#F5C85B; --muted:#6E6A78;
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --tangan:'Caveat',cursive;
  --u:min(1vw,.5vh);
}
@media (min-aspect-ratio:1/1){ :root{ --u:min(.62vw,.92vh); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2346;color:var(--ink);font-family:var(--sans)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
button{font-family:var(--sans)}

/* ── latar: halaman depan rumah & meja kayu (kamera bergeser di meja) ── */
.latar{position:fixed;inset:0;transition:opacity .9s ease}
.luar{background:
  linear-gradient(180deg,#F6E7D5 0%,#F3DCC6 46%,transparent 46.2%),
  repeating-linear-gradient(90deg,#CBBFAE 0 calc(var(--u)*1.2),#D9CFC1 calc(var(--u)*1.2) calc(var(--u)*13)),
  #D9CFC1;background-size:100% 100%,100% 100%;}
.luar::before{content:"";position:absolute;left:0;right:0;top:46%;height:4%;background:#BFB2A0;box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.06)}
.luar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#8FA27A,#76895f);box-shadow:inset 0 calc(var(--u)*1.2) 0 #9DB087}
.meja{opacity:0;background-color:#B98A5E;
  background-image:
    repeating-linear-gradient(92deg,rgba(80,45,15,.07) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(90deg,rgba(255,235,205,.08) 0 1px,transparent 1px 37px),
    linear-gradient(90deg,#A97A4E,#C29466 30%,#B3845A 55%,#C69A6C 80%,#A97A4E);
  background-size:auto,auto,260% 100%;background-position:0 0,0 0,var(--geser,0%) 0;
  transition:opacity .9s ease,background-position 1.1s cubic-bezier(.6,.05,.3,1)}
.meja::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(40,20,5,.35))}
body.di-meja .luar{opacity:0} body.di-meja .meja{opacity:1}

/* ── kepala & petunjuk ── */
.kepala{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
.langkah{background:rgba(22,22,26,.78);color:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.langkah b{color:var(--kuning)}
.kepala .sela{flex:1}
.kepala button{border:0;background:rgba(251,250,247,.92);color:var(--ink);border-radius:99px;height:34px;min-width:34px;padding:0 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
#lewati{display:none} body.boleh-lewati #lewati{display:block}
.petunjuk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:40;max-width:min(92vw,560px);
  background:rgba(251,250,247,.95);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.45;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.18);transition:opacity .3s,transform .3s}
.petunjuk b{color:var(--coral)}
.petunjuk.ganti{opacity:0;transform:translateX(-50%) translateY(6px)}
.petunjuk.kedip{animation:kedip .5s 2}
@keyframes kedip{50%{background:#FFE3B8}}
.lanjut{border:0;background:var(--violet);color:#fff;font-weight:800;font-size:15px;border-radius:99px;padding:13px 26px;box-shadow:0 6px 18px rgba(59,49,104,.35);cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:.4s}
.lanjut.tampil{opacity:1;transform:none;pointer-events:auto}

/* ── adegan ── */
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);
  opacity:0;pointer-events:none;transform:translateX(45%);transition:opacity .7s ease,transform 1.1s cubic-bezier(.6,.05,.3,1)}
.sc.aktif{opacity:1;pointer-events:auto;transform:none}

   Kalau tidak ada berkas lagu, surat TIDAK pernah diam - ini aturan

function musicBox(){
  var a=ac(); if(!a) return null;
  var gain=a.createGain(); gain.gain.value=.11; gain.connect(a.__out||a.destination);
  var notes=[72,76,79,84,79,76, 74,77,81,86,81,77, 72,76,79,83,79,76, 71,74,79,83,86,83];
  var step=.34, t0=a.currentTime+.1, n=0, timer=null, berhenti=false;
  function ping(midi,t){
    var o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=440*Math.pow(2,(midi-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.4);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t+1.5);
  }
  (function loop(){
    if(berhenti) return;
    if(t0<a.currentTime) t0=a.currentTime+.05; while(t0 < a.currentTime + 2){ ping(notes[n%notes.length],t0); t0+=step; n++; }
    timer=setTimeout(loop,300);
  })();
  return { gain:gain, stop:function(){ berhenti=true; clearTimeout(timer); } };
}

      var gs=rot-awalRot; rot=Math.abs(gs)>18?awalRot+Math.sign(gs)*langkah*Math.max(1,Math.round(Math.abs(gs)/langkah)):awalRot; rak.style.transition='transform .5s cubic-bezier(.3,1.3,.5,1)'; rak.style.setProperty('--r',rot+'deg'); SFX.klik();
    }
  });
  var kot=$('#lihat'), kt=$('#lihatKartu'), aktifI=0;
  function lihat(i){ aktifI=i; $('#lkImg').src=FOTO[i].src; $('#lkKet').textContent=FOTO[i].caption||'-';
    $('#lkUntuk').setAttribute('data-t','untuk '+PENERIMA); kt.classList.remove('balik'); $('#lkPetunjuk').textContent='ketuk kartunya untuk membaca baliknya';
    kot.classList.add('tampil'); ptj.style.visibility='hidden'; SFX.kertas(); }
  kt.addEventListener('click',function(e){ e.stopPropagation(); kt.classList.toggle('balik'); SFX.kertas();
    if(kt.classList.contains('balik')){ dilihat[aktifI]=1; kartu[aktifI].classList.add('dilihat'); $('#lkPetunjuk').textContent='ketuk di luar kartu untuk mengembalikannya ke rak'; } });
  kot.addEventListener('click',function(){ kot.classList.remove('tampil'); ptj.style.visibility=''; hitung(); });
  noMenu(kot);
})();

/* ═════ 5 · diterawang ke lampu ═════ */
(function(){
  if(!String(D.rahasia||'').trim()) return;
  var tp=$('#tipis'), teks=$('#tipisTeks'), cah=$('#cahaya'), dasar={x:0,y:0}, geser={x:0,y:0}, beres=false;
  teks.textContent=D.rahasia;
  MASUK[5-1]=function(){ petunjuk('Selembar kertas tipis, kelihatannya kosong. <b>Angkat ke depan lampu</b> untuk menerawangnya.'); };
  function nilai(){ var a=pusat(tp), b=pusat(cah), R=b.r.width/2, d=Math.hypot(a.x-b.x,a.y-b.y); return klem(1-(d-R*.12)/(R*.7),0,1); }
  seret(tp,{
    boleh:function(){ return !beres; },
    down:function(){ tp.style.transition='none'; dasar.x=geser.x; dasar.y=geser.y; },

      var v=nilai(); teks.style.opacity=v; tp.classList.toggle('terang',v>.25); },
    up:function(){

        tp.style.transition='transform .5s cubic-bezier(.3,1.3,.5,1)'; tp.style.transform='translate('+geser.x+'px,'+geser.y+'px)';
        teks.style.transition='opacity .6s'; teks.style.opacity=1; tp.classList.add('terang'); SFX.dentang(); buzz(20);

})();

/* ═════ 6 · kartu ucapan ═════ */

/* ═════ 7 · timbangan pos ═════ */
(function(){
  var modeUmur=!A.hide && A.age>=6 && A.age<=99, T=modeUmur?A.age:25;
  var MAKS=Math.max(30,Math.ceil(T*1.6/10)*10);
  var a=Math.max(1,Math.round(T*.27)), b=Math.max(1,Math.round(T*.38)), c=T-a-b;
  if(c<1){ b=Math.max(1,b+c-1); c=T-a-b; }
  var umpan=[], coba=0;
  while(umpan.length<3 && coba<200){ coba++; var w=Math.round(rand(2,Math.max(3,T-2))); if(w!==T && umpan.indexOf(w)<0 && [a,b,c].indexOf(w)<0) umpan.push(w); }
  while(umpan.length<3) umpan.push(umpan.length+T+1);
  var NAMA=[['🎀','Pita'],['🍬','Permen'],['🕯️','Lilin'],['💌','Kartu'],['📎','Jepit'],['🔑','Gantungan']];
  var berat=[a,b,c].concat(umpan).sort(function(){ return Math.random()-.5; });
  var nampan=$('#nampan'), tumpuk=$('#tumpuk'), piring=$('#piring'), sel=[], brg=[], beres=false;
  berat.forEach(function(g,i){
    var s=el('div'); s.style.cssText='width:calc(var(--u)*24);height:calc(var(--u)*20)'; nampan.appendChild(s); sel.push(s);
    var x=el('div','brg'); x.innerHTML='<span class="ik">'+NAMA[i][0]+'</span>'+NAMA[i][1]+'<span class="g">'+g+' g</span>'; x._g=g; x._sel=s; x._di=false;
    s.appendChild(x); brg.push(x);
  });
  $('#syarat').innerHTML='Kirim balik paket kecil untuk '+PENGIRIM.replace(/</g,'&lt;')+'. Hari ini tarifnya khusus: beratnya harus pas <b>'+T+' g</b>'+(modeUmur?', sama dengan umurmu.':'.');
  /* dial */
  var svg=$('#dialSvg'), h='';
  function sud(v){ return -135+270*v/MAKS; }
  for(var v=0;v<=MAKS;v+=MAKS/10){ var r=sud(v)*Math.PI/180, x1=50+Math.sin(r)*40, y1=50-Math.cos(r)*40, x2=50+Math.sin(r)*34, y2=50-Math.cos(r)*34, xt=50+Math.sin(r)*27, yt=50-Math.cos(r)*27;
    h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#16161A" stroke-width="1.6"/><text x="'+xt+'" y="'+(yt+2.4)+'" font-size="6.4" text-anchor="middle" font-family="sans-serif" font-weight="700" fill="#16161A">'+v+'</text>'; }
  var rt=sud(T)*Math.PI/180;
  h+='<line x1="'+(50+Math.sin(rt)*43)+'" y1="'+(50-Math.cos(rt)*43)+'" x2="'+(50+Math.sin(rt)*31)+'" y2="'+(50-Math.cos(rt)*31)+'" stroke="#E8734A" stroke-width="3.4" stroke-linecap="round"/>';
  svg.innerHTML=h;
  var jarum=$('#jarum'), cur=-135, vel=0, tuju=-135, jalan=false;
  function goyang(){ vel+=(tuju-cur)*.09; vel*=.82; cur+=vel; jarum.style.setProperty('--j',cur+'deg');
    if(Math.abs(vel)>.02||Math.abs(tuju-cur)>.05) requestAnimationFrame(goyang); else { cur=tuju; jalan=false; } }
  var cekT=null;
  function hitung(){
    var tot=brg.filter(function(x){ return x._di; }).reduce(function(s,x){ return s+x._g; },0);
    tuju=sud(Math.min(tot,MAKS*1.04)); if(!jalan){ jalan=true; requestAnimationFrame(goyang); }
    $('#baca').textContent=tot+' g';
    piring.style.transform='translateY('+(Math.min(tot,MAKS)/MAKS*U()*1.6)+'px)'; tumpuk.style.transform=piring.style.transform;
    clearTimeout(cekT);
    if(tot===T) cekT=setTimeout(berhasil,700);
    else if(tot>T) petunjuk('Kelebihan <b>'+(tot-T)+' g</b>. Turunkan satu barang dari piring.');
    else if(tot>0) petunjuk('Masih kurang <b>'+(T-tot)+' g</b>.');
  }
  MASUK[6]=function(){ petunjuk('<b>Seret barang ke piring timbangan</b> sampai jarumnya pas di garis merah.'); };
  brg.forEach(function(x){
    var ox=0,oy=0,ruang=null;
    seret(x,{
      boleh:function(){ return !beres; },
      down:function(e){ var r=x.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
        ruang=el('div','brg ruang'); if(x._di) ruang.className='brg di-piring ruang'; x.parentNode.insertBefore(ruang,x);
        x.style.width=r.width+'px'; x.style.height=r.height+'px'; x.classList.add('terbang'); document.body.appendChild(x);
        x.style.left=r.left+'px'; x.style.top=r.top+'px'; SFX.klik(); },
      move:function(e){ x.style.left=(e.clientX-ox)+'px'; x.style.top=(e.clientY-oy)+'px'; },
      up:function(e){
        var p=pusat(piring), dalam=Math.abs(e.clientX-p.x)<p.r.width*.6 && e.clientY<p.r.bottom+U()*10 && e.clientY>p.r.top-U()*26;
        ruang.remove(); x.classList.remove('terbang'); x.style.cssText='';
        if(dalam){ x._di=true; x.classList.add('di-piring'); tumpuk.appendChild(x); SFX.tutup(); }
        else { x._di=false; x.classList.remove('di-piring'); x._sel.appendChild(x); }
        hitung();
      }
    });
  });
  function berhasil(){
    if(beres) return; beres=true; SFX.menang(); buzz([20,40,20]);

    tumpuk.style.transition='opacity .4s'; tumpuk.style.opacity='0';
    $('#paketLabel').textContent='untuk '+PENGIRIM+' · '+T+' g ✓';
    $('#paket').classList.add('jadi');
    var c=pusat($('#paket')); konfeti(c.x,c.y,60);
    petunjuk('Pas <b>'+T+' g</b>. Paketnya siap dikirim.');
    setTimeout(function(){ lanjut(berikut,'Masukkan ke kotak pos'); },1500);
  }
  $('#lewati').onclick=function(){ if(kini!==6||beres) return;
    brg.forEach(function(x){ if(x._di){ x._di=false; x.classList.remove('di-piring'); x._sel.appendChild(x); } });
    brg.filter(function(x){ return [a,b,c].indexOf(x._g)>-1; }).slice(0,3).forEach(function(x){ x._di=true; x.classList.add('di-piring'); tumpuk.appendChild(x); });
    hitung(); };
})();
