<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sans);color:var(--tinta)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.label-k{padding:6px 14px;border-radius:99px;font:700 12px var(--sans);letter-spacing:.04em;background:var(--kartu);color:var(--aksen2);box-shadow:0 2px 8px rgba(0,0,0,.12)}

.petunjuk{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:65;max-width:500px;margin:0 auto;background:var(--petunjuk-bg,#1E1E24);color:var(--petunjuk-teks,#F6F2EA);padding:11px 16px 11px 42px;border-radius:12px;font:14px/1.45 var(--sans);box-shadow:0 8px 22px rgba(0,0,0,.25);transition:opacity .25s,transform .25s}

/* Palet: sore hujan abu biru, teal halte, payung merah muda, aspal basah.
   Beda dari Pasar Malam (senja peach, biru malam, amber) dan Meja untuk Dua (taplak merah, krem, zaitun). */
body{background:linear-gradient(180deg,#7F93A6 0,#5E7488 55%,#4A5D70);transition:background 1.4s}
body.reda{background:linear-gradient(180deg,#F6C9A8 0,#D9B4B9 40%,#8FA6BC 100%)}
.hujan{position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(104deg,transparent 0 9px,rgba(230,240,250,.32) 9px 10px,transparent 10px 23px);background-size:200% 200%;animation:hujan .45s linear infinite;transition:opacity 1.4s}
.hujan.dua{background:repeating-linear-gradient(100deg,transparent 0 17px,rgba(230,240,250,.22) 17px 18px,transparent 18px 37px);animation-duration:.7s}
@keyframes hujan{from{background-position:0 0}to{background-position:-40px 160px}}
body.reda .hujan{opacity:0}
.judul{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25)}.judul small{color:#FFD3DF}
body.reda .judul{color:var(--tinta);text-shadow:none}body.reda .judul small{color:var(--payung2)}
.label-k{color:var(--teal2)}
.aspal{position:fixed;left:0;right:0;bottom:0;height:20vh;background:linear-gradient(180deg,#46525E,#2E3742);z-index:0}
.aspal::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#8A949E}
/* 1 · halte + payung */
.halte{position:relative;width:min(92vw,calc(var(--u)*92));height:calc(var(--u)*86);flex:none}
.atap{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*6);border-radius:calc(var(--u)*1);background:var(--teal);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.atap::after{content:"HALTE";position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*7);padding:2px 8px;border-radius:4px;background:#fff;font:800 10px var(--sans);letter-spacing:.2em;color:var(--teal2)}
.tiang-h{position:absolute;top:calc(var(--u)*6);bottom:0;width:calc(var(--u)*2);background:#2B3A44}.tiang-h.l{left:6%}.tiang-h.r{right:6%}
.bangku{position:absolute;left:14%;right:14%;bottom:calc(var(--u)*12);height:calc(var(--u)*3);border-radius:4px;background:#8C6A4A;box-shadow:0 calc(var(--u)*9) 0 calc(var(--u)*-1.2) #2B3A44}
.payung-w{position:absolute;left:50%;bottom:calc(var(--u)*4);width:calc(var(--u)*70);height:calc(var(--u)*72);margin-left:calc(var(--u)*-35)}
.batang{position:absolute;left:50%;bottom:0;width:calc(var(--u)*1.6);height:calc(var(--u)*64);margin-left:calc(var(--u)*-.8);background:#3A3A42;border-radius:2px;cursor:pointer}
.batang::after{content:"";position:absolute;left:calc(var(--u)*-3.4);bottom:calc(var(--u)*-1);width:calc(var(--u)*5);height:calc(var(--u)*5);border:calc(var(--u)*1.4) solid #3A3A42;border-top:0;border-left:0;border-radius:0 0 calc(var(--u)*3) 0}
.kanopi{position:absolute;left:50%;top:calc(var(--u)*6);width:calc(var(--u)*64);height:calc(var(--u)*24);margin-left:calc(var(--u)*-32);border-radius:50% 50% 6% 6%/100% 100% 6% 6%;background:repeating-conic-gradient(from 270deg at 50% 100%,var(--payung) 0 22.5deg,var(--payung2) 22.5deg 45deg);transform-origin:50% 100%;transform:scaleX(var(--b,.08)) scaleY(calc(.35 + var(--b,.08)*.65));box-shadow:0 8px 16px rgba(0,0,0,.2)}
.runner{position:absolute;left:50%;width:calc(var(--u)*7);height:calc(var(--u)*4.4);margin-left:calc(var(--u)*-3.5);border-radius:calc(var(--u)*1.2);background:#C9CDD6;bottom:calc(var(--u)*(12 + var(--b,.08)*34));touch-action:none;cursor:grab;box-shadow:0 2px 4px rgba(0,0,0,.3);z-index:3}
.runner.ajak{animation:ajakR 1.3s infinite}
@keyframes ajakR{50%{box-shadow:0 2px 4px rgba(0,0,0,.3),0 0 0 calc(var(--u)*2.4) rgba(232,100,138,.5)}}
.payung-w.tertutup .kanopi{transform:scaleX(.08) scaleY(.35) rotate(0)}
.payung-ket{position:absolute;left:0;right:0;bottom:calc(var(--u)*-8);text-align:center;font:700 calc(var(--u)*4.6) var(--tangan);color:#fff}
.payung-w.ajak{animation:ajakP 1.5s infinite}
@keyframes ajakP{50%{transform:rotate(-3deg)}}
.payung-w.miring{transform:rotate(8deg);transform-origin:50% 100%}
/* 2 · kaca berembun */
.kaca{position:relative;width:min(92vw,calc(var(--u)*90));border-radius:calc(var(--u)*1.6);background:linear-gradient(160deg,rgba(220,232,240,.55),rgba(160,180,196,.45));box-shadow:inset 0 0 0 calc(var(--u)*1.4) #2B3A44,0 10px 22px rgba(0,0,0,.25);padding:calc(var(--u)*6) calc(var(--u)*6);overflow:hidden}
.kaca ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*4)}
.kaca li{min-height:calc(var(--u)*16);display:flex;align-items:center;font:700 clamp(18px,calc(var(--u)*5.6),26px)/1.2 var(--tangan);color:#fff;text-shadow:0 1px 6px rgba(20,40,60,.5)}
.kaca canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:calc(var(--u)*1.6)}
.kaca-ket{font:700 calc(var(--u)*4.6) var(--tangan);color:#fff;animation:usap 1.6s infinite}
@keyframes usap{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
/* 3 · genangan */
.genangan-g{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4) calc(var(--u)*5);width:min(92vw,calc(var(--u)*92))}
.gn{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.6);border:0;background:none;padding:0;cursor:pointer}
.gn .foto-g{display:block;border:calc(var(--u)*1) solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.3);opacity:0;transform:translateY(calc(var(--u)*10)) scaleY(.2);transform-origin:50% 100%;transition:.7s cubic-bezier(.3,1.3,.5,1);background:#ccd}
.gn .foto-g.T{height:calc(var(--u)*36);aspect-ratio:3/4}.gn .foto-g.R{width:calc(var(--u)*40);aspect-ratio:4/3}
.gn .air{position:relative;width:calc(var(--u)*40);height:calc(var(--u)*11);border-radius:50%;overflow:hidden;background:radial-gradient(ellipse,#6F8599,#3E5063);box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.gn .air img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleY(-1);filter:blur(4px) saturate(.6);opacity:.55}
.gn .air::after{content:"";position:absolute;inset:20% 25%;border:2px solid rgba(255,255,255,.5);border-radius:50%;animation:riak 1.6s ease-out infinite}
@keyframes riak{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.gn p{margin:0;max-width:calc(var(--u)*42);font:700 clamp(14px,calc(var(--u)*4.2),18px)/1.1 var(--tangan);color:#fff;text-align:center;opacity:0;transition:.5s .4s}
.gn.buka .foto-g{opacity:1;transform:none}.gn.buka p{opacity:1}.gn.buka .air::after{animation:none;opacity:0}
.gn:not(.buka) .air{box-shadow:inset 0 2px 8px rgba(0,0,0,.4),0 0 0 3px rgba(255,179,200,.55)}
/* 4 · perahu kertas di selokan */
.selokan{position:relative;width:min(92vw,calc(var(--u)*92));height:calc(var(--u)*30);border-radius:calc(var(--u)*2);background:linear-gradient(180deg,#5D7488,#3E5063);overflow:hidden;box-shadow:inset 0 4px 10px rgba(0,0,0,.4),0 0 0 calc(var(--u)*2) #8A949E;flex:none}
.selokan::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.14) 30px 46px,transparent 46px 80px);animation:alir 2.2s linear infinite}
@keyframes alir{to{background-position:80px 0}}
.perahu{position:absolute;left:50%;top:calc(var(--u)*4);width:calc(var(--u)*28);height:calc(var(--u)*16);margin-left:calc(var(--u)*-14);touch-action:none;cursor:grab;animation:apung 2.4s ease-in-out infinite;z-index:3}
.perahu svg{width:100%;height:100%;overflow:visible}
@keyframes apung{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(4px) rotate(3deg)}}
.perahu-ket{font:700 calc(var(--u)*4.6) var(--tangan);color:#fff;animation:geserU 1.3s infinite}
@keyframes geserU{50%{transform:translateY(-6px)}}
.surat-p{display:none;width:min(90vw,calc(var(--u)*88));max-height:62vh;overflow-y:auto;padding:calc(var(--u)*6);background:var(--kartu);border-radius:calc(var(--u)*1);box-shadow:0 12px 26px rgba(0,0,0,.3);background-image:linear-gradient(135deg,transparent 49.6%,rgba(0,0,0,.05) 50%,transparent 50.4%),linear-gradient(45deg,transparent 49.6%,rgba(0,0,0,.05) 50%,transparent 50.4%);transform-origin:50% 0}
.surat-p.tampil{display:block;animation:buka .8s cubic-bezier(.3,1.2,.5,1)}
@keyframes buka{from{transform:scaleY(.15) scaleX(.5);opacity:0}}
.surat-p p{margin:0 0 calc(var(--u)*3);font:500 clamp(15px,calc(var(--u)*4.3),19px)/1.6 var(--serif);color:var(--tinta);opacity:0;transform:translateY(6px);transition:.6s}
.surat-p p.tampil{opacity:1;transform:none}
.surat-p .ttd-s{text-align:right;font:700 calc(var(--u)*6) var(--tangan);color:var(--payung2);opacity:0;transition:.5s}
.surat-p .ttd-s.tampil{opacity:1}
/* 5 · bus datang */
.bus{position:relative;width:min(92vw,calc(var(--u)*92));height:calc(var(--u)*44);border-radius:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*2) calc(var(--u)*2);background:linear-gradient(180deg,#F2F4F6,#D9DEE3);box-shadow:0 12px 24px rgba(0,0,0,.3);transform:translateX(130%);transition:transform 1.6s cubic-bezier(.2,.8,.3,1);flex:none}
.bus.tiba{transform:none}
.bus .papan-t{position:absolute;left:6%;right:6%;top:calc(var(--u)*3);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);border-radius:calc(var(--u)*1);background:#141A20;font:700 clamp(12px,calc(var(--u)*3.6),15px)/1.35 var(--sans);color:#FFB547;text-align:center;letter-spacing:.04em;text-shadow:0 0 6px rgba(255,181,71,.6)}
.bus .jendela-b{position:absolute;left:6%;right:30%;top:calc(var(--u)*20);height:calc(var(--u)*12);border-radius:calc(var(--u)*1.4);background:linear-gradient(160deg,#9FC3DA,#6E93AE)}
.bus .pintu-b{position:absolute;right:8%;top:calc(var(--u)*18);bottom:calc(var(--u)*5);width:18%;border-radius:calc(var(--u)*1);background:linear-gradient(90deg,#6E93AE 0 48%,#2B3A44 48% 52%,#6E93AE 52%)}
.bus .roda{position:absolute;bottom:calc(var(--u)*-4.4);width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;background:radial-gradient(circle,#9AA2AA 0 30%,#1E242A 31%)}
.bus .roda.a{left:14%}.bus .roda.b{right:18%}
.pilih-b{display:flex;flex-direction:column;gap:calc(var(--u)*2.4);width:min(84vw,calc(var(--u)*80))}
.pilih-b button{border:0;border-radius:99px;padding:calc(var(--u)*3) calc(var(--u)*5);font:700 clamp(14px,calc(var(--u)*4.2),18px) var(--sans);cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.2);text-align:center}

.pilih-b .naik{background:var(--payung);color:#fff}.pilih-b .berikut{background:#fff;color:var(--teal2)}.pilih-b .nanti{background:rgba(255,255,255,.55);color:var(--tinta)}

@media (min-aspect-ratio:1/1){
  #s0,#s1,#s3,#s4{flex-direction:row;gap:calc(var(--u)*8)}

  .genangan-g{grid-template-columns:repeat(4,1fr);width:min(90vw,calc(var(--u)*170))}

}
.kol{display:contents}
@media (min-aspect-ratio:1/1){ .kol{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)} }

.memuat{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#4A5D70;transition:opacity .4s}
