<style>
:root{
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --tangan:'Caveat',cursive;
  --u:min(1vw,.5vh);
  --paku:#E0483A; --gabus:#B5865A; --kartu:#FFFFFF; --tinta:#2B2B2E; --redup:#6E6A63; --aksen:#E0483A; --aksen2:#2B2B2E; --petunjuk-bg:#2B2B2E; --petunjuk-tebal:#C9F55E;
}
@media (min-aspect-ratio:1/1){ :root{ --u:min(.62vw,.92vh); } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sans);color:var(--tinta)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
.kepala{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 54px 6px;pointer-events:none}
.label-k{padding:6px 14px;border-radius:99px;font:700 12px var(--sans);letter-spacing:.04em;background:var(--kartu);color:var(--aksen2);box-shadow:0 2px 8px rgba(0,0,0,.12)}
#music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:41;border:0;width:34px;height:34px;border-radius:50%;background:var(--kartu);color:var(--tinta);font-size:15px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.petunjuk{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:65;max-width:500px;margin:0 auto;background:var(--petunjuk-bg,#1E1E24);color:var(--petunjuk-teks,#F6F2EA);padding:11px 16px 11px 42px;border-radius:12px;font:14px/1.45 var(--sans);box-shadow:0 8px 22px rgba(0,0,0,.25);transition:opacity .25s,transform .25s}
.petunjuk::before{content:"";position:absolute;left:16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--aksen);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.petunjuk b{color:var(--petunjuk-tebal,#FFD98A)}
.petunjuk.ganti{opacity:0;transform:translateY(6px)}
.petunjuk.kedip{animation:kedip .45s}
@keyframes kedip{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#lanjut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:70;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:.4s;border:0;border-radius:99px;padding:13px 24px;font:700 15px var(--sans);color:var(--aksen-teks,#fff);background:var(--aksen);box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
#lanjut::after{content:"  ›"}
#lanjut.tampil{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3.4);opacity:0;pointer-events:none;z-index:5}
.sc.aktif{opacity:1;pointer-events:auto}
.judul{margin:0;text-align:center;font:600 calc(var(--u)*6.4)/1.12 var(--serif);color:var(--tinta);opacity:0;transform:translateY(8px);transition:.6s;padding:0 16px}
.judul small{display:block;margin-top:6px;font:700 calc(var(--u)*5.4) var(--tangan);color:var(--aksen)}
.judul.tampil{opacity:1;transform:none}
.akhir{width:min(92vw,calc(var(--u)*86));background:var(--kartu);color:var(--tinta);border-radius:calc(var(--u)*2.4);padding:16px;display:none;flex-direction:column;gap:10px;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.akhir.tampil{display:flex;animation:muncul .7s ease}
@keyframes muncul{from{opacity:0;transform:translateY(12px)}}
.akhir h3{margin:0;font:600 20px/1.2 var(--serif);color:var(--aksen2)}
.akhir textarea{width:100%;min-height:76px;border:1.5px solid rgba(0,0,0,.12);border-radius:10px;padding:10px 12px;font:15px var(--sans);resize:none;background:#fff;color:var(--tinta);user-select:text;-webkit-user-select:text}
.akhir .aksi{display:flex;flex-direction:column;gap:8px}
.akhir .aksi a,.akhir .aksi button,.akhir .ulang{border:0;border-radius:99px;padding:12px;font:700 14px var(--sans);text-align:center;text-decoration:none;cursor:pointer}
.t-utama{background:var(--aksen);color:var(--aksen-teks,#fff)}.t-wa{background:#25D366;color:#073b1c}.ulang{background:transparent;color:var(--aksen2);box-shadow:inset 0 0 0 1.5px var(--aksen2)}
.dibuat{font-size:12px;color:var(--redup);text-align:center;text-decoration:none}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important} }
.dibawa{position:fixed!important;z-index:80!important;margin:0!important;transition:none!important;animation:none!important}


/* Palet: papan gabus, kertas putih, tinta grafit, stabilo hijau, paku merah, post-it merah muda/mint/lila.
   Beda dari Garis Finis (biru malam, kuning limau, jingga, toska) dan Tumpeng Syukuran (daun pisang, kunyit, bambu). */
body{background:linear-gradient(180deg,#E9E4DA,#D8D1C3)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 2px,transparent 2px 70px)}
.judul{color:var(--tinta)}.judul small{color:var(--paku)}
.label-k{color:var(--tinta)}
.ket-p{font:700 calc(var(--u)*4.8) var(--tangan);color:var(--paku);text-align:center}
.gabus{position:relative;width:min(94vw,calc(var(--u)*94));flex:none;padding:calc(var(--u)*4);border-radius:calc(var(--u)*1.4);
  background:radial-gradient(circle at 20% 30%,rgba(0,0,0,.12) 0 1px,transparent 1.5px) 0 0/7px 6px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.18) 0 1px,transparent 1.5px) 0 0/9px 8px,linear-gradient(135deg,#C29466,#A97A4D);
  box-shadow:inset 0 0 0 calc(var(--u)*2.2) #7A5634,0 10px 24px rgba(0,0,0,.25)}
.paku-i{position:absolute;width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8A7D,var(--paku) 60%,#9E2A20);box-shadow:1px 2px 3px rgba(0,0,0,.4);z-index:3}
/* daftar pengumuman */
.kertas{position:relative;background:#fff;padding:calc(var(--u)*4) calc(var(--u)*4) calc(var(--u)*3);box-shadow:0 4px 10px rgba(0,0,0,.25);transform:rotate(-.6deg)}
.kertas h4{margin:0;text-align:center;font:800 calc(var(--u)*3.4) var(--sans);letter-spacing:.14em;color:var(--tinta)}
.kertas h5{margin:2px 0 calc(var(--u)*2.4);text-align:center;font:500 calc(var(--u)*2.8) var(--sans);color:var(--redup)}
.baris-p{position:relative;display:flex;gap:calc(var(--u)*2.4);align-items:center;padding:calc(var(--u)*1.1) calc(var(--u)*1.4);border-bottom:1px solid #EEE;font:500 calc(var(--u)*3.1) ui-monospace,Menlo,monospace;color:#555}
.baris-p .sensor{flex:1;height:calc(var(--u)*2);border-radius:2px;background:#E4E4E4}
.baris-p .nm{flex:1;font:800 calc(var(--u)*3.4) var(--sans);color:var(--tinta);letter-spacing:.04em}
.baris-p .st{font:700 calc(var(--u)*2.6) var(--sans);color:#999}
.baris-p.dia .st{color:var(--tinta)}
.baris-p .stabilo{position:absolute;left:0;top:12%;height:76%;width:0;background:rgba(184,240,60,.75);mix-blend-mode:multiply;border-radius:2px;transition:width .08s}
.baris-p.ketemu{background:rgba(255,236,150,.45)}
.penggaris{position:absolute;left:calc(var(--u)*1);right:calc(var(--u)*1);height:calc(var(--u)*5.6);z-index:5;touch-action:none;cursor:grab;border-radius:3px;
  background:repeating-linear-gradient(90deg,#3A3A3A 0 1px,transparent 1px calc(var(--u)*2.4)) 0 0/100% 40% no-repeat,linear-gradient(rgba(255,255,255,.55),rgba(220,235,245,.55));
  box-shadow:0 0 0 1.5px rgba(60,60,60,.5),0 4px 8px rgba(0,0,0,.2)}
.penggaris.ajak{animation:ajakG 1.3s infinite}@keyframes ajakG{50%{margin-top:6px}}
.stb{position:absolute;z-index:6;width:calc(var(--u)*20);height:calc(var(--u)*6);touch-action:none;cursor:grab;display:none}
.stb::before{content:"";position:absolute;left:0;top:10%;width:78%;height:80%;border-radius:3px 6px 6px 3px;background:linear-gradient(#C9F55E,#9ED62A);box-shadow:0 3px 6px rgba(0,0,0,.25)}
.stb::after{content:"";position:absolute;right:0;top:25%;width:24%;height:50%;background:#8BC21C;clip-path:polygon(0 0,100% 30%,100% 70%,0 100%)}
.stb.tampil{display:block;animation:ajakS 1.2s infinite}@keyframes ajakS{50%{margin-left:8px}}
/* post-it */
.blok-n{position:relative;width:calc(var(--u)*40);height:calc(var(--u)*40);flex:none}
.notes{position:absolute;inset:0;border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 6px 12px rgba(0,0,0,.2);display:grid;place-items:center;font:700 calc(var(--u)*5) var(--tangan);color:rgba(0,0,0,.45);touch-action:none;cursor:grab}
.notes.ajak{animation:ajakN 1.3s infinite}@keyframes ajakN{50%{transform:translateY(-6px) rotate(-2deg)}}
.notes.c0{background:#FFB7C9}.notes.c1{background:#AEEBD0}.notes.c2{background:#CFC2F5}
.dinding-n{display:flex;flex-direction:column;gap:calc(var(--u)*2.6);width:min(90vw,calc(var(--u)*88))}
.tempel{position:relative;padding:calc(var(--u)*3.4) calc(var(--u)*4);border-radius:2px;box-shadow:0 6px 12px rgba(0,0,0,.2);font:700 clamp(18px,calc(var(--u)*5.4),24px)/1.2 var(--tangan);color:#2B2B2E;animation:tempel .6s cubic-bezier(.3,1.4,.5,1)}
.tempel:nth-child(1){transform:rotate(-1.5deg)}.tempel:nth-child(2){transform:rotate(1.2deg);margin-left:6%}.tempel:nth-child(3){transform:rotate(-.8deg)}
@keyframes tempel{from{transform:translateY(calc(var(--u)*30)) scale(.6);opacity:0}}
.tempel::before{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8A7D,#E0483A 60%,#9E2A20)}
/* foto di balik brosur */
.foto-p{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*3.4);align-items:center;justify-items:center;width:min(94vw,calc(var(--u)*94))}
.kartu-f{position:relative;background:#fff;padding:calc(var(--u)*1.6) calc(var(--u)*1.6) calc(var(--u)*1);box-shadow:0 5px 12px rgba(0,0,0,.28)}
.kartu-f:nth-child(odd){transform:rotate(-2deg)}.kartu-f:nth-child(even){transform:rotate(2deg)}
.kartu-f img{display:block;background:#ccc}.kartu-f img.T{height:calc(var(--u)*40);aspect-ratio:3/4}.kartu-f img.R{width:calc(var(--u)*42);aspect-ratio:4/3}
.kartu-f p{margin:4px 0 0;max-width:calc(var(--u)*42);font:700 clamp(14px,calc(var(--u)*4.1),18px)/1.1 var(--tangan);color:#2B2B2E;text-align:center}
.brosur{position:absolute;inset:-4%;z-index:2;touch-action:none;cursor:grab;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:8%;text-align:center;
  font:800 calc(var(--u)*3.4)/1.15 var(--sans);letter-spacing:.04em;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .5s,opacity .5s}
.brosur small{font:600 calc(var(--u)*2.6) var(--sans);letter-spacing:0;opacity:.75}
.brosur em{font:700 calc(var(--u)*4.2) var(--tangan);font-style:normal;opacity:.9}
.brosur.b0{background:#FFE7A3;color:#6B4A00}.brosur.b1{background:#BDE3FF;color:#0D3C61}.brosur.b2{background:#FFD0C2;color:#7A2410}.brosur.b3{background:#D8F0C0;color:#2E5512}
.brosur.lepas{opacity:0;pointer-events:none}
/* amplop resmi */
.amplop{position:relative;width:min(88vw,calc(var(--u)*84));height:calc(var(--u)*46);flex:none;background:linear-gradient(#F4EEE2,#E8DFCC);box-shadow:0 10px 22px rgba(0,0,0,.25);border-radius:3px}
.amplop .kop{position:absolute;left:6%;top:12%;font:800 calc(var(--u)*3) var(--sans);letter-spacing:.16em;color:var(--redup)}
.amplop .kpd{position:absolute;right:8%;bottom:16%;text-align:right;font:500 calc(var(--u)*3) var(--sans);color:var(--redup)}
.amplop .kpd b{display:block;font:600 calc(var(--u)*5.4) var(--serif);color:var(--tinta)}
.amplop .jalur{position:absolute;left:0;right:0;top:calc(var(--u)*-1);height:calc(var(--u)*5);border-top:2px dashed #B9AE97}
.tab-s{position:absolute;left:calc(var(--u)*-2);top:calc(var(--u)*-3.4);width:calc(var(--u)*14);height:calc(var(--u)*7);z-index:3;touch-action:none;cursor:grab;border-radius:3px;background:var(--paku);color:#fff;display:grid;place-items:center;font:800 calc(var(--u)*2.6) var(--sans);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.tab-s.ajak{animation:ajakT 1.2s infinite}@keyframes ajakT{50%{margin-left:8px}}
.sobek{position:absolute;left:0;top:calc(var(--u)*-1);height:calc(var(--u)*5);width:0;background:#D8D1C3;z-index:2}
.surat-r{display:none;width:min(90vw,calc(var(--u)*88));max-height:62vh;overflow-y:auto;background:#fff;padding:calc(var(--u)*6);box-shadow:0 12px 26px rgba(0,0,0,.25)}
.surat-r.tampil{display:block;animation:muncul .8s ease}
.surat-r .kepala-r{text-align:center;border-bottom:2px solid var(--tinta);padding-bottom:calc(var(--u)*2);margin-bottom:calc(var(--u)*3)}
.surat-r .kepala-r b{display:block;font:800 calc(var(--u)*3.6) var(--sans);letter-spacing:.16em}
.surat-r .kepala-r span{font:500 calc(var(--u)*2.8) var(--sans);color:var(--redup)}
.surat-r p{margin:0 0 calc(var(--u)*3);font:500 clamp(15px,calc(var(--u)*4.3),19px)/1.6 var(--serif);color:var(--tinta);opacity:0;transform:translateY(6px);transition:.6s}
.surat-r p.tampil{opacity:1;transform:none}
.surat-r .ttd-r{text-align:right;font:500 13px var(--sans);color:var(--redup);opacity:0;transition:.5s}
.surat-r .ttd-r b{display:block;font:700 calc(var(--u)*6.4) var(--tangan);color:var(--tinta)}
.surat-r .ttd-r.tampil{opacity:1}
.surat-r{position:relative}
.cap{position:absolute;left:8%;bottom:calc(var(--u)*6);padding:4px 14px;border:3px solid var(--paku);border-radius:6px;font:800 calc(var(--u)*6) var(--sans);letter-spacing:.12em;color:var(--paku);transform:rotate(-12deg) scale(2.2);opacity:0;mix-blend-mode:multiply;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .15s}
.cap.jatuh{opacity:.85;transform:rotate(-12deg) scale(1)}
.stempel-b{border:0;cursor:pointer;width:calc(var(--u)*18);height:calc(var(--u)*20);flex:none;position:relative;background:none}
.stempel-b::before{content:"";position:absolute;left:30%;top:0;width:40%;height:56%;border-radius:40% 40% 8px 8px;background:linear-gradient(90deg,#5A3A22,#8A5E3A,#5A3A22)}
.stempel-b::after{content:"";position:absolute;left:5%;right:5%;bottom:10%;height:30%;border-radius:4px;background:linear-gradient(#3A3A3A,#1E1E1E);box-shadow:0 4px 0 var(--paku)}
.stempel-b.ajak{animation:ajakSt 1.2s infinite}@keyframes ajakSt{50%{transform:translateY(-6px)}}
.stempel-b span{position:absolute;left:50%;top:104%;transform:translateX(-50%);white-space:nowrap;font:700 calc(var(--u)*4.4) var(--tangan);color:var(--paku)}
.akhir h3{color:var(--tinta)}
#s4 .akhir{display:none}#s4 .akhir.tampil{display:flex}
@media (min-aspect-ratio:1/1){
  #s0,#s1,#s2,#s3,#s4{flex-direction:row;gap:calc(var(--u)*8)}
  .gabus{width:calc(var(--u)*96)}
  .foto-p{grid-template-columns:repeat(4,auto);width:auto}
  .kartu-f img.T{height:calc(var(--u)*40)}.kartu-f img.R{width:calc(var(--u)*44)}
  .surat-r{max-height:calc(100vh - 150px)}
}
.kol{display:contents}
@media (min-aspect-ratio:1/1){ .kol{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)} }

.memuat{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#E9E4DA;transition:opacity .4s}
.memuat.pergi{opacity:0;pointer-events:none}
.memuat p{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#2B2B2E;font-size:15px;text-align:center;padding:24px;max-width:22rem;line-height:1.6}
</style>

<div id="memuat" class="memuat"><p id="memuatPesan">Menempel pengumumannya…</p></div>
<header class="kepala"><div class="label-k" id="labelK">papan pengumuman</div></header>
<button id="music" type="button" aria-label="Suara">🔊</button>
<div class="petunjuk" id="petunjuk"></div>
<button id="lanjut" type="button">Lanjut</button>

<section class="sc" id="s0">
  <div class="kol"><p class="judul" id="judulAwal"></p><span class="ket-p" id="ketAwal">ketuk papannya</span></div>
  <div class="gabus" id="gabus0"><span class="paku-i" style="left:47%;top:1.4%"></span>
    <div class="kertas" id="kertasP"><h4>PENGUMUMAN HASIL AKHIR</h4><h5 id="subP"></h5><div id="daftarP"></div>
      <div class="penggaris" id="penggaris" hidden></div><div class="stb" id="stb"></div></div></div>
</section>
<section class="sc" id="s1">
  <div class="kol"><p class="judul" id="judulNote"></p><div class="blok-n" id="blokN"></div><span class="ket-p" id="ketNote">tarik kertasnya ke atas ↑</span></div>
  <div class="dinding-n" id="dindingN"></div>
</section>
<section class="sc" id="s2">
  <p class="judul" id="judulFoto"></p>
  <div class="foto-p" id="fotoP"></div>
</section>
<section class="sc" id="s3">
  <div class="kol"><p class="judul" id="judulSurat"></p>
  <div class="amplop" id="amplop"><div class="jalur"></div><div class="sobek" id="sobek"></div><div class="tab-s ajak" id="tabS">sobek →</div><div class="kop">PENTING · RAHASIA</div><div class="kpd" id="kpdA"></div></div></div>
  <div class="surat-r" id="suratR"><div class="kepala-r"><b>SURAT UCAPAN SELAMAT</b><span id="nomorR"></span></div><div id="isiR"></div><div class="ttd-r" id="ttdR"></div><div class="cap" id="cap">SELAMAT!</div></div>
