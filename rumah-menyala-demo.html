/* Palet: hijau cemara tua, merah cranberry, emas hangat, putih salju,
   kayu. Satu malam Natal di rumahnya — tidak dipakai tema lain. */
:root{
  --cemara:#16392B; --cemara2:#1F4D3A; --merah:#A8323E; --merah2:#7E2230; --emas:#E8B64C; --emas2:#FFD98A; --salju:#F6F3EC; --kayu:#6B4426; --ink:#1A1512; --muted:#6B625A;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;

body.hangat .cahaya-hangat{background:radial-gradient(60% 50% at 50% 60%,rgba(255,200,110,.22),transparent 70%)}

/* kepala: enam bola hiasan sebagai kemajuan */
.kepala{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 6px}

.bola i.ok{background:radial-gradient(circle at 35% 30%,#ffb3b9,var(--merah));box-shadow:0 0 8px rgba(232,182,76,.6)}
.bola i.kini{background:radial-gradient(circle at 35% 30%,var(--emas2),var(--emas))}
#music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:41;border:0;width:34px;height:34px;border-radius:50%;background:rgba(246,243,236,.12);color:var(--salju);font-size:15px;cursor:pointer}

/* petunjuk = label kado bertali di bawah */
.petunjuk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:39;transform:translateX(-50%);max-width:min(90vw,520px);
  background:var(--salju);color:var(--ink);padding:10px 18px 10px 34px;border-radius:6px 14px 14px 6px;font-size:14px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .25s}
.petunjuk::before{content:"";position:absolute;left:12px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--merah)}
.petunjuk::after{content:"";position:absolute;left:-28px;top:50%;width:30px;height:2px;background:var(--emas);transform:rotate(-12deg)}
.petunjuk b{color:var(--merah)}
.petunjuk.ganti{opacity:0}
.petunjuk.kedip{animation:kedip .45s 2}

  border:0;border-radius:99px;padding:13px 28px;font:700 15px var(--sans);color:#fff;background:linear-gradient(180deg,#c0414e,var(--merah2));box-shadow:0 0 0 3px var(--emas),0 8px 20px rgba(0,0,0,.35);cursor:pointer}

/* adegan: larut lewat cahaya hangat */
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 44px);bottom:calc(env(safe-area-inset-bottom) + 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);

.depan{position:relative;width:calc(var(--u)*76);height:calc(var(--u)*104)}

.kusen{position:absolute;left:calc(var(--u)*14);right:calc(var(--u)*22);top:calc(var(--u)*18);bottom:0;background:#3a2414;border-radius:calc(var(--u)*20) calc(var(--u)*20) 0 0;perspective:calc(var(--u)*200)}

function musicBox(){
  var a=ac(); if(!a) return null;
  var gain=a.createGain(); gain.gain.value=.11; gain.connect(a.__out||a.destination);
  var notes=[72,76,79,84,79,76, 74,77,81,86,81,77, 72,76,79,83,79,76, 71,74,79,83,86,83];
  var step=.34, t0=a.currentTime+.1, n=0, timer=null, berhenti=false;
  function ping(midi,t){
    var o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=440*Math.pow(2,(midi-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.4);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t+1.5);
  }
  (function loop(){
    if(berhenti) return;
    if(t0<a.currentTime) t0=a.currentTime+.05; while(t0 < a.currentTime + 2){ ping(notes[n%notes.length],t0); t0+=step; n++; }
    timer=setTimeout(loop,300);
  })();
  return { gain:gain, stop:function(){ berhenti=true; clearTimeout(timer); } };
}

/* satu gestur seret: down / move(dx,dy) / up(dx,dy); boleh() mengunci */
function seret(node,o){
  var pid=null,sx=0,sy=0; noMenu(node);
  node.addEventListener('pointerdown',function(e){
    if(pid!==null || (o.boleh && !o.boleh())) return;
    pid=e.pointerId; sx=e.clientX; sy=e.clientY;
    try{ node.setPointerCapture(pid); }catch(_){}
    e.preventDefault(); ac(); if(o.down) o.down(e);
  });
  node.addEventListener('pointermove',function(e){ if(e.pointerId===pid && o.move) o.move(e,e.clientX-sx,e.clientY-sy); });
  function lepas(e){ if(e.pointerId!==pid) return; pid=null; if(o.up) o.up(e,e.clientX-sx,e.clientY-sy); }
  node.addEventListener('pointerup',lepas); node.addEventListener('pointercancel',lepas);
}
/* benda dibawa jari ke mana saja (pindah ke lapisan atas selama diseret) */

    down:function(e){ var r=node.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; lw=node.style.width; lh=node.style.height;
      ruang=el('div'); ruang.style.cssText='visibility:hidden;flex:none;width:'+r.width+'px;height:'+r.height+'px;margin:'+getComputedStyle(node).margin;
      node.parentNode.insertBefore(ruang,node); node.style.width=r.width+'px'; node.style.height=r.height+'px';
      node.classList.add('dibawa'); document.body.appendChild(node); try{ node.setPointerCapture(e.pointerId); }catch(_){} node.style.left=r.left+'px'; node.style.top=r.top+'px'; if(o.down) o.down(e); },
    move:function(e){ node.style.left=(e.clientX-ox)+'px'; node.style.top=(e.clientY-oy)+'px'; if(o.move) o.move(e); },
    up:function(e){ var hasil=o.up?o.up(e):false;

(function(){
  var C=4, R=5, papan=$('#papanUbin'), pk=$('#pohonKecil'), DX=[0,1,0,-1], DY=[-1,0,1,0], sel=[], beres=false;
  pk.innerHTML=pohonSvg();
  papan.style.gridTemplateColumns='repeat('+C+',calc(var(--u)*15))';
  /* jalur acak yang pasti bisa: dari kiri-bawah (masuk dari barat) ke kanan-atas (keluar ke utara) */
  function cariJalur(){
    var seen={}, jalur=[];
    function dfs(x,y){ seen[x+','+y]=1; jalur.push([x,y]); if(x===C-1&&y===0) return true;
      var d=[0,1,2,3].sort(function(){ return Math.random()-.5; });
      for(var i=0;i<4;i++){ var nx=x+DX[d[i]], ny=y+DY[d[i]]; if(nx<0||ny<0||nx>=C||ny>=R||seen[nx+','+ny]) continue; if(dfs(nx,ny)) return true; }
      jalur.pop(); return false; }
    dfs(0,R-1); return jalur;
  }
  var jalur=cariJalur(), dalamJalur={};
  jalur.forEach(function(p,i){
    var masuk = i===0 ? 3 : arahDari(jalur[i-1],p), keluar = i===jalur.length-1 ? 0 : arahKe(p,jalur[i+1]);
    dalamJalur[p[0]+','+p[1]]=[masuk,keluar];
  });
  function arahKe(a,b){ for(var d=0;d<4;d++) if(a[0]+DX[d]===b[0]&&a[1]+DY[d]===b[1]) return d; }
  function arahDari(a,b){ return (arahKe(a,b)+2)%4; }
  function sambungan(t){ return t.jenis==='I'?[t.r%4,(t.r+2)%4]:[t.r%4,(t.r+1)%4]; }
  for(var y=0;y<R;y++) for(var x=0;x<C;x++){
    var j=dalamJalur[x+','+y], t={x:x,y:y};
    if(j){ var lurus=(j[0]+2)%4===j[1]; t.jenis=lurus?'I':'L';
      var benar; if(lurus) benar=Math.min(j[0],j[1])%2; else { var a=j[0],b=j[1]; benar=((a+1)%4===b)?a:b; }
      t.r=(benar+1+Math.floor(Math.random()*3))%4; }
    else { t.jenis=Math.random()<.5?'I':'L'; t.r=Math.floor(Math.random()*4); }
    var b=el('button','ubin'); b.type='button';
    b.innerHTML=t.jenis==='I'
      ?'<svg viewBox="0 0 100 100"><path class="kabel" d="M50 0 L50 100"/><circle class="bohlam" cx="50" cy="32" r="8"/><circle class="bohlam" cx="50" cy="68" r="8"/></svg>'
      :'<svg viewBox="0 0 100 100"><path class="kabel" d="M50 0 L50 30 Q50 50 70 50 L100 50"/><circle class="bohlam" cx="56" cy="44" r="8"/></svg>';
    t.el=b; t.rot=t.r*90; b.firstChild.style.transform='rotate('+t.rot+'deg)';
    (function(t){ b.addEventListener('click',function(){ if(beres) return; t.r=(t.r+1)%4; t.rot+=90; t.el.firstChild.style.transform='rotate('+t.rot+'deg)'; SFX.ubin(); cek(); }); })(t);
    noMenu(b); papan.appendChild(b); sel.push(t);
  }
  var col=el('div','colokan','🔌'); col.style.left='calc(var(--u)*-6)'; col.style.top='calc(var(--u)*2.4 + '+(R-1)+' * (var(--u)*15 + 3px) + var(--u)*4)'; papan.appendChild(col);
  var uj=el('div','ujung','🎄'); uj.style.left='calc(var(--u)*2.4 + '+(C-1)+' * (var(--u)*15 + 3px) + var(--u)*4)'; uj.style.top='calc(var(--u)*-6)'; papan.appendChild(uj);
  function ambil(x,y){ return sel[y*C+x]; }
  function cek(){
    var nyala={}, antri=[], awal=ambil(0,R-1);
    if(sambungan(awal).indexOf(3)>-1){ antri.push(awal); nyala['0,'+(R-1)]=1; }
    while(antri.length){ var t=antri.shift(); sambungan(t).forEach(function(d){ var nx=t.x+DX[d], ny=t.y+DY[d]; if(nx<0||ny<0||nx>=C||ny>=R) return; var n=ambil(nx,ny);
      if(!nyala[nx+','+ny] && sambungan(n).indexOf((d+2)%4)>-1){ nyala[nx+','+ny]=1; antri.push(n); } }); }
    sel.forEach(function(t){ t.el.classList.toggle('nyala',!!nyala[t.x+','+t.y]); });
    var akhir=ambil(C-1,0);
    if(nyala[(C-1)+',0'] && sambungan(akhir).indexOf(0)>-1) selesai();
  }
  MASUK[1]=function(){ cek(); petunjuk('Kabel lampunya kusut. <b>Ketuk ubin untuk memutarnya</b> sampai listrik dari colokan 🔌 sampai ke pohon 🎄.'); };
  var dibaca=0, ornamen=[];
  function selesai(){
    beres=true; SFX.menang(); buzz([20,40,20]); pk.classList.add('nyala'); papan.style.transition='opacity .6s'; papan.style.opacity='.55';
