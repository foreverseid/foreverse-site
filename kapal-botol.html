  function lepas(e){ if(e.pointerId!==pid) return; pid=null; if(o.up) o.up(e,e.clientX-sx,e.clientY-sy); }
  node.addEventListener('pointerup',lepas); node.addEventListener('pointercancel',lepas);

/* layar: [tiang, posisi] untuk tiap slot foto; mendatar → layar bawah, tegak → layar atas */
var LAYAR=$$('.layar'); /* urutan DOM: t1 atas, t1 bawah, t2 atas, t2 bawah */
var PASANG=[]; (function(){ var bawah=[LAYAR[1],LAYAR[3]], atas=[LAYAR[0],LAYAR[2]], cad=[];
  FOTO.slice(0,4).forEach(function(f){ var w=f.bentuk==='R'?bawah:atas; var l=w.shift()||null; if(l) PASANG.push({f:f,l:l}); else cad.push(f); });
  cad.forEach(function(f){ var l=bawah.shift()||atas.shift(); if(l){ l.classList.toggle('paksa',true); PASANG.push({f:f,l:l}); } });
  PASANG.forEach(function(p){ var im=el('img'); pasFoto(im,p.f); p.l.appendChild(im); });
  /* urutkan naik dari depan ke belakang: tiang 1 dulu */
  PASANG.sort(function(a,b){ return LAYAR.indexOf(a.l)-LAYAR.indexOf(b.l); });
  /* layar bawah dulu baru atas, biar tiap tiang terisi dari bawah */
  PASANG.sort(function(a,b){ var ia=LAYAR.indexOf(a.l), ib=LAYAR.indexOf(b.l); var ta=ia<2?0:1, tb=ib<2?0:1; if(ta!==tb) return ta-tb; return (a.l.classList.contains('bawah')?0:1)-(b.l.classList.contains('bawah')?0:1); });
})();

var URUT=['s0','s3','s4']; if(String(D.rahasia||'').trim()) URUT.push('s5'); URUT.push('s6');
var TAHAP=['gabus','kapal','benang'].concat(URUT.slice(1));
var maju=$('#maju'); maju.innerHTML=TAHAP.map(function(){ return '<i></i>'; }).join('');
var tahapKe=0; function tandai(n){ tahapKe=n; $$('i',maju).forEach(function(b,i){ b.classList.toggle('ok',i<n); }); }
var MASUK={}, kini=null;
function ke(id){ if(kini){ var l=$('#'+kini); l.classList.remove('aktif'); l.classList.add('lewat'); }
  kini=id; var s=$('#'+id); s.classList.remove('lewat'); s.classList.add('aktif'); if(MASUK[id]) MASUK[id](); }
function berikut(){ tandai(tahapKe+1); ke(URUT[URUT.indexOf(kini)+1]); }

/* ═ 1-3 · botol ═ */
(function(){
  var gabus=$('#gabus'), kapal=$('#kapal'), benang=$('#benang'), cincin=$('#cincin'), mulut=$('#mulut'), tahap='gabus';
  MASUK.s0=function(){ petunjuk('Kapalnya belum selesai dirakit, dan botolnya masih tertutup. <b>Cabut gabusnya ke kanan.</b>'); };
  seret(gabus,{
    boleh:function(){ return tahap==='gabus'; },
    down:function(){ gabus.classList.add('seret'); },
    move:function(e,dx){ var t=klem(dx/(U()*14),0,1.2); gabus.style.transform='translateX('+(t*U()*12)+'px) rotate('+(t*14)+'deg)'; },
    up:function(e,dx){ gabus.classList.remove('seret'); var t=dx/(U()*14);
      if(t>.7){ tahap='kapal'; SFX.gabus(); buzz(20); gabus.style.transform='translate(calc(var(--u)*16),calc(var(--u)*30)) rotate(80deg)'; setTimeout(function(){ gabus.classList.add('lepas'); },500);
        tandai(1); kapal.classList.add('ajak'); petunjuk('Terbuka. Kapalnya masih terlipat di meja. <b>Seret kapalnya ke mulut botol.</b>'); }
      else { gabus.style.transform=''; if(t<.08) kedip(); } }
  });
  var ox=0, oy=0;
  seret(kapal,{
    boleh:function(){ return tahap==='kapal'; },
    down:function(){ kapal.classList.add('seret'); kapal.classList.remove('ajak'); SFX.kayu(); },
    move:function(e,dx,dy){ kapal.style.transform='translate('+dx+'px,'+dy+'px) scale(.62)'; },
    up:function(e){ kapal.classList.remove('seret'); var m=pusat(mulut), r=kapal.getBoundingClientRect();
      var ujung={x:r.right,y:r.top+r.height*.6};
      if(Math.hypot(ujung.x-m.x,ujung.y-m.y)<U()*18 || Math.hypot(e.clientX-m.x,e.clientY-m.y)<U()*14){
        tahap='masuk'; kapal.style.transform=''; kapal.classList.remove('di-meja'); kapal.classList.add('di-dalam'); SFX.kayu(); buzz(25);
        tandai(2); petunjuk('Masuk. Tiangnya masih rebah.');
        setTimeout(function(){ tahap='benang'; benang.classList.add('tampil','ajak'); petunjuk('Tiang dan layarnya diikat ke satu benang. <b>Tarik benangnya ke kanan.</b>'); },1000);
      } else { kapal.style.transform=''; kapal.classList.add('ajak'); kedip(); } }
  });
  var tarikan=0, total=PASANG.length+1;
  seret(cincin,{
    boleh:function(){ return tahap==='benang'; },
    down:function(){ benang.classList.remove('ajak'); },
    move:function(e,dx){ var t=klem(dx,0,U()*14); cincin.style.transform='translateX('+t+'px)'; $('#taliBenang').style.transform='scaleX('+(1+t/benang.offsetWidth)+')'; },
    up:function(e,dx){ cincin.style.transform=''; $('#taliBenang').style.transform='';
      if(dx<U()*7){ kedip(); benang.classList.add('ajak'); return; }
      SFX.benang(); buzz(15); tarikan++;
      if(tarikan===1){ kapal.classList.add('tegak'); SFX.kayu(); }
      else { var p=PASANG[tarikan-2]; p.l.classList.add('naik'); SFX.layar(); setTimeout(function(){ lihat(p); },650); tahap='lihat'; }
      if(tarikan===1) petunjuk('Tiangnya berdiri. '+(PASANG.length?'<b>Tarik lagi</b>, layarnya belum terbuka.':''));
      if(tarikan>=total){ tahap='beres'; benang.classList.remove('tampil'); }
      else if(tarikan===1 && !PASANG.length){ tahap='beres'; }
      if(tahap==='beres' && tarikan===1) selesai();
    }
  });
  var ov=$('#lihat'), kiniP=null;
  function lihat(p){ kiniP=p; pasFoto($('#lihatImg'),p.f); $('#lihatBingkai').classList.toggle('rebah',p.f.bentuk==='R'); $('#lihatKet').textContent=p.f.caption||''; ov.classList.add('tampil'); ptj.style.visibility='hidden'; }
  noMenu(ov);
  ov.addEventListener('click',function(){ if(!kiniP) return; kiniP=null; ov.classList.remove('tampil'); ptj.style.visibility='';
    if(tarikan>=total) selesai();
    else { tahap='benang'; benang.classList.add('ajak'); petunjuk('<b>Tarik lagi.</b> Masih '+(total-tarikan)+' layar terlipat.'); } });
  function selesai(){ benang.classList.remove('tampil'); SFX.menang(); petunjuk('Kapalnya berdiri utuh di dalam botol.'); setTimeout(function(){ lanjut(berikut,'Lihat talinya'); },1300); }
})();

/* ═ 4 · simpul per tahun ═ */
(function(){
  var tali=$('#tali'), ikat=$('#ikat'), isiL=$('#ikatIsi'), K=2*Math.PI*44, daftar=[];
  var y0=MULAI?MULAI.getFullYear():KINI.getFullYear();
  if(SEMBUNYI||!MULAI) daftar=[['hari pertama',''],['hari-hari biasa',''],['hari ini','']];
  else { var n=Math.min(TAHUN,7);
    for(var k=1;k<=n;k++) daftar.push([k===n&&TAHUN>7?'tahun ke-'+k+' sampai ke-'+TAHUN:'tahun ke-'+k, k===n&&TAHUN>7?(y0+k-1)+'–'+(y0+TAHUN):(y0+k-1)+'–'+(y0+k)]);
    daftar.push(['hari ini', HARI.toLocaleString('id-ID')+' hari']); }
  var simpul=daftar.map(function(d,i){ var s=el('div','simpul calon '+(i%2?'bawah':'atas')); s.style.left=(daftar.length===1?50:6+i*(88/(daftar.length-1)))+'%';
    s.innerHTML='<span><b>'+teks(d[0])+'</b>'+teks(d[1])+'</span>'; tali.appendChild(s); return s; });
  var ke_=0, t0=0, raf=0, tahan=false, beres=false, DUR=1100;
  $('#judulTali').textContent=SEMBUNYI||!MULAI?'Tali kapal ini diikat satu simpul untuk tiap babak kalian.':'Tali kapal ini diikat satu simpul untuk tiap tahun di laut yang sama.';
  MASUK.s3=function(){ petunjuk('<b>Tahan tombolnya</b> sampai lingkarannya penuh untuk mengikat satu simpul.'); };
  function isi(p){ isiL.setAttribute('stroke-dasharray',(p*K).toFixed(1)+' 999'); }
  function jalan(t){ if(!tahan) return; var p=klem((t-t0)/DUR,0,1); isi(p); if(p>=1){ tahan=false; ikatSatu(); return; } raf=requestAnimationFrame(jalan); }
  function ikatSatu(){ var s=simpul[ke_++]; s.classList.remove('calon'); s.classList.add('terikat'); SFX.pop(); buzz(25); isi(0);
    if(ke_>=simpul.length){ beres=true; ikat.disabled=true;
      $('#hasilTali').textContent=SEMBUNYI||!MULAI?'Masih di kapal yang sama.':HARI.toLocaleString('id-ID')+' hari di kapal yang sama.';
      SFX.menang(); petunjuk('Talinya sudah penuh simpul.'); setTimeout(function(){ lanjut(berikut,'Buka pesan di botolnya'); },1500); }
    else petunjuk('Terikat. <b>'+(simpul.length-ke_)+' simpul lagi.</b>'); }
  noMenu(ikat);
  ikat.addEventListener('pointerdown',function(e){ if(beres) return; e.preventDefault(); ac(); tahan=true; t0=performance.now(); SFX.benang(); raf=requestAnimationFrame(jalan); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){ ikat.addEventListener(n,function(){ if(tahan){ tahan=false; cancelAnimationFrame(raf); isi(0); kedip(); } }); });
})();

/* ═ 5 · gulungan surat ═ */
(function(){
  var kertas=$('#kertas'), isi=$('#kertasIsi'), rol=$('#rolBawah'), p=0, p0=0, beres=false, kres=0;
  isi.innerHTML='<h3>Untuk '+teks(PENERIMA)+',</h3>'+(SURAT.length?SURAT:['']).map(function(s){ return '<p>'+teks(s)+'</p>'; }).join('')+'<div class="ttd">'+teks(PENGIRIM)+'</div>';
  function maks(){ return $('#s4').clientHeight-U()*12; }
  function atur(){ var h=Math.min(p,maks()); kertas.style.height=h+'px'; isi.style.transform='translateY('+(-Math.max(0,p-maks()))+'px)'; }
  MASUK.s4=function(){ p=U()*4; atur(); petunjuk('Ada surat tergulung di dalam botol. <b>Tarik gulungannya ke bawah.</b>'); };
  function gerak(e,dx,dy){ if(beres) return; var akhir=isi.offsetHeight; p=klem(p0+dy,U()*4,akhir); if(Math.abs(p-kres)>U()*6){ SFX.kertas(); kres=p; } atur();
    if(p>=akhir-2){ beres=true; buzz(20); petunjuk(String(D.rahasia||'').trim()?'Di bawahnya ada sobekan kertas yang kelihatan kosong.':'Sudah terbuka semua.'); setTimeout(function(){ lanjut(berikut,String(D.rahasia||'').trim()?'Lihat sobekan kertasnya':'Tutup botolnya'); },1500); } }
  [rol,kertas].forEach(function(n){ seret(n,{ down:function(){ p0=p; }, move:gerak, up:function(){ if(!beres && p<U()*10) kedip(); } }); });
})();

/* ═ 6 · tinta jeruk nipis ═ */
(function(){
  if(!String(D.rahasia||'').trim()) return;
  var tinta=$('#tinta'), len=$('#lentera'), wadah=$('#rahasiaWadah'), beres=false, kata=[], kena=0;
  String(D.rahasia).split(/(\s+)/).forEach(function(w){ if(/^\s+$/.test(w)||!w){ tinta.appendChild(document.createTextNode(w)); return; } var k=el('span','kata',w); tinta.appendChild(k); kata.push(k); });
  MASUK.s5=function(){ petunjuk('Kertasnya kelihatan kosong. <b>Dekatkan lenteranya</b>, geser pelan di atas tulisan.'); };
  var lx=0, ly=0;
  seret(len,{
    boleh:function(){ return !beres; },
    down:function(){ len.classList.add('seret'); lx=parseFloat(len.dataset.x||0); ly=parseFloat(len.dataset.y||0); },
    move:function(e,dx,dy){ if(beres) return; var x=lx+dx, y=ly+dy; len.style.transform='translate('+x+'px,'+y+'px)';
      var c=pusat(len), hx=c.x, hy=c.r.top+c.r.height*.2, R=U()*12;
      kata.forEach(function(k){ if(k._k) return; var q=pusat(k); if(Math.abs(q.x-hx)<R+q.r.width/2 && Math.abs(q.y-hy)<R){ k._k=true; k.classList.add('muncul'); kena++; } });
      if(kena>=Math.ceil(kata.length*.85)){ beres=true; kata.forEach(function(k){ k.classList.add('muncul'); }); len.style.transition='transform .7s ease'; len.style.transform=''; SFX.dentang(); buzz([20,40,20]); petunjuk('Tulisannya muncul.'); setTimeout(function(){ lanjut(berikut,'Tutup botolnya'); },2200); } },
    up:function(e,dx,dy){ len.classList.remove('seret'); len.dataset.x=lx+dx; len.dataset.y=ly+dy; if(Math.hypot(dx,dy)<6) kedip(); }
  });
  noMenu(wadah);
})();

/* ═ 7 · penutup ═ */
(function(){
  MASUK.s6=function(){ ptj.hidden=true; tandai(TAHAP.length); MU.play();
    $('#akhirJudul').textContent='Selamat '+JENIS+(!SEMBUNYI&&TAHUN>=1?' yang ke-'+TAHUN:'')+', '+PENERIMA+'.';
    $('#akhirSub').textContent='Kapalnya sudah utuh. Botolnya ditutup lagi, siap dibawa berlayar.';
    var c=pusat($('.botol-apung')); konfeti(c.x,c.y,50,['#F3E9D2','#D3A54A','#E8734A','#8fd1d0']); };
  var t=$('#balasTeks'); t.value='Aku juga mau berlayar terus sama kamu.';

  $('#ulang').onclick=function(){ location.reload(); };
})();

$('#music').addEventListener('click',function(){ ac(); });
document.addEventListener('pointerdown',function sekali(){ MU.play(); document.removeEventListener('pointerdown',sekali); });
ke('s0');

}
