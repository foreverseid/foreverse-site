/* Tema khas Foreverse: warna merek (violet malam, krem, blush, coral, tinta). Motif dari logo: amplop berhati dan lingkaran tak hingga.
   Beda dari Dia Lewat Sini Duluan (krem, coral, amber), Bekal Makan Siang (biru muda, mint), Tali Jemuran (langit biru, rumput). */
body{background:radial-gradient(ellipse at 50% 20%,#4A3F80 0,var(--violet) 45%,#241E45)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px) 0 0/90px 90px,radial-gradient(circle at 70% 70%,#E8A5B0 0 1px,transparent 1.5px) 0 0/130px 130px}
.judul{color:var(--krem)}.judul small{color:var(--blush)}
.label-k{color:var(--violet)}
.ket-f{font:700 calc(var(--u)*4.8) var(--tangan);color:var(--blush);text-align:center}
/* amplop berhati (seperti logo) */
.amplop-f{position:relative;width:calc(var(--u)*70);height:calc(var(--u)*46);flex:none;border:0;padding:0;cursor:pointer;background:none;perspective:900px}
.amplop-f .bd{position:absolute;inset:0;border-radius:calc(var(--u)*2);background:var(--krem);box-shadow:0 14px 30px rgba(10,6,30,.45)}
.amplop-f .bd::after{content:"";position:absolute;inset:0;border-radius:calc(var(--u)*2);background:linear-gradient(to top right,transparent 49.6%,var(--batu) 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,var(--batu) 50%,transparent 50.4%)}
.amplop-f .tutup{position:absolute;left:0;right:0;top:0;height:58%;background:#F1EEE8;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .9s cubic-bezier(.4,.1,.3,1);z-index:2}
.amplop-f .hati{position:absolute;left:50%;top:46%;width:calc(var(--u)*12);height:calc(var(--u)*12);margin:calc(var(--u)*-6) 0 0 calc(var(--u)*-6);z-index:3;transition:transform .6s,opacity .6s}
.amplop-f .hati svg{width:100%;height:100%}
.amplop-f.buka .tutup{transform:rotateX(90deg);opacity:0;transition:transform .5s,opacity .5s}
.amplop-f .kartu-a{position:absolute;left:8%;right:8%;top:8%;height:80%;border-radius:calc(var(--u)*1.4);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;font:400 calc(var(--u)*14) Fraunces,var(--serif);color:var(--violet);opacity:0;transition:transform .9s .3s cubic-bezier(.3,1.3,.5,1),opacity .5s .3s;z-index:1}
.amplop-f.buka .kartu-a{opacity:1;transform:translateY(-6%)}.amplop-f.buka .hati{transform:scale(1.8) translateY(-40%);opacity:0}
.amplop-f.ajak .hati{animation:detak 1.2s infinite}@keyframes detak{20%{transform:scale(1.15)}40%{transform:scale(1)}}

.takhingga{position:relative;width:min(92vw,calc(var(--u)*92));flex:none;touch-action:none}
.takhingga svg{display:block;width:100%;height:auto;overflow:visible}
.jalur-d{fill:none;stroke:rgba(251,250,247,.22);stroke-width:7;stroke-linecap:round}
.jalur-t{fill:none;stroke:url(#gradF);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(232,165,176,.8))}
.mulai{fill:var(--blush)}.mulai.aktif{animation:denyutM 1s infinite}@keyframes denyutM{50%{r:11}}
.pos{fill:var(--violet);stroke:var(--krem);stroke-width:2.5;transition:fill .4s}.pos.nyala{fill:var(--coral)}

.kartu-f img{display:block;border-radius:calc(var(--u)*1.2);background:#ccc}.kartu-f img.T{height:calc(var(--u)*50);aspect-ratio:3/4}.kartu-f img.R{width:calc(var(--u)*58);aspect-ratio:4/3}
.kartu-f p{margin:0;max-width:calc(var(--u)*56);font:700 clamp(16px,calc(var(--u)*4.8),21px)/1.1 var(--tangan);color:var(--tinta);text-align:center}

.panah-k{font:700 calc(var(--u)*4.6) var(--tangan);color:var(--blush);text-align:center}
/* surat tiga lipatan */
.lipatan{width:min(90vw,calc(var(--u)*86));display:flex;flex-direction:column;perspective:1200px}
.lp{position:relative;background:var(--krem);padding:calc(var(--u)*5) calc(var(--u)*6);transform-origin:50% 0;transition:transform 1s cubic-bezier(.4,.1,.3,1);box-shadow:0 8px 20px rgba(10,6,30,.35);border:0;text-align:left;cursor:pointer;font:inherit;color:var(--tinta)}
.lp + .lp{border-top:1px dashed var(--batu)}
.lp.tertutup{transform:rotateX(-88deg);pointer-events:none}

.segel{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*-6);width:calc(var(--u)*16);height:calc(var(--u)*16);animation:capS .4s cubic-bezier(.3,1.6,.5,1)}.segel svg{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}@keyframes capS{from{transform:scale(2.4);opacity:0}}
.lp:first-child{z-index:2}
.buka-l{border:0;border-radius:99px;padding:calc(var(--u)*2.4) calc(var(--u)*5);background:var(--coral);color:#fff;font:700 14px var(--sans);cursor:pointer;align-self:center;margin-top:calc(var(--u)*3);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.buka-l.ajak{animation:detak 1.2s infinite}
.surat-wadah{max-height:62vh;overflow-y:auto;display:flex;flex-direction:column}
/* tahan hati */
.hati-b{position:relative;width:calc(var(--u)*34);height:calc(var(--u)*34);border:0;background:none;cursor:pointer;touch-action:none;flex:none}
.hati-b svg{width:100%;height:100%;overflow:visible}
.hati-b .isi-h{transform-origin:50% 100%;transform:scaleY(var(--p,0));transition:transform .05s}
.hati-b.ajak{animation:detak 1.2s infinite}
.merek{display:flex;align-items:center;gap:8px;opacity:0;transition:1s}.merek.tampil{opacity:1}
.merek img{height:30px;padding:4px 6px;border-radius:8px;background:var(--krem)}.merek b{font:400 20px Fraunces,var(--serif);color:var(--krem);letter-spacing:.01em}
.pilihan .utama{background:var(--coral)}.pilihan .kedua{background:var(--krem);color:var(--violet)}
.akhir h3{color:var(--violet)}
@media (min-aspect-ratio:1/1){

.memuat{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#3B3168;transition:opacity .4s}
