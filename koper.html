<style>
/* Palet: papan petunjuk bandara (arang & kuning), langit biru muda, koper
   biru, putih seprai. Beda dari Dua Jendela (krem, coral, amber, hijau)
   dan Celengan Rindu (terakota, mint, kayu). */
:root{
  --arang:#23262B; --arang2:#353A41; --kuning:#F6C343; --langit:#BFDDF5; --langit2:#8EC5F0; --biru:#3E6FB8; --biru2:#2C548F; --putih:#F8F7F2; --abu:#C9CDD3; --muted:#6B717A;
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --papan:'Barlow Condensed','Plus Jakarta Sans',sans-serif; --tangan:'Caveat',cursive;
  --u:min(1vw,.5vh);
}
@media (min-aspect-ratio:1/1){ :root{ --u:min(.62vw,.92vh); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--langit);font-family:var(--sans);color:var(--arang)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--langit);transition:background 1s}
body[data-tempat="kamar"]{background:linear-gradient(180deg,#EAF3FB 0 58%,#DCE9F5 58% 100%)}
body[data-tempat="bandara"]{background:linear-gradient(180deg,#E9ECEF 0 70%,#CFD4DA 70% 100%)}
body[data-tempat="langit"]{background:linear-gradient(180deg,#8EC5F0,#D9ECFA)}
img{-webkit-user-drag:none;pointer-events:none}

/* kepala: papan tahapan perjalanan */
.kepala{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px}
.tahap{display:flex;gap:2px;font:700 13px var(--papan);letter-spacing:.08em;text-transform:uppercase}
.tahap span{background:var(--arang2);color:#8F959D;padding:5px 9px}
.tahap span:first-child{border-radius:4px 0 0 4px}.tahap span:last-child{border-radius:0 4px 4px 0}
.tahap span.ini{background:var(--kuning);color:var(--arang)}
.tahap span.lewat{background:var(--arang);color:var(--kuning)}
#music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:41;border:0;width:34px;height:34px;border-radius:6px;background:var(--arang);color:#fff;font-size:15px;cursor:pointer}

/* petunjuk = papan informasi hitam */
.petunjuk{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:65;max-width:500px;margin:0 auto;background:var(--arang);color:#fff;padding:11px 16px 11px 46px;border-radius:6px;font-size:14px;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:opacity .25s,transform .25s}
.petunjuk::before{content:"i";position:absolute;left:14px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--kuning);color:var(--arang);font:700 13px/20px var(--serif);text-align:center}
.petunjuk b{color:var(--kuning)}
.petunjuk.ganti{opacity:0;transform:translateY(6px)}
.petunjuk.kedip{animation:kedip .45s 2}
@keyframes kedip{50%{background:#4A3F14}}
.petunjuk[hidden]{display:none}
/* tombol lanjut = papan arah kuning */
#lanjut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:70;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:.4s;
  border:0;border-radius:4px;padding:12px 22px 12px 16px;font:700 19px var(--papan);letter-spacing:.04em;text-transform:uppercase;color:var(--arang);background:var(--kuning);box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:12px;white-space:nowrap}
#lanjut::before{content:"→";font:700 22px var(--sans);background:var(--arang);color:var(--kuning);width:30px;height:30px;line-height:28px;text-align:center;border-radius:3px}
#lanjut.tampil{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* adegan: perjalanan bergeser ke kiri */
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);
  opacity:0;pointer-events:none;transform:translateX(100%);transition:transform .9s cubic-bezier(.6,0,.3,1),opacity .4s;z-index:5}
.sc.aktif{opacity:1;pointer-events:auto;transform:none}
.sc.lewat{opacity:0;transform:translateX(-100%)}
.sc>*{flex-shrink:0}
@media (min-aspect-ratio:1/1){ .sc{flex-direction:row;gap:calc(var(--u)*7)} .sc.tegak{flex-direction:column;gap:calc(var(--u)*2)} }
.judul{margin:0;font:600 calc(var(--u)*6.4)/1.12 var(--serif);color:var(--arang);text-align:center;opacity:0;transform:translateY(8px);transition:.8s;max-width:92vw}
.judul.tampil{opacity:1;transform:none}
.judul small{display:block;margin-top:calc(var(--u)*1.2);font:700 calc(var(--u)*5.2)/1.1 var(--tangan);color:var(--biru)}

/* ═ 1 · koper di kasur ═ */
.koper-tutup{position:relative;width:calc(var(--u)*70);height:calc(var(--u)*52)}
.koper-tutup .badan{position:absolute;inset:calc(var(--u)*6) 0 0;border-radius:calc(var(--u)*5);background:repeating-linear-gradient(90deg,var(--biru) 0 calc(var(--u)*8),#4A7CC6 calc(var(--u)*8) calc(var(--u)*9));box-shadow:inset 0 -6px 0 var(--biru2),0 10px 20px rgba(0,0,0,.25)}
.koper-tutup .gagang{position:absolute;left:35%;right:35%;top:0;height:calc(var(--u)*8);border:calc(var(--u)*2) solid var(--arang2);border-bottom:0;border-radius:calc(var(--u)*3) calc(var(--u)*3) 0 0}
.kancing{position:absolute;top:calc(var(--u)*12);width:calc(var(--u)*12);height:calc(var(--u)*9);border:0;padding:0;border-radius:calc(var(--u)*1.6);background:linear-gradient(180deg,#E3E6EA,#A9AFB7);box-shadow:inset 0 -2px 0 #8C929A,0 2px 3px rgba(0,0,0,.3);cursor:pointer;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.kancing::before{content:"";position:absolute;left:30%;right:30%;top:22%;height:30%;border-radius:2px;background:var(--arang2)}
.kancing::after{content:"";position:absolute;inset:calc(var(--u)*-2.4);border-radius:calc(var(--u)*3);box-shadow:0 0 0 2px var(--kuning);animation:denyut 1.3s infinite}
.kancing.k1{left:calc(var(--u)*12)}.kancing.k2{right:calc(var(--u)*12)}
.kancing.buka{transform:translateY(calc(var(--u)*-3)) rotate(-25deg)}
.kancing.buka::after{display:none}
@keyframes denyut{50%{box-shadow:0 0 0 2px rgba(246,195,67,.2),0 0 0 calc(var(--u)*2.6) rgba(246,195,67,.15)}}
.koper-tutup.lenyap{transition:transform .6s,opacity .5s;transform:scale(1.1);opacity:0}

.koper-buka{position:relative;width:calc(var(--u)*86);display:none;flex-direction:column;border-radius:calc(var(--u)*4);overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.koper-buka.tampil{display:flex;animation:muncul .6s ease}
@keyframes muncul{from{opacity:0;transform:scale(.94)}}
.koper-buka .tutup{height:calc(var(--u)*22);background:var(--biru2);padding:calc(var(--u)*2.4);display:flex}
.koper-buka .tutup i{flex:1;border-radius:calc(var(--u)*2);background:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 2px,transparent 2px 7px),#335E9E}
.koper-buka .dasar{position:relative;height:calc(var(--u)*44);background:#E9EEF6;border-top:calc(var(--u)*1.4) solid var(--arang2);box-shadow:inset 0 0 0 calc(var(--u)*1.6) var(--biru2)}
.koper-buka .dasar::before,.koper-buka .dasar::after{content:"";position:absolute;top:0;bottom:0;width:calc(var(--u)*2.4);background:#B9C4D4}
.koper-buka .dasar::before{left:30%}.koper-buka .dasar::after{right:30%}
.koper-buka .dasar.siap{animation:sorot 1.4s infinite}
@keyframes sorot{50%{box-shadow:inset 0 0 0 calc(var(--u)*1.6) var(--biru2),inset 0 0 0 calc(var(--u)*3) rgba(246,195,67,.7)}}
.koper-buka .dasar .barang{position:absolute;pointer-events:none}
.kasur{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*2.4);width:calc(var(--u)*92);min-height:calc(var(--u)*34)}
@media (min-aspect-ratio:1/1){ .kasur{width:calc(var(--u)*76);min-height:0} .koper-buka{width:calc(var(--u)*76)} .koper-buka .tutup{height:calc(var(--u)*16)} .koper-buka .dasar{height:calc(var(--u)*36)} }
.barang{position:relative;width:calc(var(--u)*27);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6);touch-action:none;cursor:grab}
.barang svg{width:calc(var(--u)*17);height:calc(var(--u)*13);overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.barang .label{width:100%;background:#fff;border:1.5px solid var(--arang);border-radius:3px;padding:calc(var(--u)*1) calc(var(--u)*1.4);font:700 calc(var(--u)*3.8)/1.08 var(--tangan);color:var(--arang);text-align:center;word-break:break-word}
.barang.berat .label{background:#E4E6E9;color:#555B63;border-style:dashed}
.barang.mental{animation:mental .6s}
@keyframes mental{30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(4px) rotate(5deg)}}
.barang.pergi{transition:transform .9s ease-in,opacity .8s;transform:translate(0,-40vh) rotate(30deg);opacity:0;pointer-events:none}
.barang.masuk .label{font-size:calc(var(--u)*3.2)}

.koper-zip{position:relative;width:calc(var(--u)*74);height:calc(var(--u)*56);display:none}
.koper-zip.tampil{display:block;animation:muncul .6s ease}
.koper-zip .badan{position:absolute;inset:calc(var(--u)*6) 0 0;border-radius:calc(var(--u)*5);background:repeating-linear-gradient(90deg,var(--biru) 0 calc(var(--u)*8),#4A7CC6 calc(var(--u)*8) calc(var(--u)*9));box-shadow:inset 0 -6px 0 var(--biru2),0 10px 20px rgba(0,0,0,.25)}
.koper-zip .gagang{position:absolute;left:35%;right:35%;top:0;height:calc(var(--u)*8);border:calc(var(--u)*2) solid var(--arang2);border-bottom:0;border-radius:calc(var(--u)*3) calc(var(--u)*3) 0 0}
.rel{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*14);height:calc(var(--u)*3.4);border-radius:99px;background:repeating-linear-gradient(90deg,#1E2A3B 0 3px,#556270 3px 6px);opacity:.55}
.rel i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:repeating-linear-gradient(90deg,#C8CDD4 0 3px,#7D8691 3px 6px)}
.tarikan{position:absolute;top:calc(var(--u)*11);width:calc(var(--u)*8);height:calc(var(--u)*13);margin-left:calc(var(--u)*-4);touch-action:none;cursor:grab;z-index:3}
.tarikan::before{content:"";position:absolute;left:25%;right:25%;top:0;bottom:30%;border-radius:calc(var(--u)*1.4);background:linear-gradient(180deg,#F1F3F5,#9EA5AE);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.tarikan::after{content:"";position:absolute;inset:calc(var(--u)*-2.6);border-radius:50%;box-shadow:0 0 0 2px var(--kuning);animation:denyut 1.3s infinite}
.tarikan span{position:absolute;left:120%;top:10%;white-space:nowrap;font:700 calc(var(--u)*3.6) var(--papan);letter-spacing:.06em;text-transform:uppercase;background:var(--kuning);color:var(--arang);padding:calc(var(--u)*.8) calc(var(--u)*2);border-radius:3px;animation:geserKanan 1.2s ease-in-out infinite}
@keyframes geserKanan{50%{transform:translateX(calc(var(--u)*2.4))}}
.tarikan.beres::after,.tarikan.beres span{display:none}
.label-koper{position:absolute;right:calc(var(--u)*-3);top:calc(var(--u)*22);width:calc(var(--u)*26);background:#fff;border:1.5px solid var(--arang);border-radius:3px;padding:calc(var(--u)*2);font:700 calc(var(--u)*3.2)/1.3 var(--papan);letter-spacing:.04em;text-transform:uppercase;transform-origin:50% -20%;transform:rotate(14deg) scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.label-koper.tampil{transform:rotate(8deg) scale(1)}
.label-koper b{display:block;font:700 calc(var(--u)*5) var(--papan);color:var(--biru2)}

/* ═ 2 · mesin X-ray ═ */
.monitor{position:relative;width:calc(var(--u)*88);background:var(--arang);border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.4);box-shadow:0 10px 24px rgba(0,0,0,.3);cursor:pointer;border:0;display:block;text-align:left}
@media (min-aspect-ratio:1/1){ .monitor{width:calc(var(--u)*92)} }
.layar{position:relative;aspect-ratio:4/3;background:#0B1A26;border-radius:calc(var(--u)*1.2);overflow:hidden;display:grid;place-items:center}
.layar::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
.layar img{max-width:92%;max-height:92%;transition:filter 1.4s ease}
.layar img.xray{filter:grayscale(1) invert(1) sepia(1) hue-rotate(160deg) saturate(3.2) brightness(.95) contrast(1.2)}
.layar .kosong{font:700 calc(var(--u)*4.2) var(--papan);letter-spacing:.1em;color:#5FD1FF;text-transform:uppercase;text-align:center;padding:0 10%}
.layar .aman{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*3);font:700 calc(var(--u)*4.4) var(--papan);letter-spacing:.1em;color:#0B1A26;background:#6BE39A;padding:calc(var(--u)*.6) calc(var(--u)*2.4);border-radius:3px;opacity:0;transition:opacity .4s}
.layar .aman.tampil{opacity:1}
.ticker{margin-top:calc(var(--u)*2);display:flex;justify-content:space-between;gap:10px;font:600 calc(var(--u)*3.6)/1.3 var(--papan);letter-spacing:.06em;text-transform:uppercase;color:#5FD1FF}
.ticker b{color:var(--kuning);font-weight:700}
.ticker .ket{font:700 calc(var(--u)*4.6)/1.15 var(--tangan);text-transform:none;letter-spacing:0;color:#fff}
.ban{position:relative;width:calc(var(--u)*92);height:calc(var(--u)*26)}
@media (min-aspect-ratio:1/1){ .ban{width:calc(var(--u)*80)} }
.ban .sabuk{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*6);border-radius:99px;background:repeating-linear-gradient(90deg,#3B4048 0 calc(var(--u)*4),#2C3036 calc(var(--u)*4) calc(var(--u)*8));animation:jalan 1s linear infinite}
@keyframes jalan{to{background-position:calc(var(--u)*8) 0}}
.ban .terowong{position:absolute;left:30%;width:40%;bottom:calc(var(--u)*6);height:calc(var(--u)*20);background:linear-gradient(180deg,#D7DBE0,#B8BEC6);border-radius:calc(var(--u)*2) calc(var(--u)*2) 0 0;box-shadow:0 4px 10px rgba(0,0,0,.2);z-index:2}
.ban .terowong::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:70%;background:repeating-linear-gradient(90deg,#2C3036 0 5px,#40464E 5px 8px);border-radius:3px 3px 0 0}
.ban .mini{position:absolute;bottom:calc(var(--u)*6);left:0;width:calc(var(--u)*20);height:calc(var(--u)*14);border-radius:calc(var(--u)*2);background:var(--biru);box-shadow:inset 0 -3px 0 var(--biru2);transition:left 2.2s linear}

/* ═ 3 · mesin check-in + boarding pass ═ */
.kios{position:relative;width:calc(var(--u)*62);background:linear-gradient(180deg,#F2F4F6,#D5DADF);border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*1.2) calc(var(--u)*1.2);padding:calc(var(--u)*4);box-shadow:0 12px 26px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:calc(var(--u)*3);align-items:center}
.kios .layar-k{width:100%;background:var(--biru2);color:#fff;border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*3.4);font:600 calc(var(--u)*3.6)/1.4 var(--sans)}
.kios .layar-k b{display:block;font:700 calc(var(--u)*6) var(--papan);letter-spacing:.04em;text-transform:uppercase;color:var(--kuning)}
.cetak{border:0;border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*3) calc(var(--u)*4);width:100%;font:700 calc(var(--u)*4.6) var(--papan);letter-spacing:.06em;text-transform:uppercase;color:var(--arang);background:var(--kuning);box-shadow:0 4px 0 #C99A20;cursor:pointer;position:relative}
.cetak::after{content:"";position:absolute;inset:calc(var(--u)*-1.6);border-radius:calc(var(--u)*2.4);box-shadow:0 0 0 2px var(--kuning);animation:denyut 1.3s infinite}
.cetak:disabled{opacity:.45;box-shadow:none}.cetak:disabled::after{display:none}
.celah{width:80%;height:calc(var(--u)*2.4);border-radius:99px;background:var(--arang)}
.pass-kecil{position:relative;width:70%;height:0;overflow:hidden;transition:height 1.6s steps(14);margin-top:calc(var(--u)*-3.6)}
.pass-kecil.keluar{height:calc(var(--u)*26)}
.pass-kecil button{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*26);border:0;padding:0;background:#fff;border-radius:0 0 calc(var(--u)*1.6) calc(var(--u)*1.6);box-shadow:0 4px 8px rgba(0,0,0,.2);cursor:pointer;font:700 calc(var(--u)*3.6) var(--papan);letter-spacing:.06em;text-transform:uppercase;color:var(--biru2)}
.pass-kecil button i{display:block;height:calc(var(--u)*6);background:var(--biru2);margin-bottom:calc(var(--u)*2.4)}

.tirai{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 56px) 14px calc(env(safe-area-inset-bottom) + 90px);background:rgba(35,38,43,.55);perspective:1600px}
.tirai.tampil{display:flex}
.pass{position:relative;width:min(92vw,calc(var(--u)*88));height:min(100%,calc(var(--u)*128));transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,0,.2,1);cursor:pointer}
@media (min-aspect-ratio:1/1){ .pass{width:min(80vw,calc(var(--u)*130));height:min(100%,calc(var(--u)*82))} }
.pass.balik{transform:rotateY(180deg)}
.muka,.belakang{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:calc(var(--u)*3);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.belakang{transform:rotateY(180deg);display:flex;flex-direction:column}
.muka .pita{background:var(--biru2);color:#fff;padding:calc(var(--u)*4) calc(var(--u)*5);display:flex;justify-content:space-between;align-items:center;font:700 calc(var(--u)*4) var(--papan);letter-spacing:.12em;text-transform:uppercase}
.muka .pita span:last-child{color:var(--kuning)}
.rute{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--u)*6) calc(var(--u)*5) calc(var(--u)*3)}
