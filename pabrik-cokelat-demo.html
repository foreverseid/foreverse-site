   ═══════════════════════════════════════════════════════════════ */
var ALASAN=(D.alasan||[]).map(function(s){ return String(s||''); }).filter(function(s){ return s.trim(); });
SFX.kertas2=function(){ noise(.12,6000,.08); };
SFX.tuang=function(){ noise(.12,700,.05); };
SFX.patah=function(){ noise(.09,5200,.4); tone(320,.06,{type:'square',vol:.12}); };
var HATI='M50 90 C18 68 2 48 4 28 C6 10 22 2 34 4 C42 5 48 11 50 18 C52 11 58 5 66 4 C78 2 94 10 96 28 C98 48 82 68 50 90Z';

var URUT=[0,1]; if(FOTO.length) URUT.push(2); URUT.push(3,4);
var MASUK={}, kini=-1;
$('#hatiHati').innerHTML=URUT.map(function(){ return '<i></i>'; }).join('');
function ke(no){
  var pos=URUT.indexOf(no);
  if(kini>=0){ var l=$('#s'+kini); l.classList.remove('aktif'); l.classList.add('lewat'); }
  kini=no; var s=$('#s'+no); s.classList.remove('lewat'); s.classList.add('aktif');
  $$('#hatiHati i').forEach(function(b,i){ b.classList.toggle('ok',i<pos); b.classList.toggle('kini',i===pos); });
  if(MASUK[no]) MASUK[no]();
}
function berikut(){ ke(URUT[URUT.indexOf(kini)+1]); }

/* ═ 1 · foil dikelupas dari sudut ═ */
(function(){
  var svg=$('#hatiFoil'), foil=$('#foil'), poly=$('#polyKupas'), NS='http://www.w3.org/2000/svg', k=100, k0=100, beres=false;
  $('#hatiTulis').textContent='untuk '+PENERIMA;
  /* lipatan foil = bagian yang sudah terkelupas, dicerminkan terhadap garis kupas x - y = k */
  var g=document.createElementNS(NS,'g'), cp=document.createElementNS(NS,'clipPath'); cp.id='klipBuang';
  var pb=document.createElementNS(NS,'polygon'); cp.appendChild(pb); $('defs',svg).appendChild(cp);
  g.innerHTML='<path d="'+HATI+'" fill="#ffe3ea" stroke="#e07a93" stroke-width=".6" clip-path="url(#klipBuang)"/>'; svg.appendChild(g);
  $('#polyLipat').remove();
  function potong(pts,sisi){ var o=[]; for(var i=0;i<pts.length;i++){ var a=pts[i], b=pts[(i+1)%pts.length], fa=(a[0]-a[1]-k)*sisi<=0, fb=(b[0]-b[1]-k)*sisi<=0;
      if(fa) o.push(a); if(fa!==fb){ var t=(k-(a[0]-a[1]))/((b[0]-b[1])-(a[0]-a[1])); o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]); } } return o; }
  function gambar(){ var kotak=[[0,0],[100,0],[100,92],[0,92]];
    var simpan=potong(kotak,1), buang=potong(kotak,-1), str=function(p){ return p.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' '); };
    poly.setAttribute('points',simpan.length?str(simpan):'0,0'); pb.setAttribute('points',buang.length?str(buang):'0,0');
    g.setAttribute('transform','matrix(0 1 1 0 '+k+' '+(-k)+')'); }
  gambar();
  MASUK[0]=function(){ petunjuk('Ada cokelat hati terbungkus foil. <b>Kelupas foilnya dari sudut kanan atas</b> ke arah kiri bawah.'); };
  seret(foil,{
    boleh:function(){ return !beres; },
    down:function(){ k0=k; },
    move:function(e,dx,dy){ if(beres) return; var unit=svg.getBoundingClientRect().width/100; k=klem(k0-(dy-dx)/unit,-95,100); gambar(); if(Math.random()<.2) SFX.kertas2();
      if(k<-30) kelupas(); },
    up:function(){ if(!beres && k>92) kedip(); }
  });
  function kelupas(){
    beres=true; $('#sudutFoil').remove(); foil.style.display='none'; SFX.kertas(); buzz(20); MU.play();
    var a=k; (function f(){ a-=6; k=a; gambar(); if(a>-100) requestAnimationFrame(f); else { g.style.transition='opacity .4s'; g.style.opacity='0'; } })();
    var j=$('#judulAwal'); j.innerHTML=''; j.appendChild(document.createTextNode('Selamat Hari Valentine, '+PENERIMA)); j.appendChild(el('small',null,'yang ini kita bikin bareng, dari '+PENGIRIM));
    setTimeout(function(){ j.classList.add('tampil'); petunjuk('Yang ini sudah jadi. Sekarang giliranmu bikin tiga lagi.'); },500);
    setTimeout(function(){ lanjut(berikut,'Ke dapur'); },2200);
  }
})();

/* ═ 2 · tuang cokelat ke cetakan (game) ═ */
(function(){
  var dp=$('#dapur'), panci=$('#panci'), al=$('#aliran'), baris=$('#cetakanBaris'), N=3, ke_=0, level=0, miring=0, tuang=false, beres=false, lalu=0, tumpah=false, BAWAH=.78;
  var cet=[];
  for(var i=0;i<N;i++){
    var c=el('div','cetakan'); c.innerHTML='<svg viewBox="0 0 100 92" aria-hidden="true"><defs><clipPath id="kc'+i+'"><path d="'+HATI+'"/></clipPath></defs>'+
      '<path d="'+HATI+'" fill="#f7e3d6" stroke="#c9a28c" stroke-width="2.4"/>'+
      '<rect class="isi" x="0" y="92" width="100" height="92" fill="#5A372F" clip-path="url(#kc'+i+')"/>'+
      '<line x1="10" x2="90" y1="'+(92-92*BAWAH)+'" y2="'+(92-92*BAWAH)+'" stroke="#A8C69F" stroke-width="1.6" stroke-dasharray="3 2"/>'+
      '<line x1="10" x2="90" y1="2" y2="2" stroke="#e07a93" stroke-width="1.6" stroke-dasharray="3 2"/></svg><div class="tulis"></div>';
    $('.tulis',c).textContent=ALASAN[i]||''; baris.appendChild(c); cet.push(c);
  }
  function atur(){ var c=cet[ke_], cr=c.getBoundingClientRect(), dr=dp.getBoundingClientRect();
    panci.style.left=(cr.left-dr.left+cr.width*.5-panci.offsetWidth*.92)+'px'; }
  function isi(){ $('rect.isi',cet[ke_]).setAttribute('y',92-92*Math.min(level,1.08)); }
  function aliran(){
    if(miring<.27||tumpah){ al.style.opacity='0'; return; }
    var pr=panci.getBoundingClientRect(), dr=dp.getBoundingClientRect(), cr=cet[ke_].getBoundingClientRect();
    var x=pr.right-dr.left-U()*1, y=pr.top+pr.height*.25-dr.top, yb=cr.bottom-dr.top-cr.height*Math.min(level,1)*.9;
    al.style.left=x+'px'; al.style.top=y+'px'; al.style.height=Math.max(0,yb-y)+'px'; al.style.width='calc(var(--u)*'+(1+miring*2)+')'; al.style.opacity='1';
  }
  function loop(t){ var dt=Math.min(.05,(t-lalu)/1000); lalu=t;
    if(tuang && !beres && !tumpah){ var laju=Math.max(0,(miring-.27)/.73); level+=laju*.42*dt; if(laju>0 && Math.random()<.25) SFX.tuang();
      if(level>1.05){ tumpah=true; SFX.salah(); buzz(40); petunjuk('Tumpah! <b>Lepaskan</b>, lalu coba lagi dengan lebih pelan.'); } }
    if(!tuang && !beres) atur(); isi(); aliran(); if(kini===1) requestAnimationFrame(loop); }
  MASUK[1]=function(){ atur(); lalu=performance.now(); requestAnimationFrame(loop);
    petunjuk('<b>Geser pancinya ke kanan</b> untuk memiringkannya. Lepas saat cokelatnya di antara garis hijau dan garis merah muda.'); };
  addEventListener('resize',function(){ if(kini===1) atur(); });
  seret(panci,{
    boleh:function(){ return !beres; },
    down:function(){ tuang=true; },
    move:function(e,dx){ if(beres) return; miring=klem(dx/(U()*22),0,1); panci.style.setProperty('--m',(miring*80)+'deg'); },
    up:function(){
      tuang=false; miring=0; panci.style.setProperty('--m','0deg');
      if(tumpah){ tumpah=false; level=0; isi(); petunjuk('Cetakannya sudah dibersihkan. <b>Tuang lagi</b>, pelan-pelan.'); return; }
      if(level>=BAWAH && level<=1.0){ pas(); return; }
      if(level>0) petunjuk('Masih kurang. <b>Miringkan lagi</b> sampai melewati garis hijau.'); else kedip();
    }
  });
  function pas(){
    var c=cet[ke_]; SFX.benar(); buzz(20); level=Math.max(level,.9); isi(); al.style.opacity='0';
    setTimeout(function(){ $('.tulis',c).classList.add('ditulis'); },300);
    var a=$('#alasan'); a.innerHTML=''; if(ALASAN[ke_]){ a.appendChild(el('small',null,'alasan '+(ke_+1)+' aku sayang kamu')); a.appendChild(document.createTextNode(ALASAN[ke_])); a.classList.add('tampil'); }
    ke_++;
    if(ke_>=N){ beres=true; petunjuk('Tiga-tiganya pas. Cokelatmu jadi!'); SFX.menang(); var r=pusat(baris); konfeti(r.x,r.y,80,['#F2A7B8','#E07A93','#FFF4EC','#A8C69F']);
      setTimeout(function(){ lanjut(berikut,FOTO.length?'Buka kotak pralinenya':'Lanjut'); },2600); return; }
    setTimeout(function(){ level=0; atur(); petunjuk('Pas! Sekarang <b>cetakan ke-'+(ke_+1)+'</b>.'); },1800);
  }
})();

/* ═ 3 · bendera foto di kotak praline ═ */
(function(){
  if(!FOTO.length) return;
  var kp=$('#kotakPraline'), kf=$('#kartuFoto'), sisa=FOTO.length;
  FOTO.forEach(function(f,i){
    var x=(i+.5)*100/FOTO.length;
    var p=el('div','praline'); p.style.left='calc('+x+'% - var(--u)*10)'; kp.appendChild(p);
    var b=el('div','bendera'); b.style.left='calc('+x+'% - var(--u)*10)'; b.appendChild(el('span',null,(i+1)+'')); kp.appendChild(b);
    seret(b,{
      boleh:function(){ return !b.classList.contains('diambil'); },
      down:function(){ b.classList.add('seret'); },
      move:function(e,dx,dy){ b.style.setProperty('--y',Math.min(0,dy)+'px'); },
      up:function(e,dx,dy){ b.classList.remove('seret'); b.style.setProperty('--y','0px');
        if(-dy<U()*14){ kedip(); return; }
        b.classList.add('diambil'); SFX.pop(); pasFoto($('#kfImg'),f); $('#kartuFoto .bingkai').classList.toggle('rebah',f.bentuk==='R'); $('#kfKet').textContent=f.caption||''; kf.classList.add('tampil'); ptj.style.visibility='hidden'; }
    });
  });
  kf.addEventListener('click',function(){ kf.classList.remove('tampil'); ptj.style.visibility=''; sisa--;
    if(sisa<=0) lanjut(berikut,'Buka bungkus cokelatnya'); else petunjuk('<b>'+sisa+' bendera lagi.</b>'); });
  noMenu(kf);
  MASUK[2]=function(){ petunjuk('Tiap praline ada benderanya. <b>Tarik benderanya ke atas</b> satu per satu.'); };
})();

/* ═ 4 · bungkus dibuka lipat demi lipat (surat) ═ */
(function(){
  var lp=$('#lipatan'), panel=[];
  var s=el('div','panel sampul'); s.appendChild(el('h2',null,'Untuk '+PENERIMA)); s.appendChild(el('p',null,'bacanya pelan-pelan, ya')); s.appendChild(el('span','gagang')); panel.push(s);
  var daftar=SURAT.length?SURAT:[''];
  daftar.forEach(function(t,i){ var p=el('div','panel'); p.appendChild(el('p','par',t)); if(i===daftar.length-1) p.appendChild(el('div','ttd',''+PENGIRIM)); else p.appendChild(el('span','gagang'));
    p.appendChild(el('div','no',(i+1)+' / '+daftar.length)); panel.push(p); });
  panel.forEach(function(p,i){ p.style.zIndex=panel.length-i; lp.appendChild(p); });
  var atas=0;
  MASUK[3]=function(){ petunjuk('Di bagian dalam bungkusnya ada tulisan. <b>Buka lipatannya ke kiri.</b>'); };
  panel.forEach(function(p,i){
    if(i===panel.length-1) return;
    seret(p,{
      boleh:function(){ return i===atas; },
      down:function(){ p.classList.add('seret'); },
      move:function(e,dx){ p.style.setProperty('--a',(-klem(-dx/(p.offsetWidth*.8),0,1)*180)+'deg'); },
      up:function(e,dx){ p.classList.remove('seret'); var t=klem(-dx/(p.offsetWidth*.8),0,1);
        if(t>.38){ p.style.setProperty('--a','-180deg'); p.classList.add('pergi'); SFX.kertas(); atas++;
          if(atas===panel.length-1) setTimeout(function(){ lanjut(berikut,'Bagi cokelatnya'); },2400);
          petunjuk(atas===panel.length-1?'…':'<b>Buka lipatan berikutnya.</b>'); }
        else { p.style.setProperty('--a','0deg'); if(t<.04) kedip(); } }
    });
  });
})();

/* ═ 5 · cokelat dipatahkan dua ═ */
(function(){
  var sn=$('#separuhN'), bt=$('#batang'), beres=false;
  $('#labelKu').textContent='untukmu, '+PENERIMA; $('#labelDia').textContent='untuk '+PENGIRIM;
  MASUK[4]=function(){ petunjuk('Cokelat terakhir untuk dibagi berdua. <b>Patahkan di tengah</b>, tarik separuh kanannya.'); };
  seret(sn,{
    boleh:function(){ return !beres; },
    down:function(){ sn.classList.add('seret'); },
    move:function(e,dx){ if(beres) return; var x=klem(dx,0,U()*16); sn.style.transform='translateX('+(x*.25)+'px) rotate('+(x/U()*.3)+'deg)'; if(x>=U()*14) patah(); },
    up:function(){ if(beres) return; sn.classList.remove('seret'); sn.style.transform=''; kedip(); }
  });
  function patah(){
    beres=true; sn.classList.remove('seret'); SFX.patah(); buzz([15,30,15]); bt.classList.add('patah'); sn.style.transform='translateX(calc(var(--u)*6)) rotate(5deg)';
    var c=pusat(bt); konfeti(c.x,c.y,60,['#5A372F','#8A5A44','#F2A7B8']);
    var j=$('#judulAkhir'); j.innerHTML=''; j.appendChild(document.createTextNode('Selamat Hari Valentine')); j.appendChild(el('small',null,'separuh untukmu, separuh untuk '+PENGIRIM));
    setTimeout(function(){ j.classList.add('tampil'); },300);
    setTimeout(function(){ ptj.hidden=true; var t=$('#balasTeks'); t.value='Selamat Valentine juga! Cokelatnya aku simpan separuh, ya 🍫';
      $('#akhirJudul').textContent='Mau balas ke '+PENGIRIM+'?'; bt.style.display='none';
      if(!pasangBalasan($('#balasAksi'),t,'t-utama','t-wa')){ t.style.display='none'; $('#akhirJudul').textContent='Selamat Valentine, '+PENERIMA+'.'; }
      $('#akhir').classList.add('tampil'); },1800);
  }
  $('#ulang').onclick=function(){ location.reload(); };
})();

ke(0);

}
window.FV_MULAI=FV_MULAI;
</script>
<script>
(function(){
  "use strict";
  var tirai=document.getElementById("memuat");
  var data=null; try{ data=JSON.parse(document.getElementById("foreverse-data").textContent||"{}"); }catch(e){ data={}; }
  if(!data||!data.penerima){ document.getElementById("memuatPesan").textContent="Suratnya tidak bisa dibuka sekarang. Minta tautan yang benar ke pengirimnya, ya."; return; }
  window.KADO=data;
  var tugas=(data.foto||[]).filter(function(f){ return f&&f.src; }).map(function(f){ return new Promise(function(b){ var im=new Image(); im.onload=im.onerror=b; im.src=f.src; }); });
  Promise.race([Promise.all(tugas),new Promise(function(r){ setTimeout(r,12000); })]).then(function(){ FV_MULAI(); tirai.classList.add("pergi"); setTimeout(function(){ tirai.remove(); },420); });
