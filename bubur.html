body{background:linear-gradient(180deg,#F7E9D7,#EBD3B8)}

.api i{width:calc(var(--u)*3);height:calc(var(--u)*7);border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse at 50% 80%,#BFE4FF,#3A7BFF 60%,transparent 70%);animation:apiN .25s infinite alternate}

.panci{position:absolute;left:50%;bottom:44%;width:calc(var(--u)*44);height:calc(var(--u)*24);margin-left:calc(var(--u)*-22);border-radius:0 0 calc(var(--u)*6) calc(var(--u)*6);background:linear-gradient(90deg,#9AA0A8,#D9DDE2 40%,#8C929A)}
.panci::before{content:"";position:absolute;left:-6%;right:-6%;top:-4%;height:16%;border-radius:6px;background:#B5BAC1}

.kenop{position:absolute;bottom:10%;width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:50%;border:0;background:radial-gradient(circle,#ECECEC 0 30%,#BDBDBD 31% 60%,#8A8A8A 62%);cursor:pointer;transition:transform .4s}

.kenop.k1{left:22%}.kenop.k2{right:22%;opacity:.5;pointer-events:none}

/* aduk */
.atas-panci{position:relative;width:calc(var(--u)*66);height:calc(var(--u)*66);flex:none;border-radius:50%;background:radial-gradient(circle,transparent 0 80%,#B5BAC1 81% 88%,#8C929A 89%);touch-action:none;cursor:grab}

.sendok::after{content:"";position:absolute;left:calc(var(--u)*-5);top:calc(var(--u)*-30);width:calc(var(--u)*10);height:calc(var(--u)*7);border-radius:50%;background:#8A5A35}

@keyframes putarA{to{transform:rotate(360deg)}}
.putaran{display:flex;gap:8px}.putaran i{width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;border:2px solid var(--merah)}.putaran i.isi{background:var(--merah)}
.semangat-l{list-style:none;margin:0;padding:0;width:min(90vw,calc(var(--u)*88));display:flex;flex-direction:column;gap:calc(var(--u)*2)}

.meja-b{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)}
.mangkuk{position:relative;width:calc(var(--u)*56);height:calc(var(--u)*28);flex:none}

.mangkuk .badan-m{position:absolute;left:0;right:0;top:14%;bottom:0;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(#FFFFFF,#EDE6DA);box-shadow:inset 0 calc(var(--u)*-2) 0 rgba(0,0,0,.05),0 8px 16px rgba(120,70,30,.2)}

.tabur{position:absolute;width:6px;height:4px;border-radius:2px}
