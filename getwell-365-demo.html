    P=P.filter(function(p){ p.vy+=.12; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; return p.y<H+20; });
    P.forEach(function(p){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(P.length) requestAnimationFrame(langkah); else jalan=false; }
  return function(x,y,n,warna){ ukur(); var C=warna||['#E8734A','#E8A5B0','#F5C85B','#3B3168','#FBFAF7'];
    for(var i=0;i<(n||90);i++) P.push({x:x,y:y,vx:rand(-6,6),vy:rand(-11,-3),r:rand(0,6),vr:rand(-.3,.3),s:rand(6,11),c:C[i%C.length]});
    if(!jalan){ jalan=true; requestAnimationFrame(langkah); } };
})();

/* petunjuk & tombol lanjut — bentuknya diatur CSS tiap tema */
var ptj=$('#petunjuk'), ptjT=null, tLanjut=$('#lanjut'), lanjutFn=null;
function petunjuk(h){ ptj.classList.add('ganti'); clearTimeout(ptjT); ptjT=setTimeout(function(){ ptj.innerHTML=h; ptj.classList.remove('ganti'); },200); ptj.hidden=false; }
function kedip(){ ptj.classList.remove('kedip'); void ptj.offsetWidth; ptj.classList.add('kedip'); }
/* LANJUT_OTOMATIS (ms): tema yang adegannya berjalan sendiri (kereta, lomba, hitung mundur)
   tidak menunggu ketukan; tombolnya jadi penanda yang terisi lalu berpindah sendiri. */
var LANJUT_OTOMATIS=0, tOto=null;
function lanjut(fn,label){ lanjutFn=fn; tLanjut.textContent=label||'Lanjut'; ptj.hidden=true; tLanjut.classList.add('tampil');
  if(LANJUT_OTOMATIS){ tLanjut.classList.remove('otomatis'); void tLanjut.offsetWidth; tLanjut.style.setProperty('--oto',LANJUT_OTOMATIS+'ms'); tLanjut.classList.add('otomatis'); clearTimeout(tOto); tOto=setTimeout(function(){ tLanjut.onclick(); },LANJUT_OTOMATIS); } }
tLanjut.onclick=function(){ clearTimeout(tOto); if(!lanjutFn) return; var f=lanjutFn; lanjutFn=null; tLanjut.classList.remove('tampil','otomatis'); SFX.klik(); f(); };

/* penutup: tombol balasan ke email pembeli (fvBalas), WhatsApp kedua */
function pasangBalasan(wadah, teks, kelasUtama, kelasWa){
  var wa=String(D.waPengirim||'').replace(/\D/g,''); if(wa.charAt(0)==='0') wa='62'+wa.slice(1);
  var ada=false;
  if(window.fvBalas){ wadah.appendChild(fvBalas.tombol(teks,el('button',kelasUtama),'Kirim balasan ke '+PENGIRIM)); ada=true; }
  if(wa.length>=10){ var a=el('a',kelasWa,ada?'atau lewat WhatsApp':'Balas lewat WhatsApp'); a.href='https://wa.me/'+wa; a.target='_blank'; a.rel='noopener';
    a.addEventListener('click',function(){ a.href='https://wa.me/'+wa+'?text='+encodeURIComponent(teks.value); }); wadah.appendChild(a); ada=true; }
  return ada;
}

/* ═══════════════════════════════════════════════════════════════
   36,5 (Get Well Soon), dibangun ulang. Satu angka mengikat semua
   adegan: suhu di kepala halaman turun dari 38,9 ke 36,5 setiap kali

SFX.bip=function(){ tone(2100,.09,{type:'square',vol:.12}); };

(function(){ var h=$('#hariKe');

$('#suhu').textContent='--,-'; $('#air').style.width='0%';

/* 2 · kompres: celup handuk ke baskom, lalu taruh di bantal */
(function(){
  var h=$('#handuk'), bk=$('#baskom'), bt=$('#bantal'), basah=false, beres=false;
  MASUK[1]=function(){ petunjuk('<b>Celupkan handuknya ke baskom</b> dulu, baru taruh di bantal.'); };
  seret(h,{ boleh:function(){ return !beres; },
    down:function(){ h.style.transition='none'; },
    move:function(e,dx,dy){ h.style.transform='translate('+dx+'px,'+dy+'px)'; },
    up:function(){ h.style.transition='transform .4s';
      if(!basah && dekat(h,bk,U()*16)){ basah=true; h.classList.add('basah'); SFX.tetes(); setTimeout(SFX.tetes,120); buzz(10); petunjuk('Sudah dingin. Sekarang <b>taruh di bantal</b>.'); }
      else if(basah && dekat(h,bt,U()*22)){ beres=true; var b=bt.getBoundingClientRect(), a=h.getBoundingClientRect(), p=h.style.transform.match(/-?[\d.]+/g)||[0,0];
        h.style.transform='translate('+(+p[0]+b.left+b.width/2-a.left-a.width/2)+'px,'+(+p[1]+b.top+b.height*.35-a.top-a.height/2)+'px)'; bt.classList.add('ada'); SFX.benar(); suhu(38.2); selesai(); return; }
      else if(!basah && dekat(h,bt,U()*22)){ petunjuk('Handuknya masih kering. <b>Celupkan ke baskom</b> dulu.'); kedip(); }
      h.style.transform=''; } });
  function selesai(){ var c=$('#catatan'); ENAKAN.forEach(function(s,i){ var n=el('span',null,s); n.style.setProperty('--r',(i%2?1.5:-1.5)+'deg'); n.style.animationDelay=(i*.25)+'s'; c.appendChild(n); });
    petunjuk(ENAKAN.length?'38,2. Di nakas ada catatan: hal-hal yang bikin kamu enakan.':'38,2. Sudah lebih adem.'); setTimeout(function(){ lanjut(berikut,'Minum obat'); },2200); }
})();

/* 3 · game sirup: tahan untuk menuang, lepas tepat di garis sendok */
(function(){
  var tb=$('#tuang'), bo=$('#botol'), sd=$('#sendok'), ca=$('#cairan'), ol=$('#resepDosis'), daftar=DOSIS.length?DOSIS:[{teks:'Istirahat yang cukup.',aturan:'sepanjang hari'}], r=0, lv=0, tm=null, t0=0, beres=false, tuang=false;
  MASUK[2]=function(){ petunjuk('<b>Tahan tombolnya untuk menuang</b>, lepas saat sirup ada di antara dua garis. Jangan sampai tumpah.'); };
  tb.addEventListener('pointerdown',function(e){ e.preventDefault(); ac(); if(beres||tuang) return; tuang=true; bo.classList.add('miring'); lv=0; t0=performance.now();
    var laju=55+r*20; tm=setInterval(function(){ lv=(performance.now()-t0)/1000*laju; ca.style.height=Math.min(lv,100)+'%'; if(Math.random()<.3) SFX.tetes();
      if(lv>100){ lepas(true); } },40); });
  function lepas(tumpah){ if(!tuang) return; tuang=false; clearInterval(tm); bo.classList.remove('miring');
    if(!tumpah && lv>=60 && lv<=74){ SFX.benar(); buzz(15); var d=daftar[r], li=el('li'); li.appendChild(el('small',null,'dosis '+(r+1)+(d.aturan?' · '+d.aturan:''))); li.appendChild(document.createTextNode(d.teks)); ol.appendChild(li);
      r++; setTimeout(function(){ ca.style.height='0'; },700);
      if(r>=daftar.length){ beres=true; suhu(37.6); petunjuk('Semua dosis pas. 37,6.'); setTimeout(function(){ lanjut(berikut,'Segelas air'); },2000); }
      else petunjuk('Pas! <b>Sendok berikutnya</b>, kali ini sirupnya keluar lebih cepat.'); }
    else { SFX.salah(); sd.classList.add('tumpah'); setTimeout(function(){ sd.classList.remove('tumpah'); ca.style.height='0'; },500);
      petunjuk(tumpah||lv>74?'Kebanyakan, tumpah. <b>Lepas lebih cepat</b>.':'Masih kurang. <b>Tahan sedikit lebih lama</b>.'); } }
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ tb.addEventListener(ev,function(){ lepas(false); }); }); noMenu(tb);
})();

/* 4 · segelas air: geser gelasnya ke atas untuk meminum */
(function(){

  seret(g,{ boleh:function(){ return !beres; }, down:function(){ g.style.transition='none'; },
    move:function(e,dx,dy){ var m=klem(-dy/(U()*30),0,1); g.style.transform='rotate('+(-m*38)+'deg) translateY('+(-m*U()*6)+'px)';

(function(){

  var jd=$('#jendela'), im=$('#jdImg'), kt=$('#jdKet'), tl=$('#tali'), i=0, beres=false, sibuk=false;
