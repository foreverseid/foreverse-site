<script>
/* ═══════════════════════════════════════════════════════════════
   FOREVERSE · SURAT (penyaji) · Tema Bait × Birthday
   File ini tidak berisi data siapa pun. Isinya diambil dari
   /api/surat?kode=... berdasarkan kode di alamat /s/<kode>,
   atau dari sessionStorage saat dibuka sebagai pratinjau dari
   halaman /pesan (lihat skrip pemuat di bagian bawah berkas ini).
   ═══════════════════════════════════════════════════════════════ */
var KADO = {
  penerima:"", pengirim:"", ucapan:"selamat",
  tanggalLahir:"", sembunyikanUmur:false,
  foto:[], rahasia:"", surat:["","",""],
  lagu:{file:"",mulai:0,selesai:0}, waPengirim:""
};
</script>
<style>
/* ═══════════════════════════════════════════════════════════════
   FOREVERSE · Tema Bait × Birthday (dirombak total 3-11-2026)
   Satu hari menerima pos: kotak pos di depan rumah → amplop dibuka
   dengan pisau surat → album perangko umur → rak kartu pos berisi
   foto → kertas tipis diterawang ke lampu → kartu ucapan dibalik
   lembar demi lembar → paket balasan ditimbang pas → bendera kotak
   pos dinaikkan, balasan dikirim.
   Satu layar, tidak di-scroll. Ukuran memakai --u supaya sama rapi
   di HP tegak dan laptop/landscape.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#16161A; --cream:#FBFAF7; --stone:#E4E2DC; --violet:#3B3168; --coral:#E8734A; --blush:#E8A5B0;
  --kraft:#D8B78A; --kayu:#B98A5E; --kuning:#F5C85B; --muted:#6E6A78;
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --tangan:'Caveat',cursive;
  --u:min(1vw,.5vh);
}
@media (min-aspect-ratio:1/1){ :root{ --u:min(.62vw,.92vh); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2346;color:var(--ink);font-family:var(--sans)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
button{font-family:var(--sans)}

/* ── latar: halaman depan rumah & meja kayu (kamera bergeser di meja) ── */
.latar{position:fixed;inset:0;transition:opacity .9s ease}
.luar{background:
  linear-gradient(180deg,#F6E7D5 0%,#F3DCC6 46%,transparent 46.2%),
  repeating-linear-gradient(90deg,#CBBFAE 0 calc(var(--u)*1.2),#D9CFC1 calc(var(--u)*1.2) calc(var(--u)*13)),
  #D9CFC1;background-size:100% 100%,100% 100%;}
.luar::before{content:"";position:absolute;left:0;right:0;top:46%;height:4%;background:#BFB2A0;box-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.06)}
.luar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#8FA27A,#76895f);box-shadow:inset 0 calc(var(--u)*1.2) 0 #9DB087}
.meja{opacity:0;background-color:#B98A5E;
  background-image:
    repeating-linear-gradient(92deg,rgba(80,45,15,.07) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(90deg,rgba(255,235,205,.08) 0 1px,transparent 1px 37px),
    linear-gradient(90deg,#A97A4E,#C29466 30%,#B3845A 55%,#C69A6C 80%,#A97A4E);
  background-size:auto,auto,260% 100%;background-position:0 0,0 0,var(--geser,0%) 0;
  transition:opacity .9s ease,background-position 1.1s cubic-bezier(.6,.05,.3,1)}
.meja::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(40,20,5,.35))}
body.di-meja .luar{opacity:0} body.di-meja .meja{opacity:1}

/* ── kepala & petunjuk ── */
.kepala{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
.langkah{background:rgba(22,22,26,.78);color:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.langkah b{color:var(--kuning)}
.kepala .sela{flex:1}
.kepala button{border:0;background:rgba(251,250,247,.92);color:var(--ink);border-radius:99px;height:34px;min-width:34px;padding:0 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
#lewati{display:none} body.boleh-lewati #lewati{display:block}
.petunjuk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:40;max-width:min(92vw,560px);
  background:rgba(251,250,247,.95);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:14px;line-height:1.45;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.18);transition:opacity .3s,transform .3s}
.petunjuk b{color:var(--coral)}
.petunjuk.ganti{opacity:0;transform:translateX(-50%) translateY(6px)}
.petunjuk.kedip{animation:kedip .5s 2}
@keyframes kedip{50%{background:#FFE3B8}}
.lanjut{border:0;background:var(--violet);color:#fff;font-weight:800;font-size:15px;border-radius:99px;padding:13px 26px;box-shadow:0 6px 18px rgba(59,49,104,.35);cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:.4s}
.lanjut.tampil{opacity:1;transform:none;pointer-events:auto}

/* ── adegan ── */
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);
  opacity:0;pointer-events:none;transform:translateX(45%);transition:opacity .7s ease,transform 1.1s cubic-bezier(.6,.05,.3,1)}
.sc.aktif{opacity:1;pointer-events:auto;transform:none}
.sc.lewat{transform:translateX(-45%);opacity:0}
@media (min-aspect-ratio:1/1){ .sc{flex-direction:row;gap:calc(var(--u)*8)} .sc.tegak{flex-direction:column;gap:calc(var(--u)*3)} }
.sc>*,.timbang-wrap>*,.barang-wrap>*,.kolom>*{flex-shrink:0}
.judul-sc{font-family:var(--serif);color:#fff;text-align:center;font-size:calc(var(--u)*6);line-height:1.15;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.kolom{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)}

/* ═════ 1 · kotak pos ═════ */
.kp{position:relative;width:calc(var(--u)*60);height:calc(var(--u)*96)}
.kp-tiang{position:absolute;left:50%;bottom:0;width:calc(var(--u)*9);height:calc(var(--u)*34);transform:translateX(-50%);background:linear-gradient(90deg,#7a5434,#9b6e47 45%,#6e4b2e);border-radius:3px 3px 0 0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.2)}
.kp-badan{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*64);border-radius:calc(var(--u)*30) calc(var(--u)*30) calc(var(--u)*3) calc(var(--u)*3);
  background:linear-gradient(90deg,#251d47,#4a3f86 30%,#5a4f98 48%,#3b3168 70%,#231b42);box-shadow:0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,0,0,.28),inset 0 calc(var(--u)*1.5) 0 rgba(255,255,255,.12)}
.kp-dalam{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*17);height:calc(var(--u)*34);border-radius:calc(var(--u)*2);background:linear-gradient(180deg,#120e22,#2a2248);box-shadow:inset 0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.6)}
.kp-amplop{position:absolute;left:calc(var(--u)*10);right:calc(var(--u)*10);top:calc(var(--u)*22);height:calc(var(--u)*26);border-radius:3px;background:linear-gradient(180deg,#F8EEDD,#EADBC2);box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:3;touch-action:none;cursor:grab;transform-origin:50% 0}
.kp-amplop::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 49.5%,rgba(120,90,50,.18) 50%,transparent 51%),linear-gradient(20deg,transparent 49.5%,rgba(120,90,50,.18) 50%,transparent 51%)}
.kp-amplop span{position:absolute;left:12%;top:28%;font-family:var(--tangan);font-size:calc(var(--u)*5.4);color:var(--violet);font-weight:700}
.kp-pintu{position:absolute;left:calc(var(--u)*4.5);right:calc(var(--u)*4.5);top:calc(var(--u)*15.5);height:calc(var(--u)*37);border-radius:calc(var(--u)*2.4);z-index:4;
  background:linear-gradient(90deg,#2e2558,#54489a 35%,#6458a6 50%,#463b7d 72%,#2b2252);box-shadow:inset 0 0 0 calc(var(--u)*.8) rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.35);
  transform-origin:50% 100%;transform:perspective(calc(var(--u)*90)) rotateX(var(--buka,0deg));touch-action:none;cursor:grab}
.kp-pintu::before{content:"";position:absolute;left:12%;right:12%;top:14%;height:calc(var(--u)*1.6);border-radius:99px;background:#1a1433;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.kp-gagang{position:absolute;left:50%;top:calc(var(--u)*6);width:calc(var(--u)*14);height:calc(var(--u)*4.2);transform:translateX(-50%);border-radius:99px;background:linear-gradient(180deg,#F7D983,#C99A2E);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.kp-tulis{position:absolute;left:0;right:0;bottom:calc(var(--u)*5);text-align:center;font-family:var(--serif);font-weight:600;letter-spacing:.2em;color:rgba(255,255,255,.75);font-size:calc(var(--u)*3.4)}
.kp-papan{position:absolute;left:50%;top:calc(var(--u)*54.5);transform:translateX(-50%);background:linear-gradient(180deg,#F3D78E,#C9A044);color:#3a2a08;font-family:var(--serif);font-weight:700;letter-spacing:.18em;font-size:calc(var(--u)*3.6);padding:calc(var(--u)*.8) calc(var(--u)*4);border-radius:calc(var(--u)*1);box-shadow:0 2px 4px rgba(0,0,0,.35);white-space:nowrap}
.kp-bendera{position:absolute;right:calc(var(--u)*-1.5);top:calc(var(--u)*28);width:calc(var(--u)*3);height:calc(var(--u)*3);z-index:5}
.kp-lengan{position:absolute;left:50%;top:50%;width:calc(var(--u)*2.2);height:calc(var(--u)*24);margin-left:calc(var(--u)*-1.1);transform-origin:50% 0;transform:rotate(var(--sudut,0deg));border-radius:99px;background:linear-gradient(90deg,#c9c3b8,#f2efe8,#b7b0a4);box-shadow:0 2px 3px rgba(0,0,0,.3);touch-action:none;cursor:grab}
.kp-lengan::after{content:"";position:absolute;left:calc(var(--u)*1);top:calc(var(--u)*15);width:calc(var(--u)*10);height:calc(var(--u)*9);background:linear-gradient(180deg,#F08A5D,#D8603A);border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.kp-poros{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#9b958b);box-shadow:0 1px 2px rgba(0,0,0,.4);z-index:2}
.tarik-isyarat{position:absolute;left:50%;transform:translateX(-50%);color:#fff;font-size:calc(var(--u)*7);animation:turun 1.4s ease-in-out infinite;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.4);z-index:6}
@keyframes turun{0%,100%{transform:translate(-50%,0);opacity:.4}50%{transform:translate(-50%,calc(var(--u)*3));opacity:1}}

/* ═════ 2 · amplop & pisau surat (dilihat dari atas meja) ═════ */
.ampl-wrap{position:relative;width:calc(var(--u)*86);height:calc(var(--u)*92)}
@media (min-aspect-ratio:1/1){ .ampl-wrap{width:calc(var(--u)*128);height:calc(var(--u)*70)} }
.ampl{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*6);width:calc(var(--u)*80);height:calc(var(--u)*52);border-radius:4px;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 60%),repeating-linear-gradient(35deg,rgba(120,80,30,.05) 0 2px,transparent 2px 6px),linear-gradient(160deg,#E0C397,#CFAE7E);
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*3) rgba(40,20,5,.35)}
@media (min-aspect-ratio:1/1){ .ampl{top:calc(var(--u)*9)} }
.ampl-alamat{position:absolute;left:12%;top:44%;font-family:var(--tangan);color:#2a2346;line-height:1.05}
.ampl-alamat b{display:block;font-size:calc(var(--u)*7.4)}
.ampl-alamat i{font-style:normal;font-size:calc(var(--u)*4.4);opacity:.75}
.ampl-alamat::after{content:"";display:block;width:calc(var(--u)*42);height:1px;margin-top:calc(var(--u)*1.5);background:rgba(42,35,70,.3);box-shadow:0 calc(var(--u)*5) 0 rgba(42,35,70,.2)}
.ampl-perangko{position:absolute;right:calc(var(--u)*4);top:calc(var(--u)*5);width:calc(var(--u)*11);height:calc(var(--u)*13.5);background:#fff;padding:calc(var(--u)*.9);
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 60%,transparent 62%) 0 0/calc(var(--u)*1.6) calc(var(--u)*1.6) round,linear-gradient(#000,#000) content-box;mask:radial-gradient(circle at 50% 50%,#000 60%,transparent 62%) 0 0/calc(var(--u)*1.6) calc(var(--u)*1.6) round,linear-gradient(#000,#000) content-box;transform:rotate(3deg)}
.ampl-perangko::before{content:"";position:absolute;inset:calc(var(--u)*.9);background:linear-gradient(160deg,#E8A5B0,#c97d8b)}
.ampl-cap{position:absolute;right:calc(var(--u)*9);top:calc(var(--u)*4);width:calc(var(--u)*17);height:calc(var(--u)*17);border:2px solid rgba(40,30,60,.55);border-radius:50%;
  display:grid;place-items:center;font-size:calc(var(--u)*2.2);font-weight:800;color:rgba(40,30,60,.6);text-align:center;line-height:1.2;letter-spacing:.06em;transform:rotate(-14deg)}
.ampl-gelombang{position:absolute;right:calc(var(--u)*-1);top:calc(var(--u)*8);width:calc(var(--u)*16);height:calc(var(--u)*9);opacity:.55}
.ampl-takik{position:absolute;left:calc(var(--u)*-1);top:calc(var(--u)*-1.6);width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;border:2px dashed #fff;animation:denyut 1.2s ease-in-out infinite}
@keyframes denyut{50%{transform:scale(1.25);opacity:.4}}
.ampl-potong{position:absolute;left:0;top:calc(var(--u)*1.2);height:calc(var(--u)*.7);width:0;background:#3b2a16;box-shadow:0 1px 0 rgba(255,255,255,.5);border-radius:2px}
.ampl-pita{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*1.2);background:linear-gradient(180deg,#e7cba0,#d5b585);border-radius:4px 4px 0 0}
.pisau{position:absolute;width:calc(var(--u)*46);height:calc(var(--u)*7);touch-action:none;cursor:grab;transform-origin:0 50%;z-index:5;filter:drop-shadow(0 calc(var(--u)*1.2) calc(var(--u)*1) rgba(40,20,5,.35))}
.pisau svg{width:100%;height:100%;display:block}
.isi-amplop{position:absolute;left:calc(var(--u)*8);top:calc(var(--u)*4);width:calc(var(--u)*70);height:calc(var(--u)*46);pointer-events:none}
.isi-amplop div{position:absolute;left:0;right:0;bottom:0;height:100%;border-radius:3px;transition:transform 1s cubic-bezier(.3,1.2,.4,1)}
.isi-a{background:#FBFAF7;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.isi-b{background:#E8A5B0;left:4%!important;right:4%!important}
.isi-c{background:#fff;left:8%!important;right:8%!important;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ═════ 3 · album perangko umur ═════ */
.album{position:relative;width:calc(var(--u)*78);padding:calc(var(--u)*5) calc(var(--u)*5) calc(var(--u)*4);background:linear-gradient(180deg,#2d2a33,#232028);border-radius:calc(var(--u)*2);box-shadow:0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.4)}
.album h3{margin:0 0 calc(var(--u)*3);color:#efe6d4;font-family:var(--serif);font-weight:600;font-size:calc(var(--u)*4.2);text-align:center;letter-spacing:.03em}
.album-baris{display:flex;justify-content:space-around;gap:calc(var(--u)*4)}
.slot{position:relative;width:calc(var(--u)*27);height:calc(var(--u)*33);background:rgba(255,255,255,.06);border-radius:4px;display:flex;align-items:center;justify-content:center}
.slot::after{content:"";position:absolute;left:-4%;right:-4%;top:58%;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.12));border-top:1px solid rgba(255,255,255,.35);pointer-events:none;z-index:3}
.slot.kosong{outline:2px dashed rgba(245,200,91,.8);outline-offset:-6px}
.slot-ket{position:absolute;left:0;right:0;bottom:calc(var(--u)*-5.2);text-align:center;font-family:var(--tangan);color:#efe6d4;font-size:calc(var(--u)*4.2)}
.prk{position:relative;width:calc(var(--u)*23);height:calc(var(--u)*28);background:#fff;padding:calc(var(--u)*1.3);
  -webkit-mask:radial-gradient(circle,#000 58%,transparent 60%) 0 0/calc(var(--u)*2.2) calc(var(--u)*2.2) round,linear-gradient(#000,#000) content-box;mask:radial-gradient(circle,#000 58%,transparent 60%) 0 0/calc(var(--u)*2.2) calc(var(--u)*2.2) round,linear-gradient(#000,#000) content-box}
.prk-isi{position:absolute;inset:calc(var(--u)*1.3);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.prk-lama .prk-isi{background:linear-gradient(170deg,#cdbfdf,#9f8fbf)}
.prk-baru .prk-isi{background:linear-gradient(170deg,#F7C8CF,#E8A5B0 55%,#d98794)}
.prk-angka{position:relative;font-family:var(--serif);font-weight:700;font-size:calc(var(--u)*13);line-height:1;color:var(--violet);letter-spacing:-.04em}
.prk-angka.panjang{font-size:calc(var(--u)*7.4)}
.prk-mata{position:absolute;left:0;right:0;top:30%;display:flex;justify-content:center;gap:calc(var(--u)*2.2);z-index:2}
.prk-mata i{display:block;width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);border-radius:50%;background:radial-gradient(circle at 55% 55%,var(--ink) 0 34%,#fff 36%);box-shadow:0 0 0 calc(var(--u)*.45) var(--ink);transition:.25s}
.prk.tidur .prk-mata i{height:calc(var(--u)*.7);border-radius:2px;background:var(--ink);box-shadow:none;margin-top:calc(var(--u)*1.4)}
.prk-mulut{position:absolute;left:50%;top:60%;width:calc(var(--u)*5);height:calc(var(--u)*2.6);margin-left:calc(var(--u)*-2.5);background:#fff;border:calc(var(--u)*.6) solid var(--ink);border-top:0;border-radius:0 0 99px 99px;transition:.25s;z-index:2}
.prk.tidur .prk-mulut{height:0;background:none;border-width:calc(var(--u)*.6) 0 0;border-radius:0;width:calc(var(--u)*3);margin-left:calc(var(--u)*-1.5)}
.prk-tulis{font-size:calc(var(--u)*2);font-weight:800;letter-spacing:.12em;color:rgba(59,49,104,.75);margin-top:calc(var(--u)*.8)}
.prk-cap{position:absolute;inset:-10%;pointer-events:none;opacity:.72}
.lembar{position:relative;display:grid;grid-template-columns:repeat(2,calc(var(--u)*23));margin-bottom:calc(var(--u)*4);gap:0;padding:calc(var(--u)*2.4);background:#fff;border-radius:2px;box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*3) rgba(40,20,5,.35);transform:rotate(-3deg)}
.lembar .prk{touch-action:none;cursor:grab}
.lembar-ket{position:absolute;left:0;right:0;bottom:calc(var(--u)*-6);text-align:center;font-family:var(--tangan);color:#fff;font-size:calc(var(--u)*4.4);text-shadow:0 1px 3px rgba(0,0,0,.4)}

    if(window.fvBalas){ var contoh=el('button','tbl-utama'); aksi.insertBefore(fvBalas.tombol(txt,contoh,'Kirim balasan ke '+PENGIRIM),aksi.firstChild); }
    if(adaWa){ var w=$('#waBtn'); w.hidden=false; w.textContent=window.fvBalas?'atau lewat WhatsApp':'Balas lewat WhatsApp';
      w.href='https://wa.me/'+wa; w.addEventListener('click',function(){ this.href='https://wa.me/'+wa+'?text='+encodeURIComponent(txt.value); }); }
    if(!window.fvBalas && !adaWa){ txt.style.display='none'; $('#balasJudul').textContent='Benderanya naik. Terima kasih sudah membuka semuanya.'; }
    box.classList.add('tampil');
  }
  $('#ulang').onclick=function(){ location.reload(); };
})();

ke(0);
}
window.FV_MULAI = FV_MULAI;
</script>

<script>
/* ══════════════════════════════════════════════════════════════
   Pemuat: ambil isi surat, lalu jalankan tampilannya.
   Dua cara pakai -
     /s/<kode>              → diambil dari server
     /surat.html#pratinjau  → dibuka dari halaman /pesan lewat tombol
                              "Lihat pratinjau penuh"; isinya diambil
                              dari sessionStorage, bukan postMessage -
                              tema ini terkunci-game, jadi pratinjau
                              dimuat ulang penuh tiap kali dibuka,
                              bukan ditambal sebagian saat mengetik.
   ══════════════════════════════════════════════════════════════ */
(function(){
  "use strict";
  var tirai = document.getElementById("memuat");
  var pesanTirai = document.getElementById("memuatPesan");

  function gagal(t){
    if(!tirai) return;
    tirai.classList.add("gagal");
    pesanTirai.textContent = t;
  }
  function tutupTirai(){ if(tirai){ tirai.classList.add("pergi"); setTimeout(function(){ tirai.remove(); },420); } }

  function pasang(data){
    KADO = Object.assign({
      penerima:"", pengirim:"", ucapan:"selamat",
      tanggalLahir:"", sembunyikanUmur:false,
      foto:[], rahasia:"", surat:["","",""],
      lagu:{file:"",mulai:0,selesai:0}, waPengirim:""
    }, data || {});
  }

  /* ── mode pratinjau: isi datang dari sessionStorage, ditulis oleh /pesan ── */
  if(location.hash === "#pratinjau" || location.search.indexOf("pratinjau") > -1){
    var mentah = null;
    try{ mentah = sessionStorage.getItem("fv-pratinjau"); }catch(_){}
    if(!mentah){ gagal("Tidak ada pratinjau tersimpan. Buka tombol “Lihat pratinjau penuh” dari halaman /pesan."); return; }
    try{ pasang(JSON.parse(mentah)); }catch(_){ gagal("Pratinjau rusak. Coba isi formulirnya lagi."); return; }
    FV_MULAI();
    tutupTirai();
    return;
  }

  /* ── mode surat sungguhan ── */
  var kode = (location.pathname.match(/\/s\/([a-z0-9]+)/i) || [])[1]
          || new URLSearchParams(location.search).get("kode") || "";

  if(!kode){ gagal("Tautan ini tidak lengkap. Minta tautan yang benar ke pengirimnya, ya."); return; }

  /* unduh semua foto dulu di balik tirai, supaya tidak muncul sepotong-sepotong.
     Batas tunggu 12 detik - kalau sinyal sangat lambat, surat tetap dibuka. */
  function siapkanFoto(daftar){
    var tugas = (daftar || []).filter(function(f){ return f && f.src; }).map(function(f){
      return new Promise(function(beres){
        var im = new Image();
        im.onload = function(){ (im.decode ? im.decode() : Promise.resolve()).then(beres, beres); };
        im.onerror = beres;
        im.src = f.src;
      });
    });
    var batas = new Promise(function(beres){ setTimeout(beres, 12000); });
    return Promise.race([Promise.all(tugas), batas]);
  }

  fetch("/api/surat?kode=" + encodeURIComponent(kode))
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(h){
      if(!h.ok || !h.j.ok) throw new Error(h.j.pesan || "Surat tidak ditemukan.");
      pasang(h.j.isi);
      return siapkanFoto(KADO.foto).then(function(){
        FV_MULAI();
        tutupTirai();
      });
    })
    .catch(function(e){ gagal(e.message || "Suratnya tidak bisa dibuka sekarang."); });
})();
</script>
</body>
</html>
