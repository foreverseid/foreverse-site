      else if(mode==='mundur' && pos<=0){ pos=0; mode='tunggu'; berhenti=2.6; petunjuk('Kereta mundur ke wesel. <b>Pindahkan tuasnya</b> ke jalur yang menyala ke stasiun.'); J[k].kunci=false; J[k].tuas.classList.remove('kunci'); }
      else if(mode==='jalan' && seg===(J[k]&&J[k].st) && !diSinggah && pos>=len*.5){ diSinggah=true; berhenti=3.4; kenang(k); mode='singgah'; }
      if(seg) taruh(seg,Math.max(0,Math.min(len,pos)));
    }
    requestAnimationFrame(loop);
  }
  function ujungSeg(){
    if(seg===awal || (J[k] && seg===J[k].st)){ k++; if(k>=n){ seg=null; tiba(); return; } masukWesel(); return; }
    if(J[k] && seg===J[k].bu){ SFX.klakson(); buzz(60); petunjuk('Buntu! Jalurnya salah.'); mode='mundur'; arahJalan=-1; berhenti=.8; }
  }
  function masukWesel(){ var j=J[k]; j.kunci=true; j.tuas.classList.add('kunci'); mulaiSeg(j.arah==='st'?j.st:j.bu); mode='jalan'; SFX.rel(); }
  function lanjutkan(){
    if(mode==='singgah'){ $('#kenang').classList.remove('tampil'); mode='jalan'; var sisa=n-k-1; petunjuk(sisa?'Kereta jalan lagi. <b>Atur wesel berikutnya</b> sebelum keretanya sampai.':'Lanjut ke stasiun terakhir…'); return; }
    if(mode==='mundur'){ return; }
    if(mode==='tunggu'){ masukWesel(); return; }
  }
  function tiba(){ SFX.menang(); petunjuk('Sampai di Stasiun Terakhir.'); setTimeout(function(){ lanjut(berikut,'Duduk di dekat jendela'); },1400); }
  MASUK[1]=function(){ taruh(awal,0); petunjuk('Kereta singgah di tempat-tempat kita. <b>Ketuk tuas kuning</b> supaya jalurnya mengarah ke stasiun, bukan ke buntu.');
    setTimeout(function(){ mulaiSeg(awal); mode='jalan'; if(!jalanLoop){ jalanLoop=true; lalu=performance.now(); requestAnimationFrame(loop); } },2600); };
})();
