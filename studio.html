<style>
:root{
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --tangan:'Caveat',cursive;
  --u:min(1vw,.5vh);
  --awan:#3E6EA3; --awan2:#2B5280; --awan3:#6E9AC9; --arang:#1C1D22; --arang2:#2E3038; --kartu:#FFFFFF; --tinta:#1C1D22; --pink:#D94F8A; --pink2:#A8336A;
  --putih:#F7F8FB; --redup:#6B7280; --aksen:#D94F8A; --aksen2:#A8336A; --petunjuk-bg:#1C1D22; --petunjuk-tebal:#FF9CC6;
}
@media (min-aspect-ratio:1/1){ :root{ --u:min(.62vw,.92vh); } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sans);color:var(--tinta)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
.kepala{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 54px 6px;pointer-events:none}
.label-k{padding:6px 14px;border-radius:99px;font:700 12px var(--sans);letter-spacing:.04em;background:var(--kartu);color:var(--aksen2);box-shadow:0 2px 8px rgba(0,0,0,.12)}
#music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:41;border:0;width:34px;height:34px;border-radius:50%;background:var(--kartu);color:var(--tinta);font-size:15px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.petunjuk{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:65;max-width:500px;margin:0 auto;background:var(--petunjuk-bg,#1E1E24);color:var(--petunjuk-teks,#F6F2EA);padding:11px 16px 11px 42px;border-radius:12px;font:14px/1.45 var(--sans);box-shadow:0 8px 22px rgba(0,0,0,.25);transition:opacity .25s,transform .25s}
.petunjuk::before{content:"";position:absolute;left:16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--aksen);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.petunjuk b{color:var(--petunjuk-tebal,#FFD98A)}
.petunjuk.ganti{opacity:0;transform:translateY(6px)}
.petunjuk.kedip{animation:kedip .45s}
@keyframes kedip{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#lanjut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:70;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:.4s;border:0;border-radius:99px;padding:13px 24px;font:700 15px var(--sans);color:var(--aksen-teks,#fff);background:var(--aksen);box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
#lanjut::after{content:"  ›"}
#lanjut.tampil{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 84px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3.4);opacity:0;pointer-events:none;z-index:5}
.sc.aktif{opacity:1;pointer-events:auto}
.judul{margin:0;text-align:center;font:600 calc(var(--u)*6.4)/1.12 var(--serif);color:var(--tinta);opacity:0;transform:translateY(8px);transition:.6s;padding:0 16px}
.judul small{display:block;margin-top:6px;font:700 calc(var(--u)*5.4) var(--tangan);color:var(--aksen)}
.judul.tampil{opacity:1;transform:none}
.akhir{width:min(92vw,calc(var(--u)*86));background:var(--kartu);color:var(--tinta);border-radius:calc(var(--u)*2.4);padding:16px;display:none;flex-direction:column;gap:10px;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.akhir.tampil{display:flex;animation:muncul .7s ease}
@keyframes muncul{from{opacity:0;transform:translateY(12px)}}
.akhir h3{margin:0;font:600 20px/1.2 var(--serif);color:var(--aksen2)}
.akhir textarea{width:100%;min-height:76px;border:1.5px solid rgba(0,0,0,.12);border-radius:10px;padding:10px 12px;font:15px var(--sans);resize:none;background:#fff;color:var(--tinta);user-select:text;-webkit-user-select:text}
.akhir .aksi{display:flex;flex-direction:column;gap:8px}
.akhir .aksi a,.akhir .aksi button,.akhir .ulang{border:0;border-radius:99px;padding:12px;font:700 14px var(--sans);text-align:center;text-decoration:none;cursor:pointer}
.t-utama{background:var(--aksen);color:var(--aksen-teks,#fff)}.t-wa{background:#25D366;color:#073b1c}.ulang{background:transparent;color:var(--aksen2);box-shadow:inset 0 0 0 1.5px var(--aksen2)}
.dibuat{font-size:12px;color:var(--redup);text-align:center;text-decoration:none}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important} }
.dibawa{position:fixed!important;z-index:80!important;margin:0!important;transition:none!important;animation:none!important}


/* Palet: latar studio biru berawan (khas foto wisuda), kamera arang, aksen merah muda.
   Beda dari Loker Terakhir (krem, baja biru, mustard) dan Halaman Persembahan (hijau jilid, emas). */
body{background:radial-gradient(ellipse at 30% 20%,var(--awan3) 0,transparent 45%),radial-gradient(ellipse at 75% 60%,#5A86B8 0,transparent 50%),radial-gradient(ellipse at 20% 85%,#335E91 0,transparent 55%),var(--awan);transition:filter .8s}
body:not(.nyala){filter:brightness(.42) saturate(.7)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:16vh;background:linear-gradient(180deg,transparent,rgba(20,28,45,.35));pointer-events:none}
.label-k{color:var(--pink2)}
.judul{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.judul small{color:#FFD3E5}
/* 1 · saklar & softbox */
.set{position:relative;width:calc(var(--u)*86);height:calc(var(--u)*70);flex:none}
.softbox{position:absolute;top:0;width:calc(var(--u)*24);height:calc(var(--u)*30);border-radius:calc(var(--u)*1.6);background:linear-gradient(180deg,#FFFFFF,#E9EEF6);box-shadow:inset 0 0 0 calc(var(--u)*1.2) #2A2C33;opacity:.35;transition:opacity .4s,box-shadow .6s}
.softbox::after{content:"";position:absolute;left:48%;top:100%;width:calc(var(--u)*1);height:calc(var(--u)*36);background:#2A2C33}
.softbox.kiri{left:0;transform:rotate(-8deg)}.softbox.kanan{right:0;transform:rotate(8deg)}
body.nyala .softbox{opacity:1;box-shadow:inset 0 0 0 calc(var(--u)*1.2) #2A2C33,0 0 calc(var(--u)*14) rgba(255,255,255,.75)}
.kursi{position:absolute;left:50%;bottom:0;width:calc(var(--u)*20);height:calc(var(--u)*22);margin-left:calc(var(--u)*-10);border-radius:calc(var(--u)*2) calc(var(--u)*2) 0 0;background:linear-gradient(180deg,#8C5B3C,#6A422A);box-shadow:0 calc(var(--u)*-1.5) 0 #A06C49 inset}
.saklar{position:absolute;left:50%;top:calc(var(--u)*14);width:calc(var(--u)*16);height:calc(var(--u)*22);margin-left:calc(var(--u)*-8);border:0;border-radius:calc(var(--u)*2);background:#F2F3F6;box-shadow:0 6px 14px rgba(0,0,0,.3);cursor:pointer;padding:0}
.saklar i{position:absolute;left:28%;right:28%;top:22%;height:28%;border-radius:calc(var(--u)*1);background:#C9CDD6;box-shadow:inset 0 -3px 0 #A5AAB5;transition:.2s}
body.nyala .saklar i{top:50%;box-shadow:inset 0 3px 0 #A5AAB5}
.saklar.ajak{animation:ajakB 1.3s infinite}
@keyframes ajakB{0%,100%{box-shadow:0 6px 14px rgba(0,0,0,.3),0 0 0 0 rgba(217,79,138,.6)}50%{box-shadow:0 6px 14px rgba(0,0,0,.3),0 0 0 calc(var(--u)*3) rgba(217,79,138,0)}}
.saklar-ket{position:absolute;left:50%;top:calc(var(--u)*38);transform:translateX(-50%);font:700 calc(var(--u)*4.6) var(--tangan);color:#fff;white-space:nowrap;transition:opacity .4s}
body.nyala .saklar-ket{opacity:0}
/* 2 · pemotretan */
.aba{max-width:min(90vw,calc(var(--u)*90));min-height:calc(var(--u)*13);padding:calc(var(--u)*2.4) calc(var(--u)*4);border-radius:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*.6);background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18);font:600 clamp(15px,calc(var(--u)*4.4),19px)/1.35 var(--serif);color:var(--tinta);opacity:0;transform:translateY(6px);transition:.4s}
.aba.tampil{opacity:1;transform:none}
.aba small{display:block;font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--pink2);margin-bottom:2px}
.kamera{position:relative;padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*4);border-radius:calc(var(--u)*4);background:linear-gradient(180deg,var(--arang2),var(--arang));box-shadow:0 14px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.kamera::before{content:"REC";position:absolute;left:calc(var(--u)*5);top:calc(var(--u)*1);font:700 9px var(--sans);letter-spacing:.2em;color:#8C8F99}
.lcd{position:relative;overflow:hidden;border-radius:calc(var(--u)*1);background:#000;transition:width .4s,height .4s}
.lcd.T{width:calc(var(--u)*45);height:calc(var(--u)*60)}.lcd.R{width:calc(var(--u)*72);height:calc(var(--u)*54)}
.lcd img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .08s}
.lcd .bidik{position:absolute;inset:18%;border:1.5px solid rgba(255,255,255,.55);border-radius:4px;pointer-events:none;transition:border-color .2s}
.lcd.tajam .bidik{border-color:#5BE38A;box-shadow:0 0 0 2px rgba(91,227,138,.35)}
.lcd .meter{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.55);font:700 11px var(--sans);color:#fff}
.lcd.tajam .meter{color:#5BE38A}
.blitz{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
.blitz.nyala{animation:blitz .45s ease-out}
@keyframes blitz{0%{opacity:.95}100%{opacity:0}}
.kontrol{display:flex;align-items:center;gap:calc(var(--u)*4)}
.cincin{position:relative;width:calc(var(--u)*56);height:calc(var(--u)*14);border-radius:calc(var(--u)*3);background:repeating-linear-gradient(90deg,#2A2C33 0 calc(var(--u)*1.2),#43464F calc(var(--u)*1.2) calc(var(--u)*2.4));background-position:var(--gx,0) 0;box-shadow:inset 0 3px 6px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.3);touch-action:none;cursor:ew-resize}
.cincin::after{content:"⟵ putar fokus ⟶";position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--u)*3.6) var(--sans);letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.cincin.ajak{box-shadow:inset 0 3px 6px rgba(0,0,0,.6),0 0 0 3px var(--pink)}
.rana{width:calc(var(--u)*16);height:calc(var(--u)*16);border-radius:50%;border:calc(var(--u)*1.4) solid #2A2C33;background:radial-gradient(circle at 40% 35%,#F2F3F6,#B9BDC7);box-shadow:0 4px 10px rgba(0,0,0,.35);cursor:pointer;padding:0;opacity:.45;transition:opacity .3s}
.rana.siap{opacity:1;animation:ajakR 1.1s infinite}
@keyframes ajakR{50%{box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 0 calc(var(--u)*3) rgba(217,79,138,.45)}}
.baki{display:flex;gap:calc(var(--u)*2.4);min-height:calc(var(--u)*15)}
.baki .cetak{width:calc(var(--u)*13);padding:calc(var(--u)*.8) calc(var(--u)*.8) calc(var(--u)*2.4);background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);animation:jatuhC .5s cubic-bezier(.3,1.5,.5,1)}
.baki .cetak img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.baki .slot{width:calc(var(--u)*13);height:calc(var(--u)*15);border:1.5px dashed rgba(255,255,255,.45);border-radius:3px}
@keyframes jatuhC{from{transform:translateY(-30px) rotate(-8deg);opacity:0}}
/* 2b · pilih satu untuk dicetak besar */
.meja-c{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4);width:min(92vw,calc(var(--u)*92))}
.pil-c{border:0;padding:calc(var(--u)*1.4) calc(var(--u)*1.4) calc(var(--u)*2);background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.25);cursor:pointer;transform:rotate(var(--rot,0deg));transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;gap:calc(var(--u)*1.2);align-items:center}
.pil-c img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pil-c span{font:700 clamp(13px,calc(var(--u)*4),18px)/1.1 var(--tangan);color:var(--tinta);text-align:center}
.pil-c.dipilih{transform:scale(1.06) rotate(0);box-shadow:0 0 0 4px var(--pink),0 12px 24px rgba(0,0,0,.35)}
.meja-c.selesai .pil-c:not(.dipilih){opacity:.45}
@media (min-aspect-ratio:1/1){ .meja-c{grid-template-columns:repeat(4,1fr);width:min(88vw,calc(var(--u)*150))} }
/* 3 · cetakan besar ditarik dari printer */
.printer{position:relative;width:min(92vw,calc(var(--u)*92));height:calc(var(--u)*13);border-radius:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*.6) calc(var(--u)*.6);background:linear-gradient(180deg,#F2F3F6,#C9CDD6);box-shadow:0 6px 14px rgba(0,0,0,.3);z-index:3;flex:none}
.printer::after{content:"";position:absolute;left:7%;right:7%;bottom:calc(var(--u)*1.6);height:calc(var(--u)*1.4);border-radius:2px;background:#1C1D22}
.printer i{position:absolute;right:calc(var(--u)*4);top:calc(var(--u)*3);width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);border-radius:50%;background:#5BE38A;box-shadow:0 0 6px #5BE38A}
.kertas-w{position:relative;width:calc(min(92vw,calc(var(--u)*92)) * .84);height:var(--tinggi,calc(var(--u)*8));overflow:hidden;margin-top:calc(var(--u)*-2.4);transition:height .05s;flex:none}
.kertas{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:calc(var(--u)*3.4);box-shadow:0 8px 18px rgba(0,0,0,.25);touch-action:none;cursor:grab}
.kertas img{display:block;margin:0 auto;height:calc(var(--u)*50);object-fit:cover}
.kertas img.T{width:calc(var(--u)*37.5)}.kertas img.R{width:calc(var(--u)*66.7)}
.kertas .tulis{padding:calc(var(--u)*3) calc(var(--u)*1) 0}
.kertas .tulis p{margin:0 0 calc(var(--u)*2);font:500 clamp(14px,calc(var(--u)*3.9),17px)/1.5 var(--serif);color:var(--tinta)}
.kertas .tulis .ttd-k{font:700 calc(var(--u)*5.6) var(--tangan);color:var(--pink2);text-align:right}
.tarik-ket{font:700 calc(var(--u)*4.6) var(--tangan);color:#fff;animation:geserT 1.3s infinite;transition:opacity .3s}
@keyframes geserT{50%{transform:translateY(6px)}}
/* 4 · foto bareng dengan timer */
.tripod{position:relative;width:calc(var(--u)*44);height:calc(var(--u)*30);border-radius:calc(var(--u)*3);background:linear-gradient(180deg,var(--arang2),var(--arang));box-shadow:0 10px 22px rgba(0,0,0,.35);display:grid;place-items:center;flex:none}
.tripod::before{content:"";width:calc(var(--u)*17);height:calc(var(--u)*17);border-radius:50%;background:radial-gradient(circle at 40% 35%,#5A6D8C,#11131A 60%);box-shadow:0 0 0 calc(var(--u)*1.6) #3A3D46}
.tripod::after{content:"";position:absolute;left:50%;top:100%;width:calc(var(--u)*1.2);height:calc(var(--u)*12);background:#2A2C33}
.timer{position:absolute;right:calc(var(--u)*-6);top:calc(var(--u)*-6);width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;border:0;background:var(--pink);color:#fff;font:800 calc(var(--u)*3.4) var(--sans);box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer}
.timer.ajak{animation:ajakR 1.1s infinite}
.hitung{position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--u)*16) var(--sans);color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none;z-index:4}
.hasil{display:none;padding:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*7);background:#fff;box-shadow:0 12px 26px rgba(0,0,0,.3);transform:rotate(-3deg);position:relative;flex:none}
.hasil.tampil{display:block;animation:jatuhC .7s cubic-bezier(.3,1.4,.5,1)}
.hasil img{display:block;width:calc(var(--u)*40);aspect-ratio:3/4;object-fit:cover}
.hasil p{position:absolute;left:0;right:0;bottom:calc(var(--u)*1.4);margin:0;text-align:center;font:700 calc(var(--u)*4.6) var(--tangan);color:var(--tinta)}
.duo{display:flex;align-items:center;gap:calc(var(--u)*6)}
@media (min-aspect-ratio:1/1){
  #s1{flex-direction:row;gap:calc(var(--u)*8)}
  .kol{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)}
  .lcd.T{width:calc(var(--u)*40);height:calc(var(--u)*53)}.lcd.R{width:calc(var(--u)*64);height:calc(var(--u)*48)}
  .kertas-w,.printer{width:min(88vw,calc(var(--u)*150))}
  .kertas-w{width:calc(min(88vw,calc(var(--u)*150)) * .9)}
  .kertas{display:grid;grid-template-columns:44% 1fr;gap:calc(var(--u)*3);align-items:start}
  .kertas .tulis{padding:0}
  .kertas{grid-template-columns:auto 1fr!important}
  .kertas img.T{width:auto;height:calc(var(--u)*42)}.kertas img.R{width:calc(var(--u)*52);height:auto;aspect-ratio:4/3}
  .kertas .tulis p{font-size:13px;line-height:1.45;margin-bottom:6px}
  .printer{height:calc(var(--u)*9)}
  #s3,#s4{flex-direction:row;gap:calc(var(--u)*8)}
  .hasil img{width:calc(var(--u)*34)}
}
.kol{display:contents}
@media (min-aspect-ratio:1/1){ .kol{display:flex} }

.memuat{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#2B5280;transition:opacity .4s}
.memuat.pergi{opacity:0;pointer-events:none}
.memuat p{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;font-size:15px;text-align:center;padding:24px;max-width:22rem;line-height:1.6}
</style>
</head>
<body>
<div id="memuat" class="memuat"><p id="memuatPesan">Menyiapkan studionya…</p></div>
<header class="kepala"><div class="label-k" id="labelK">studio</div></header>
<button id="music" type="button" aria-label="Suara">🔊</button>
<div class="petunjuk" id="petunjuk"></div>

function musicBox(){
  var a=ac(); if(!a) return null;
  var gain=a.createGain(); gain.gain.value=.11; gain.connect(a.__out||a.destination);
  var notes=[67,71,74,79,74,71, 69,72,76,81,76,72, 71,74,79,83,79,74, 72,76,79,84,79,76];
  var step=.38, t0=a.currentTime+.1, n=0, timer=null, berhenti=false;
  function ping(midi,t){
    var o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=440*Math.pow(2,(midi-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.4);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t+1.5);

/* satu gestur seret: down / move(dx,dy) / up(dx,dy); boleh() mengunci */
/* satu seretan sekaligus di seluruh halaman: jari kedua yang menyentuh benda lain
   diabaikan, supaya tidak ada benda yang tertinggal melayang */
var seretAktif=null;
function seret(node,o){
  var pid=null,sx=0,sy=0; noMenu(node);
  node.addEventListener('pointerdown',function(e){
    if(pid!==null || (seretAktif && seretAktif!==node && seretAktif.isConnected) || (o.boleh && !o.boleh())) return;
    pid=e.pointerId; seretAktif=node; sx=e.clientX; sy=e.clientY;
    try{ node.setPointerCapture(pid); }catch(_){}
    e.preventDefault(); ac(); if(o.down) o.down(e);
  });
  node.addEventListener('pointermove',function(e){ if(e.pointerId===pid && o.move) o.move(e,e.clientX-sx,e.clientY-sy); });
  function lepas(e){ if(e.pointerId!==pid) return; pid=null; if(seretAktif===node) seretAktif=null; if(o.up) o.up(e,e.clientX-sx,e.clientY-sy); }
  node.addEventListener('pointerup',lepas); node.addEventListener('pointercancel',lepas);
}
/* benda dibawa jari ke mana saja (pindah ke lapisan atas selama diseret) */
function bawa(node,o){
  var ox=0,oy=0,ruang=null,lw='',lh='';
  seret(node,{ boleh:o.boleh,
    down:function(e){ var r=node.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; lw=node.style.width; lh=node.style.height;
      ruang=el('div'); ruang.style.cssText='visibility:hidden;flex:none;width:'+r.width+'px;height:'+r.height+'px;margin:'+getComputedStyle(node).margin;
      node.parentNode.insertBefore(ruang,node); node.style.width=r.width+'px'; node.style.height=r.height+'px';
      node.classList.add('dibawa'); document.body.appendChild(node); try{ node.setPointerCapture(e.pointerId); }catch(_){} node.style.left=r.left+'px'; node.style.top=r.top+'px'; if(o.down) o.down(e); },
    move:function(e){ node.style.left=(e.clientX-ox)+'px'; node.style.top=(e.clientY-oy)+'px'; if(o.move) o.move(e); },
    up:function(e){ var hasil=o.up?o.up(e):false;
      if(!hasil){ node.classList.remove('dibawa'); node.style.left=node.style.top=''; node.style.width=lw; node.style.height=lh; ruang.parentNode.insertBefore(node,ruang); }
      ruang.remove(); }
  });
}
