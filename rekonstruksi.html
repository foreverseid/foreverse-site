*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--kertas)}

  position:fixed;inset:0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);

  background:var(--krem);border-bottom:3px solid var(--ink);

#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.05s!important;animation-duration:.05s!important}}
</style>

  { c0:1,  c1:6,  r0:1, r1:4,  px:3.5,  py:5.5, hadap:'bawah', atap:'#E39B7B', dinding:'#F6D2BF' },

  { c0:15, c1:20, r0:9, r1:12, px:18.5, py:8.5, hadap:'atas',  atap:'#8C93C9', dinding:'#D9DCF2' },
  { c0:1,  c1:6,  r0:9, r1:12, px:3.5,  py:8.5, hadap:'atas',  atap:'#D6AE57', dinding:'#F4E2B4' }

for(var c=0;c<COLS;c++){ blok(c,0); blok(c,ROWS-1); }
for(var r=0;r<ROWS;r++){ blok(0,r); blok(COLS-1,r); }

  var len = Math.hypot(dx, dy), tampil = len > MAKS ? MAKS / len : 1;
  bola.style.transform = 'translate(calc(-50% + ' + (dx*tampil).toFixed(1) + 'px), calc(-50% + ' + (dy*tampil).toFixed(1) + 'px))';

/* ══════════════ pemutaran ulang — rute lingkaran yang pasti ══════════════
   Sosok "dulu" berangkat dari pintu kejadian pertama, lalu menyusuri
   lingkaran ke pintu kejadian berikutnya (jalur terpendek searah atau
   berlawanan jarum jam). Tidak ada pencarian jalan sama sekali. */
function ruteLingkar(dari, ke){
  if(dari === ke) return [LINGKAR[ke]];
  var maju = (ke - dari + 4) % 4, arah = maju <= 2 ? 1 : -1, n = arah > 0 ? maju : 4 - maju, rute = [];
  for(var s=1; s<=n; s++) rute.push(LINGKAR[(dari + arah*s + 4) % 4]);
  return rute;
}
var antri = [], tunda = 0, setelah = null;
function mulaiPutar(){
  sinema = true; document.body.classList.add('sinema');
  lepasJoy({ pointerId:jid });
  var awal = URUT[0].i;
  DULU.tampil = true; DULU.padat = false; DULU.x = LINGKAR[awal][0]; DULU.y = LINGKAR[awal][1];
  antri = [];
  var kini = awal;
  URUT.forEach(function(k, n){
    if(n > 0) ruteLingkar(kini, k.i).forEach(function(t){ antri.push({ x:t[0], y:t[1] }); });
    antri.push({ tiba:k.i, tunggu:1500 });
    kini = k.i;
  });
  setelah = function(){ setTimeout(function(){ bukaLaporan(); }, 500); };
  segarBar();
}
function majuPutar(dt){
  if(!antri.length){ if(setelah){ var f = setelah; setelah = null; DULU.jalan = 0; f(); } return; }
  var a = antri[0];
  if(a.tiba != null){
    if(tunda === 0){
      tunda = a.tunggu; nyala[a.tiba] = true; jamTampil = KJ[a.tiba].jam;
      SFX.warna(); buzz(15);
      toast(tulisJam(KJ[a.tiba].jam) + ' · ' + KJ[a.tiba].tempat + ' — ' + KJ[a.tiba].cerita, 1500);
      segarBar();
    }
    DULU.jalan = 0;
    tunda -= dt * 1000;
    if(tunda <= 0){ tunda = 0; antri.shift(); }
    return;
  }
  var dx = a.x - DULU.x, dy = a.y - DULU.y, d = Math.hypot(dx, dy), langkah = 3.0 * dt;
  if(d <= langkah){ DULU.x = a.x; DULU.y = a.y; antri.shift(); return; }
  DULU.x += dx / d * langkah; DULU.y += dy / d * langkah;
  DULU.hadap = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'kanan' : 'kiri') : (dy > 0 ? 'bawah' : 'atas');
  DULU.jalan = 1; DULU.t += dt;
  if(Math.floor(DULU.t / .3) !== Math.floor((DULU.t - dt) / .3)) SFX.detak();
}

/* ── penutup: jam meloncat ke hari ini, dua sosok berjalan ke titik
   "hari ini", berhenti jadi sosok utuh (bukan lagi garis putus-putus) ── */
function keHariIni(){
  hidup = true; jamTampil = 'kini';
  sinema = true; document.body.classList.add('sinema');
  var dekatnya = 0, jt = 1e9;
  LINGKAR.forEach(function(t, i){ var j = Math.hypot(t[0] - DULU.x, t[1] - DULU.y); if(j < jt){ jt = j; dekatnya = i; } });
  var bawahKe = dekatnya === 2 || dekatnya === 3 ? dekatnya : (dekatnya === 0 ? 3 : 2);
  antri = ruteLingkar(dekatnya, bawahKe).map(function(t){ return { x:t[0], y:t[1] }; });
  if(dekatnya === bawahKe) antri = [];
  antri.push({ x:TITIK_KINI[0], y:LINGKAR[bawahKe][1] }, { x:TITIK_KINI[0], y:TITIK_KINI[1] });
  setelah = function(){
    DULU.padat = true; DULU.hadap = 'bawah';
    SFX.warna(); buzz([30,40,60]);
    setTimeout(function(){ jadiBersama(); sinema = false; document.body.classList.remove('sinema'); bukaAkhir(); }, 700);
  };
  toast('Kembali ke hari ini.');
  segarBar();
}
function jadiBersama(){
  if(BERSAMA) return;
  BERSAMA = true; DULU.tampil = false;
  P.x = TITIK_KINI[0] - .32; P.y = TITIK_KINI[1]; P.hadap = 'bawah';
  IKUT.x = TITIK_KINI[0] + .32; IKUT.y = TITIK_KINI[1]; IKUT.hadap = 'bawah';
  JEJAK = [{ x:IKUT.x, y:IKUT.y }, { x:P.x, y:P.y }];
}
function majuIkut(dt){
  var akhir = JEJAK[JEJAK.length - 1];
  if(Math.hypot(P.x - akhir.x, P.y - akhir.y) > .06){ JEJAK.push({ x:P.x, y:P.y }); if(JEJAK.length > 400) JEJAK.shift(); }
  /* titik jejak terjauh yang masih ≥ 0,75 petak di belakang pemain */
  var sasaran = null;
  for(var i=JEJAK.length-1; i>=0; i--){ if(Math.hypot(P.x - JEJAK[i].x, P.y - JEJAK[i].y) >= .75){ sasaran = JEJAK[i]; break; } }
  if(!sasaran){ IKUT.jalan = 0; return; }
  var dx = sasaran.x - IKUT.x, dy = sasaran.y - IKUT.y, d = Math.hypot(dx, dy), lk = KEC * 1.15 * dt;
  if(d < .02){ IKUT.jalan = 0; return; }
  if(d <= lk){ IKUT.x = sasaran.x; IKUT.y = sasaran.y; } else { IKUT.x += dx / d * lk; IKUT.y += dy / d * lk; }
  IKUT.hadap = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'kanan' : 'kiri') : (dy > 0 ? 'bawah' : 'atas');
  IKUT.jalan = 1; IKUT.t += dt;
  /* buang jejak yang sudah dilewati pengikut */
  while(JEJAK.length > 2 && Math.hypot(JEJAK[0].x - IKUT.x, JEJAK[0].y - IKUT.y) < .08) JEJAK.shift();
}
function bukaAkhir(){
  jadiBersama();
  ST.akhir = true;

/* ══════════════════════════════════════════════════════════════
   GAMBAR — kertas berpetak + garis pensil; palet berwarna dipasang
   per bangunan (sekali), tanpa animasi peralihan.
   ══════════════════════════════════════════════════════════════ */
var cv = $('#dunia'), g = cv.getContext('2d');
var VW = 0, VH = 0, S = 40, CAMX = 0, CAMY = 0, ATAS = 60, BAWAH = 0, OX = 0, OY = 0;
function ukur(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  ATAS = $('#atas').offsetHeight;
  BAWAH = VH > VW ? 168 : 0;
  S = Math.max(26, Math.min((VH - ATAS - BAWAH) / 9, VW / 7.2));
}
window.addEventListener('resize', ukur);
window.addEventListener('orientationchange', function(){ setTimeout(ukur, 120); });
function sx(x){ return x * S - CAMX + OX; }
function sy(y){ return y * S - CAMY + OY; }
function kamera(){
  var fx = P.x, fy = P.y;
  if(sinema && DULU.tampil){ fx = DULU.x; fy = DULU.y; }
  var lebarW = COLS * S, tinggiW = ROWS * S, tinggiV = VH - ATAS - BAWAH;
  if(lebarW <= VW){ CAMX = 0; OX = (VW - lebarW) / 2; }
  else { CAMX = klem(fx * S - VW / 2, 0, lebarW - VW); OX = 0; }
  if(tinggiW <= tinggiV){ CAMY = 0; OY = ATAS + (tinggiV - tinggiW) / 2; }
  else { CAMY = klem(fy * S - tinggiV / 2, 0, tinggiW - tinggiV); OY = ATAS; }
}
var PENSIL = '#5E5A6A';
function kotak(x, y, w, h, isi, garis){
  if(isi){ g.fillStyle = isi; g.fillRect(x, y, w, h); }
  if(garis){ g.strokeStyle = garis; g.lineWidth = Math.max(1.5, S/22); g.strokeRect(x, y, w, h); }
}
function hurufPiksel(px, berat){ return (berat || 600) + ' ' + Math.round(px) + "px 'Pixelify Sans', ui-monospace, 'Courier New', monospace"; }
function hurufTangan(px){ return '700 ' + Math.round(px) + "px Caveat, 'Comic Sans MS', cursive"; }

function lantai(){
  /* kertas berpetak (sketsa) atau paving hangat (setelah harinya hidup) */
  var x0 = sx(0), y0 = sy(0), w = COLS * S, h = ROWS * S;
  g.fillStyle = hidup ? '#EADBC0' : '#F4F1EA'; g.fillRect(x0, y0, w, h);
  g.strokeStyle = hidup ? 'rgba(160,120,80,.25)' : '#D7E0E8'; g.lineWidth = 1;
  g.beginPath();
  for(var c=0;c<=COLS;c++){ var x = Math.round(sx(c)) + .5; g.moveTo(x, y0); g.lineTo(x, y0 + h); }
  for(var r=0;r<=ROWS;r++){ var y = Math.round(sy(r)) + .5; g.moveTo(x0, y); g.lineTo(x0 + w, y); }
  g.stroke();
  /* lingkaran jalan: digambar sebagai jalan setapak putus-putus pensil */
  g.strokeStyle = hidup ? '#C9A77C' : 'rgba(94,90,106,.35)'; g.lineWidth = Math.max(2, S*.08);
  g.setLineDash([S*.2, S*.18]);
  g.beginPath();
  LINGKAR.concat([LINGKAR[0]]).forEach(function(t, i){ var X = sx(t[0]), Y = sy(t[1]); if(i) g.lineTo(X, Y); else g.moveTo(X, Y); });
  g.stroke(); g.setLineDash([]);
  /* pagar tepi */
  g.strokeStyle = PENSIL; g.lineWidth = Math.max(2, S/16);
  g.strokeRect(sx(.5), sy(.5), (COLS - 1) * S, (ROWS - 1) * S);
  /* titik "hari ini" */
  var hx = sx(TITIK_KINI[0]), hy = sy(TITIK_KINI[1]);
  g.strokeStyle = hidup ? '#E8734A' : 'rgba(94,90,106,.5)'; g.lineWidth = 2.5; g.setLineDash([5,4]);
  g.beginPath(); g.ellipse(hx, hy + S*.15, S*.9, S*.45, 0, 0, 7); g.stroke(); g.setLineDash([]);
}

function bangunan(b, i){
  var warna = ST.bukti[i];
  var x = sx(b.c0), y = sy(b.r0), w = (b.c1 - b.c0 + 1) * S, h = (b.r1 - b.r0 + 1) * S;
  var muka = S * 1.1;                                       // tinggi dinding depan
  var atasH = h - muka;
  /* atap */
  kotak(x, y, w, atasH, warna ? b.atap : '#FFFFFF', warna ? '#241C2E' : PENSIL);
  if(!warna){                                                // arsiran pensil di atap
    g.save(); g.beginPath(); g.rect(x, y, w, atasH); g.clip();
    g.strokeStyle = 'rgba(94,90,106,.28)'; g.lineWidth = 1;
    for(var k=-h; k<w; k+=S*.32){ g.beginPath(); g.moveTo(x + k, y + atasH); g.lineTo(x + k + atasH, y); g.stroke(); }
    g.restore();
  }
  /* dinding depan + jendela + pintu */
  kotak(x, y + atasH, w, muka, warna ? b.dinding : '#FAF9F5', warna ? '#241C2E' : PENSIL);
  var nyalaJ = nyala[i] || hidup;
  for(var j=0;j<3;j++){
    var jx = x + S*.4 + j * (w - S*.8) / 2.6, jy = y + atasH + S*.22;
    kotak(jx, jy, S*.7, S*.42, warna ? (nyalaJ ? '#FFE08A' : '#BFE1EE') : null, warna ? '#241C2E' : PENSIL);
  }
  var pintuX = sx(b.px) - S*.32;
  kotak(pintuX, y + h - S*.78, S*.64, S*.78, warna ? '#7A5536' : null, warna ? '#241C2E' : PENSIL);
  /* papan nama: tulisan tangan di sketsa, papan berwarna setelahnya */
  var nx = x + w/2, ny = y + atasH * .48, nama = KJ[i].tempat;
  if(warna){
    g.font = hurufPiksel(Math.max(11, S*.26), 700);
    var tw = g.measureText(nama).width + S*.4;
    tw = Math.min(tw, w - S*.2);
    kotak(nx - tw/2, ny - S*.24, tw, S*.48, '#FFFCF4', '#241C2E');
    g.fillStyle = '#241C2E'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(nama, nx, ny + 1, tw - S*.2);
  } else {
    g.font = hurufTangan(Math.max(15, S*.42));
    g.fillStyle = PENSIL; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(nama, nx, ny, w - S*.3);
  }
}
function meja(){
  var x = sx(MEJA.c0), y = sy(MEJA.r0), w = 2 * S, h = 2 * S;
  kotak(x + S*.08, y + S*.15, w - S*.16, h - S*.6, hidup ? '#C99A63' : '#FFFFFF', hidup ? '#241C2E' : PENSIL);
  kotak(x + S*.08, y + h - S*.45, w - S*.16, S*.3, hidup ? '#9A6B42' : '#FAF9F5', hidup ? '#241C2E' : PENSIL);
  /* garis waktu kecil di atas meja */
  g.strokeStyle = '#241C2E'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x + S*.3, y + S*.7); g.lineTo(x + w - S*.3, y + S*.7); g.stroke();
  for(var i=0;i<4;i++){
    g.fillStyle = (ST.garis ? '#E8734A' : '#FFFFFF');
    g.beginPath(); g.arc(x + S*.3 + i * (w - S*.6) / 3, y + S*.7, S*.09, 0, 7); g.fill(); g.stroke();
  }
}
function pohon(t){
  var x = sx(t[0] + .5), y = sy(t[1] + .5);
  g.fillStyle = hidup ? '#7FAE6E' : '#FFFFFF'; g.strokeStyle = hidup ? '#241C2E' : PENSIL; g.lineWidth = 2;
  g.beginPath(); g.arc(x, y - S*.1, S*.42, 0, 7); g.fill(); g.stroke();
  g.fillStyle = hidup ? '#8C6142' : '#FAF9F5'; g.fillRect(x - S*.06, y + S*.28, S*.12, S*.22); g.strokeRect(x - S*.06, y + S*.28, S*.12, S*.22);
}
function tandaBukti(i){
  if(ST.bukti[i]) return;
  var b = BANGUN[i], x = sx(b.px), y = sy(b.py) + (b.hadap === 'atas' ? -S*.15 : S*.05);
  kotak(x - S*.2, y - S*.12, S*.4, S*.26, '#FFFFFF', '#241C2E');
  g.fillStyle = '#C8372D'; g.fillRect(x - S*.2, y - S*.12, S*.4, S*.06);
}

/* tokoh balok — dipakai untuk pemain dan dua sosok "dulu" */
function orang(x, y, o){
  var X = sx(x), Y = sy(y), u = S / 38;
  var ayun = o.jalan ? Math.sin(o.t * 14) * 2.4 * u : 0;
  var garis = '#241C2E';
  g.save();
  if(o.hantu){ g.globalAlpha = .62; g.setLineDash([3, 2.5]); }
  if(!o.hantu){ g.fillStyle = 'rgba(0,0,0,.16)'; g.beginPath(); g.ellipse(X, Y + u, 9*u, 3.5*u, 0, 0, 7); g.fill(); }
  var isi = function(w){ return o.hantu ? '#FFFFFF' : w; };
  kotak(X - 6*u, Y - 9*u + ayun, 5*u, 9*u - ayun, isi(o.celana || '#3B4A72'), garis);
  kotak(X + 1*u, Y - 9*u - ayun, 5*u, 9*u + ayun, isi(o.celana || '#3B4A72'), garis);
  var by = Y - 21*u, hy = by - 13*u;
  kotak(X - 8*u, by, 16*u, 13*u, isi(o.baju), garis);
  kotak(X - 7*u, hy, 14*u, 13*u, isi('#F2C9A0'), garis);
  g.fillStyle = isi(o.rambut);
  if(o.hadap === 'atas'){
    g.fillRect(X - 7*u, hy, 14*u, 11*u);
    if(o.panjang) kotak(X - 7*u, hy + 6*u, 14*u, 12*u, isi(o.rambut), garis);
  } else {
    if(o.panjang){ kotak(X - 8.5*u, hy, 3.6*u, 19*u, isi(o.rambut), garis); kotak(X + 4.9*u, hy, 3.6*u, 19*u, isi(o.rambut), garis); }
    g.fillStyle = isi(o.rambut); g.fillRect(X - 7*u, hy, 14*u, 4*u);
    g.fillStyle = '#241C2E';
    if(o.hadap === 'bawah'){ g.fillRect(X - 4*u, hy + 6*u, 2*u, 2.5*u); g.fillRect(X + 2*u, hy + 6*u, 2*u, 2.5*u); }
    else if(o.hadap === 'kiri') g.fillRect(X - 5*u, hy + 6*u, 2*u, 2.5*u);
    else g.fillRect(X + 3*u, hy + 6*u, 2*u, 2.5*u);
  }
  g.restore();
}

function pil(x, y, teks, gaya){
  if(x < -S*.5 || x > VW + S*.5 || y < ATAS - 4 || y > VH + S) return;
  var fs = Math.max(10.5, S * .21);
  g.font = hurufPiksel(fs, 700);
  var w = g.measureText(teks).width + fs*1.1, h = fs * 1.55;
  x = klem(x, w/2 + 4, VW - w/2 - 4);
  var bx = Math.round(x - w/2), by = Math.round(y - h);
  g.fillStyle = gaya === 'aktif' ? '#FFC24A' : gaya === 'kamu' ? '#241C2E' : gaya === 'selesai' ? 'rgba(255,252,244,.8)' : '#FFFCF4';
  g.fillRect(bx, by, w, h);
  g.strokeStyle = gaya === 'selesai' ? 'rgba(36,28,46,.45)' : '#241C2E'; g.lineWidth = 2; g.strokeRect(bx, by, w, h);
  g.fillStyle = gaya === 'kamu' ? '#FFC24A' : gaya === 'selesai' ? 'rgba(36,28,46,.55)' : '#241C2E';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(teks, x, by + h/2 + 1);
}

function gambarPenunjuk(now){
  var t = tujuan().o; if(!t || panelBuka || sinema) return;
  var X = sx(t.ox), Y = sy(t.oy);
  g.strokeStyle = '#E8734A'; g.lineWidth = Math.max(2, S/14); g.setLineDash([S*.16, S*.12]);
  g.beginPath(); g.ellipse(X, Y + S*.15, S*.9, S*.5, 0, 0, 7); g.stroke(); g.setLineDash([]);
  var kiri = 22, kanan = VW - 22, atas = ATAS + 26, bawah = VH - (BAWAH || 150) - 10;
  if(X < kiri || X > kanan || Y < atas || Y > bawah){
    var cx = VW / 2, cy = (atas + bawah) / 2, dx = X - cx, dy = Y - cy;
    var k = Math.min(Math.abs((dx > 0 ? kanan - cx : kiri - cx) / (dx || 1e-6)), Math.abs((dy > 0 ? bawah - cy : atas - cy) / (dy || 1e-6)));
    g.save(); g.translate(cx + dx * k, cy + dy * k); g.rotate(Math.atan2(dy, dx));
    g.fillStyle = '#E8734A'; g.strokeStyle = '#241C2E'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(12, 0); g.lineTo(-12, -14); g.lineTo(-12, 14); g.closePath(); g.fill(); g.stroke();
    g.restore();
    return;
  }
  var ay = Y - S*1.25 + Math.sin(now / 220) * S * .08;
  g.fillStyle = '#E8734A'; g.strokeStyle = '#241C2E'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(X, ay + S*.3); g.lineTo(X - S*.22, ay); g.lineTo(X + S*.22, ay); g.closePath(); g.fill(); g.stroke();
}

function gambar(now){
  g.fillStyle = hidup ? '#D9C7A6' : '#E9E5DC'; g.fillRect(0, 0, VW, VH);
  lantai();
  var L = [];
  BANGUN.forEach(function(b, i){ L.push({ y:b.r1 + 1, f:function(){ bangunan(b, i); } }); });
  L.push({ y:MEJA.r1 + 1, f:meja });
  POHON.forEach(function(t){ L.push({ y:t[1] + 1, f:function(){ pohon(t); } }); });
  for(var i=0;i<4;i++) (function(i){ L.push({ y:BANGUN[i].py, f:function(){ tandaBukti(i); } }); })(i);
  if(DULU.tampil){
    L.push({ y:DULU.y + .01, f:function(){
      var hantu = !DULU.padat;
      orang(DULU.x - .32, DULU.y, { baju:'#E8734A', rambut:'#3A2A2E', panjang:KAR_A === 'perempuan', hadap:DULU.hadap, jalan:DULU.jalan, t:DULU.t, hantu:hantu });
      orang(DULU.x + .32, DULU.y, { baju:'#3B6FA8', rambut:'#2A2228', panjang:KAR_B === 'perempuan', hadap:DULU.hadap, jalan:DULU.jalan, t:DULU.t + .15, hantu:hantu });
    }});
  }
  if(!sinema || !DULU.tampil){
    L.push({ y:P.y, f:function(){ orang(P.x, P.y, { baju:'#E8734A', rambut:'#3A2A2E', panjang:KAR_A === 'perempuan', hadap:P.hadap, jalan:P.jalan > 0, t:P.langkahT }); } });
  }
  if(BERSAMA){
    L.push({ y:IKUT.y, f:function(){ orang(IKUT.x, IKUT.y, { baju:'#3B6FA8', rambut:'#2A2228', panjang:KAR_B === 'perempuan', hadap:IKUT.hadap, jalan:IKUT.jalan, t:IKUT.t }); } });
  }
  L.sort(function(a,b){ return a.y - b.y; });
  L.forEach(function(o){ o.f(); });

  /* label */
  if(!sinema){
    for(var k=0;k<4;k++){
      var b = BANGUN[k], ly = b.hadap === 'bawah' ? b.py + .95 : b.py - .3;
      var gaya = ST.bukti[k] ? 'selesai' : (IA[k] === dekat ? 'aktif' : '');
      pil(sx(b.px), sy(ly), ST.bukti[k] ? '✓ bukti' : 'bukti', gaya);
    }
    pil(sx(11), sy(MEJA.r0) - S*.05, 'meja rekonstruksi', ST.garis ? 'selesai' : (IA[4] === dekat ? 'aktif' : ''));
    if(!dekat) pil(sx(BERSAMA ? (P.x + IKUT.x) / 2 : P.x), sy(Math.min(P.y, BERSAMA ? IKUT.y : P.y)) - S*1.12, BERSAMA ? 'kalian, hari ini' : 'kamu', 'kamu');
  }
  if(DULU.tampil){
    pil(sx(DULU.x), sy(DULU.y) - S*1.12, DULU.padat ? 'kalian, hari ini' : 'kalian, waktu itu', 'kamu');
  }
  pil(sx(TITIK_KINI[0]), sy(TITIK_KINI[1] + .95), 'hari ini', ST.laporan ? 'aktif' : 'selesai');
  gambarPenunjuk(now);
}

/* ══════════════ putaran utama ══════════════ */
var lalu = performance.now();
function tik(now){
  var dt = Math.min(.05, (now - lalu) / 1000); lalu = now;
  if(sinema && !panelBuka) majuPutar(dt);
  var v = (!panelBuka && bisaMain()) ? (arahKB() || JV) : { x:0, y:0 };
  var kec = Math.hypot(v.x, v.y);
  if(kec > .01){
    var nx = P.x + v.x * KEC * dt, ny = P.y + v.y * KEC * dt;
    if(bisaDi(nx, P.y)) P.x = nx;
    if(bisaDi(P.x, ny)) P.y = ny;
    P.hadap = Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'kanan' : 'kiri') : (v.y > 0 ? 'bawah' : 'atas');
    P.jalan = kec; P.langkahT += dt;
    if(Math.floor(P.langkahT / .3) !== Math.floor((P.langkahT - dt) / .3)) SFX.langkah();
  } else P.jalan = 0;
  if(BERSAMA) majuIkut(dt);
  kamera();
  segarAksi();
  gambar(now);
  requestAnimationFrame(tik);
}
