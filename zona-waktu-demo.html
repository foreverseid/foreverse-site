/* =====================================================================
   DUA JENDELA — layar terbelah dua kota.

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#241C2E; --redup:#6E6480; --krem:#FFF8EE; --kertas:#FFFDF8;

html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#EFE6D8}
body{position:fixed;inset:0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#atas{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--atas) + env(safe-area-inset-top));

#suara{width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:.8rem}

/* ---------- panggung terbelah ---------- */
#panggung{position:fixed;left:0;right:0;bottom:0;top:calc(var(--atas) + env(safe-area-inset-top));

#garis{background:var(--ink);transition:opacity 1.2s ease, transform 1.2s ease;position:relative;z-index:3}

#panggung.satu #garis{opacity:0;transform:scale(.2)}

}
var satu = false;
function segarJam(){
  var a = waktuDi(KA.tz), b = waktuDi(KB.tz);
  $('#jamA').textContent = $('#jamMejaA').textContent = tulis(a);
  $('#jamB').textContent = tulis(b);
  if(!jadwalBuka) $('#jamMejaB').textContent = tulis(b);
  if(satu){
    /* satu ruangan: kedua sisi diterangi jam si PENERIMA */
    terangi($('#sisiA'), $('#jendelaA'), b); terangi($('#sisiB'), $('#jendelaB'), b);
  } else {
    terangi($('#sisiA'), $('#jendelaA'), a); terangi($('#sisiB'), $('#jendelaB'), b);
  }
}

/* ══════════════ suara (infrastruktur bersama) ══════════════ */
var AC = null, bisu = false;
function ac(){ if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); } if(AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, dur, o){
  o = o || {}; var a = ac(); if(!a || bisu) return;
  var t = a.currentTime + (o.when||0), osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .1, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  osc.connect(g); g.connect(a.destination); osc.start(t); osc.stop(t + dur + .05);
}
var SFX = {
  dering: function(){ [0,.18].forEach(function(w){ tone(880,.12,{when:w,vol:.07}); tone(660,.12,{when:w+.09,vol:.06}); }); },
  angkat: function(){ tone(523,.1,{vol:.08}); tone(784,.16,{vol:.07,when:.08}); },
  klik:   function(){ tone(700,.05,{vol:.06}); },
  benar:  function(){ [523,659,784].forEach(function(f,i){ tone(f,.16,{when:i*.07,vol:.06}); }); },
  salah:  function(){ tone(180,.15,{vol:.05,type:'sawtooth'}); },
  pesan:  function(){ tone(988,.07,{vol:.06}); tone(1318,.09,{vol:.05,when:.07}); },
  geser:  function(){ tone(300,.5,{vol:.05,type:'triangle'}); }
};
function musicBox(){
  var a = ac(); if(!a) return function(){};
  var stop = false, i = 0, pola = [0,7,12,7,4,7,11,7,2,9,14,9,5,9,12,9];
  function ping(midi, t){
    var f = 440 * Math.pow(2, (midi - 69) / 12), o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(bisu ? .0001 : .042, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .9);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1);
  }
  (function loop(){ if(stop) return; var t = a.currentTime + .05; for(var k=0;k<4;k++) ping(60 + pola[(i+k) % pola.length], t + k*.44); i += 4; setTimeout(loop, 1760); })();
  return function(){ stop = true; };
}
var MU = (function(){
  var L = D.lagu || {}, punya = !!(L.src && String(L.src).trim()), audio = punya ? new Audio() : null, mulai = +L.mulai || 0, selesai = +L.selesai || 0, mati = null;
  if(audio){
    audio.src = L.src; audio.preload = 'auto'; audio.loop = !selesai;
    audio.addEventListener('timeupdate', function(){ if(selesai > mulai && audio.currentTime >= selesai) audio.currentTime = mulai; });
    audio.addEventListener('ended', function(){ audio.currentTime = mulai; audio.play().catch(function(){}); });
  }
  return {
    main: function(){ if(audio){ try{ if(audio.currentTime < mulai) audio.currentTime = mulai; }catch(e){} audio.volume = .75; audio.muted = bisu; audio.play().catch(function(){}); } else if(!mati) mati = musicBox(); },
    bisukan: function(m){ if(audio) audio.muted = m; }
  };
})();

var tt;
function toast(m, ms){ var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, ms || 2400); }
['contextmenu','selectstart','dragstart'].forEach(function(ev){
  document.addEventListener(ev, function(e){ if(e.target && e.target.closest && e.target.closest('textarea')) return; e.preventDefault(); }, true);
});
document.addEventListener('touchmove', function(e){ if(e.target && e.target.closest && e.target.closest('.kartu')) return; e.preventDefault(); }, { passive:false });

/* ══════════════ panel ══════════════
   Dibuka lewat ketukan (setelah jari diangkat). Latar TIDAK menutup
   panel; tombol baru bisa ditekan 400ms setelah panel muncul. */
var panelBuka = false, panelSejak = 0, kartu = $('#kartu');
function buka(isi){ kartu.innerHTML = ''; isi.forEach(function(n){ kartu.appendChild(n); }); $('#tirai').hidden = false; kartu.scrollTop = 0; panelBuka = true; panelSejak = performance.now(); }
function tutup(){ $('#tirai').hidden = true; kartu.innerHTML = ''; panelBuka = false; }
function siap(){ return performance.now() - panelSejak >= 400; }
function tombol(label, fn, cls){ var b = el('button', 'tbl ' + (cls || ''), label); b.type = 'button'; b.addEventListener('click', function(){ if(siap()) fn(b); }); return b; }
function h3(t){ return el('h3', '', t); }
function p(t, c){ return el('p', c || '', t); }

/* ══════════════ alur: enam langkah ══════════════ */
var LANGKAH = [
  'Ada panggilan masuk — angkat',
  'Ketuk jam meja ' + PENGIRIM + ': jam segini dia lagi apa?',
  'Ponselmu bergetar — ketuk untuk membaca pesannya',
  'Ketuk jam mejamu: samakan jadwal kalian',
  'Ada paket di meja ' + PENGIRIM + ' — ketuk untuk mengirim',
  'Dua jendela, satu ruangan'
];
var langkah = 0, jadwalBuka = false, lewatiMode = false, paketDi = null;
var aktifNode = null, aktifFn = null;
function setLangkah(n){
  langkah = n;
  $('#langkahN').textContent = 'Langkah ' + Math.min(n + 1, 6) + ' dari 6';
  $('#langkahT').textContent = LANGKAH[n] || '';
}
/* hanya SATU benda aktif dalam satu waktu: bercincin, berpanah, dan
   namanya disebut di baris instruksi */
function aktifkan(node, fn){
  if(aktifNode){ aktifNode.classList.remove('aktif'); aktifNode.onclick = null; }
  aktifNode = node; aktifFn = fn;
  if(!node) return;
  node.classList.add('aktif');
  node.onclick = function(){ if(panelBuka) return; ac(); var f = aktifFn; aktifkan(null); f(); };
}

/* ── 1 · pembuka: panggilan masuk ── */
function bukaPanggil(){
  var fotoB = el('div', 'foto-bulat');
  if(FOTO[0]) fotoB.style.backgroundImage = 'url("' + FOTO[0].src + '")'; else fotoB.textContent = PENGIRIM.charAt(0).toUpperCase();
  var wrap = el('div', 'panggil');
  wrap.appendChild(p('panggilan video', 'dari'));
  wrap.appendChild(fotoB);
  wrap.appendChild(el('div', 'siapa', PENGIRIM));
  wrap.appendChild(p('dari ' + KA.nama + ', jam ' + tulis(waktuDi(KA.tz)) + ' di sana — buat ' + PENERIMA + ' di ' + KB.nama, 'dari'));
  wrap.appendChild(tombol('Angkat', function(){
    ac(); MU.main(); SFX.angkat(); buzz(30);
    tutup(); $('#ponselB').classList.remove('dering');
    if(FOTO[0]) $('#layarB').style.backgroundImage = 'url("' + FOTO[0].src + '")';
    toast('Tersambung. ' + KA.nama + ' — ' + KB.nama + '.');
    setLangkah(1);
    var awan = el('div', 'awan', 'jam segini aku lagi apa?'); $('#pikirA').appendChild(awan);
    aktifkan($('#pikirA'), bukaKuis);
  }, 'hijau'));
  panelSejak = 0;
  buka([wrap]);
}

/* ── 2 · game: "jam segini aku lagi apa?" — jawabannya bergantung
   pada JAM ASLI di kota pengirim saat surat dibuka ── */
/* kebiasaan yang jamnya PALING DEKAT dengan jam sekarang di kota
   pengirim (melingkar 24 jam). Bukan "yang terakhir sudah lewat": jam
   07.07 dengan kebiasaan 07.30 & 22.30 harus terbaca "berangkat kerja",
   bukan "siap-siap tidur". Seri → yang lebih awal di daftar isian. */
function rutinitasSekarang(){
  var kini = waktuDi(KA.tz), hasil = RUT[0], jt = 1e9;
  RUT.forEach(function(r){
    var d = Math.abs(menitDari(r.jam) - kini); d = Math.min(d, 1440 - d);
    if(d < jt){ jt = d; hasil = r; }
  });
  return hasil;
}
function bukaKuis(){
  var aw = $('#pikirA .awan'); if(aw) aw.remove();
  var benar = rutinitasSekarang(), kini = waktuDi(KA.tz);
  var jb = el('div', 'jamBesar'); jb.appendChild(el('b', '', tulis(kini))); jb.appendChild(el('span', '', 'sekarang di ' + KA.nama));
  var pilih = el('div', 'pilih'), lanjut = tombol('Lanjut', function(){ tutup(); keSurat(); });
  lanjut.hidden = true;
  [1,2,0].map(function(i){ return RUT[i]; }).forEach(function(r){
    var b = el('button', '', r.kegiatan); b.type = 'button';
    b.addEventListener('click', function(){
      if(!siap() || !lanjut.hidden) return;
      if(r !== benar){ b.classList.remove('salah'); void b.offsetWidth; b.classList.add('salah'); SFX.salah(); toast('Belum. Lihat lagi jam di ' + KA.nama + '.'); return; }
      b.classList.add('benar'); SFX.benar(); buzz(25);
      ket.textContent = 'Iya. Sekitar jam ' + tulis(menitDari(r.jam)) + ' waktu ' + KA.nama + ', dia biasanya ' + r.kegiatan + '.';
      lanjut.hidden = false;
      var catat = el('div', 'awan', r.kegiatan.length > 26 ? r.kegiatan.slice(0, 25) + '…' : r.kegiatan);
      $('#pikirA').appendChild(catat);
    });
    pilih.appendChild(b);
  });
  var ket = p('Pilih kebiasaan yang jamnya paling dekat dengan jam segini di sana.');
  buka([ h3('Jam segini dia lagi apa?'), jb, pilih, ket, lanjut ]);
}

/* ── 3 · surat: pesan masuk di ponsel penerima ── */
function keSurat(){
  setLangkah(2);
  var n = $('#notifB'); n.hidden = false; n.textContent = PENGIRIM + ': ' + SURAT.length + ' pesan';
  $('#ponselB').classList.add('dering'); SFX.pesan(); buzz([20,60,20]);
  aktifkan($('#ponselB'), bukaSurat);
}
function bukaSurat(){
  $('#ponselB').classList.remove('dering'); $('#notifB').hidden = true;
  var hp = el('div', 'hp'), kep = el('div', 'kepala'), av = el('i');
  if(FOTO[0]) av.style.backgroundImage = 'url("' + FOTO[0].src + '")';
  var nm = el('div'); nm.appendChild(el('b', '', PENGIRIM)); nm.appendChild(el('small', '', 'online · ' + KA.nama));
  kep.appendChild(av); kep.appendChild(nm); hp.appendChild(kep);
  var ketik = el('div', 'ketik'); ketik.innerHTML = '<i></i><i></i><i></i>';
  var tutupB = tombol(langkah === 2 ? 'Balas nanti, lanjut dulu' : 'Tutup', function(){
    tutup();
    if(lewatiMode && !satu) mulaiSatu();          // "lewati": pesan → langsung penutup
    else if(langkah === 2) keJadwal();
  }, 'putih');
  tutupB.hidden = true;
  var i = 0, kini = waktuDi(KA.tz);
  /* panel dibuka DULU, baru rangkaian pesannya dimulai — kalau dibalik,
     pemeriksaan "panel masih terbuka?" di langkah pertama langsung gagal
     dan tidak ada satu pesan pun yang muncul */
  buka([ h3('Pesan masuk'), hp, tutupB ]);
  var sesi = panelSejak;                       // panel lain dibuka = rangkaian ini berhenti
  (function berikut(){
    if(!panelBuka || panelSejak !== sesi) return;
    if(i >= SURAT.length){ ketik.remove(); tutupB.hidden = false; return; }
    hp.appendChild(ketik);
    setTimeout(function(){
      if(!panelBuka || panelSejak !== sesi) return;
      var gb = el('div', 'gelembung', SURAT[i]);
      gb.appendChild(el('small', '', tulis(kini - (SURAT.length - 1 - i)) + ' · ' + KA.nama));
      hp.insertBefore(gb, ketik); SFX.pesan(); i++;
      setTimeout(berikut, 650);
    }, 700);
  })();
}

/* ── 4 · game: samakan jadwal — jam meja penerima diputar ke jam
   lokalnya yang setara dengan rutinitas si pengirim, dua ronde ── */
function keJadwal(){
  setLangkah(3);
  aktifkan($('#jamBendaB'), function(){ jadwalBuka = true; bukaJadwal(0); });
}
function bukaJadwal(ronde){
  var r = RUT[ronde === 0 ? 0 : 2], d = selisih();
  var asal = menitDari(r.jam), target = ((asal + d) % 1440 + 1440) % 1440;
  var nilai = asal;                                    // jarum mulai di angka yang sama — selisihnya yang harus dicari
  var kA = el('div', 'k'), kB = el('div', 'k');
  kA.appendChild(el('small', '', KA.nama)); kA.appendChild(el('b', '', tulis(asal))); kA.appendChild(el('em', '', ''));
  kB.appendChild(el('small', '', KB.nama + ' (punyamu)'));
  var bB = el('b', '', tulis(nilai)), eB = el('em', '', ''); kB.appendChild(bB); kB.appendChild(eB);
  var dua = el('div', 'duaJam'); dua.appendChild(kA); dua.appendChild(el('span', '', '→')); dua.appendChild(kB);
  var putar = el('div', 'putar');
  var ok = tombol('Cocokkan', function(){
    if(nilai !== target){ SFX.salah(); toast('Belum pas. Di ' + KB.nama + ' sekarang jam ' + tulis(waktuDi(KB.tz)) + ', di ' + KA.nama + ' jam ' + tulis(waktuDi(KA.tz)) + '.', 3200); return; }
    SFX.benar(); buzz(30);
    var hari = hariGeser(asal, d);
    toast('Pas. Saat dia ' + r.kegiatan + ', di tempatmu jam ' + tulis(target) + (hari ? ' (' + hari + ')' : '') + '.', 3200);
    tutup();
    if(ronde === 0) bukaJadwal(1); else { jadwalBuka = false; segarJam(); keGanti(); }
  }, 'hijau');
  function segar(){ bB.textContent = tulis(nilai); }
  [['−1 jam', -60], ['+1 jam', 60]].forEach(function(x){
    var b = el('button', '', x[0]); b.type = 'button';
    b.addEventListener('click', function(){ if(!siap()) return; nilai = ((nilai + x[1]) % 1440 + 1440) % 1440; segar(); SFX.klik(); $('#jamMejaB').textContent = tulis(nilai); });
    putar.appendChild(b);
  });
  var isi = [ h3('Samakan jadwal' + (ronde ? ' (2 dari 2)' : ' (1 dari 2)')),
    p('Jam ' + tulis(asal) + ' di ' + KA.nama + ', dia ' + r.kegiatan + '. Putar jam mejamu: di ' + KB.nama + ' itu jam berapa?'),
    dua ];
  if(d === 0){
    isi.push(p('Kalian ternyata di zona waktu yang sama — jamnya memang sama persis. Tinggal cocokkan.'));
  }
  isi.push(putar, ok);
  panelSejak = performance.now();
  buka(isi);
}

/* ── 5 · interaktif: paket menyeberangi garis tengah, dibuka lapis
   demi lapis; foto ketiga terselip di dalamnya ── */
function keGanti(){
  setLangkah(4);
  aktifkan($('#mejaPaketA'), kirimPaket);
  $('#mejaPaketA').querySelector('.ponsel').style.visibility = 'hidden';
  $('#labelPaketA').textContent = 'paket';
  var pk = $('#paket'); pk.hidden = false;
  taruhPaket($('#mejaPaketA'), 0);
}
function taruhPaket(node, ms){
  paketDi = node;
  var pk = $('#paket'), r = node.getBoundingClientRect();
  pk.style.transition = ms ? '' : 'none';
  /* skala sama dengan benda di meja, berporos di bawah → tetap di meja */
  pk.style.transform = 'translate(' + (r.left + r.width/2 - 31).toFixed(1) + 'px,' + (r.bottom - 50).toFixed(1) + 'px) scale(var(--sk,1))';
  if(!ms){ void pk.offsetWidth; pk.style.transition = ''; }
}
function kirimPaket(){
  SFX.geser(); buzz(20);
  taruhPaket($('#jamBendaB'), 1300);
  setTimeout(function(){ bukaPaket(); }, 1450);
}
function bukaPaket(){
  $('#labelPaketA').textContent = 'ponselnya';
  $('#mejaPaketA').querySelector('.ponsel').style.visibility = '';
  var lap = el('div', 'lapisan'), sisa = 3;
  var kertas = el('button', 'kertasKado', 'Ketuk untuk membuka lapis pertama'); kertas.type = 'button';
  var selesai = tombol('Simpan semuanya', function(){ tutup(); $('#paket').hidden = true; mulaiSatu(); }, 'hijau');
  selesai.hidden = true;
  kertas.addEventListener('click', function(){
    if(!siap()) return;
    var i = 3 - sisa, kotak = el('div', 'lapis', OLEH[i]);
    if(i === 2 && FOTO[2]){ var img = el('img'); img.alt = ''; img.src = FOTO[2].src; kotak.appendChild(img); if(FOTO[2].caption) kotak.appendChild(el('div', '', FOTO[2].caption)); }
    lap.appendChild(kotak); sisa--; SFX.benar(); buzz(15);
    if(sisa <= 0){ kertas.remove(); selesai.hidden = false; }
    else kertas.textContent = 'Masih ada lapis lagi — ketuk';
  });
  buka([ h3('Paket dari ' + KA.nama), p('Dibungkus tiga lapis. Pelan-pelan aja.'), lap, kertas, selesai ]);
}

/* ── 6 · penutup: garis tengah hilang, dua kamar jadi satu ── */
function mulaiSatu(){
  setLangkah(5);
  satu = true; segarJam(); SFX.benar();
  $('#panggung').classList.add('satu');
  var hari = KETEMU ? Math.round((KETEMU - new Date(new Date().setHours(0,0,0,0))) / 86400000) : null;
  $('#satuSub').textContent = hari && hari > 0 ? hari + ' hari lagi, beneran.' : 'sebentar lagi, beneran.';
  setTimeout(bukaAkhir, 2600);
}
function bukaAkhir(){
  var isi = [ h3('Satu ruangan') ];
  var hari = KETEMU ? Math.round((KETEMU - new Date(new Date().setHours(0,0,0,0))) / 86400000) : null;
  if(hari !== null && hari > 0){
    var h = el('div', 'hitung'); h.appendChild(el('b', '', hari + ' hari lagi')); h.appendChild(document.createTextNode('sampai kalian di kota yang sama.'));
    isi.push(h);
  } else if(hari === 0){
    var h0 = el('div', 'hitung'); h0.appendChild(el('b', '', 'Hari ini')); h0.appendChild(document.createTextNode('kalian ketemu.')); isi.push(h0);
  }
  if(PENUTUP) isi.push(p(PENUTUP + ' — ' + PENGIRIM));
  var wa = String(D.waPengirim || '').replace(/\D/g, ''), nomor = wa.charAt(0) === '0' ? '62' + wa.slice(1) : wa;
  if(nomor.length >= 10){
    var ta = el('textarea', 'balas'); ta.value = 'Udah aku buka. Di sini jam ' + tulis(waktuDi(KB.tz)) + ', kangen kamu yang di jam ' + tulis(waktuDi(KA.tz)) + '.';
    var kirim = el('a', 'tbl', 'Balas lewat WhatsApp'); kirim.target = '_blank'; kirim.rel = 'noopener'; kirim.href = 'https://wa.me/' + nomor;
    kirim.addEventListener('click', function(){ kirim.href = 'https://wa.me/' + nomor + '?text=' + encodeURIComponent(ta.value); });
    isi.push(ta, kirim);
  }
  var bar = el('div', 'baris-tbl');
  bar.appendChild(tombol('Baca pesannya lagi', function(){ tutup(); bukaSurat(); }, 'putih'));
  bar.appendChild(tombol('Lihat kamarnya', function(){ tutup(); }, 'putih'));
  isi.push(bar);
  var jejak = el('div', 'jejak');
  jejak.innerHTML = '<svg width="20" height="12" viewBox="0 0 20 12" aria-hidden="true"><path d="M1 11C1 5 4.5 1 8 1" fill="none" stroke="#241C2E" stroke-width="2" stroke-linecap="round"/><path d="M19 11C19 5 15.5 1 12 1" fill="none" stroke="#E8734A" stroke-width="2" stroke-linecap="round"/></svg>';
  var a = el('a', '', 'Dibuat dengan Foreverse'), fu = D.foreverseUrl || 'https://foreverse.id';
  a.href = fu + (fu.indexOf('?') > -1 ? '&' : '?') + 'ref=zona-waktu'; a.target = '_blank'; a.rel = 'noopener';
  jejak.appendChild(a); isi.push(jejak);
  buka(isi);
}

/* ── lewati: langsung ke pesan, lalu penutup ── */
$('#lewati').addEventListener('click', function(){
  if(panelBuka && langkah === 0){ tutup(); }
  if(satu || panelBuka) return;
  ac(); MU.main(); aktifkan(null); lewatiMode = true;
  $('#ponselB').classList.remove('dering'); $('#paket').hidden = true;
  setLangkah(2);
  bukaSurat();
});
$('#suara').addEventListener('click', function(){
  bisu = !bisu; MU.bisukan(bisu);
  try{ if(AC){ bisu ? AC.suspend() : AC.resume(); } }catch(e){}
  this.textContent = bisu ? '🔇' : '🔊';
});

/* ── mulai ── */
$('#namaA').textContent = PENGIRIM; $('#kotaA').textContent = KA.nama;
$('#namaB').textContent = PENERIMA; $('#kotaB').textContent = KB.nama;
if(FOTO[1]){ var tp = $('#tempelA'); tp.hidden = false; tp.querySelector('img').src = FOTO[1].src; tp.querySelector('span').textContent = FOTO[1].caption || ''; }
document.title = 'Panggilan dari ' + KA.nama + ' buat ' + PENERIMA;
function skala(){
  var h = $('#sisiA').getBoundingClientRect().height;
  var sk = Math.max(1, Math.min(1.7, h / 380));
  document.documentElement.style.setProperty('--sk', sk.toFixed(2));
}
skala(); window.addEventListener('resize', skala);
segarJam(); setInterval(segarJam, 20000);
window.addEventListener('resize', function(){ if(!$('#paket').hidden && paketDi) taruhPaket(paketDi, 0); });
$('#ponselB').classList.add('dering');
setLangkah(0);
SFX.dering();
bukaPanggil();

window.__fv = function(){
  return { langkah:langkah, satu:satu, panel:panelBuka, selisih:selisih(), kini:{ a:waktuDi(KA.tz), b:waktuDi(KB.tz) },
           benarKuis: rutinitasSekarang().kegiatan, rut: RUT.map(function(r){ return r.jam; }), aktif: aktifNode ? aktifNode.id : null };
};
})();
</script>
