<style>
/* Palet: beludru marun bioskop, emas lampu marquee, krem layar perak,
   hitam studio. Bioskop klasik, tidak dipakai tema lain. */
:root{
  --beludru:#5A1424; --marun:#3A0E18; --hitam:#1C0D12; --emas:#E2B857; --emas2:#F3D58A; --layar:#F6E7C8; --ink:#241318; --redup:#B79A86;
  --bebas:'Bebas Neue','Arial Narrow',sans-serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif;
  --u:min(1vw,.5vh);
}
@media (min-aspect-ratio:1/1){ :root{ --u:min(.62vw,.92vh); } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--hitam);font-family:var(--sans);color:var(--layar)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}

/* tirai beludru di kiri-kanan, makin gelap saat lampu studio dimatikan */
.beludru{position:fixed;inset:0;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 6px,transparent 6px 22px,rgba(255,255,255,.05) 22px 26px,transparent 26px 34px) left/14vw 100% no-repeat,
  repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 6px,transparent 6px 22px,rgba(255,255,255,.05) 22px 26px,transparent 26px 34px) right/14vw 100% no-repeat,
  radial-gradient(ellipse at 50% 30%,#4a1220 0%,var(--hitam) 70%);transition:filter 1.2s}
body.redup .beludru{filter:brightness(.45)}

/* papan marquee di atas */
.marquee{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 110px);
  background:#120709;border:2px solid var(--emas);border-radius:8px;padding:6px 14px;box-shadow:0 0 0 3px #120709,0 0 18px rgba(226,184,87,.35)}
.marquee i{width:7px;height:7px;border-radius:50%;background:var(--emas2);box-shadow:0 0 8px var(--emas2);flex:none;animation:lampu 1.2s steps(2) infinite}
.marquee i:last-child{animation-delay:.6s}
.marquee span{font:400 19px/1 var(--bebas);letter-spacing:.08em;color:var(--emas2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes lampu{50%{opacity:.35}}
#music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 9px);z-index:41;border:0;width:36px;height:36px;border-radius:50%;background:rgba(18,7,9,.85);color:#fff;font-size:15px;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(226,184,87,.5)}

/* petunjuk = pengumuman petugas, pita krem di bawah */
.petunjuk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:39;width:min(92vw,560px);padding:11px 16px;border-radius:12px;
  background:var(--layar);color:var(--ink);font:600 14.5px/1.4 var(--sans);text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.4);transition:opacity .2s}
.petunjuk b{color:var(--beludru)}
.petunjuk.ganti{opacity:0}
.petunjuk.kedip{animation:kedip .4s 2}
.petunjuk[hidden]{display:none}
@keyframes kedip{50%{background:var(--emas2)}}
#lanjut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:45;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:.4s;
  border:0;border-radius:99px;padding:13px 28px;font:400 20px/1 var(--bebas);letter-spacing:.08em;color:var(--ink);background:linear-gradient(180deg,var(--emas2),var(--emas));box-shadow:0 0 0 3px rgba(226,184,87,.3),0 8px 22px rgba(0,0,0,.4);cursor:pointer}
#lanjut.tampil{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* adegan: berpindah seperti potongan film (fade ke hitam) */
.sc{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);bottom:calc(env(safe-area-inset-bottom) + 78px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*5);
  opacity:0;pointer-events:none;transition:opacity .7s;z-index:5;padding:0 14px}
.sc.aktif{opacity:1;pointer-events:auto}
.sc>*{flex-shrink:0}
@media (min-aspect-ratio:1/1){ .sc{flex-direction:row;gap:calc(var(--u)*7)} .sc.tegak{flex-direction:column;gap:calc(var(--u)*3)} }

/* ═ 1 · tiket ═ */
.tiket{display:flex;width:min(92vw,calc(var(--u)*90));filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));transform:rotate(-2deg)}
.tiket .badan{flex:1;background:var(--layar);color:var(--ink);padding:calc(var(--u)*5) calc(var(--u)*5);border-radius:12px 0 0 12px;
  background-image:radial-gradient(circle at 100% 0,transparent 10px,var(--layar) 10.5px),radial-gradient(circle at 100% 100%,transparent 10px,var(--layar) 10.5px);background-size:100% 51%;background-position:top,bottom;background-repeat:no-repeat}
.tiket small{font:400 13px/1 var(--bebas);letter-spacing:.2em;color:var(--beludru)}
.tiket h1{margin:6px 0 12px;font:600 clamp(22px,calc(var(--u)*8),36px)/1.08 var(--serif);color:var(--ink)}
.baris-tk{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed #d6c4a4;padding:6px 0;font-size:13px}

      node.classList.add('dibawa'); document.body.appendChild(node); try{ node.setPointerCapture(e.pointerId); }catch(_){} node.style.left=r.left+'px'; node.style.top=r.top+'px'; if(o.down) o.down(e); },
    move:function(e){ node.style.left=(e.clientX-ox)+'px'; node.style.top=(e.clientY-oy)+'px'; if(o.move) o.move(e); },
    up:function(e){ var hasil=o.up?o.up(e):false;
      if(!hasil){ node.classList.remove('dibawa'); node.style.left=node.style.top=''; node.style.width=lw; node.style.height=lh; ruang.parentNode.insertBefore(node,ruang); }
      ruang.remove(); }
  });
}
function dekat(a,b,jarak){ var p=pusat(a),q=pusat(b); return Math.hypot(p.x-q.x,p.y-q.y)<jarak; }

var konfeti=(function(){
  var cv=el('canvas'); cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:90'; document.body.appendChild(cv);
  var ctx=cv.getContext('2d'), P=[], jalan=false, W=0, H=0;
  function ukur(){ var d=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); }
  function langkah(){ ctx.clearRect(0,0,W,H);
    P=P.filter(function(p){ p.vy+=.12; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; return p.y<H+20; });
    P.forEach(function(p){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(P.length) requestAnimationFrame(langkah); else jalan=false; }
  return function(x,y,n,warna){ ukur(); var C=warna||['#E8734A','#E8A5B0','#F5C85B','#3B3168','#FBFAF7'];
    for(var i=0;i<(n||90);i++) P.push({x:x,y:y,vx:rand(-6,6),vy:rand(-11,-3),r:rand(0,6),vr:rand(-.3,.3),s:rand(6,11),c:C[i%C.length]});
    if(!jalan){ jalan=true; requestAnimationFrame(langkah); } };
})();

/* petunjuk & tombol lanjut — bentuknya diatur CSS tiap tema */
var ptj=$('#petunjuk'), ptjT=null, tLanjut=$('#lanjut'), lanjutFn=null;
function petunjuk(h){ ptj.classList.add('ganti'); clearTimeout(ptjT); ptjT=setTimeout(function(){ ptj.innerHTML=h; ptj.classList.remove('ganti'); },200); ptj.hidden=false; }
function kedip(){ ptj.classList.remove('kedip'); void ptj.offsetWidth; ptj.classList.add('kedip'); }
/* LANJUT_OTOMATIS (ms): tema yang adegannya berjalan sendiri (kereta, lomba, hitung mundur)
   tidak menunggu ketukan; tombolnya jadi penanda yang terisi lalu berpindah sendiri. */
var LANJUT_OTOMATIS=0, tOto=null;
function lanjut(fn,label){ lanjutFn=fn; tLanjut.textContent=label||'Lanjut'; ptj.hidden=true; tLanjut.classList.add('tampil');
  if(LANJUT_OTOMATIS){ tLanjut.classList.remove('otomatis'); void tLanjut.offsetWidth; tLanjut.style.setProperty('--oto',LANJUT_OTOMATIS+'ms'); tLanjut.classList.add('otomatis'); clearTimeout(tOto); tOto=setTimeout(function(){ tLanjut.onclick(); },LANJUT_OTOMATIS); } }
tLanjut.onclick=function(){ clearTimeout(tOto); if(!lanjutFn) return; var f=lanjutFn; lanjutFn=null; tLanjut.classList.remove('tampil','otomatis'); SFX.klik(); f(); };

/* penutup: tombol balasan ke email pembeli (fvBalas), WhatsApp kedua */
function pasangBalasan(wadah, teks, kelasUtama, kelasWa){
  var wa=String(D.waPengirim||'').replace(/\D/g,''); if(wa.charAt(0)==='0') wa='62'+wa.slice(1);
  var ada=false;
  if(window.fvBalas){ wadah.appendChild(fvBalas.tombol(teks,el('button',kelasUtama),'Kirim balasan ke '+PENGIRIM)); ada=true; }
  if(wa.length>=10){ var a=el('a',kelasWa,ada?'atau lewat WhatsApp':'Balas lewat WhatsApp'); a.href='https://wa.me/'+wa; a.target='_blank'; a.rel='noopener';
    a.addEventListener('click',function(){ a.href='https://wa.me/'+wa+'?text='+encodeURIComponent(teks.value); }); wadah.appendChild(a); ada=true; }
  return ada;
}

/* ═══════════════════════════════════════════════════════════════
   Pemutaran Perdana (Anniversary). Kisah mereka diputar sebagai film
   di studio yang disewa untuk satu penonton: tiket bertanggal hari
   jadi disobek, kursinya dicari dengan senter petugas di studio gelap,
   gulungan film diputar sampai foto-foto tayang di layar, surat jadi
   babak-babak film, lalu kredit bergulir berisi nama, lokasi syuting
   (isian `lokasi`), adegan (keterangan foto), dan lagu temanya.
   ═══════════════════════════════════════════════════════════════ */
var JUDUL=String(D.judulFilm||'').trim()||('Kisah '+PENERIMA+' & '+PENGIRIM);
var LOKASI=(D.lokasi||[]).map(function(s){ return String(s||'').trim(); }).filter(Boolean);
var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var TGL=(function(){ var s=String(D.tanggalMulai||''); return /^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T00:00:00'):null; })();
var SEMBUNYI=D.sembunyikanTahun===true||D.sembunyikanTahun==='true';
function tglTeks(){ if(!TGL) return 'malam ini'; return TGL.getDate()+' '+BULAN[TGL.getMonth()]+(SEMBUNYI?'':' '+TGL.getFullYear()); }
var JENIS={pacaran:'Mulai pacaran',tunangan:'Mulai tunangan',menikah:'Mulai menikah'}[D.jenisHariJadi]||'Mulai syuting';
SFX.proyektor=function(){ noise(.06,900,.05); };
SFX.sobek=function(){ noise(.35,5200,.18); noise(.2,2600,.1); };

var kini=-1, MASUK={};
function ke(no){
  if(kini>=0) $('#s'+kini).classList.remove('aktif');
  kini=no; $('#s'+no).classList.add('aktif'); if(MASUK[no]) MASUK[no]();
}
function berikut(){ ke(kini+1); }
$('#mqJudul').textContent='STUDIO 1 · '+JUDUL.toUpperCase();

/* ═ 1 · tiket: tarik sobekan ke bawah sepanjang perforasi ═ */
(function(){
  var sb=$('#sobekan'), beres=false;
  $('#tkJudul').textContent=JUDUL; $('#tkTanggal').textContent=tglTeks(); $('#tkKursi').textContent='E7';
  if(TGL) $('#tkTglLbl').textContent='Tayang perdana';
  seret(sb,{ boleh:function(){ return !beres; },
    down:function(){ sb.style.transition='none'; },
    move:function(e,dx,dy){ var y=Math.max(0,dy); sb.style.transform='translateY('+y+'px) rotate('+(y*.12)+'deg)'; if(Math.random()<.2) noise(.04,5000,.05); },
    up:function(e,dx,dy){ sb.style.transition='';
      if(dy<U()*16){ sb.style.transform=''; kedip(); return; }
      beres=true; SFX.sobek(); buzz(25); sb.classList.add('lepas'); sb.style.transform='translateY(70vh) rotate(28deg)';
      petunjuk('Tiketnya sah. Kursimu <b>E7</b>. Lampu studio sudah dimatikan.');
      setTimeout(function(){ lanjut(berikut,'Masuk studio'); },1100);
    } });
  MASUK[0]=function(){ petunjuk('Satu tiket atas namamu, '+PENERIMA+'. <b>Tarik sobekan kanannya ke bawah</b> untuk masuk.'); };
})();

/* ═ 2 · studio gelap: senter petugas mencari kursi E7 ═ */
(function(){
  var st=$('#studio'), g=$('#kursiGrid'), sen=$('#senter'), BARIS='ABCDE', target=null, tahan=null, beres=false;
  for(var r=0;r<5;r++) for(var c=0;c<9;c++){ var k=el('div','kursi'); k.dataset.no=BARIS[r]+(c+1);
    if(r===4&&c===6){ k.classList.add('cari'); k.appendChild(el('span','label','kursimu')); target=k; }
    if(r===4&&c===7){ k.classList.add('isi','pas'); k.appendChild(el('span','label',PENGIRIM)); }
    g.appendChild(k); }
  function arah(e){ var r=st.getBoundingClientRect(); var x=klem(e.clientX-r.left,0,r.width), y=klem(e.clientY-r.top,0,r.height);
    st.style.setProperty('--sx',x+'px'); st.style.setProperty('--sy',y+'px');
    var t=target.getBoundingClientRect(), kena=e.clientX>t.left-6&&e.clientX<t.right+6&&e.clientY>t.top-6&&e.clientY<t.bottom+6;
    if(kena&&!tahan){ sen.classList.add('tahan'); tahan=setTimeout(ketemu,1000); }
    if(!kena&&tahan){ clearTimeout(tahan); tahan=null; sen.classList.remove('tahan'); } }
  function ketemu(){ if(beres) return; beres=true; sen.classList.remove('tahan'); st.classList.add('terang'); target.classList.add('ketemu');
    $$('.kursi.pas').forEach(function(k){ k.classList.add('ketemu'); });
    SFX.benar(); buzz(20); petunjuk('Ketemu. Kursi E7, tepat di sebelah <b>'+PENGIRIM+'</b>. Filmnya mau mulai.');
    setTimeout(function(){ lanjut(berikut,'Mulai filmnya'); },1300); }
  seret(st,{ boleh:function(){ return !beres; }, down:arah, move:function(e){ arah(e); },
    up:function(){ if(tahan){ clearTimeout(tahan); tahan=null; sen.classList.remove('tahan'); } if(!beres) kedip(); } });
  MASUK[1]=function(){ document.body.classList.add('redup'); petunjuk('Studionya gelap. <b>Geser senter</b> sampai menemukan kursi <b>E7</b>, lalu tahan sebentar di sana.'); };
})();

/* ═ 3 · proyektor: putar gulungan, foto tayang satu per satu ═ */
(function(){
  var gl=$('#gulungan'), bf=$('#bingkaiFilm'), img=$('#filmImg'), sub=$('#subtitle'), n=Math.max(FOTO.length,1), sudut=0, lalu=null, frame=-1, beres=false, ketik=null;
  function tampilFrame(k){ frame=k; var f=FOTO[k]; SFX.klik(); buzz(10);
    if(!f){ return; } bf.classList.remove('tayang'); bf.classList.toggle('rebah',f.bentuk==='R');
    setTimeout(function(){ pasFoto(img,f); bf.classList.add('tayang'); },120);
    clearInterval(ketik); var t=f.caption||'', i=0; sub.textContent=''; ketik=setInterval(function(){ i++; sub.textContent=t.slice(0,i); if(i>=t.length) clearInterval(ketik); },30);
    $('#filmNo').textContent='ADEGAN '+(k+1)+'/'+FOTO.length; }
  function sudutDari(e){ var p=pusat(gl); return Math.atan2(e.clientY-p.y,e.clientX-p.x)*180/Math.PI; }
  seret(gl,{ boleh:function(){ return !beres; },
    down:function(e){ lalu=sudutDari(e); },
    move:function(e){ var a=sudutDari(e), d=a-lalu; if(d>180)d-=360; if(d<-180)d+=360; lalu=a;
      if(d<=0){ return; } sudut+=d; gl.style.setProperty('--r',sudut+'deg'); if(Math.random()<.25) SFX.proyektor();
      var total=360*(n+1); $('#barFilm').style.width=Math.min(100,sudut/total*100)+'%';
      if(sudut<360){ $('#leaderNo').textContent=3-Math.floor(sudut/120); }
      var k=Math.floor(sudut/360)-1; if(k>frame&&k<FOTO.length) tampilFrame(k);
      if(sudut>=total-180&&!beres&&frame>=FOTO.length-1){ beres=true; petunjuk('Rol terakhir selesai diputar. Sekarang babak-babak suratnya.'); setTimeout(function(){ lanjut(berikut,'Lanjut ke babak'); },1600); } },
    up:function(){ if(sudut<20) kedip(); } });
  MASUK[2]=function(){ petunjuk('Proyektornya manual malam ini. <b>Putar gulungan filmnya searah jarum jam</b>. Tiap satu putaran, satu adegan tayang.'); };
})();

/* ═ 4 · babak surat ═ */
(function(){
  var ls=$('#layarSurat'), daftar=SURAT.length?SURAT:[''], i=-1, ketik=null, penuh=true;
  function tampil(k){ i=k; $('#babakNo').textContent='BABAK '+(k+1)+(daftar.length>1?' DARI '+daftar.length:''); var t=daftar[k], c=0; penuh=false; $('#babakTeks').textContent='';
    clearInterval(ketik); ketik=setInterval(function(){ c+=2; $('#babakTeks').textContent=t.slice(0,c); if(c>=t.length){ clearInterval(ketik); penuh=true; if(k===daftar.length-1) habis(); } },28); }
  function habis(){ $('#babakKetuk').style.visibility='hidden'; var t=$('#babakTtd'); t.textContent=PENGIRIM; t.classList.add('tampil'); setTimeout(function(){ lanjut(berikut,'Lihat kreditnya'); },1800); }
  ls.addEventListener('click',function(){ if(!penuh){ return; } if(i>=daftar.length-1) return; SFX.kertas(); tampil(i+1); });
  noMenu(ls);
  MASUK[3]=function(){ tampil(0); petunjuk('Ini naskah dari '+PENGIRIM+'. <b>Ketuk layarnya</b> untuk babak berikutnya.'); };
})();

/* ═ 5 · kredit bergulir, lalu balasan ═ */
(function(){
  var kr=$('#kredit');
  function blok(label,isi,kelas){ var b=el('div','blok'); if(label) b.appendChild(el('small',null,label)); (Array.isArray(isi)?isi:[isi]).forEach(function(t){ b.appendChild(el('p',kelas||null,t)); }); kr.appendChild(b); }
  function susun(){ kr.innerHTML='';
    blok('sebuah film tentang kita',JUDUL,'judul-film');
    blok('dibintangi',[PENERIMA,PENGIRIM]);
    blok('sutradara & penulis naskah',PENGIRIM);
    if(TGL) blok(JENIS,tglTeks());
    if(TGL&&!SEMBUNYI){ var hari=Math.floor((Date.now()-TGL.getTime())/864e5); if(hari>0) blok('durasi',hari.toLocaleString('id-ID')+' hari, dan masih berlanjut'); }
    if(LOKASI.length) blok('lokasi syuting',LOKASI);
    var adegan=FOTO.map(function(f){ return f.caption; }).filter(Boolean); if(adegan.length) blok('adegan-adegan',adegan);
    if(D.lagu&&D.lagu.judul) blok('lagu tema',D.lagu.judul+(D.lagu.artis?' · '+D.lagu.artis:''));
    blok('penonton kehormatan',PENERIMA);
    blok(null,'BERSAMBUNG','tamat'); }
  MASUK[4]=function(){ susun(); ptj.hidden=true; document.body.classList.remove('redup');
    var w=$('#kreditWadah'), tinggi=kr.offsetHeight+w.offsetHeight, dur=Math.max(9,tinggi/55);
    kr.animate([{transform:'translateY(0)'},{transform:'translateY(-'+tinggi+'px)'}],{duration:dur*1000,easing:'linear',fill:'forwards'}).onfinish=akhir; };
  function akhir(){ $('#s4').classList.add('selesai'); $('#akhir').classList.add('tampil');
    $('#akhirJudul').textContent='Mau balas ke '+PENGIRIM+'?';
    var t=$('#balasTeks'); t.value='Aku juga masih ingat malam itu. Nonton lagi yuk minggu ini 🎬';
    if(!$('#balasAksi').children.length&&!pasangBalasan($('#balasAksi'),t,'t-utama','t-wa')){ t.style.display='none'; $('#akhirJudul').textContent='Selamat hari jadi, '+PENERIMA+'.'; }
    konfeti(innerWidth/2,innerHeight*.25,80,['#E2B857','#F3D58A','#F6E7C8','#8E1F33']); }
  $('#ulang').onclick=function(){ location.reload(); };
})();

ke(0);

}
